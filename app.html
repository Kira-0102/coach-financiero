function debtFormElements(prefix) {
  const byId = suffix => document.getElementById(`${prefix}${suffix}`);
  return {
    name: byId("Name"), type: byId("Type"), planType: byId("PlanType"),
    amount: byId("Amount"), interest: byId("Interest"), rateType: byId("RateType"),
    frequency: byId("Frequency"), installments: byId("Installments"),
    scheduledPayment: byId("ScheduledPayment"), currentBalance: byId("CurrentBalance"),
    currentPrincipal: byId("CurrentPrincipal"), remainingInstallments: byId("RemainingInstallments"),
    startDate: byId("StartDate"), nextDue: byId("NextDue"), preview: byId("DebtPreview"),
    interestGroup: byId("InterestGroup"), termGroup: byId("TermGroup"),
    interestLabel: byId("InterestLabel"),
  };
}

function suggestedPlanForDebtType(debtType) {
  if (debtType === "tarjeta_credito") return "credit_card";
  if (debtType === "prestamista") return "flat_total";
  return "amortized";
}

function applyDebtFormMode(prefix, { keepCurrentRateType = false } = {}) {
  const e = debtFormElements(prefix);
  if (!e.planType) return;
  const planType = e.planType.value;

  if (e.interestGroup) e.interestGroup.style.display = planType === "no_interest" ? "none" : "block";
  if (e.termGroup) e.termGroup.style.display = planType === "credit_card" ? "none" : "block";

  if (e.rateType) {
    e.rateType.disabled = ["flat_total", "flat_periodic", "no_interest"].includes(planType);
    if (!keepCurrentRateType) {
      if (planType === "flat_total") e.rateType.value = "total_term";
      else if (planType === "flat_periodic") e.rateType.value = "per_period";
      else if (planType === "credit_card") e.rateType.value = "annual";
      else if (planType === "no_interest") e.rateType.value = "annual";
      else if (!["annual", "monthly", "per_period"].includes(e.rateType.value)) e.rateType.value = "annual";
    }
  }

  if (e.interestLabel) {
    e.interestLabel.textContent = planType === "flat_total"
      ? "Interés total del acuerdo (%)"
      : planType === "flat_periodic"
        ? "Interés por cada cuota (%)"
        : planType === "credit_card"
          ? "Tasa de la tarjeta (%)"
          : "Tasa de interés (%)";
  }

  if (planType === "credit_card" && e.frequency) e.frequency.value = "monthly";
  renderDebtFormPreview(prefix);
}

function debtFormData(prefix, existingDebt = null) {
  const e = debtFormElements(prefix);
  const planType = e.planType?.value || existingDebt?.plan_type || "amortized";
  const originalAmount = Number(e.amount?.value) || Number(existingDebt?.original_amount) || 0;
  const interestRate = planType === "no_interest" ? 0 : (Number(e.interest?.value) || 0);
  const interestRateType = planType === "flat_total" ? "total_term"
    : planType === "flat_periodic" ? "per_period"
    : (e.rateType?.value || existingDebt?.interest_rate_type || "annual");
  const paymentFrequency = planType === "credit_card" ? "monthly" : (e.frequency?.value || existingDebt?.payment_frequency || "monthly");
  const termCount = planType === "credit_card" ? 0 : Math.max(0, Math.trunc(Number(e.installments?.value) || Number(existingDebt?.term_count) || 0));
  const scheduledPaymentInput = Math.max(0, Number(e.scheduledPayment?.value) || 0);

  const planBaseAmount = existingDebt
    ? Math.max(0, Number(existingDebt.principal_outstanding ?? existingDebt.current_balance) || 0)
    : originalAmount;
  const planTerm = existingDebt
    ? Math.max(0, Math.trunc(Number(e.remainingInstallments?.value) || Number(existingDebt.remaining_installments) || termCount))
    : termCount;

  const plan = calculateDebtPlan({
    planType,
    originalAmount: planBaseAmount,
    interestRate,
    interestRateType,
    paymentFrequency,
    termCount: planTerm,
    scheduledPayment: scheduledPaymentInput,
  });
  const effectiveTermCount = planType === "amortized" && plan.payoffPeriods
    ? plan.payoffPeriods
    : termCount;

  const currentPrincipalInput = Number(e.currentPrincipal?.value);
  const currentBalanceInput = Number(e.currentBalance?.value);
  const currentPrincipal = existingDebt
    ? Math.max(0, Number(existingDebt.principal_outstanding ?? existingDebt.current_balance) || 0)
    : (Number.isFinite(currentPrincipalInput) && currentPrincipalInput >= 0 ? currentPrincipalInput : originalAmount);

  const existingPaymentCount = existingDebt ? debtPaymentStats(existingDebt.id).payments.length : 0;
  const convertingLegacyPlan = Boolean(
    existingDebt &&
    existingPaymentCount === 0 &&
    (existingDebt.plan_type || "legacy") === "legacy" &&
    planType !== "legacy"
  );

  let currentBalance;
  let interestOutstanding;
  if (existingDebt && !convertingLegacyPlan) {
    currentBalance = Math.max(0, Number(existingDebt.current_balance) || 0);
    interestOutstanding = Math.max(0, Number(existingDebt.interest_outstanding) || 0);
  } else if (existingDebt && convertingLegacyPlan) {
    if (["flat_total", "flat_periodic"].includes(planType)) {
      interestOutstanding = Math.max(0, plan.estimatedInterest);
      currentBalance = currentPrincipal + interestOutstanding;
    } else {
      interestOutstanding = 0;
      currentBalance = currentPrincipal;
    }
  } else if (Number.isFinite(currentBalanceInput) && currentBalanceInput > 0) {
    currentBalance = currentBalanceInput;
    interestOutstanding = Math.max(0, currentBalance - currentPrincipal);
  } else if (["flat_total", "flat_periodic"].includes(planType)) {
    interestOutstanding = Math.max(0, plan.estimatedInterest);
    currentBalance = currentPrincipal + interestOutstanding;
  } else {
    interestOutstanding = 0;
    currentBalance = currentPrincipal;
  }

  const remainingInstallmentsInput = Math.trunc(Number(e.remainingInstallments?.value) || 0);
  const calculatedRemaining = planType === "amortized" && plan.payoffPeriods ? plan.payoffPeriods : planTerm;
  const remainingInstallments = existingDebt
    ? Math.max(0, remainingInstallmentsInput || calculatedRemaining || Number(existingDebt.remaining_installments) || planTerm)
    : Math.max(0, remainingInstallmentsInput || effectiveTermCount);

  const historicalPaid = existingDebt ? Math.max(0, Number(existingDebt.total_paid) || debtPaymentStats(existingDebt.id).total) : 0;
  const historicalInterest = existingDebt ? Math.max(0, Number(existingDebt.total_interest_paid) || debtPaymentStats(existingDebt.id).interest) : 0;
  const remainingProjectedTotal = plan.totalPayable == null ? null : plan.totalPayable;

  return {
    plan,
    payload: {
      name: e.name?.value?.trim() || existingDebt?.name || "",
      debt_type: e.type?.value || existingDebt?.debt_type || "otro",
      plan_type: planType,
      original_amount: originalAmount,
      current_balance: currentBalance,
      principal_outstanding: currentPrincipal,
      interest_outstanding: interestOutstanding,
      interest_rate: interestRate,
      interest_rate_type: interestRateType,
      payment_frequency: paymentFrequency,
      term_count: (existingDebt ? (termCount || Number(existingDebt.term_count) || null) : (effectiveTermCount || null)),
      remaining_installments: remainingInstallments || null,
      scheduled_payment: plan.scheduledPayment || null,
      minimum_payment: plan.scheduledPayment || null,
      total_payable: remainingProjectedTotal == null ? null : historicalPaid + remainingProjectedTotal,
      estimated_total_interest: planType === "credit_card" ? null : historicalInterest + plan.estimatedInterest,
      total_paid: historicalPaid,
      total_interest_paid: historicalInterest,
      total_fees_paid: existingDebt ? Math.max(0, Number(existingDebt.total_fees_paid) || debtPaymentStats(existingDebt.id).fees) : 0,
      start_date: e.startDate?.value || existingDebt?.start_date || null,
      next_due_date: e.nextDue?.value || existingDebt?.next_due_date || null,
      due_day: Number((e.nextDue?.value || existingDebt?.next_due_date || "").slice(-2)) || existingDebt?.due_day || null,
      status: existingDebt?.status === "completed" && currentBalance > 0 ? "active" : (existingDebt?.status || "active"),
    },
  };
}

function validateDebtForm(prefix, existingDebt = null) {
  const { payload, plan } = debtFormData(prefix, existingDebt);
  if (!payload.name || !payload.debt_type || payload.original_amount <= 0) {
    return { error: "Completa el nombre, el tipo y el capital original." };
  }
  if (payload.interest_rate < 0) return { error: "La tasa de interés no puede ser negativa." };
  if (!["credit_card", "legacy"].includes(payload.plan_type) && !payload.term_count) {
    return { error: "Indica la cantidad de cuotas del acuerdo." };
  }
  if (payload.plan_type === "credit_card" && !(payload.scheduled_payment > 0)) {
    return { error: "Indica el pago mínimo mensual de la tarjeta." };
  }
  if (payload.current_balance < payload.principal_outstanding) {
    return { error: "El saldo total pendiente no puede ser menor que el capital pendiente." };
  }
  if (payload.principal_outstanding > payload.original_amount && !existingDebt) {
    return { error: "El capital pendiente no puede superar el capital original." };
  }
  if (plan.scheduledPayment <= 0 && payload.plan_type !== "legacy") {
    return { error: "No se pudo calcular una cuota. Revisa el plazo o escribe la cuota acordada." };
  }
  if (payload.plan_type === "amortized" && !plan.payoffPeriods) {
    return { error: "La cuota no cubre los intereses y la deuda no terminaría de pagarse. Aumenta la cuota o el plazo." };
  }
  const planPeriods = existingDebt ? payload.remaining_installments : payload.term_count;
  if (["flat_total", "flat_periodic", "no_interest"].includes(payload.plan_type) && planPeriods > 0 && plan.totalPayable != null) {
    const expectedPayment = plan.totalPayable / planPeriods;
    if (Math.abs(plan.scheduledPayment - expectedPayment) > 1) {
      return { error: `La cuota no coincide con el total del acuerdo. Usa ${money(expectedPayment)} o ajusta la cantidad de cuotas.` };
    }
  }
  return { payload, plan, error: null };
}

function renderDebtFormPreview(prefix, existingDebt = null) {
  const e = debtFormElements(prefix);
  if (!e.preview) return;
  const { payload, plan } = debtFormData(prefix, existingDebt);
  e.preview.innerHTML = debtPlanPreviewHTML(plan, {
    planType: payload.plan_type,
    paymentFrequency: payload.payment_frequency,
    termCount: existingDebt ? payload.remaining_installments : payload.term_count,
    currentBalance: payload.current_balance > 0 ? payload.current_balance : null,
  });
}

function wireDebtForm(prefix, existingDebt = null) {
  const e = debtFormElements(prefix);
  if (!e.planType) return;

  const update = () => renderDebtFormPreview(prefix, existingDebt);
  [e.amount, e.interest, e.rateType, e.frequency, e.installments, e.scheduledPayment,
   e.currentBalance, e.currentPrincipal, e.remainingInstallments, e.startDate, e.nextDue]
    .filter(Boolean).forEach(input => input.addEventListener("input", update));

  e.planType.addEventListener("change", () => {
    if (existingDebt && e.planType.value !== (existingDebt.plan_type || "legacy") && e.scheduledPayment) {
      e.scheduledPayment.value = "";
    }
    applyDebtFormMode(prefix);
  });
  e.type?.addEventListener("change", () => {
    if (!existingDebt) e.planType.value = suggestedPlanForDebtType(e.type.value);
    applyDebtFormMode(prefix);
  });

  applyDebtFormMode(prefix, { keepCurrentRateType: Boolean(existingDebt) });
}

async function saveDebtFromForm(prefix, existingDebt = null) {
  const result = validateDebtForm(prefix, existingDebt);
  if (result.error) return { error: { message: result.error } };
  const { data, error } = await supabase.rpc("save_debt", {
    p_payload: result.payload,
    p_debt_id: existingDebt?.id || null,
  });
  return { data, error };
}

        const txIds = contribs.map(c => c.transaction_id).filter(Boolean);

    const inserts = toSave.map(({ catId, amount }) =>
      supabase.from("budgets").insert({
        user_id: user.id, category_id: catId, amount, effective_from: today,
      })
    );
    const results = await Promise.all(inserts);
    const failed = results.filter(r => r.error);
    if (failed.length > 0) {
      showToast(`${failed.length} presupuesto(s) no se pudieron guardar. Intenta de nuevo.`, true);
      saveAllBudgetsBtn.disabled = false;
      saveAllBudgetsBtn.textContent = "Guardar presupuestos";
      return;
    }
    await loadState(); renderApp();
    showToast(`${toSave.length} presupuesto${toSave.length > 1 ? "s" : ""} guardado${toSave.length > 1 ? "s" : ""}`);
  });



  const openDebtWizardBtn = document.getElementById("openDebtWizardBtn");
  if (openDebtWizardBtn) openDebtWizardBtn.addEventListener("click", openDebtWizard);

  const addDebtBtn = document.getElementById("addDebtBtn");
  if (addDebtBtn) {
    wireDebtForm("newD");
    addDebtBtn.addEventListener("click", async () => {
      addDebtBtn.disabled = true;
      addDebtBtn.textContent = "Guardando…";
      const { error } = await saveDebtFromForm("newD");
      if (error) {
        showToast(error.message || "No se pudo guardar la deuda.", true);
        addDebtBtn.disabled = false;
        addDebtBtn.textContent = "Guardar deuda";
        return;
      }
      await loadState();
      renderApp();
      showToast("Deuda guardada con su plan de pago");
    });
  }

  document.querySelectorAll("[data-view-debt-history]").forEach(btn => {
    btn.addEventListener("click", () => openDebtHistoryModal(btn.dataset.viewDebtHistory));
  });

  document.querySelectorAll("[data-pay-debt]").forEach(btn => {
    btn.addEventListener("click", () => openPayDebtModal(btn.dataset.payDebt));
  });
}

function openDebtHistoryModal(debtId) {
  const d = state.debts.find(x => x.id === debtId);
  if (!d) return;
  const payments = debtPaymentStats(debtId).payments.slice().sort((a, b) => new Date(b.paid_on || b.paid_at || 0) - new Date(a.paid_on || a.paid_at || 0));
  const modal = document.getElementById("logModal");
  modal.classList.add("visible");
  modal.innerHTML = `
    <div class="modal-box" style="max-height:85vh;overflow-y:auto;">
      <p class="step-label">Historial — ${esc(d.name)}</p>
      ${payments.length === 0 ? `<p style="font-size:12px;color:var(--text-muted);text-align:center;">No hay pagos registrados.</p>` : payments.map((p, index) => {
        const voided = (p.status || "active") === "voided";
        return `<div class="card" style="margin-bottom:7px;padding:10px 12px;opacity:${voided ? ".65" : "1"};">
          <div class="row-between" style="margin-bottom:5px;"><strong style="font-size:12px;">Pago ${p.payment_number || (payments.length - index)} ${voided ? "— ANULADO" : ""}</strong><span style="font-size:10px;color:var(--text-muted);">${formatDateDO(p.paid_on || p.paid_at) || "Sin fecha"}</span></div>
          <div class="row-between" style="font-size:11px;margin-bottom:3px;"><span>Total pagado</span><strong>${money(p.amount)}</strong></div>
          <div class="row-between" style="font-size:10px;color:var(--text-muted);margin-bottom:2px;"><span>A capital</span><span>${money(p.principal_component || 0)}</span></div>
          <div class="row-between" style="font-size:10px;color:var(--text-muted);margin-bottom:2px;"><span>A intereses</span><span>${money(p.interest_component || 0)}</span></div>
          ${Number(p.fee_component) > 0 ? `<div class="row-between" style="font-size:10px;color:var(--text-muted);margin-bottom:2px;"><span>Cargos</span><span>${money(p.fee_component)}</span></div>` : ""}
          ${p.breakdown_confirmed === false ? `<p style="font-size:9px;color:var(--warning-text);margin:5px 0;">⚠ Desglose pendiente de confirmar</p>` : ""}
          <div class="row-between" style="font-size:10px;padding-top:5px;margin-top:5px;border-top:1px solid var(--border);"><span>Saldo después</span><strong>${money(p.balance_after)}</strong></div>
          ${!voided ? `<div style="display:flex;gap:7px;margin-top:8px;"><button class="btn-secondary" data-correct-debt-payment="${p.id}" style="flex:1;padding:6px;font-size:10px;">Corregir</button><button data-reverse-debt-payment="${p.id}" style="flex:1;background:none;border:1px solid var(--danger-text);color:var(--danger-text);border-radius:14px;font-size:10px;">Anular</button></div>` : ""}
        </div>`;
      }).join("")}
      <button class="btn-secondary" id="closeDebtHistory" style="width:100%;">Cerrar</button>
    </div>`;

  async function reversePayment(paymentId, reopen = false) {
    const p = payments.find(x => x.id === paymentId);
    const message = reopen ? "Se anulará este pago y podrás registrarlo nuevamente con los datos correctos." : "Se restaurará el saldo de la deuda y el dinero de la cuenta. El pago quedará marcado como anulado.";
    if (!(await confirmAction(message))) return;
    const { error } = await supabase.rpc("reverse_debt_payment_v4", { p_payment_id: paymentId });
    if (error) { showToast(error.message || "No se pudo anular el pago.", true); return; }
    modal.classList.remove("visible"); modal.innerHTML = "";
    await loadState(); renderApp(); showToast("Pago anulado y saldos restaurados");
    if (reopen && p) openPayDebtModal(debtId, { prefillAmount: p.amount, prefillDate: p.paid_on || String(p.paid_at || "").slice(0, 10), prefillInterest: p.interest_component, prefillFee: p.fee_component });
  }

  document.querySelectorAll("[data-reverse-debt-payment]").forEach(btn => btn.addEventListener("click", () => reversePayment(btn.dataset.reverseDebtPayment, false)));
  document.querySelectorAll("[data-correct-debt-payment]").forEach(btn => btn.addEventListener("click", () => reversePayment(btn.dataset.correctDebtPayment, true)));
  document.getElementById("closeDebtHistory").addEventListener("click", () => { modal.classList.remove("visible"); modal.innerHTML = ""; });
}

// ---------------------------------------------------------------
// MODAL: REGISTRAR PAGO DE DEUDA
// ---------------------------------------------------------------
function openPayDebtModal(debtId, prefill = {}) {
  const d = state.debts.find(x => x.id === debtId);
  if (!d) return;
  const modal = document.getElementById("logModal");
  modal.classList.add("visible");

  const scheduled = Math.max(0, Number(d.scheduled_payment ?? d.minimum_payment) || 0);
  const paidToward = Math.max(0, Number(d.current_installment_paid) || 0);
  const remainingForInstallment = scheduled > 0 ? Math.max(0, scheduled - paidToward) : 0;
  const defaultAmount = Number(prefill.prefillAmount) || (remainingForInstallment > 0 ? Math.min(remainingForInstallment, Number(d.current_balance)) : Math.min(scheduled || Number(d.current_balance), Number(d.current_balance)));
  const isStatementDebt = ["credit_card", "legacy"].includes(d.plan_type || "legacy");

  modal.innerHTML = `
    <div class="modal-box" style="max-height:90vh;overflow-y:auto;">
      <p class="step-label">Registrar pago — ${esc(d.name)}</p>
      <div class="card accent" style="margin-bottom:12px;">
        <div class="row-between" style="font-size:11px;margin-bottom:4px;"><span>Saldo pendiente</span><strong>${money(d.current_balance)}</strong></div>
        ${scheduled > 0 ? `<div class="row-between" style="font-size:11px;margin-bottom:4px;"><span>Cuota actual</span><strong>${money(paidToward)} de ${money(scheduled)}</strong></div>` : ""}
        <div class="row-between" style="font-size:11px;"><span>Tasa/modelo</span><strong style="text-align:right;max-width:65%;">${debtRateLabel(d)} · ${esc(debtPlanLabel(d.plan_type || "legacy", d))}</strong></div>
      </div>

      <label>Fecha real del pago</label><input id="payDate" type="date" value="${prefill.prefillDate || localISODate()}" style="margin-bottom:8px;">
      <label>Monto total pagado</label><input id="payAmount" type="number" step="0.01" min="0" value="${defaultAmount > 0 ? Math.round(defaultAmount * 100) / 100 : ""}" placeholder="RD$0" style="margin-bottom:8px;">

      <label>${isStatementDebt ? "Intereses y cargos de interés del estado de cuenta" : "Interés incluido en este pago"} <span style="color:var(--text-muted);">(opcional)</span></label>
      <input id="payInterest" type="number" step="0.01" min="0" value="${prefill.prefillInterest ?? ""}" placeholder="${isStatementDebt ? "Escríbelo si aparece en el estado de cuenta" : "Déjalo vacío para estimarlo"}" style="margin-bottom:4px;">
      <p style="font-size:9px;color:var(--text-muted);margin:0 0 8px;line-height:1.4;">${isStatementDebt ? "Si no conoces el desglose, el pago reducirá el balance, pero quedará marcado como pendiente de confirmar." : "La app no volverá a cargar el mismo período de interés en pagos parciales."}</p>

      <label>Cargos, mora o comisión incluidos <span style="color:var(--text-muted);">(opcional)</span></label><input id="payFee" type="number" step="0.01" min="0" value="${prefill.prefillFee ?? 0}" style="margin-bottom:8px;">

      <div id="payActionGroup" style="display:none;">
        <label>Este pago supera lo que falta de la cuota. ¿Cómo deseas aplicarlo?</label>
        <select id="payAction" style="margin-bottom:8px;"><option value="advance_installments">Completar cuotas próximas</option><option value="reduce_principal">Reducir capital y mantener solo la próxima fecha</option><option value="manual">Aplicación manual según el desglose</option></select>
      </div>

      <label style="display:flex;gap:7px;align-items:flex-start;font-size:10px;margin:4px 0 8px;"><input id="payBreakdownConfirmed" type="checkbox" ${isStatementDebt && prefill.prefillInterest == null ? "" : "checked"} style="width:auto;margin-top:2px;">El desglose entre capital e intereses está confirmado</label>

      <div id="payBreakdownPreview"></div><div class="error-banner" id="payErr"></div>
      <div class="btn-row" style="margin-top:12px;"><button class="btn-secondary" id="cancelPay">Cancelar</button><button class="btn-primary" id="savePay">Registrar pago</button></div>
    </div>`;

  const amountInput = document.getElementById("payAmount");
  const dateInput = document.getElementById("payDate");
  const interestInput = document.getElementById("payInterest");
  const feeInput = document.getElementById("payFee");
  const actionGroup = document.getElementById("payActionGroup");
  const previewEl = document.getElementById("payBreakdownPreview");

  function renderBreakdown() {
    const amount = Number(amountInput.value) || 0;
    const fee = Number(feeInput.value) || 0;
    const available = Math.max(0, amount - fee);
    const manualInterest = interestInput.value === "" ? null : Number(interestInput.value);
    const b = estimateDebtPaymentBreakdownV4(d, amount, dateInput.value, manualInterest, fee);
    const progressAfter = paidToward + available;
    const completeCount = scheduled > 0 ? Math.floor(progressAfter / scheduled) : 0;
    const remainder = scheduled > 0 ? progressAfter - completeCount * scheduled : 0;
    actionGroup.style.display = scheduled > 0 && available > remainingForInstallment + 0.01 ? "block" : "none";
    const warnings = [];
    if (b.periodsAccrued > 1) warnings.push(`La fecha indicada acumula ${b.periodsAccrued} períodos estimados de interés. Compara el resultado con tu estado de cuenta.`);
    if (scheduled > 0 && progressAfter < scheduled - 0.01) warnings.push(`Pago parcial: faltarán ${money(scheduled - progressAfter)} para completar la cuota actual.`);
    if (isStatementDebt && manualInterest == null) warnings.push("El balance se actualizará, pero el desglose quedará pendiente de confirmar.");
    previewEl.innerHTML = `<div class="card" style="padding:10px 12px;"><p style="font-size:11px;font-weight:600;margin:0 0 7px;">Desglose estimado</p><div class="row-between" style="font-size:10px;margin-bottom:3px;"><span>A capital/saldo</span><strong>${money(b.principalComponent)}</strong></div><div class="row-between" style="font-size:10px;margin-bottom:3px;"><span>A intereses</span><strong>${money(b.interestComponent)}</strong></div><div class="row-between" style="font-size:10px;margin-bottom:3px;"><span>A cargos</span><strong>${money(b.fee)}</strong></div><div class="row-between" style="font-size:10px;padding-top:5px;margin-top:5px;border-top:1px solid var(--border);"><span>Saldo estimado después</span><strong>${money(b.newBalance)}</strong></div>${scheduled > 0 ? `<div class="row-between" style="font-size:10px;margin-top:5px;"><span>Cuotas que completaría</span><strong>${completeCount}</strong></div><div class="row-between" style="font-size:10px;"><span>Avance sobrante</span><strong>${money(remainder)}</strong></div>` : ""}${warnings.map(w => `<p style="font-size:10px;color:var(--warning-text);margin:7px 0 0;">⚠ ${w}</p>`).join("")}</div>`;
    return b;
  }

  [amountInput, dateInput, interestInput, feeInput].forEach(input => input.addEventListener("input", renderBreakdown));
  renderBreakdown();
  document.getElementById("cancelPay").addEventListener("click", () => { modal.classList.remove("visible"); modal.innerHTML = ""; });

  document.getElementById("savePay").addEventListener("click", async () => {
    const amount = Number(amountInput.value);
    const fee = Number(feeInput.value) || 0;
    const manualInterest = interestInput.value === "" ? null : Number(interestInput.value);
    const errEl = document.getElementById("payErr");
    if (!dateInput.value) { errEl.textContent = "Selecciona la fecha real del pago."; errEl.classList.add("visible"); return; }
    if (!amount || amount <= 0) { errEl.textContent = "Pon un monto válido."; errEl.classList.add("visible"); return; }
    if (fee < 0 || fee > amount) { errEl.textContent = "Los cargos no pueden superar el pago total."; errEl.classList.add("visible"); return; }
    if (manualInterest != null && (manualInterest < 0 || manualInterest > amount - fee)) { errEl.textContent = "El interés no puede superar el monto disponible después de cargos."; errEl.classList.add("visible"); return; }
    if (Number(state.analysis?.liquidity?.balanceToday) < amount) { errEl.textContent = `No tienes ${money(amount)} disponibles hoy en la cuenta.`; errEl.classList.add("visible"); return; }

    const saveBtn = document.getElementById("savePay"); saveBtn.disabled = true; saveBtn.textContent = "Registrando…";
    const { data, error } = await supabase.rpc("record_debt_payment_v4", {
      p_debt_id: d.id, p_account_id: state.account.id, p_amount: amount,
      p_paid_on: dateInput.value, p_interest_component: manualInterest,
      p_fee_component: fee, p_payment_action: document.getElementById("payAction").value,
      p_breakdown_confirmed: document.getElementById("payBreakdownConfirmed").checked,
      p_note: null,
    });
    if (error) { console.error("record_debt_payment_v4 falló", error); errEl.textContent = error.message || "No se pudo registrar el pago."; errEl.classList.add("visible"); saveBtn.disabled = false; saveBtn.textContent = "Registrar pago"; return; }
    modal.classList.remove("visible"); modal.innerHTML = ""; await loadState(); renderApp();
    showToast(`Pago registrado: ${money(data?.principal_component || 0)} a capital y ${money(data?.interest_component || 0)} a intereses`);
  });
}

async function replaceBudgetSafely(budgetId, categoryId, amount) {
  const effectiveDate = localISODate();
  const { error: rpcError } = await supabase.rpc("replace_budget", {
    p_budget_id: budgetId, p_category_id: categoryId, p_amount: Number(amount), p_effective_date: effectiveDate,
  });
  if (rpcError) {
    console.error("replace_budget falló", rpcError);
    return { error: rpcError };
  }
  return { error: null };
}

// ---------------------------------------------------------------
// MODAL: NUEVA META (con selector de prioridad)
// ---------------------------------------------------------------
// Preview de viabilidad de meta — compartida entre el onboarding (paso 4)
// y "+ Nueva meta", para que ambas pantallas calculen exactamente lo mismo
// y no se desincronicen si una se actualiza y la otra no.
function goalAvailableBudget() {
  return Number(state.analysis?.cashFlow?.remainingBudget) || 0;
}

function resolveGoalPlan(amount, months, monthly) {
  const target = Number(amount) || 0;
  const deadline = Number(months) || 0;
  const contribution = Number(monthly) || 0;
  if (target <= 0) return { valid: false, message: "El monto objetivo debe ser mayor que cero." };
  if (deadline <= 0 && contribution <= 0) return { valid: false, message: "Indica el plazo o el aporte mensual." };
  if (deadline > 0 && contribution > 0) {
    const required = target / deadline;
    if (contribution + 0.01 < required) {
      return { valid: false, message: `Con ${money(contribution)}/mes no llegarías en ${deadline} meses. Necesitas al menos ${money(Math.ceil(required))}/mes o ampliar el plazo.` };
    }
  }
  return { valid: true, targetMonths: deadline > 0 ? Math.ceil(deadline) : Math.ceil(target / contribution) };
}

function buildGoalPreviewHTML(amount, months, monthly) {
  const target = Number(amount) || 0;
  if (target <= 0) return "";
  const deadline = Number(months) || 0;
  const contribution = Number(monthly) || 0;
  const available = goalAvailableBudget();
  const plan = resolveGoalPlan(target, deadline, contribution);
  if (!plan.valid) {
    return `<div class="card" style="background:var(--warning-bg); margin-top:4px;"><p style="font-size:12px; color:var(--warning-text); margin:0; line-height:1.5;">⚠ ${plan.message}</p></div>`;
  }
  const needed = deadline > 0 ? Math.ceil(target / deadline) : contribution;
  const monthsNeeded = deadline > 0 ? deadline : Math.ceil(target / contribution);
  if (available <= 0) {
    return `<div class="card" style="background:var(--warning-bg); margin-top:4px;"><p style="font-size:12px; color:var(--warning-text); margin:0; line-height:1.5;">⚠ Tu presupuesto restante actual es ${money(available)}. La meta requiere ${money(needed)}/mes durante ${monthsNeeded} meses.</p></div>`;
  }
  const pct = Math.round((needed / available) * 100);
  const sustainable = pct <= 50;
  return `<div class="card" style="background:${sustainable ? "var(--success-bg)" : "var(--warning-bg)"}; margin-top:4px;"><p style="font-size:12px; color:${sustainable ? "var(--success-text)" : "var(--warning-text)"}; margin:0; line-height:1.5;">${sustainable ? "✓ Alcanzable." : "⚠ Puede ser difícil."} Necesitas ${money(needed)}/mes durante ${monthsNeeded} meses — ${pct}% de tu presupuesto restante oficial.</p></div>`;
}

// El aporte sale del bolsillo → se registra como transacción real
// (hechos, no intenciones), sube el progreso, y queda auditable.
// ---------------------------------------------------------------
function openContributeModal(goalId) {
  const g = state.goals.find(x => x.id === goalId);
  const modal = document.getElementById("logModal");
  const restante = Math.max(0, Number(g.target_amount) - Number(g.current_amount));
  const sugerido = Math.min(Math.round(goalMonthlyPace(g)), restante);
  modal.classList.add("visible");
  modal.innerHTML = `
    <div class="modal-box">
      <p class="step-label">Aportar a "${esc(g.name)}"</p>
      <p style="font-size:12px; color:var(--text-muted); text-align:center; margin:0 0 4px;">Te falta ${money(restante)} para tu objetivo.</p>
      <p style="font-size:11px; color:var(--text-muted); text-align:center; margin:0 0 14px;">Saldo disponible ahora: ${money(balance())}</p>
      <label>¿Cuánto quieres apartar?</label>
      <input id="contribAmount" type="number" min="0" step="1" value="${sugerido > 0 ? sugerido : ""}" style="margin-bottom:16px;" />
      <div class="error-banner" id="contribErr"></div>
      <div class="btn-row">
        <button class="btn-secondary" id="cancelContrib">Cancelar</button>
        <button class="btn-primary" id="saveContrib">Aportar</button>
      </div>
    </div>
  `;
  document.getElementById("cancelContrib").addEventListener("click", () => { modal.classList.remove("visible"); modal.innerHTML = ""; });
  document.getElementById("saveContrib").addEventListener("click", async () => {
    const amount = Number(document.getElementById("contribAmount").value);
    const errEl = document.getElementById("contribErr");
    if (!amount || amount <= 0) {
      errEl.textContent = "Pon un monto válido.";
      errEl.classList.add("visible");
      return;
    }
    if (amount > restante) {
      errEl.textContent = `Con ${money(amount)} pasarías tu objetivo. Te falta solo ${money(restante)}.`;
      errEl.classList.add("visible");
      return;
    }
    const saveBtn = document.getElementById("saveContrib");
    saveBtn.disabled = true;
    saveBtn.textContent = "Aportando…";

    const monthlyPaceWas = goalMonthlyPace(g);
    const newAmount = Number(g.current_amount) + amount;
    const completed = newAmount >= Number(g.target_amount);

    const { error: rpcError } = await supabase.rpc("record_goal_contribution", {
      p_goal_id: g.id, p_account_id: state.account.id, p_amount: amount,
    });
    if (rpcError) {
      console.error("record_goal_contribution falló", rpcError);
      errEl.textContent = rpcError.message || "No se pudo registrar el aporte. Intenta de nuevo.";
      errEl.classList.add("visible");
      saveBtn.disabled = false;
      saveBtn.textContent = "Aportar";
      return;
    }

    modal.classList.remove("visible"); modal.innerHTML = "";
    await loadState();

    if (completed) {
      // Calcular cuántos meses antes y cuánto dinero se libera
      const monthsEarly = goalMonthsLeft(g); // meses que quedaban cuando aportó
      const updatedGoal = state.goals.find(x => x.id === g.id);
      // Se usa el ritmo pendiente anterior al aporte, no el objetivo completo.
      const nextActive = state.goals.find(x => isGoalActive(x) && x.id !== g.id);
      openGoalCelebrationModal(g.name, monthsEarly, Math.round(monthlyPaceWas), nextActive);
    } else {
      renderApp();
      showToast("Aporte registrado");
    }
  });
}

        <input id="incLogNote" placeholder="Nota (opcional, ej. Sueldo julio)" style="margin-bottom:16px;" />
        <div class="btn-row">
          <button class="btn-secondary" id="cancelIncLog">Cancelar</button>
          <button class="btn-primary" id="saveIncLog">Guardar</button>
        </div>
      </div>
    `;
    document.getElementById("cancelIncLog").addEventListener("click", () => { modal.classList.remove("visible"); modal.innerHTML = ""; });
    document.getElementById("saveIncLog").addEventListener("click", async () => {
      const amount = document.getElementById("incLogAmount").value;
      const note = document.getElementById("incLogNote").value.trim();
      if (!amount || Number(amount) <= 0) { showToast("Pon un monto válido.", true); return; }
      const saveBtn = document.getElementById("saveIncLog");
      saveBtn.disabled = true;
      saveBtn.textContent = "Guardando…";
      const { error } = await supabase.from("transactions").insert({
        user_id: user.id, account_id: state.account.id, category_id: null,
        amount: Math.abs(Number(amount)), note: note || null,
      });
      if (error) {
        showToast("No se pudo guardar. Intenta de nuevo.", true);
        saveBtn.disabled = false;
        saveBtn.textContent = "Guardar";
        return;
      }
      await loadState();
      paint(true);
    });
  }
  paint();
}

// ---------------------------------------------------------------
// MODAL: REGISTRO RÁPIDO
// ---------------------------------------------------------------
function openLogModal(prefillAmount = null, prefillNote = null) {
  const modal = document.getElementById("logModal");
  let selectedCat = null;

  function paint(saved = false) {
    modal.classList.add("visible");
    if (saved) {
      modal.innerHTML = `
        <div class="modal-box" style="text-align:center; padding:40px 20px;">
          <div class="icon-circle" style="background:var(--teal-light); margin:0 auto 10px;">✓</div>
          <p style="font-size:14px; color:var(--teal); font-weight:500;">Gasto registrado</p>
        </div>
      `;
      setTimeout(() => { modal.classList.remove("visible"); modal.innerHTML = ""; renderApp(); }, 900);
      return;
    }

    modal.innerHTML = `
      <div class="modal-box">
        <p class="step-label">Nuevo gasto</p>
        <input id="logAmount" type="number" step="1" min="0" placeholder="RD$0"
          value="${prefillAmount ?? ""}"
          style="text-align:center; font-size:24px; margin-bottom:10px;" />
        <input id="logNote" placeholder="Nota (opcional)" value="${esc(prefillNote || "")}" style="margin-bottom:12px;" />
        <label>Categoría</label>
        <div class="cat-grid">
          ${categories.map(c => `<div class="cat-option ${selectedCat === c.id ? "selected" : ""}" data-cat="${c.id}">${CATEGORY_ICONS[c.name] || "•"}<br>${c.name}</div>`).join("")}
        </div>
        <div class="btn-row">
          <button class="btn-secondary" id="cancelLog">Cancelar</button>
          <button class="btn-primary" id="saveLog">Guardar</button>
        </div>
      </div>
    `;

    document.querySelectorAll(".cat-option").forEach(el => {
      el.addEventListener("click", () => {
        selectedCat = el.dataset.cat;
        document.querySelectorAll(".cat-option").forEach(c => c.classList.remove("selected"));
        el.classList.add("selected");
      });
    });
    document.getElementById("cancelLog").addEventListener("click", () => { modal.classList.remove("visible"); modal.innerHTML = ""; });
    document.getElementById("saveLog").addEventListener("click", async () => {
      const amount = document.getElementById("logAmount").value;
      const note = document.getElementById("logNote")?.value.trim() || null;
      if (!amount || Number(amount) <= 0 || !selectedCat) { showToast("Completa el monto y la categoría.", true); return; }
      const saveBtn = document.getElementById("saveLog");
      saveBtn.disabled = true;
      saveBtn.textContent = "Guardando…";
      const { error } = await supabase.from("transactions").insert({
        user_id: user.id, account_id: state.account.id, category_id: selectedCat,
        amount: -Math.abs(Number(amount)), note,
      });
      if (error) {
        showToast("No se pudo guardar. Intenta de nuevo.", true);
        saveBtn.disabled = false;
        saveBtn.textContent = "Guardar";
        return;
      }
      await loadState();
      paint(true);
    });
  }
  paint();
}

function runDebtUXTests() {
  const tests = [];
  const check = (name, ok) => tests.push({ name, ok: Boolean(ok) });
  const flat = calculateDebtPlan({ planType: "flat_total", originalAmount: 20000, interestRate: 45, interestRateType: "total_term", paymentFrequency: "monthly", termCount: 5 });
  check("45% total sobre RD$20,000 produce RD$29,000", Math.abs(flat.totalPayable - 29000) < 0.01);
  check("La cuota plana de 5 pagos es RD$5,800", Math.abs(flat.scheduledPayment - 5800) < 0.01);
  const estimated = wizardDebtPayload({ name:"Tenis", debtType:"prestamista", existingMode:"new", originalAmount:20000, currentBalance:"", paidBeforeApp:"", knowledge:"scheduled_payment", rate:"", totalPayable:"", scheduledPayment:2435, termCount:10, paymentFrequency:"monthly", nextDue:"", startDate:"", allocationMethod:"proportional" });
  check("Solo cuota crea una estimación, no una tasa inventada", estimated.payload.setup_state === "estimated" && estimated.payload.interest_rate == null);
  const unknown = wizardDebtPayload({ name:"Deuda", debtType:"otro", existingMode:"existing", originalAmount:20000, currentBalance:15000, paidBeforeApp:5000, knowledge:"unknown", scheduledPayment:3000, termCount:6, paymentFrequency:"monthly", nextDue:"", startDate:"", allocationMethod:"manual" });
  check("Interés desconocido queda incompleto", unknown.payload.setup_state === "incomplete" && unknown.payload.interest_rate == null);
  check("Una deuda en curso conserva saldo actual", unknown.payload.current_balance === 15000);
  const partial1 = 1200, partial2 = 1235, installment = 2435;
  check("Dos pagos parciales completan una cuota", Math.floor((partial1 + partial2) / installment) === 1);
  const passed = tests.filter(t => t.ok).length;
  console.log(`[DEBT UX TESTS] ${passed}/${tests.length} passed`);
  tests.forEach(t => console.log(`  ${t.ok ? "✅" : "❌"} ${t.name}`));
  return { passed, total: tests.length, tests };
}
window.runDebtUXTests = runDebtUXTests;

init();
</script>
