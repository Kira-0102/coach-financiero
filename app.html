        <div style="align-self:${m.role === "user" ? "flex-end" : "flex-start"}; background:${m.role === "user" ? "var(--teal)" : "var(--card)"}; color:${m.role === "user" ? "white" : "var(--text)"}; border-radius:14px; padding:10px 12px; max-width:85%;">
          <p style="font-size:13px; margin:0; line-height:1.5;">${esc(m.content)}</p>
        </div>
      `).join("")}
      <div id="coachTyping" style="display:none; align-self:flex-start; background:var(--card); border-radius:14px; padding:10px 12px;">
        <p style="font-size:13px; margin:0; color:var(--text-muted);">Escribiendo…</p>
      </div>
    </div>
    <div class="error-banner ${coachError ? "visible" : ""}" id="coachErr">${esc(coachError)}</div>
    <div style="display:flex; gap:8px;">
      <input id="coachInput" placeholder="Pregúntale algo a tu coach" maxlength="500" style="margin-bottom:0;" ${coachSending ? "disabled" : ""} />
      <button class="btn-primary" id="coachSendBtn" style="flex:0 0 auto; padding:10px 16px;" ${coachSending ? "disabled" : ""}>${coachSending ? "…" : "Enviar"}</button>
    </div>
  `;
}

function purchaseVerdictPayload(analysis) {
  if (!analysis) return null;
  return {
    verdict: analysis.verdict,
    verdictLabel: analysis.verdictLabel,
    reason: analysis.reason,
    item: analysis.meta?.itemName ?? null,
    amount: analysis.meta?.amount ?? null,
    canBuyNow: analysis.affordability?.canBuyNow ?? null,
    canBuyAfterNextIncome: analysis.affordability?.canBuyAfterNextIncome ?? null,
    canAffordAfterNextIncome: analysis.affordability?.canAffordAfterNextIncome ?? null,
    requiresNextIncome: analysis.affordability?.requiresNextIncome ?? null,
    shouldBuy: analysis.judgment?.shouldBuy ?? null,
    isBestUseOfMoney: analysis.judgment?.isBestUseOfMoney ?? null,
  };
}

function buildCoachContext({ purchaseMode = false, purchaseAnalysis = null } = {}) {
  const fa = state.analysis || computeAnalysis();
  const liquidity = fa?.liquidity;
  const cashFlow = fa?.cashFlow;
  const normalized = fa?.normalized;
  const goalsAnalysis = fa?.goals;
  const debtsAnalysis = fa?.debts;
  const officialPurchase = purchaseAnalysis || coachPurchaseAnalysis || simulatorPurchaseAnalysis;

  const base = {
    schemaVersion: fa?.schemaVersion ?? null,
    balance: Math.round(Number(liquidity?.balanceToday) || 0),
    freeCashToday: Math.round(Number(liquidity?.freeCashToday) || 0),
    projectedBalance: liquidity?.projectedBalance == null ? null : Math.round(Number(liquidity.projectedBalance)),
    freeCashProjected: liquidity?.freeCashProjected == null ? null : Math.round(Number(liquidity.freeCashProjected)),
    remainingBudget: Math.round(Number(cashFlow?.remainingBudget) || 0),
    income: Math.round(Number(cashFlow?.monthlyIncome) || 0),
    perPaycheck: Math.round(Number(normalized?.perPaycheck) || 0),
    payFrequency: normalized?.payFrequency || null,
    nextPay: liquidity?.nextPay || null,
    debtRisk: debtsAnalysis?.riskLevel || "none",
    goalsAffordable: goalsAnalysis?.canAffordAllGoals !== false,
    lastPurchaseVerdict: purchaseVerdictPayload(officialPurchase),
  };

  // En compras se envía un contexto mínimo para impedir que una categoría
  // irrelevante (por ejemplo Transporte) contamine la explicación.
  if (purchaseMode) return base;

  return {
    ...base,
    totalFixed: Math.round(Number(cashFlow?.fixedExpenses) || 0),
    variableExpenses: Math.round(Number(cashFlow?.variableExpenses) || 0),
    goals: (goalsAnalysis?.byGoal || []).map(g => ({
      name: g.name,
      target: Number(g.target_amount),
      saved: Number(g.current_amount),
      remaining: Math.max(0, Number(g.target_amount) - Number(g.current_amount)),
      monthlyPace: Math.round(Number(g.pace) || 0),
      status: g.derivedStatus,
      priority: g.priority,
    })),
    debts: (debtsAnalysis?.sorted || []).map(d => ({
      name: d.name,
      balance: Number(d.current_balance),
      annualRate: annualizedDebtRate(d),
      rateLabel: debtRateLabel(d),
      monthlyPayment: monthlyPaymentEquivalent(
        Number(d.scheduled_payment ?? d.minimum_payment) || 0,
        d.payment_frequency || "monthly"
      ),
    })),
  };
}

function containsPurchaseIntent(message) {
  return /\b(comprar|comprarlo|comprarla|comprarlos|comprarlas|comprarme|comprármelo|comprármela|comprármelos|comprármelas|adquirir|pagar\s+por)\b/i.test(String(message));
}

function isPurchaseFollowUpMsg(message) {
  return [
    /\bpuedo\s+comprar(?:lo|la|los|las|melo|mela|melos|melas)?\s+ahora\b/i,
    /\bpuedo\s+compr[aá]rme(?:lo|la|los|las)?\s+ahora\b/i,
    /\bcuando\s+cobre\b/i, /\bpr[oó]ximo\s+cobro\b/i, /\by\s+despu[eé]s\b/i,
    /\bentonces\s+s[ií]\b/i, /\bme\s+conviene\b/i, /\bpuedo\s+hacerlo\b/i,
    /\by\s+ahora\b/i, /\bcuando\s+me\s+paguen\b/i,
  ].some(pattern => pattern.test(String(message)));
}

function parseMoneyNumber(raw) {
  if (!raw) return null;
  const cleaned = String(raw).replace(/\s/g, "").replace(/[.,](?=\d{3}(?:\D|$))/g, "").replace(",", ".");
  const value = Number(cleaned);
  return Number.isFinite(value) && value > 0 ? value : null;
}

function extractMoneyAmounts(message, { allowBare = false } = {}) {
  const value = String(message || "");
  const patterns = [
    /(?:rd\$|dop\$?|rd\s*\$)\s*(\d[\d.,]*)/gi,
    /(\d[\d.,]*)\s*(?:pesos?|dop)\b/gi,
    /(?:cuesta|cuestan|vale|valen|sale|salen|precio(?:\s+es)?|son)\s*(?:rd\$|dop\$?)?\s*(\d[\d.,]*)/gi,
    /(?:de|por)\s+(?:rd\$|dop\$?)\s*(\d[\d.,]*)/gi,
  ];
  const amounts = [];
  for (const pattern of patterns) {
    for (const match of value.matchAll(pattern)) {
      const amount = parseMoneyNumber(match[1]);
      if (amount && !amounts.includes(amount)) amounts.push(amount);
    }
  }
  if (allowBare && amounts.length === 0 && /^\s*\d[\d.,\s]*\s*$/.test(value)) {
    const amount = parseMoneyNumber(value);
    if (amount) amounts.push(amount);
  }
  return amounts;
}

function extractMoneyAmount(message, options = {}) {
  const amounts = extractMoneyAmounts(message, options);
  return amounts.length === 1 ? amounts[0] : null;
}

function isPriceReply(message) {
  if (extractMoneyAmount(message, { allowBare: true }) && /^\s*(?:rd\$?\s*)?\d[\d.,\s]*(?:\s*(?:pesos?|dop))?\s*$/i.test(String(message))) return true;
  return extractMoneyAmount(message) != null && /\b(cuesta|cuestan|vale|valen|sale|salen|precio|son)\b/i.test(String(message));
}

function extractPurchaseItem(message) {
  const value = String(message || "").trim();
  // Las formas pronominales hacen referencia al artículo anterior.
  if (/\b(comprarlo|comprarla|comprarlos|comprarlas|comprármelo|comprármela|comprármelos|comprármelas)\b/i.test(value)) return null;
  const match = value.match(/(?:comprar|comprarme|adquirir|pagar\s+por)\s+(?:unos?|unas?|un|una|el|la)?\s*(.+)$/i);
  if (!match) return null;
  let item = match[1]
    .replace(/\s+(?:de|por)\s+(?:rd\$|dop\$?)\s*\d[\d.,]*.*$/i, "")
    .replace(/[?.!,]+$/g, "")
    .trim();
  return item && !/^(ahora|despu[eé]s|cuando\s+cobre)$/i.test(item) ? item : null;
}

function expireCoachPurchaseContext() {
  if (coachPurchaseContext.updatedAtTurn !== null && coachTurnCounter - coachPurchaseContext.updatedAtTurn > 6) {
    resetCoachPurchaseContext();
  }
}

function updateCoachPurchaseContext(message) {
  expireCoachPurchaseContext();
  const explicitAmounts = extractMoneyAmounts(message);
  const followUp = isPurchaseFollowUpMsg(message);
  const hasIntent = containsPurchaseIntent(message);

  if (explicitAmounts.length > 1) {
    coachPurchaseContext.awaitingAmount = true;
    coachPurchaseContext.amount = null;
    coachPurchaseContext.updatedAtTurn = coachTurnCounter;
    coachPurchaseAnalysis = null;
    return { ambiguousOptions: true, followUp, hasIntent };
  }

  if (hasIntent) {
    const itemName = extractPurchaseItem(message);
    const amount = explicitAmounts[0] || null;
    if (itemName && coachPurchaseContext.itemName && itemName.toLowerCase() !== coachPurchaseContext.itemName.toLowerCase()) {
      resetCoachPurchaseContext();
    }
    if (itemName) coachPurchaseContext.itemName = itemName;
    if (amount) {
      coachPurchaseContext.amount = amount;
      coachPurchaseContext.awaitingAmount = false;
    } else if (!coachPurchaseContext.amount) {
      coachPurchaseContext.awaitingAmount = true;
    }
    coachPurchaseContext.updatedAtTurn = coachTurnCounter;
  } else if (coachPurchaseContext.awaitingAmount && isPriceReply(message)) {
    const amount = extractMoneyAmount(message, { allowBare: true });
    if (amount) {
      coachPurchaseContext.amount = amount;
      coachPurchaseContext.awaitingAmount = false;
      coachPurchaseContext.updatedAtTurn = coachTurnCounter;
    }
  } else if (followUp && coachPurchaseContext.amount) {
    coachPurchaseContext.updatedAtTurn = coachTurnCounter;
  }

  return { ambiguousOptions: false, followUp, hasIntent };
}

function buildLocalPurchaseCoachReply(message, interactionType, analysis) {
  if (interactionType === "clarify_purchase_option") {
    return "Mencionaste varios precios. Dime cuál monto exacto quieres analizar.";
  }
  if (interactionType === "clarify_purchase") {
    const item = coachPurchaseContext.itemName ? ` para ${coachPurchaseContext.itemName}` : "";
    return `¿Cuánto cuesta${item}?`;
  }
  if (interactionType !== "purchase_followup" || !analysis) return null;

  const text = String(message || "");
  const a = analysis.affordability || {};
  const j = analysis.judgment || {};
  const item = analysis.meta?.itemName || "esa compra";
  const amount = money(analysis.meta?.amount || 0);

  if (/\b(ahora|hoy)\b/i.test(text)) {
    if (a.canBuyNow) {
      return j.shouldBuy
        ? `Sí, puedes pagar ${item} por ${amount} hoy. El motor indica que tus compromisos quedan cubiertos. ${analysis.reason}`
        : `Puedes pagarlo hoy físicamente, pero el motor no lo recomienda como mejor decisión. ${analysis.reason}`;
    }
    return `No puedes pagarlo hoy con el saldo real disponible. ${analysis.reason}`;
  }

  if (/\b(cobre|cobro|paguen|despu[eé]s)\b/i.test(text)) {
    if (a.canAffordAfterNextIncome) {
      return j.shouldBuy
        ? `Después del próximo cobro el saldo proyectado sí cubriría ${item} por ${amount}. Aun así, espera a que el dinero entre realmente. ${analysis.reason}`
        : `Después del próximo cobro podrías cubrir el precio, pero eso no significa que sea recomendable. ${analysis.reason}`;
    }
    return `No. Ni con el próximo cobro proyectado alcanza para cubrir ${item} por ${amount}. ${analysis.reason}`;
  }

  if (/\b(conviene|recomiend|mejor|deber[ií]a)\b/i.test(text)) {
    if (j.shouldBuy && j.isBestUseOfMoney) return `Sí. El motor considera que puedes comprarlo y que es un uso razonable del dinero. ${analysis.reason}`;
    if (a.canBuyNow || a.canAffordAfterNextIncome) return `Podrías llegar a pagarlo, pero el motor no lo considera tu mejor uso del dinero ahora. ${analysis.reason}`;
    return `No es recomendable porque la compra no es financieramente viable con tu liquidez actual ni proyectada. ${analysis.reason}`;
  }

  return `${analysis.verdictLabel}. ${analysis.reason}`;
}

async function invokeCoach(payload, timeoutMs = 30000) {
  const request = supabase.functions.invoke("coach-chat", { body: payload });
  const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), timeoutMs));
  return Promise.race([request, timeout]);
}

async function sendCoachMessage() {
  if (coachSending) return;
  const input = document.getElementById("coachInput");
  const msg = input?.value.trim();
  if (!msg) return;

  coachError = "";
  coachSending = true;
  coachTurnCounter += 1;
  const wasAwaitingAmount = coachPurchaseContext.awaitingAmount;
  const contextUpdate = updateCoachPurchaseContext(msg);

  const priceReply = wasAwaitingAmount && isPriceReply(msg);
  const purchaseRelated = contextUpdate.hasIntent || contextUpdate.followUp || priceReply || contextUpdate.ambiguousOptions;
  const hasResolvedPurchase = Number(coachPurchaseContext.amount) > 0;

  if (purchaseRelated && hasResolvedPurchase && state.analysis) {
    coachPurchaseAnalysis = buildPurchaseAnalysis(
      state.analysis,
      coachPurchaseContext.amount,
      coachPurchaseContext.itemName || "Compra consultada"
    );
  }

  let interactionType = "general";
  if (contextUpdate.ambiguousOptions) interactionType = "clarify_purchase_option";
  else if (purchaseRelated && hasResolvedPurchase) interactionType = "purchase_followup";
  else if (purchaseRelated) interactionType = "clarify_purchase";

  coachHistory.push({ role: "user", content: msg });
  if (coachHistory.length > 20) coachHistory = coachHistory.slice(-20);
  input.value = "";

  const localPurchaseReply = buildLocalPurchaseCoachReply(msg, interactionType, coachPurchaseAnalysis);
  if (localPurchaseReply) {
    coachHistory.push({ role: "assistant", content: localPurchaseReply });
    coachSending = false;
    renderApp();
    return;
  }

  renderApp();
  document.getElementById("coachTyping")?.style.setProperty("display", "block");

  try {
    const { data, error } = await invokeCoach({
      message: msg,
      history: coachHistory.slice(0, -1).slice(-10),
      context: buildCoachContext({ purchaseMode: interactionType.startsWith("purchase") || interactionType.startsWith("clarify_purchase"), purchaseAnalysis: coachPurchaseAnalysis }),
      interaction: { type: interactionType, source: "coach", awaitingAmount: coachPurchaseContext.awaitingAmount },
    });
    if (error || data?.error) throw new Error(data?.error || error?.message || "coach_error");
    if (typeof data?.reply !== "string" || !data.reply.trim()) throw new Error("invalid_reply");
    coachHistory.push({ role: "assistant", content: data.reply.trim() });
  } catch (error) {
    coachError = error?.message === "timeout"
      ? "El coach tardó demasiado en responder. Intenta de nuevo."
      : "No se pudo conectar con el coach. Revisa tu conexión e intenta de nuevo.";
  } finally {
    coachSending = false;
  }
  renderApp();
}

function wireCoach() {
  const sendBtn = document.getElementById("coachSendBtn");
  const input = document.getElementById("coachInput");
  if (!sendBtn || !input) return;
  sendBtn.addEventListener("click", sendCoachMessage);
  input.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      sendCoachMessage();
    }
  });
  const messages = document.getElementById("coachMessages");
  if (messages) messages.scrollTop = messages.scrollHeight;
}

// ================================================================
// MOTOR DE DECISIÓN v2 — buildPurchaseAnalysis(financialAnalysis, amount, itemName)
// Fuente única de verdad. La UI y el Coach consumen este objeto.
// Nunca inventar información — si no hay datos, decirlo explícito.
// ================================================================
function scoreLabel(s) {
  return s >= 80 ? "Excelente" : s >= 60 ? "Buena" : s >= 40 ? "Moderada" : s >= 20 ? "Baja" : "Muy baja";
}

function buildPurchaseAnalysis(financialAnalysis, amount, itemName) {
  const purchaseAmount = Math.max(0, Number(amount) || 0);
  const fa = financialAnalysis;

  if (!fa?.liquidity || !fa?.cashFlow) {
    return {
      verdict: "neutral", score: 0, stars: 0, verdictLabel: "", reason: "",
      summary: "Completa tu perfil para analizar una compra.", coachPrompt: "",
      purchaseAnalysis: null,
      dimensions: {
        liquidez: { score: 0, label: "Sin datos", msg: "Completa tu perfil financiero." },
        deudas: { score: 0, label: "Sin datos", msg: "Completa tu perfil financiero." },
        metas: { score: 0, label: "Sin datos", msg: "Completa tu perfil financiero." },
        habitos: { score: 0, label: "Sin datos", msg: "Todavía no hay suficiente historial." },
        bienestar: { score: 0, label: "Sin datos", msg: "Completa tu perfil financiero." },
        oportunidad: { title: "", items: [] },
      },
      actions: { canBuy: false, registerPurchase: false, saveWishlist: false },
      affordability: { canBuyNow: false, canBuyAfterNextIncome: false },
      judgment: { shouldBuy: false, isBestUseOfMoney: false, verdict: "neutral" },
      meta: { amount: purchaseAmount, itemName, balAfter: null, dispRestante: null, afterPurch: null },
    };
  }

  const { liquidity, cashFlow, goals, debts, financialHealth, recommendations } = fa;
  const bal = Number(liquidity.balanceToday) || 0;
  const projectedBalance = liquidity.projectedBalance == null ? null : Number(liquidity.projectedBalance);
  const nextPay = liquidity.nextPay;
  const daysLeft = Math.max(1, Number(liquidity.daysLeftInMonth) || 1);
  const balanceAfterToday = bal - purchaseAmount;
  const balanceAfterProjected = projectedBalance == null ? null : projectedBalance - purchaseAmount;
  const freeCashAfterToday = Number(liquidity.freeCashToday || 0) - purchaseAmount;
  const freeCashAfterProjected = liquidity.freeCashProjected == null
    ? null
    : Number(liquidity.freeCashProjected) - purchaseAmount;
  const remainingBudgetAfter = Number(cashFlow.remainingBudget || 0) - purchaseAmount;
  const operatingSurplusAfter = Number(cashFlow.operatingSurplus || 0) - purchaseAmount;

  // Faltantes separados: capacidad matemática de pagar vs. capacidad de
  // preservar compromisos. Nunca mezclar saldo proyectado con dinero libre.
  const purchaseShortfallToday = Math.max(0, purchaseAmount - bal);
  const purchaseShortfallProjected = projectedBalance == null
    ? purchaseAmount
    : Math.max(0, purchaseAmount - projectedBalance);
  const freeCashShortfallToday = Math.max(0, -freeCashAfterToday);
  const freeCashShortfallProjected = freeCashAfterProjected == null
    ? null
    : Math.max(0, -freeCashAfterProjected);

  const canBuyToday = purchaseAmount > 0 && bal >= purchaseAmount;
  const canAffordAfterNextIncome = purchaseAmount > 0 && projectedBalance !== null && projectedBalance >= purchaseAmount;
  const requiresNextIncome = !canBuyToday && canAffordAfterNextIncome;
  // Compatibilidad: este campo histórico significa "requiere el próximo cobro".
  const canBuyAfterNextIncome = requiresNextIncome;
  const criticalDebt = debts?.riskLevel === "critical";
  const goalsAtRisk = (goals?.byGoal || []).some(g => g.derivedStatus === "at_risk");
  const commitmentsCoveredToday = freeCashAfterToday >= 0;
  const commitmentsCoveredProjected = freeCashAfterProjected !== null && freeCashAfterProjected >= 0;
  const goalsCovered = goals?.canAffordAllGoals !== false && !goalsAtRisk;

  // 1. LIQUIDEZ
  let liqS, liqLabel, liqMsg;
  if (purchaseAmount === 0) {
    liqS = 100; liqLabel = "—";
    liqMsg = "Ingresa un monto para ver el análisis de liquidez.";
  } else if (canBuyToday && commitmentsCoveredToday) {
    const pct = balanceAfterToday / Math.max(1, bal);
    liqS = pct >= 0.6 ? 90 : pct >= 0.4 ? 75 : pct >= 0.2 ? 60 : pct >= 0.05 ? 45 : 30;
    liqLabel = scoreLabel(liqS);
    liqMsg = `Puedes pagarla hoy. Te quedarían ${money(Math.round(balanceAfterToday))} en la cuenta y ${money(Math.round(freeCashAfterToday))} libres después de tus compromisos planificados.`;
  } else if (canBuyToday) {
    liqS = 30; liqLabel = "Comprometida";
    liqMsg = `Tienes el dinero en la cuenta, pero la compra usaría ${money(Math.abs(Math.round(freeCashAfterToday)))} reservado para deudas o metas. Puedes pagarla físicamente, pero no sin afectar compromisos.`;
  } else if (canBuyAfterNextIncome) {
    liqS = commitmentsCoveredProjected ? (nextPay?.daysAway <= 5 ? 55 : nextPay?.daysAway <= 15 ? 45 : 35) : 25;
    liqLabel = scoreLabel(liqS);
    const projectedFreeText = freeCashAfterProjected == null
      ? "sin cálculo de dinero libre"
      : `${money(Math.round(freeCashAfterProjected))} libres después de compromisos`;
    liqMsg = `Hoy no tienes ${money(purchaseAmount)} en cuenta (saldo: ${money(bal)}). Después de tu próximo cobro de ${money(nextPay?.amount || 0)} el saldo sería ${money(projectedBalance)}; tras la compra quedarían ${money(balanceAfterProjected)} en cuenta y ${projectedFreeText}. ${commitmentsCoveredProjected ? "La compra sería posible entonces, no hoy." : "El saldo alcanzaría, pero tus compromisos planificados quedarían sin cubrir."}`;
  } else {
    liqS = 5; liqLabel = "Muy baja";
    if (nextPay) {
      const faltante = Math.max(0, purchaseAmount - Number(projectedBalance || 0));
      liqMsg = `Hoy tienes ${money(bal)}. Después de tu próximo cobro de ${money(nextPay.amount)} tendrías ${money(projectedBalance || 0)} y todavía faltarían ${money(faltante)}.`;
    } else {
      liqMsg = `Hoy no tienes ${money(purchaseAmount)} en cuenta (saldo: ${money(bal)}) y no hay un próximo cobro configurado para proyectar la compra.`;
    }
  }

  // 2. DEUDAS
  let debtS, debtLabel, debtMsg;
  const topDebt = debts?.topDebt || null;
  if (!topDebt) {
    debtS = 90; debtLabel = "Sin deudas";
    debtMsg = "No tienes deudas activas registradas.";
  } else if (criticalDebt) {
    debtS = 25; debtLabel = "Alta prioridad";
    debtMsg = `Tienes una deuda con "${topDebt.name}" al ${topDebt.interest_rate}% anual. Esta compra nunca puede recibir verde mientras esa deuda siga activa.`;
  } else if (debts.riskLevel === "high") {
    debtS = 50; debtLabel = "Moderada";
    debtMsg = `Tu deuda activa de mayor tasa está al ${topDebt.interest_rate}% anual. Conviene evaluar si la compra puede esperar.`;
  } else {
    debtS = 75; debtLabel = "Manejable";
    debtMsg = "Tus deudas activas no presentan una tasa crítica.";
  }

  // 3. METAS Y PRESUPUESTO MENSUAL
  let goalsS, goalsLabel, goalsMsg;
  const activeGoals = goals?.active || [];
  if (activeGoals.length === 0) {
    goalsS = 80; goalsLabel = "Sin metas";
    goalsMsg = "No tienes metas activas registradas.";
  } else if (purchaseAmount === 0) {
    goalsS = 80; goalsLabel = "—";
    goalsMsg = "Ingresa un monto para ver el impacto en tus metas.";
  } else if (remainingBudgetAfter >= 0) {
    goalsS = goalsAtRisk ? 65 : 90;
    goalsLabel = goalsAtRisk ? "Con atención" : "Excelente";
    goalsMsg = `En tu plan mensual, después de la compra quedarían ${money(Math.round(remainingBudgetAfter))} luego de cubrir gastos, deudas y aportes a metas. Esto describe presupuesto mensual, no dinero disponible hoy.`;
  } else if (operatingSurplusAfter >= 0) {
    goalsS = 40; goalsLabel = "Baja";
    goalsMsg = `La compra cabe dentro del ingreso mensual, pero dejaría un faltante de ${money(Math.abs(Math.round(remainingBudgetAfter)))} para tus deudas o metas planificadas.`;
  } else {
    goalsS = 15; goalsLabel = "Muy baja";
    goalsMsg = `La compra supera en ${money(Math.abs(Math.round(operatingSurplusAfter)))} el margen operativo del mes antes de completar tus compromisos.`;
  }

  // 4. HÁBITOS
  const habitsS = null;
  const habitsLabel = "Sin datos";
  const habitsMsg = "Todavía no hay suficiente historial para detectar patrones de comportamiento.";

  // 5. BIENESTAR
  let wellS, wellLabel, wellMsg;
  const healthScore = Number(financialHealth?.score);
  const healthy = Number.isFinite(healthScore) && healthScore >= 60;
  if (purchaseAmount === 0) {
    wellS = 80; wellLabel = "—";
    wellMsg = "Ingresa un monto para evaluar el impacto en tu bienestar financiero.";
  } else if (canBuyToday && commitmentsCoveredToday && remainingBudgetAfter >= 0 && healthy) {
    wellS = 90; wellLabel = "Excelente";
    wellMsg = "Puedes pagarla hoy sin dejar descubiertos tus compromisos y tu salud financiera se mantiene estable.";
  } else if (canBuyToday && commitmentsCoveredToday) {
    wellS = 60; wellLabel = "Buena";
    wellMsg = "La compra es posible hoy, aunque reduce tu margen. Mantén controlados los gastos variables restantes.";
  } else if (canBuyAfterNextIncome && commitmentsCoveredProjected && remainingBudgetAfter >= 0) {
    wellS = healthy ? 65 : 50;
    wellLabel = healthy ? "Buena" : "Moderada";
    wellMsg = "No es posible hoy, pero podría ser viable después del próximo cobro. Espera a que el dinero esté realmente en la cuenta.";
  } else {
    wellS = 25; wellLabel = "Baja";
    wellMsg = "La compra reduciría demasiado tu margen o dejaría compromisos sin cubrir.";
  }

  const rawScore = purchaseAmount === 0 ? 0 :
    (liqS * 0.35 + debtS * 0.20 + goalsS * 0.25 + wellS * 0.10) / 0.90;
  const score = Math.round(rawScore);

  const shouldBuy = canBuyToday && commitmentsCoveredToday && remainingBudgetAfter >= 0 && goalsCovered && !criticalDebt;
  const strategicPriority = recommendations?.nextBestAction || null;
  const isBestUseOfMoney = shouldBuy && (!strategicPriority || Number(strategicPriority.impact || 0) < 90);

  let verdict;
  if (purchaseAmount === 0) verdict = "neutral";
  else if (!canBuyToday && canBuyAfterNextIncome) verdict = "yellow";
  else if (!canBuyToday) verdict = "red";
  else if (!shouldBuy || !isBestUseOfMoney) verdict = "yellow";
  else verdict = "green";

  const stars = verdict === "neutral" || verdict === "red" ? 0 : score >= 85 ? 5 : score >= 70 ? 4 : score >= 55 ? 3 : score >= 40 ? 2 : 1;

  let verdictLabel, reason;
  if (verdict === "neutral") {
    verdictLabel = ""; reason = "";
  } else if (verdict === "green") {
    verdictLabel = "🟢 Compra recomendable";
    reason = `Puedes pagarla hoy, tus compromisos quedan cubiertos y no existe una prioridad financiera más urgente.`;
  } else if (!canBuyToday && canBuyAfterNextIncome) {
    if (criticalDebt) {
      verdictLabel = "🟡 Viable cuando cobres, pero la deuda es prioritaria";
      reason = `El saldo proyectado cubriría ${money(purchaseAmount)} después del próximo cobro, pero tienes una deuda al ${topDebt?.interest_rate}% anual. Espera a recibir el dinero y prioriza reducir esa deuda.`;
    } else if (!commitmentsCoveredProjected || remainingBudgetAfter < 0 || !goalsCovered) {
      verdictLabel = "🟡 El saldo alcanzaría cuando cobres, pero compromete tu plan";
      const uncovered = Math.max(
        0,
        Number(freeCashShortfallProjected || 0),
        Math.max(0, -remainingBudgetAfter)
      );
      reason = `Hoy no puedes pagarla. Después del próximo cobro el saldo proyectado sería ${money(projectedBalance || 0)} y quedaría ${money(balanceAfterProjected || 0)} tras la compra, pero faltarían ${money(Math.round(uncovered))} para mantener cubiertos tus compromisos o presupuesto mensual.`;
    } else {
      verdictLabel = "🟡 Viable cuando cobres";
      reason = `Hoy tienes ${money(bal)}. Después de tu próximo cobro de ${money(nextPay?.amount || 0)} tendrías ${money(projectedBalance || 0)}; tras pagar ${money(purchaseAmount)} quedarían ${money(balanceAfterProjected || 0)} en la cuenta y ${money(freeCashAfterProjected || 0)} libres después de compromisos. Espera a recibir el dinero; hoy no está disponible.`;
    }
  } else if (!canBuyToday) {
    verdictLabel = "🔴 No alcanza";
    if (nextPay) {
      const extraCommitmentText = freeCashShortfallProjected && freeCashShortfallProjected > purchaseShortfallProjected
        ? ` Para preservar compromisos, el faltante financiero sería ${money(freeCashShortfallProjected)}.`
        : "";
      reason = `Hoy tienes ${money(bal)}. Después de tu próximo cobro tendrías ${money(projectedBalance || 0)} y aún faltarían ${money(purchaseShortfallProjected)} para efectuar la compra.${extraCommitmentText}`;
    } else {
      reason = `Hoy tienes ${money(bal)} y no hay un próximo cobro configurado que permita cubrir la compra.`;
    }
  } else if (criticalDebt) {
    verdictLabel = "🟡 Puedes pagarla, pero la deuda es prioritaria";
    reason = `El dinero está hoy en la cuenta, pero tienes una deuda al ${topDebt?.interest_rate}% anual. Financiera y estratégicamente, reducir esa deuda es un mejor uso del dinero.`;
  } else if (!commitmentsCoveredToday || remainingBudgetAfter < 0) {
    verdictLabel = "🟡 Puedes pagarla, pero compromete tu plan";
    reason = `La cuenta cubre la compra, pero dejarías sin cubrir ${money(Math.max(0, Math.abs(Math.round(Math.min(freeCashAfterToday, remainingBudgetAfter)))))} de compromisos o presupuesto mensual.`;
  } else {
    verdictLabel = "🟡 Viable, pero no es tu mejor uso del dinero";
    reason = strategicPriority
      ? `${strategicPriority.label} tiene mayor impacto financiero en este momento.`
      : "La compra es posible, pero conviene preservar más margen.";
  }

  const opportunityItems = [];
  let opportunityTitle = "";
  if (purchaseAmount > 0 && canBuyToday) {
    opportunityTitle = `Con ${money(purchaseAmount)} también podrías:`;
    if (topDebt && Number(topDebt.interest_rate) > 0) {
      const interesAhorro = Math.round(purchaseAmount * (Number(topDebt.interest_rate) / 100 / 12));
      opportunityItems.push({ stars: 5, text: `Abonar ${money(purchaseAmount)} a tu deuda "${topDebt.name}"`, reason: `Reducirías intereses y saldo pendiente; el ahorro estimado del primer mes sería ~${money(interesAhorro)}.` });
    }
    const topGoal = goals?.byGoal?.[0];
    if (topGoal) {
      const falta = Math.max(0, Number(topGoal.target_amount) - Number(topGoal.current_amount));
      if (purchaseAmount <= falta) opportunityItems.push({ stars: 4, text: `Aportar ${money(purchaseAmount)} a tu meta "${topGoal.name}"`, reason: "Acelerarías el progreso del objetivo." });
    }
    const fixedExpenses = Number(cashFlow.fixedExpenses) || 0;
    if (fixedExpenses > 0) {
      const emergencyTarget = fixedExpenses * 3;
      const emergencyGoal = [...(goals?.active || []), ...(goals?.completed || [])]
        .find(g => g.name?.toLowerCase().includes("emergencia"));
      const emergencySaved = emergencyGoal ? Number(emergencyGoal.current_amount) || 0 : 0;
      if (emergencySaved < emergencyTarget) {
        opportunityItems.push({ stars: 3, text: "Fortalecer tu fondo de emergencia", reason: `Meta de referencia: ${money(emergencyTarget)}. Has registrado ${money(emergencySaved)} en una meta de emergencia.` });
      }
    }
  } else if (purchaseAmount > 0) {
    opportunityTitle = "Antes de comprar, considera:";
    if (canBuyAfterNextIncome) {
      opportunityItems.push({ stars: 5, text: "Esperar al próximo cobro", reason: "La compra sería posible después de que el dinero entre realmente a la cuenta." });
    } else {
      const shortfall = Math.max(0, purchaseAmount - Math.max(0, bal));
      opportunityItems.push({
        stars: 5,
        text: bal < 0 ? "Recuperar un saldo positivo" : `Aumentar tu saldo en ${money(shortfall)}`,
        reason: bal < 0
          ? `Tu saldo actual es ${money(bal)}; primero necesitas estabilizar la liquidez.`
          : `Tu saldo es positivo, pero todavía faltan ${money(shortfall)} para pagar esta compra hoy.`,
      });
    }
  }

  const itemText = itemName ? `"${itemName}"` : "un artículo";
  const purchaseAnalysisForCoach = purchaseAmount > 0 ? {
    item: itemText,
    amount: purchaseAmount,
    verdict,
    verdictLabel,
    reason,
    score,
    affordability: {
      canBuyNow: canBuyToday,
      canBuyAfterNextIncome,
      canAffordAfterNextIncome,
      requiresNextIncome,
      balanceAfterToday,
      balanceAfterProjected,
      freeCashAfterToday,
      freeCashAfterProjected,
      purchaseShortfallToday,
      purchaseShortfallProjected,
      freeCashShortfallToday,
      freeCashShortfallProjected,
    },
    judgment: { shouldBuy, isBestUseOfMoney },
    dimensions: {
      liquidez: { score: liqS, msg: liqMsg },
      deudas: { score: debtS, msg: debtMsg },
      metas: { score: goalsS, msg: goalsMsg },
      bienestar: { score: wellS, msg: wellMsg },
    },
  } : null;

  const coachPrompt = purchaseAmount > 0
    ? `Resultado del motor de decisión (VEREDICTO OFICIAL — no recalcules ni contradigas):\n\n${JSON.stringify(purchaseAnalysisForCoach)}\n\nExplica el resultado y las alternativas usando únicamente estos datos.`
    : "";

  return {
    verdict, score, stars, verdictLabel, reason,
    summary: purchaseAmount === 0 ? "Ingresa el monto para analizar la compra." : reason,
    coachPrompt,
    purchaseAnalysis: purchaseAnalysisForCoach,
    affordability: {
      canBuyNow: canBuyToday,
      canBuyAfterNextIncome,
      canAffordAfterNextIncome,
      requiresNextIncome,
      balanceAfterToday,
      balanceAfterProjected,
      freeCashAfterToday,
      freeCashAfterProjected,
      purchaseShortfallToday,
      purchaseShortfallProjected,
      freeCashShortfallToday,
      freeCashShortfallProjected,
    },
    judgment: {
      shouldBuy,
      isBestUseOfMoney,
      verdict,
      nextBestAction: strategicPriority,
    },
    dimensions: {
      liquidez: { score: liqS, label: liqLabel, msg: liqMsg },
      deudas: { score: debtS, label: debtLabel, msg: debtMsg },
      metas: { score: goalsS, label: goalsLabel, msg: goalsMsg },
      habitos: { score: habitsS, label: habitsLabel, msg: habitsMsg },
      bienestar: { score: wellS, label: wellLabel, msg: wellMsg },
      oportunidad: { title: opportunityTitle, items: opportunityItems },
    },
    actions: {
      canBuy: canBuyToday,
      registerPurchase: canBuyToday,
      saveWishlist: purchaseAmount > 0,
    },
    meta: {
      amount: purchaseAmount,
      itemName,
      balAfter: balanceAfterToday,
      dispRestante: cashFlow.remainingBudget,
      afterPurch: remainingBudgetAfter,
    },
  };
}

function renderDecisionCard(analysis) {
  const { verdict, score, stars, verdictLabel, reason, dimensions, actions, meta } = analysis;
  const verdictColor = verdict === "green" ? "var(--success-text)" : verdict === "yellow" ? "var(--warning-text)" : "var(--danger-text)";
  const verdictBg = verdict === "green" ? "var(--success-bg)" : verdict === "yellow" ? "var(--warning-bg)" : "var(--danger-bg)";
  const starsHtml = stars > 0 ? Array.from({ length: 5 }, (_, i) =>
    `<span style="color:${i < stars ? "var(--gold)" : "var(--border)"}; font-size:20px;">★</span>`
  ).join("") : "";

  const dims = [
    { label: "💧 Liquidez", d: dimensions.liquidez },
    { label: "💳 Deudas", d: dimensions.deudas },
    { label: "🎯 Metas", d: dimensions.metas },
    { label: "🧠 Hábitos", d: dimensions.habitos },
    { label: "💚 Bienestar", d: dimensions.bienestar },
  ];
  const dimHtml = dims.map(({ label, d }) => {
    const hasScore = Number.isFinite(Number(d.score));
    const scoreNumber = hasScore ? Number(d.score) : null;
    const scoreColor = !hasScore ? "var(--text-muted)" : scoreNumber >= 70 ? "var(--success-text)" : scoreNumber >= 40 ? "var(--warning-text)" : "var(--danger-text)";
    return `<div style="padding:10px 0; border-bottom:0.5px solid var(--border);">
      <div class="row-between" style="margin-bottom:2px;">
        <span style="font-size:12px; font-weight:500;">${label}</span>
        <span style="font-size:11px; color:${scoreColor}; font-weight:500;">${hasScore ? `${scoreNumber}/100 — ` : ""}${d.label}</span>
      </div>
      <p style="font-size:11px; color:var(--text-muted); margin:0; line-height:1.5;">${d.msg}</p>
    </div>`;
  }).join("");

  const oppHtml = dimensions.oportunidad.items.length > 0
    ? `<div style="padding:10px 0;"><p style="font-size:12px; font-weight:500; margin:0 0 8px;">💡 ${dimensions.oportunidad.title || `Con ${money(meta.amount)} también podrías:`}</p>
       ${dimensions.oportunidad.items.map(o => {
         const oStars = Array.from({ length: 5 }, (_, i) => `<span style="color:${i < o.stars ? "var(--gold)" : "var(--border)"}; font-size:12px;">★</span>`).join("");
         return `<div style="margin-bottom:8px;"><div style="display:flex; align-items:center; gap:6px; margin-bottom:2px;"><span>${oStars}</span><span style="font-size:12px; font-weight:500;">${o.text}</span></div><p style="font-size:11px; color:var(--text-muted); margin:0 0 0 4px;">${o.reason}</p></div>`;
       }).join("")}</div>` : "";

  return `
    <div class="card" style="background:${verdictBg}; margin-bottom:10px; text-align:center;">
      ${starsHtml ? `<div style="margin-bottom:6px;">${starsHtml}</div>` : ""}
      <p style="font-size:16px; font-weight:600; color:${verdictColor}; margin:0 0 10px;">${verdictLabel}</p>
      <p style="font-size:13px; color:${verdictColor}; margin:0 0 12px; opacity:0.9; line-height:1.6;">${reason}</p>
      ${verdict !== "red" ? `<div style="display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,0.4); border-radius:20px; padding:4px 12px;"><span style="font-size:13px; font-weight:600; color:${verdictColor};">Score ${score}/100</span><span style="font-size:11px; color:${verdictColor}; opacity:0.8;">· Confianza ${score >= 70 ? "Alta" : score >= 45 ? "Media" : "Baja"}</span></div>` : ""}
    </div>
    <div class="card" style="margin-bottom:10px; padding:0 12px;">${dimHtml}${oppHtml}</div>
    <div style="display:flex; gap:8px; margin-bottom:8px;">
      <button id="askCoachBtn" class="btn-secondary" style="flex:1;">💬 ¿Por qué?</button>
      ${actions.registerPurchase ? `<button id="simBuyBtn" class="btn-primary" style="flex:1;">✓ Lo compré</button>` : ""}
    </div>
    ${actions.saveWishlist ? `<button id="simSaveBtn" class="btn-secondary" style="width:100%; font-size:12px;">🔖 Guardar para después</button>` : ""}
  `;
}

function looksLikeAmountOnly(value) {
  return /^(?:rd\$?\s*)?\d[\d.,\s]*(?:\s*pesos?)?$/i.test(String(value || "").trim());
}

function wireSimulador() {
  const slider = document.getElementById("simSlider");
  const amountInput = document.getElementById("simAmountInput");
  const itemInput = document.getElementById("simItemName");
  const resultEl = document.getElementById("decisionResult");
  const hint = document.getElementById("simFieldHint");
  if (!slider || !amountInput || !itemInput || !resultEl) return;

  function update(value) {
    const amount = Math.max(0, Number(value) || 0);
    slider.value = Math.min(amount, Number(slider.max));
    amountInput.value = amount || "";
    if (amount <= 0) {
      simulatorPurchaseAnalysis = null;
      resultEl.innerHTML = "";
      return;
    }
    const analysis = buildPurchaseAnalysis(state.analysis, amount, itemInput.value.trim());
    simulatorPurchaseAnalysis = analysis;
    resultEl.innerHTML = renderDecisionCard(analysis);
    wireDecisionActions(analysis);
  }

  slider.addEventListener("input", () => update(slider.value));
  amountInput.addEventListener("input", () => update(amountInput.value));
  itemInput.addEventListener("input", () => {
    const amount = Number(amountInput.value) || 0;
    if (amount > 0) update(amount);
  });
  itemInput.addEventListener("blur", () => {
    const value = itemInput.value.trim();
    if (!value || !looksLikeAmountOnly(value) || Number(amountInput.value) > 0) return;
    const amount = extractMoneyAmount(value, { allowBare: true });
    if (!amount) return;
    itemInput.value = "";
    amountInput.value = amount;
    if (hint) {
      hint.textContent = `Movimos ${money(amount)} al campo de precio.`;
      hint.style.display = "block";
    }
    update(amount);
    itemInput.focus();
  });
  update(0);
}

function wireDecisionActions(analysis) {
  const askBtn = document.getElementById("askCoachBtn");
  if (askBtn) askBtn.addEventListener("click", () => {
    if (!analysis.coachPrompt) return;
    coachPurchaseAnalysis = analysis;
    coachPurchaseContext = {
      itemName: analysis.meta?.itemName || "Compra consultada",
      amount: analysis.meta?.amount || null,
      awaitingAmount: false,
      updatedAtTurn: coachTurnCounter,
    };
    tab = "coach";
    renderApp();
    const input = document.getElementById("coachInput");
    if (input) { input.value = analysis.coachPrompt; input.focus(); }
  });

  const buyBtn = document.getElementById("simBuyBtn");
  if (buyBtn) buyBtn.addEventListener("click", () => {
    resetCoachPurchaseContext();
    simulatorPurchaseAnalysis = null;
    openLogModal(analysis.meta.amount, analysis.meta.itemName || null);
  });

  const saveBtn = document.getElementById("simSaveBtn");
  if (saveBtn) saveBtn.addEventListener("click", async () => {
    saveBtn.disabled = true;
    saveBtn.textContent = "Guardando…";
    const { error } = await supabase.from("purchase_decisions").insert({
      user_id: user.id, item_name: analysis.meta.itemName || null, amount: analysis.meta.amount,
      verdict: analysis.verdict, score: analysis.score, status: "saved", analysis_snapshot: analysis,
    });
    if (error) {
      saveBtn.disabled = false;
      saveBtn.textContent = "🔖 Guardar para después";
      showToast("No se pudo guardar. Intenta de nuevo.", true);
    } else {
      showToast("Guardado en tu lista de deseos");
      saveBtn.textContent = "✓ Guardado";
    }
  });
}

function primaryGoal() {
  const order = { critical: 0, important: 1, optional: 2 };
  // Solo metas activas o en riesgo — las completadas no van al Dashboard
  const activas = state.goals.filter(isGoalActive);
  return [...activas].sort((a, b) => (order[a.priority] ?? 3) - (order[b.priority] ?? 3))[0];
}

function tplIngreso() {
  const freq = state.profile.pay_frequency || "monthly";
  const d1 = state.profile.pay_day_1 ?? "";

function wireIngreso() {
  const grid = document.getElementById("ingFreqGrid");
  if (!grid) return;
  let selectedFreq = state.profile.pay_frequency || "monthly";

  function refreshDaysSection(freq) {
    const d1 = state.profile.pay_day_1 ?? "";
    const d2 = state.profile.pay_day_2 ?? "";
    document.getElementById("ingDaysSection").innerHTML = freq === "biweekly" ? `
      <label>¿Qué días cobras? <span style="color:var(--text-muted);">(opcional pero recomendado)</span></label>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:4px;">
        <div>
          <label style="font-size:11px; color:var(--text-muted);">Primer cobro (día del mes)</label>
          <input id="ingDay1" type="number" step="1" min="1" max="31" placeholder="Ej. 15" value="${d1}" style="margin-bottom:0;" />
        </div>
        <div>
          <label style="font-size:11px; color:var(--text-muted);">Segundo cobro (día del mes)</label>
          <input id="ingDay2" type="number" step="1" min="1" max="31" placeholder="Ej. 30" value="${d2}" style="margin-bottom:0;" />
        </div>
      </div>
      <p class="hint" style="margin-bottom:14px;">Con estas fechas el coach puede decirte cuántos días faltan para tu próximo cobro.</p>
    ` : `
      <label>¿Qué día cobras? <span style="color:var(--text-muted);">(opcional)</span></label>
      <input id="ingDay1" type="number" step="1" min="1" max="31" placeholder="Ej. 30" value="${d1}" style="margin-bottom:4px;" />
      <p class="hint" style="margin-bottom:14px;">Con este dato el coach puede calcular cuántos días faltan para tu cobro.</p>
    `;
  }

  grid.querySelectorAll(".type-option").forEach(el => {
    el.addEventListener("click", () => {
      selectedFreq = el.dataset.f;
      grid.querySelectorAll(".type-option").forEach(o => o.classList.remove("selected"));
      el.classList.add("selected");
      document.getElementById("ingAmountLabel").textContent =
        selectedFreq === "biweekly" ? "¿Cuánto ganas cada quincena?" : "¿Cuánto ganas al mes?";
      refreshDaysSection(selectedFreq);
    });
  });

  document.getElementById("saveIngresoBtn").addEventListener("click", async () => {
    const displayName = document.getElementById("ingName").value.trim();
    const amount = document.getElementById("ingAmount").value;
    const day1 = document.getElementById("ingDay1")?.value;
    const day2 = document.getElementById("ingDay2")?.value;
    const errEl = document.getElementById("ingErr");
    if (!amount || Number(amount) <= 0) {
      errEl.textContent = "Pon un monto válido.";
      errEl.classList.add("visible");
      return;
    }
    const saveBtn = document.getElementById("saveIngresoBtn");
    saveBtn.disabled = true; saveBtn.textContent = "Guardando…";
    const { error } = await supabase.from("profiles").update({
      display_name: displayName || null,
      declared_monthly_income: Number(amount),
      pay_frequency: selectedFreq,
      pay_day_1: day1 ? Number(day1) : null,
      pay_day_2: (selectedFreq === "biweekly" && day2) ? Number(day2) : null,
    }).eq("id", user.id);
    if (error) {
      errEl.textContent = "No se pudo guardar. Intenta de nuevo.";
      errEl.classList.add("visible");
      saveBtn.disabled = false; saveBtn.textContent = "Guardar";
      return;
    }
    await loadState();
    tab = "mas";
    renderApp();
    showToast("Perfil actualizado");
  });
}

function debtDueInfo(debt, today = new Date()) {
  if (!debt?.next_due_date || debt.status === "completed") return { overdue: false, days: 0, text: null };
  const due = new Date(`${String(debt.next_due_date).slice(0, 10)}T12:00:00`);
  const now = new Date(today.getFullYear(), today.getMonth(), today.getDate(), 12);
  const days = Math.floor((now - due) / 86400000);
  if (days > 0) return { overdue: true, days, text: `Pago atrasado por ${days} día${days === 1 ? "" : "s"}` };
  const remaining = Math.ceil((due - now) / 86400000);
  return { overdue: false, days: -remaining, text: remaining === 0 ? "Vence hoy" : `Vence en ${remaining} día${remaining === 1 ? "" : "s"}` };
}

function advanceDebtDateClient(value, frequency = "monthly", dueDay = null) {
  if (!value) return null;
  const date = new Date(`${String(value).slice(0, 10)}T12:00:00`);
  if (frequency === "weekly") date.setDate(date.getDate() + 7);
  else if (frequency === "biweekly") date.setDate(date.getDate() + 14);
  else {
    const target = Number(dueDay) || date.getDate();
    date.setDate(1);
    date.setMonth(date.getMonth() + 1);
    const last = new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
    date.setDate(Math.min(target, last));
  }
  return localISODate(date);
}

function debtAccrualPeriods(debt, paidOn) {
  if ((debt?.plan_type || "legacy") !== "amortized" || !(Number(debt?.interest_rate) > 0)) return 0;
  const paidDate = new Date(`${paidOn || localISODate()}T12:00:00`);
  let cursor = debt.interest_accrued_through
    ? advanceDebtDateClient(debt.interest_accrued_through, debt.payment_frequency, debt.due_day)
    : (debt.next_due_date || paidOn || localISODate());
  if (!cursor) return 1;
  let cursorDate = new Date(`${cursor}T12:00:00`);
  if (!debt.interest_accrued_through && cursorDate > paidDate) return 1;
  let periods = 0;
  while (cursorDate <= paidDate && periods < 120) {
    periods += 1;
    cursor = advanceDebtDateClient(cursor, debt.payment_frequency, debt.due_day);
    cursorDate = new Date(`${cursor}T12:00:00`);
  }
  return periods;
}

function estimateDebtPaymentBreakdownV4(debt, amount, paidOn, manualInterest = null, feeAmount = 0) {
  const clone = { ...debt };
  const periods = debtAccrualPeriods(debt, paidOn);
  if ((debt?.plan_type || "legacy") === "amortized" && manualInterest == null) {
    const periodic = periodicInterestRate(debt.interest_rate, debt.interest_rate_type || "annual", debt.payment_frequency || "monthly");
    const interest = Math.max(0, Number(debt.interest_outstanding || 0)) + Math.max(0, Number(debt.principal_outstanding ?? debt.current_balance) || 0) * periodic * periods;
    return { ...estimateDebtPaymentBreakdown(clone, amount, interest, feeAmount), periodsAccrued: periods };
  }
  return { ...estimateDebtPaymentBreakdown(clone, amount, manualInterest, feeAmount), periodsAccrued: periods };
}

function wizardDebtPayload(draft) {
  const original = Math.max(0, Number(draft.originalAmount) || Number(draft.currentBalance) || 0);
  const currentInput = Math.max(0, Number(draft.currentBalance) || original);
  const term = Math.max(0, Math.trunc(Number(draft.termCount) || 0));
  const scheduledInput = Math.max(0, Number(draft.scheduledPayment) || 0);
  const source = draft.knowledge || "unknown";
  let planType = "legacy";
  let rate = null;
  let rateType = "annual";
  let setupState = "complete";
  let informationSource = source;

  if (draft.debtType === "tarjeta_credito") {
    planType = "credit_card";
    rate = source === "annual_rate" ? Math.max(0, Number(draft.rate) || 0) : null;
    setupState = source === "unknown" ? "incomplete" : "complete";
    informationSource = source === "unknown" ? "card_statement" : source;
  } else if (source === "annual_rate") {
    planType = "amortized"; rate = Math.max(0, Number(draft.rate) || 0); rateType = "annual";
  } else if (source === "monthly_rate") {
    planType = "amortized"; rate = Math.max(0, Number(draft.rate) || 0); rateType = "monthly";
  } else if (source === "periodic_rate") {
    planType = "flat_periodic"; rate = Math.max(0, Number(draft.rate) || 0); rateType = "per_period";
  } else if (source === "total_interest_pct") {
    planType = "flat_total"; rate = Math.max(0, Number(draft.rate) || 0); rateType = "total_term";
  } else if (source === "total_payable") {
    planType = "flat_total";
    const total = Math.max(0, Number(draft.totalPayable) || 0);
    rate = original > 0 ? Math.max(0, ((total - original) / original) * 100) : 0;
    rateType = "total_term";
    setupState = "estimated";
  } else if (source === "scheduled_payment") {
    planType = "legacy";
    setupState = "estimated";
  } else if (source === "no_interest") {
    planType = "no_interest"; rate = 0;
  } else {
    planType = "legacy"; rate = null; setupState = "incomplete";
  }

  const baseForPlan = draft.existingMode === "existing" ? currentInput : original;
  const plan = calculateDebtPlan({
    planType,
    originalAmount: baseForPlan,
    interestRate: rate || 0,
    interestRateType: rateType,
    paymentFrequency: draft.paymentFrequency || "monthly",
    termCount: term,
    scheduledPayment: scheduledInput,
  });

  if (source === "total_payable") {
    plan.totalPayable = Math.max(0, Number(draft.totalPayable) || 0);
    plan.estimatedInterest = Math.max(0, plan.totalPayable - original);
    if (!plan.scheduledPayment && term > 0) plan.scheduledPayment = plan.totalPayable / term;
  }
  if (source === "scheduled_payment" && scheduledInput > 0 && term > 0) {
    plan.totalPayable = scheduledInput * term;
    plan.estimatedInterest = Math.max(0, plan.totalPayable - original);
    plan.scheduledPayment = scheduledInput;
  }

  let currentPrincipal = draft.existingMode === "existing" ? currentInput : original;
  let interestOutstanding = 0;
  let currentBalance = currentInput;
  if (draft.existingMode !== "existing" && ["flat_total", "flat_periodic"].includes(planType)) {
    interestOutstanding = Math.max(0, Number(plan.estimatedInterest) || 0);
    currentBalance = original + interestOutstanding;
  } else if (draft.existingMode !== "existing") {
    currentBalance = original;
  }

  const paidBefore = Math.max(0, Number(draft.paidBeforeApp) || (draft.existingMode === "existing" ? Math.max(0, original - currentPrincipal) : 0));
  const scheduled = Math.max(0, Number(plan.scheduledPayment) || scheduledInput || 0);
  const totalPayable = plan.totalPayable == null ? null : Math.round(Number(plan.totalPayable) * 100) / 100;
  const estimatedInterest = planType === "credit_card" || setupState === "incomplete" ? null : Math.max(0, Number(plan.estimatedInterest) || 0);

  return {
    plan: { ...plan, scheduledPayment: scheduled, totalPayable, estimatedInterest },
    payload: {
      name: String(draft.name || "").trim(),
      debt_type: draft.debtType === "unsure" ? "otro" : (draft.debtType || "otro"),
      plan_type: planType,
      original_amount: original,
      current_balance: currentBalance,
      principal_outstanding: currentPrincipal,
      interest_outstanding: interestOutstanding,
      interest_rate: rate,
      interest_rate_type: rateType,
      payment_frequency: draft.debtType === "tarjeta_credito" ? "monthly" : (draft.paymentFrequency || "monthly"),
      term_count: planType === "credit_card" || planType === "legacy" ? (term || null) : term,
      remaining_installments: term || null,
      scheduled_payment: scheduled || null,
      minimum_payment: scheduled || null,
      total_payable: totalPayable,
      estimated_total_interest: estimatedInterest,
      total_paid: 0,
      total_interest_paid: 0,
      total_fees_paid: 0,
      start_date: draft.startDate || null,
      next_due_date: draft.nextDue || null,
      due_day: draft.nextDue ? Number(String(draft.nextDue).slice(-2)) : null,
      status: currentBalance <= 0 ? "completed" : "active",
      setup_state: setupState,
      information_source: informationSource,
      is_existing_debt: draft.existingMode === "existing",
      balance_at_registration: currentBalance,
      paid_before_app: paidBefore,
      payment_allocation_method: draft.allocationMethod || (["flat_total", "flat_periodic"].includes(planType) ? "proportional" : "interest_first"),
      credit_limit: draft.creditLimit ? Number(draft.creditLimit) : null,
      statement_day: draft.statementDay ? Number(draft.statementDay) : null,
      breakdown_required: planType === "credit_card" || setupState === "incomplete",
    },
  };
}

function debtImpactHTML(payload, plan) {
  const monthly = monthlyPaymentEquivalent(plan.scheduledPayment || 0, payload.payment_frequency || "monthly");
  const income = Number(state.analysis?.cashFlow?.monthlyIncome) || 0;
  const remaining = Number(state.analysis?.cashFlow?.remainingBudget) || 0;
  const ratio = income > 0 ? Math.round((monthly / income) * 100) : null;
  const after = monthly > 0 ? remaining - monthly : remaining;
  const effectiveRatio = monthly > 0 ? ratio : null;
  const pressure = effectiveRatio == null ? "Sin datos" : effectiveRatio >= 35 || after < 0 ? "Alta" : effectiveRatio >= 20 ? "Media" : "Baja";
  const pressureColor = pressure === "Alta" ? "var(--danger-text)" : pressure === "Media" ? "var(--warning-text)" : "var(--success-text)";
  return `
    <div class="card" style="margin-top:9px;">
      <p style="font-size:12px;font-weight:600;margin:0 0 7px;">Impacto en tus finanzas</p>
      <div class="row-between" style="font-size:10px;margin-bottom:3px;"><span>Cuota mensual equivalente</span><strong>${monthly > 0 ? money(monthly) : "No definida"}</strong></div>
      <div class="row-between" style="font-size:10px;margin-bottom:3px;"><span>Porcentaje de tus ingresos</span><strong>${effectiveRatio == null ? "Sin datos" : `${effectiveRatio}%`}</strong></div>
      <div class="row-between" style="font-size:10px;margin-bottom:3px;"><span>Presupuesto restante después</span><strong style="color:${monthly > 0 && after < 0 ? "var(--danger-text)" : "inherit"};">${monthly > 0 ? money(after) : "No se puede evaluar"}</strong></div>
      <div class="row-between" style="font-size:10px;padding-top:5px;margin-top:5px;border-top:1px solid var(--border);"><span>Nivel de presión</span><strong style="color:${pressureColor};">${pressure}</strong></div>
      ${monthly > 0 && after < 0 ? `<p style="font-size:10px;color:var(--danger-text);margin:7px 0 0;">⚠ Esta cuota supera tu margen mensual actual por ${money(Math.abs(after))}.</p>` : ""}
    </div>`;
}

function openDebtWizard() {
  const modal = document.getElementById("logModal");
  const draft = {
    step: 1, name: "", debtType: "", existingMode: "new",
    originalAmount: "", currentBalance: "", paidBeforeApp: "",
    knowledge: "annual_rate", rate: "", totalPayable: "",
    scheduledPayment: "", termCount: "", paymentFrequency: "monthly",
    nextDue: "", startDate: "", creditLimit: "", statementDay: "",
    allocationMethod: "interest_first",
  };

  function collect() {
    const get = id => document.getElementById(id)?.value;
    const checked = name => document.querySelector(`[name="${name}"]:checked`)?.value;
    if (get("dwName") != null) draft.name = get("dwName");
    if (get("dwType") != null) draft.debtType = get("dwType");
    if (checked("dwExisting")) draft.existingMode = checked("dwExisting");
    const fieldMap = {
      OriginalAmount: "originalAmount", CurrentBalance: "currentBalance", PaidBeforeApp: "paidBeforeApp",
      Rate: "rate", TotalPayable: "totalPayable", ScheduledPayment: "scheduledPayment",
      TermCount: "termCount", Frequency: "paymentFrequency", NextDue: "nextDue",
      StartDate: "startDate", CreditLimit: "creditLimit", StatementDay: "statementDay",
      Allocation: "allocationMethod",
    };
    Object.entries(fieldMap).forEach(([key, target]) => {
      const value = get(`dw${key}`);
      if (value != null) draft[target] = value;
    });
    if (get("dwKnowledge") != null) draft.knowledge = get("dwKnowledge");
  }

  function validateStep() {
    collect();
    if (draft.step === 1 && (!draft.name.trim() || !draft.debtType)) return "Escribe un nombre y selecciona el tipo de deuda.";
    if (draft.step === 2) {
      const original = Number(draft.originalAmount) || 0;
      const current = Number(draft.currentBalance) || 0;
      if (draft.debtType === "tarjeta_credito" && current <= 0) return "Indica el balance actual de la tarjeta.";
      if (draft.existingMode === "new" && original <= 0) return "Indica cuánto dinero recibiste o financiaste.";
      if (draft.existingMode === "existing" && current <= 0) return "Indica cuánto debes actualmente.";
      if (draft.existingMode === "existing" && original <= 0) draft.originalAmount = String(current);
    }
    if (draft.step === 3) {
      if (["annual_rate","monthly_rate","periodic_rate","total_interest_pct"].includes(draft.knowledge) && (String(draft.rate).trim() === "" || !(Number(draft.rate) >= 0))) return "Indica la tasa o selecciona que no la conoces.";
      if (draft.knowledge === "total_payable" && !(Number(draft.totalPayable) > 0)) return "Indica el total que debes devolver.";
    }
    if (draft.step === 4) {
      const planType = wizardDebtPayload(draft).payload.plan_type;
      if (!["credit_card","legacy"].includes(planType) && !(Number(draft.termCount) > 0)) return "Indica la cantidad de cuotas.";
      if (draft.knowledge === "scheduled_payment" && (!(Number(draft.scheduledPayment) > 0) || !(Number(draft.termCount) > 0))) return "Indica la cuota y la cantidad de pagos.";
      if (draft.debtType === "tarjeta_credito" && !(Number(draft.scheduledPayment) > 0)) return "Indica el pago mínimo mensual de la tarjeta.";
    }
    return null;
  }

  function stepOne() {
    return `
      <p class="step-label">Paso 1 de 5</p><h2 style="font-size:20px;margin:0 0 6px;">¿Qué deuda quieres registrar?</h2>
      <p class="subtitle" style="text-align:left;">Primero identifica la deuda. La app mostrará solo las preguntas necesarias.</p>
      <label>Nombre</label><input id="dwName" value="${esc(draft.name)}" placeholder="Ej. Préstamo de Randy o Tarjeta Popular" style="margin-bottom:10px;" />
      <label>Tipo de deuda</label><select id="dwType" style="margin-bottom:8px;">
        <option value="">Selecciona una opción</option>
        ${DEBT_TYPES.map(t => `<option value="${t.value}" ${draft.debtType === t.value ? "selected" : ""}>${t.icon} ${t.label}</option>`).join("")}
        <option value="unsure" ${draft.debtType === "unsure" ? "selected" : ""}>❓ No estoy seguro</option>
      </select>`;
  }

  function stepTwo() {
    const card = draft.debtType === "tarjeta_credito";
    return `
      <p class="step-label">Paso 2 de 5</p><h2 style="font-size:20px;margin:0 0 6px;">Situación actual</h2>
      ${!card ? `<label style="margin-bottom:7px;">¿Es nueva o ya la estabas pagando?</label>
      <label class="card" style="display:block;padding:10px;margin-bottom:6px;"><input type="radio" name="dwExisting" value="new" ${draft.existingMode === "new" ? "checked" : ""} style="width:auto;margin-right:7px;">Es nueva, todavía no he pagado</label>
      <label class="card" style="display:block;padding:10px;margin-bottom:10px;"><input type="radio" name="dwExisting" value="existing" ${draft.existingMode === "existing" ? "checked" : ""} style="width:auto;margin-right:7px;">Ya he realizado algunos pagos</label>` : ""}
      ${card ? `
        <label>Balance actual</label><input id="dwCurrentBalance" type="number" step="0.01" min="0" value="${draft.currentBalance}" placeholder="RD$0" style="margin-bottom:8px;">
        <label>Límite de crédito <span style="color:var(--text-muted);">(opcional)</span></label><input id="dwCreditLimit" type="number" step="0.01" min="0" value="${draft.creditLimit}" placeholder="RD$0" style="margin-bottom:8px;">
      ` : `
        <label>Monto originalmente recibido o financiado</label><input id="dwOriginalAmount" type="number" step="0.01" min="0" value="${draft.originalAmount}" placeholder="RD$0" style="margin-bottom:8px;">
        ${draft.existingMode === "existing" ? `<label>Saldo pendiente actual</label><input id="dwCurrentBalance" type="number" step="0.01" min="0" value="${draft.currentBalance}" placeholder="RD$0" style="margin-bottom:8px;">
        <label>Total pagado antes de usar esta app <span style="color:var(--text-muted);">(opcional)</span></label><input id="dwPaidBeforeApp" type="number" step="0.01" min="0" value="${draft.paidBeforeApp}" placeholder="RD$0" style="margin-bottom:8px;">` : ""}
      `}`;
  }

  function stepThree() {
    const options = debtKnowledgeOptions(draft.debtType);
    const source = draft.knowledge;
    return `
      <p class="step-label">Paso 3 de 5</p><h2 style="font-size:20px;margin:0 0 6px;">¿Qué sabes sobre los intereses?</h2>
      <p class="subtitle" style="text-align:left;">No inventaremos una tasa. Puedes registrar la deuda aunque falte información.</p>
      <select id="dwKnowledge" style="margin-bottom:10px;">${options.map(([v,l]) => `<option value="${v}" ${source === v ? "selected" : ""}>${l}</option>`).join("")}</select>
      ${["annual_rate","monthly_rate","periodic_rate","total_interest_pct"].includes(source) ? `<label>${source === "annual_rate" ? "Tasa anual" : source === "monthly_rate" ? "Tasa mensual" : source === "periodic_rate" ? "Porcentaje por cada cuota" : "Porcentaje total del acuerdo"}</label><input id="dwRate" type="number" step="0.01" min="0" value="${draft.rate}" placeholder="Ej. 45" style="margin-bottom:8px;">` : ""}
      ${source === "total_payable" ? `<label>Total que debes devolver</label><input id="dwTotalPayable" type="number" step="0.01" min="0" value="${draft.totalPayable}" placeholder="RD$0" style="margin-bottom:8px;">` : ""}
      ${source === "unknown" ? `<div class="card warning"><p style="font-size:11px;margin:0;color:var(--warning-text);">La deuda se guardará con “datos por confirmar”. No asumiremos que tiene 0% de interés.</p></div>` : ""}`;
  }

  function stepFour() {
    const card = draft.debtType === "tarjeta_credito";
    return `
      <p class="step-label">Paso 4 de 5</p><h2 style="font-size:20px;margin:0 0 6px;">Pagos y fechas</h2>
      ${!card ? `<label>Frecuencia de pago</label><select id="dwFrequency" style="margin-bottom:8px;">${PAYMENT_FREQUENCIES.map(x => `<option value="${x.value}" ${draft.paymentFrequency === x.value ? "selected" : ""}>${x.label}</option>`).join("")}</select>
      <label>Cantidad total o restante de cuotas <span style="color:var(--text-muted);">(si la sabes)</span></label><input id="dwTermCount" type="number" step="1" min="1" value="${draft.termCount}" placeholder="Ej. 10" style="margin-bottom:8px;">` : `<input id="dwFrequency" type="hidden" value="monthly">`}
      <label>${card ? "Pago mínimo mensual" : "Cuota acordada"} ${card ? "" : `<span style="color:var(--text-muted);">(si la conoces)</span>`}</label><input id="dwScheduledPayment" type="number" step="0.01" min="0" value="${draft.scheduledPayment}" placeholder="RD$0" style="margin-bottom:8px;">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <div><label style="font-size:10px;">Fecha de inicio</label><input id="dwStartDate" type="date" value="${draft.startDate}" style="margin-bottom:8px;"></div>
        <div><label style="font-size:10px;">Próximo pago</label><input id="dwNextDue" type="date" value="${draft.nextDue}" style="margin-bottom:8px;"></div>
      </div>
      ${card ? `<label>Día de corte <span style="color:var(--text-muted);">(opcional)</span></label><input id="dwStatementDay" type="number" min="1" max="31" value="${draft.statementDay}" placeholder="Ej. 10" style="margin-bottom:8px;">` : `<label>¿Cómo aplica el prestamista cada pago?</label><select id="dwAllocation" style="margin-bottom:8px;"><option value="interest_first" ${draft.allocationMethod === "interest_first" ? "selected" : ""}>Primero intereses</option><option value="proportional" ${draft.allocationMethod === "proportional" ? "selected" : ""}>Proporcional entre capital e interés</option><option value="principal_first" ${draft.allocationMethod === "principal_first" ? "selected" : ""}>Primero capital</option><option value="manual" ${draft.allocationMethod === "manual" ? "selected" : ""}>Lo indicaré en cada pago</option></select>`}`;
  }

  function stepFive() {
    const { payload, plan } = wizardDebtPayload(draft);
    const infoWarning = payload.setup_state === "incomplete" ? `<div class="card warning" style="margin-top:9px;"><p style="font-size:11px;color:var(--warning-text);margin:0;">⚠ Falta confirmar cómo se calculan los intereses. La app no presentará el costo total como definitivo.</p></div>` : "";
    return `
      <p class="step-label">Paso 5 de 5</p><h2 style="font-size:20px;margin:0 0 6px;">Confirma los datos</h2>
      ${debtPlanPreviewHTML(plan, { planType: payload.plan_type, paymentFrequency: payload.payment_frequency, termCount: payload.remaining_installments, currentBalance: payload.current_balance, setupState: payload.setup_state, informationSource: payload.information_source })}
      ${debtImpactHTML(payload, plan)}${infoWarning}
      <p style="font-size:10px;color:var(--text-muted);line-height:1.45;margin:10px 0 0;">Los cálculos son estimados y pueden no incluir seguros, mora, comisiones o reglas particulares del contrato.</p>`;
  }

  function paint() {
    modal.classList.add("visible");
    const body = [stepOne, stepTwo, stepThree, stepFour, stepFive][draft.step - 1]();
    modal.innerHTML = `<div class="modal-box" style="max-height:90vh;overflow-y:auto;">${body}<div class="error-banner" id="dwErr"></div><div class="btn-row" style="margin-top:14px;"><button class="btn-secondary" id="dwBack">${draft.step === 1 ? "Cancelar" : "Atrás"}</button><button class="btn-primary" id="dwNext">${draft.step === 5 ? "Guardar deuda" : "Continuar"}</button></div></div>`;

    document.getElementById("dwKnowledge")?.addEventListener("change", e => { collect(); draft.knowledge = e.target.value; paint(); });
    document.querySelectorAll('[name="dwExisting"]').forEach(r => r.addEventListener("change", e => { collect(); draft.existingMode = e.target.value; paint(); }));
    document.getElementById("dwBack").addEventListener("click", () => {
      collect();
      if (draft.step === 1) { modal.classList.remove("visible"); modal.innerHTML = ""; }
      else { draft.step -= 1; paint(); }
    });
    document.getElementById("dwNext").addEventListener("click", async () => {
      const error = validateStep();
      if (error) { const el = document.getElementById("dwErr"); el.textContent = error; el.classList.add("visible"); return; }
      if (draft.step < 5) { draft.step += 1; paint(); return; }
      const button = document.getElementById("dwNext"); button.disabled = true; button.textContent = "Guardando…";
      const { payload } = wizardDebtPayload(draft);
      const { error: saveError } = await supabase.rpc("save_debt", { p_payload: payload, p_debt_id: null });
      if (saveError) { const el = document.getElementById("dwErr"); el.textContent = saveError.message || "No se pudo guardar la deuda."; el.classList.add("visible"); button.disabled = false; button.textContent = "Guardar deuda"; return; }
      modal.classList.remove("visible"); modal.innerHTML = "";
      await loadState(); renderApp(); showToast("Deuda guardada");
    });
  }

  paint();
}

function tplDeudas() {
  const debtCards = state.debts.map(d => {
    const stats = debtPaymentStats(d.id);
    const scheduled = Number(d.scheduled_payment ?? d.minimum_payment) || 0;
    const isVariableDebt = (d.plan_type || "legacy") === "credit_card";
    const totalPaidInApp = stats.total;
    const paidBefore = Math.max(0, Number(d.paid_before_app) || 0);
    const totalPaid = totalPaidInApp + paidBefore;
    const totalPlan = isVariableDebt ? 0 : (Number(d.total_payable) || Number(d.original_amount) || 0);
    const pct = totalPlan > 0 ? Math.max(0, Math.min(100, Math.round((totalPaid / totalPlan) * 100))) : 0;
    const isPaidOff = d.status === "completed" || Number(d.current_balance) <= 0;
    const typeInfo = DEBT_TYPES.find(t => t.value === d.debt_type);
    const frequencyLabel = PAYMENT_FREQUENCIES.find(x => x.value === (d.payment_frequency || "monthly"))?.label || "Mensual";
    const nextDue = formatDateDO(d.next_due_date);
    const remaining = Number(d.remaining_installments) || 0;
    const interestPaid = Number(d.total_interest_paid) || stats.interest;
    const principalPaid = stats.principal;
    const feesPaid = Number(d.total_fees_paid) || stats.fees;
    const dueInfo = debtDueInfo(d);
    const installmentPaid = Math.max(0, Number(d.current_installment_paid) || 0);
    const installmentPct = scheduled > 0 ? Math.min(100, Math.round((installmentPaid / scheduled) * 100)) : 0;

    return `
      <div class="card">
        <div class="row-between" style="margin-bottom:6px;align-items:flex-start;">
          <div>
            <span style="font-weight:600;">${typeInfo ? typeInfo.icon : "📄"} ${esc(d.name)}</span>
            <p style="font-size:10px;color:var(--text-muted);margin:3px 0 4px;">${esc(debtPlanLabel(d.plan_type || "legacy", d))}</p>
            ${debtSetupBadge(d)}
          </div>
          <div style="display:flex;gap:6px;">
            <button aria-label="Editar deuda" data-edit-debt="${d.id}" style="background:none;color:var(--text-muted);font-size:12px;">✎</button>
            <button aria-label="Borrar deuda" data-del-debt="${d.id}" style="background:none;color:var(--text-muted);font-size:12px;">✕</button>
          </div>
        </div>

        <p style="font-size:11px;color:var(--text-muted);margin:7px 0;">${typeInfo ? typeInfo.label : "Otro"} · ${debtRateLabel(d)}</p>
        ${dueInfo.text ? `<p style="font-size:10px;color:${dueInfo.overdue ? "var(--danger-text)" : "var(--text-muted)"};margin:0 0 7px;">${dueInfo.overdue ? "🔴" : "📅"} ${dueInfo.text}${nextDue ? ` · ${nextDue}` : ""}</p>` : ""}

        ${isPaidOff ? `<p style="font-size:13px;font-weight:600;color:var(--success-text);margin:0 0 5px;">✓ Deuda pagada</p>` : `<p style="font-size:16px;font-weight:600;color:var(--teal);margin:0 0 5px;">Saldo pendiente: ${money(d.current_balance)}</p>`}
        ${totalPlan > 0 ? `<div class="progress-bar"><div class="progress-fill" style="width:${pct}%;"></div></div>` : ""}
        <p style="font-size:10px;color:var(--text-muted);margin:5px 0 8px;">Pagos registrados en esta app: ${money(totalPaidInApp)}${paidBefore > 0 ? ` · Pagado antes de registrarla: ${money(paidBefore)}` : ""}.</p>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;padding:8px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);">
          <div><span style="font-size:9px;color:var(--text-muted);display:block;">${isVariableDebt ? "Balance reportado" : "Capital pendiente"}</span><strong style="font-size:11px;">${money(d.principal_outstanding ?? d.current_balance)}</strong></div>
          <div><span style="font-size:9px;color:var(--text-muted);display:block;">Interés pendiente</span><strong style="font-size:11px;">${money(d.interest_outstanding || 0)}</strong></div>
          <div><span style="font-size:9px;color:var(--text-muted);display:block;">Interés pagado</span><strong style="font-size:11px;">${money(interestPaid)}</strong></div>
          ${!isVariableDebt ? `<div><span style="font-size:9px;color:var(--text-muted);display:block;">Capital pagado en la app</span><strong style="font-size:11px;">${money(principalPaid)}</strong></div>` : ""}
          ${feesPaid > 0 ? `<div><span style="font-size:9px;color:var(--text-muted);display:block;">Cargos pagados</span><strong style="font-size:11px;">${money(feesPaid)}</strong></div>` : ""}
          ${remaining > 0 ? `<div><span style="font-size:9px;color:var(--text-muted);display:block;">Cuotas restantes</span><strong style="font-size:11px;">${remaining}</strong></div>` : ""}
        </div>

        ${!isPaidOff && scheduled > 0 ? `<div style="margin-top:8px;"><div class="row-between" style="font-size:9px;color:var(--text-muted);"><span>Cuota actual</span><span>${money(installmentPaid)} de ${money(scheduled)}</span></div><div class="progress-bar"><div class="progress-fill" style="width:${installmentPct}%;background:var(--gold);"></div></div></div>` : ""}

        ${!isPaidOff ? `<div class="row-between" style="margin-top:9px;align-items:flex-end;"><div><span style="font-size:10px;color:var(--text-muted);display:block;">${scheduled ? "Cuota acordada" : "Cuota"}</span><strong style="font-size:12px;">${scheduled ? `${money(scheduled)} · ${frequencyLabel.toLowerCase()}` : "No definida"}</strong>${nextDue ? `<span style="font-size:9px;color:var(--text-muted);display:block;margin-top:2px;">Próximo pago: ${nextDue}</span>` : ""}</div><button data-pay-debt="${d.id}" class="btn-secondary" style="padding:7px 12px;font-size:11px;">Registrar pago</button></div>` : ""}

        ${stats.payments.length > 0 ? `<button data-view-debt-history="${d.id}" style="width:100%;margin-top:8px;background:none;color:var(--teal);font-size:10px;text-decoration:underline;">Ver historial de ${stats.payments.length} movimiento${stats.payments.length === 1 ? "" : "s"}</button>` : ""}
      </div>`;
  }).join("");

  return `<h1 style="text-align:left;margin-bottom:4px;">Tus deudas</h1><p style="font-size:11px;color:var(--text-muted);margin:0 0 14px;">Registra lo que sabes. La app no asumirá intereses que no hayas confirmado.</p>${debtCards || `<div class="empty-state"><div class="icon-circle">📄</div><p style="font-size:13px;color:var(--text-muted);">No tienes deudas registradas.</p></div>`}${debtAddForm()}`;
}

function tplPresupuestos() {

  const rowFijados = fijados.map(c => {

    const spent = Number(state.analysis?.spending?.byCategory?.[c.id]) || 0;
    const pct = Math.min(100, Math.round((spent / Number(budget.amount)) * 100));
    const overBudget = pct >= 100;

          <span style="font-size:13px; font-weight:500;">${CATEGORY_ICONS[c.name] || "•"} ${c.name}</span>

            <button data-edit-budget="${budget.id}" data-edit-cat="${c.id}" data-edit-amount="${budget.amount}"
              style="background:none; color:var(--text-muted); font-size:12px;">✎</button>
            <button data-remove-budget="${budget.id}"

  }).join("");

  return `
    <h1 style="text-align:left; margin-bottom:4px;">Tus presupuestos</h1>
    <p style="font-size:11px; color:var(--text-muted); margin:0 0 14px;">Límites de gasto por categoría este mes.</p>

      ? `<div class="empty-state"><div class="icon-circle">📊</div><p style="font-size:13px; color:var(--text-muted);">Todavía no fijaste ningún presupuesto.</p></div>`
