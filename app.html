<script type="module">

const CATEGORY_ICONS = {
  Comida: "🍽️", Transporte: "🚌", Vivienda: "🏠", Salud: "💊",
  Ocio: "🎮", Educación: "🎓", Ropa: "👕", Otro: "•",
};

const DEBT_TYPES = [
  { value: "tarjeta_credito", label: "Tarjeta de crédito", icon: "💳" },
  { value: "prestamo_personal", label: "Préstamo personal", icon: "🏦" },
  { value: "prestamista", label: "Prestamista", icon: "🤝" },
  { value: "financiamiento_vehiculo", label: "Financiamiento de vehículo", icon: "🚗" },
  { value: "financiamiento_electrodomestico", label: "Financiamiento de electrodoméstico", icon: "🧊" },
  { value: "hipoteca", label: "Hipoteca", icon: "🏠" },
  { value: "otro", label: "Otro", icon: "📄" },
];

let user = null;
let categories = [];
let state = { account: null, profile: null, goals: [], fixed: [], debts: [], transactions: [], budgets: [], analysis: null };
let tab = "inicio";
let goalMode = "byDeadline"; // solo un modo en Fase 1, pero dejamos la variable por si acaso

const root = document.getElementById("root");

// P7: quita un ítem del estado local sin recargar TODA la base.
// Actualización optimista: si el borrado en la base falla, recarga para revertir.
async function deleteLocal(table, id, stateKey) {
  const prev = state[stateKey];
  state[stateKey] = prev.filter(x => x.id !== id);
  renderApp();
  const { error } = await supabase.from(table).delete().eq("id", id);
  if (error) {
    showToast("No se pudo borrar, reintentando…");
    await loadState();
    renderApp();
  }
}

function money(n) {
  const num = Number(n) || 0;
  return "RD$" + num.toLocaleString("es-DO", { maximumFractionDigits: 0 });
}

// Escapa texto escrito por el usuario antes de insertarlo en HTML.
// Sin esto, un nombre como: Tarjeta "Popular"  rompe los campos de
// edición, y cualquier símbolo < o & puede romper el renderizado.
function esc(str) {
  if (str == null) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// Aviso breve arriba de la pantalla, para confirmar que algo se guardó
// (antes, editar no daba ninguna señal de que había funcionado).
function showToast(msg) {
  let toast = document.getElementById("toastMsg");
  if (!toast) {
    toast = document.createElement("div");
    toast.id = "toastMsg";
    toast.style.cssText = "position:fixed; top:20px; left:50%; transform:translateX(-50%); background:var(--teal); color:white; padding:10px 18px; border-radius:20px; font-size:13px; z-index:999; box-shadow:0 4px 14px rgba(0,0,0,0.18); opacity:0; transition:opacity 0.25s; pointer-events:none;";
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.style.opacity = "1";
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { toast.style.opacity = "0"; }, 1400);
}

// Reemplaza el confirm() nativo del navegador (feo, fuera de estilo)
// por un modal propio, coherente con el resto de la app.
function confirmAction(message) {
  return new Promise((resolve) => {
    const modal = document.getElementById("logModal");
    modal.classList.add("visible");
    modal.innerHTML = `
      <div class="modal-box" style="text-align:center;">
        <p style="font-size:14px; margin:0 0 20px; line-height:1.5;">${message}</p>
        <div class="btn-row">
          <button class="btn-secondary" id="confirmNo">Cancelar</button>
          <button class="btn-primary" id="confirmYes" style="background:var(--danger-text);">Sí, borrar</button>
        </div>
      </div>
    `;
    const cleanup = (result) => { modal.classList.remove("visible"); modal.innerHTML = ""; resolve(result); };
    document.getElementById("confirmNo").addEventListener("click", () => cleanup(false));
    document.getElementById("confirmYes").addEventListener("click", () => cleanup(true));
  });
}

// CARGA INICIAL

async function init() {
  try {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) { window.location.href = "index.html"; return; }
    user = session.user;

    const { data: cats } = await supabase.from("categories").select("*").order("name");
    categories = cats || [];

    await loadState();
    render();
  } catch (e) {
    root.innerHTML = `
      <div class="screen" style="text-align:center; padding:50px 24px;">
        <div class="icon-circle" style="background:var(--danger-bg); margin:0 auto 14px;">⚠️</div>
        <p style="font-size:14px; margin:0 0 8px;">No pudimos cargar tus datos</p>
        <p style="font-size:12px; color:var(--text-muted); margin:0 0 20px; line-height:1.5;">Revisá tu conexión a internet e intentá de nuevo.</p>
        <button class="btn-primary" style="width:100%;" onclick="window.location.reload()">Reintentar</button>
      </div>
    `;
  }
}

async function loadState() {
  const [{ data: accounts }, { data: profile }, { data: goals }, { data: fixed }, { data: debts }, { data: transactions }, { data: budgets }] =
    await Promise.all([
      supabase.from("accounts").select("*").order("created_at").limit(1),
      supabase.from("profiles").select("*").eq("id", user.id).single(),
      supabase.from("goals").select("*").order("created_at"),
      supabase.from("recurring_expense_templates").select("*, categories(name)").eq("active", true).order("created_at"),
      supabase.from("debts").select("*").order("created_at"),
      // P8: el saldo real viene de accounts.computed_balance (trigger de BD).
      // Limitamos transacciones a 150 para la UI — suficiente para historial reciente.
      supabase.from("transactions").select("*, categories(name)").order("occurred_at", { ascending: false }).limit(150),
      supabase.from("budgets").select("*, categories(name)").is("effective_to", null),
    ]);

  state = {
    account: accounts && accounts[0] ? accounts[0] : null,
    profile: profile || null,
    goals: goals || [],
    fixed: fixed || [],
    debts: debts || [],
    transactions: transactions || [],
    budgets: budgets || [],
  };

  // FinancialCore: recalcular state.analysis cada vez que cambia state.
  // Todas las pantallas leen FA() en vez de recalcular por su cuenta.
  computeAnalysis();
}

function spentThisMonthTotal() {
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth(), 1);
  return state.transactions
    .filter(t => {
      if (new Date(t.occurred_at) < start) return false;
      if (Number(t.amount) >= 0) return false; // ingresos no cuentan
      // Los aportes a metas y pagos de deuda son transferencias de ahorro,
      // no gastos variables. Se excluyen para no restar dos veces el ahorro.
      const note = t.note || "";
      if (!t.category_id && (note.startsWith("Aporte:") || note.startsWith("Pago:"))) return false;
      return true;
    })
    .reduce((s, t) => s + Math.abs(Number(t.amount)), 0);
}

// Ritmo REAL necesario para cumplir la meta: usa lo que falta ahorrar
// y los meses que quedan de verdad (no el plan original completo),
// para no subestimar ni sobreestimar el riesgo si el usuario va
// adelantado o atrasado respecto a su plan inicial.
function goalMonthlyPace(g) {
  if (!g || !g.target_months) return 0;
  const created = new Date(g.created_at);
  const now = new Date();
  const elapsedMonths = (now.getFullYear() - created.getFullYear()) * 12 + (now.getMonth() - created.getMonth());
  const remainingMonths = Math.max(1, g.target_months - elapsedMonths);
  const remainingAmount = Math.max(0, Number(g.target_amount) - Number(g.current_amount));
  return remainingAmount / remainingMonths;
}

// Suma el ritmo mensual necesario de TODAS las metas activas — porque
// todas compiten por el mismo disponible, no alcanza con mirar una sola.
// P2: Cálculo correcto de cuota con interés (fórmula PMT estándar).
// PMT = P × i × (1+i)^n / ((1+i)^n − 1)
// Sin tasa de interés, degrada a simple división.
function calcPMT(principal, annualRatePct, periods) {
  if (!annualRatePct || annualRatePct <= 0 || !periods) return principal / periods;
  const i = annualRatePct / 100 / 12;
  return principal * i * Math.pow(1 + i, periods) / (Math.pow(1 + i, periods) - 1);
}

function goalPriorityLabel(priority) {
  if (priority === "critical") return "🔴 Alta";
  if (priority === "important") return "🟡 Media";
  return "🔵 Baja";
}

function goalMonthsLeft(g) {
  if (!g || !g.target_months) return 0;
  const created = new Date(g.created_at);
  const now = new Date();
  const elapsed = (now.getFullYear() - created.getFullYear()) * 12 + (now.getMonth() - created.getMonth());
  return Math.max(0, g.target_months - elapsed);
}

// Calcula cuántos meses antes del plazo se completó la meta.
// Si es positivo, se logró antes de tiempo. Si es 0 o negativo, a tiempo o tarde.
function goalMonthsEarly(g) {
  if (!g || !g.completed_at || !g.created_at || !g.target_months) return 0;
  const created = new Date(g.created_at);
  const completed = new Date(g.completed_at);
  const monthsUsed = (completed.getFullYear() - created.getFullYear()) * 12 + (completed.getMonth() - created.getMonth());
  return Math.max(0, g.target_months - monthsUsed);
}

function totalGoalMonthlyPace() {
  // Solo metas activas — las completadas ya no necesitan aportes.
  return state.goals
    .filter(g => g.status !== "completed")
    .reduce((sum, g) => sum + goalMonthlyPace(g), 0);
}

// P6: deriva el estado visible de una meta. 'completed' si ya llegó;
// 'at_risk' si el ritmo requerido supera holgadamente lo disponible.
function goalStatus(g) {
  // P3: respetar el status guardado en la BD para metas completadas.
  // Solo recalcular active/at_risk para las que aún están en curso.
  if (g.status === "completed" || Number(g.current_amount) >= Number(g.target_amount)) return "completed";
  const pace = goalMonthlyPace(g);
  // P11: usar disponible restante real (ingreso - fijos - gastos variables del mes).
  // Los aportes a metas ya están excluidos de spentThisMonthTotal(), así que no
  // se resta dos veces el dinero destinado al ahorro.
  const dispRestante = disponible() - spentThisMonthTotal();
  if (dispRestante > 0 && pace > dispRestante) return "at_risk";
  return "active";
}

function goalStatusLabel(status) {
  return status === "completed" ? { text: "✓ Cumplida", color: "var(--success-text)", bg: "var(--success-bg)" }
    : status === "at_risk" ? { text: "⚠ En riesgo", color: "var(--warning-text)", bg: "var(--warning-bg)" }
    : { text: "En curso", color: "var(--teal)", bg: "var(--teal-light)" };
}

// Calcula días hasta el próximo cobro y la fecha estimada
// basándose en pay_day_1, pay_day_2 y pay_frequency del perfil.
function nextPayInfo() {
  const p = state.profile;
  if (!p?.pay_day_1) return null; // días no configurados

  const today = new Date();
  const day = today.getDate();
  const month = today.getMonth();
  const year = today.getFullYear();

  const days = p.pay_frequency === "biweekly" && p.pay_day_2
    ? [p.pay_day_1, p.pay_day_2].sort((a, b) => a - b)
    : [p.pay_day_1];

  // Encontrar el próximo día de cobro
  let nextDate = null;
  for (const d of days) {
    const candidate = new Date(year, month, d);
    if (candidate > today) { nextDate = candidate; break; }
  }
  // Si ninguno en este mes, el primero del mes siguiente
  if (!nextDate) nextDate = new Date(year, month + 1, days[0]);

  const diffMs = nextDate - today;
  const diffDays = Math.ceil(diffMs / (1000 * 60 * 60 * 24));
  const amount = Math.round(monthlyIncome() / (p.pay_frequency === "biweekly" ? 1 : 1));

  return {
    dias: diffDays,
    fecha: nextDate.toLocaleDateString("es-DO", { day: "numeric", month: "long" }),
    monto: amount,
  };
}

function totalFixed() {
  return state.fixed.reduce((s, f) => s + Number(f.estimated_amount), 0);
}
function monthlyIncome() {
  if (!state.profile || state.profile.declared_monthly_income == null) return 0;
  const base = Number(state.profile.declared_monthly_income);
  return state.profile.pay_frequency === "biweekly" ? base * 2 : base;
}
function disponible() {
  return monthlyIncome() - totalFixed();
}
function balance() {
  // P8: computed_balance lo mantiene el trigger sync_account_balance en la BD.
  // Ya no necesitamos recalcular sumando todas las transacciones en el cliente.
  if (!state.account) return 0;
  return Number(state.account.computed_balance ?? state.account.initial_balance);
}

function totalDebt() {
  return state.debts.reduce((s, d) => s + Number(d.current_balance), 0);
}

function spentThisMonthByCategory(catId) {
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth(), 1);
  return state.transactions
    .filter(t => t.category_id === catId && new Date(t.occurred_at) >= start && Number(t.amount) < 0)
    .reduce((s, t) => s + Math.abs(Number(t.amount)), 0);
}

// Motor de Baseline Score: combina capacidad de ahorro, colchón de
// liquidez, y nivel de endeudamiento relativo al ingreso. 0-100.
// El Behavior Score se queda en "Aprendiendo" hasta que exista el
// campo de intención por transacción (fuera de Fase 1, ver ADR-005).
function computeBaselineScore() {
  const income = monthlyIncome();
  if (income <= 0) return null;

  const savingsCapacity = Math.max(0, Math.min(1, (Math.max(0, disponible()) / income) * 2));
  const liquidityBuffer = Math.max(0, Math.min(1, balance() / income)); // piso en 0: saldo negativo no arrastra por debajo
  const debtRatio = Math.max(0, Math.min(1, totalDebt() / (income * 3)));

  const score =
    40 * savingsCapacity +
    30 * liquidityBuffer +
    30 * (1 - debtRatio);

  return Math.round(Math.max(0, Math.min(100, score)));
}

// ================================================================
// ================================================================
// FINANCIAL ENGINE — FASE 1 (v2)
// Arquitectura en 5 capas con responsabilidades separadas.
//
// REGLAS DE ORO (ningún código nuevo puede violarlas):
//   1. Ninguna pantalla lee state.* para cálculos — solo state.analysis.
//      Excepción: formularios de creación/edición (CRUD).
//   2. El engine es puro — nunca modifica state. Solo recibe y retorna.
//   3. Ningún código nuevo llama funciones @legacy directamente.
//      Las @legacy son wrappers de compatibilidad durante la migración.
//
// CAPAS:
//   FinancialData      → normalización de datos crudos
//   FinancialCore    → describe la realidad financiera (puro)
//   RecommendationEngine → prioridades, estrategia, next best action
//   PurchaseEngine     → análisis de compras (Fase 3)
//   CoachContextBuilder → contexto para la IA (Fase 5)
//   DashboardPresenter → modelo para la UI (Fase 4)
//
// SCHEMA VERSION: 1
// Incrementar cuando cambie la estructura de FinancialAnalysis
// para que módulos que consumen el análisis puedan verificar.
// ================================================================
const FA_SCHEMA_VERSION = 2;

// ---------------------------------------------------------------
// @legacy — WRAPPERS DE COMPATIBILIDAD TEMPORAL
// Estas funciones existían antes del engine y siguen funcionando
// para no romper el código de las pantallas mientras se migran.
// NINGÚN CÓDIGO NUEVO debe llamarlas directamente.
// Cuando todos los módulos lean state.analysis, se eliminarán.
// ---------------------------------------------------------------
// Las funciones balance(), disponible(), monthlyIncome(), etc.
// siguen declaradas más arriba en el archivo y son llamadas DESDE
// el engine. Su uso directo en la UI está marcado como deprecated.

// ---------------------------------------------------------------
// CAPA 1 — FinancialData
// Única responsabilidad: normalizar datos crudos de state.
// El engine NUNCA lee state directamente — solo FinancialData.
// Resuelve frecuencias, calcula próximo cobro, normaliza montos.
// ---------------------------------------------------------------
function buildFinancialData(asOf = new Date()) {
  const raw = {
    account:      state.account      ?? null,
    profile:      state.profile      ?? null,
    transactions: state.transactions ?? [],
    goals:        state.goals        ?? [],
    fixed:        state.fixed        ?? [],
    debts:        state.debts        ?? [],
    budgets:      state.budgets      ?? [],
    categories:   categories         ?? [],
  };

  // Guard: sin perfil o cuenta → análisis parcial (onboarding)
  if (!raw.profile || !raw.account) return { raw, normalized: null };

  const freq         = raw.profile.pay_frequency ?? "monthly";
  const perPaycheck  = Number(raw.profile.declared_monthly_income) || 0;
  const monthlyInc   = freq === "biweekly" ? perPaycheck * 2 : perPaycheck;
  const dailyInc     = Math.round(monthlyInc / 30);
  const annualInc    = monthlyInc * 12;

  // Próximo cobro — resuelto en la capa de normalización
  const today = new Date(asOf);
  const m = today.getMonth(), y = today.getFullYear();
  let nextPayDate = null, daysUntilPay = null, nextPayAmount = null;
  if (raw.profile.pay_day_1) {
    const days = (freq === "biweekly" && raw.profile.pay_day_2)
      ? [raw.profile.pay_day_1, raw.profile.pay_day_2].sort((a, b) => a - b)
      : [raw.profile.pay_day_1];
    let next = null;
    for (const d of days) {
      const c = new Date(y, m, d);
      if (c > today) { next = c; break; }
    }
    if (!next) next = new Date(y, m + 1, days[0]);
    nextPayDate  = next.toLocaleDateString("es-DO", { day: "numeric", month: "long" });
    daysUntilPay = Math.ceil((next - today) / 86400000);
    nextPayAmount = perPaycheck;
  }

  // Gastos del mes actual — excluye aportes y pagos (no son gasto variable)
  const monthStart  = new Date(y, m, 1);
  const txMonth     = raw.transactions.filter(t => new Date(t.occurred_at) >= monthStart);
  const spentVar    = txMonth.filter(t => {
    if (Number(t.amount) >= 0) return false;
    const note = t.note || "";
    if (!t.category_id && (note.startsWith("Aporte:") || note.startsWith("Pago:"))) return false;
    return true;
  }).reduce((s, t) => s + Math.abs(Number(t.amount)), 0);

  // Gastos del mes agrupados por categoría 
  const spendingByCategory = {}; 
  for (const category of raw.categories) { 
    spendingByCategory[category.id] = 0; 
  } 
  for (const transaction of txMonth) { 
    const amount = Number(transaction.amount); 
    if (amount >= 0) continue; 
    if (!transaction.category_id) continue; 
    spendingByCategory[transaction.category_id] = 
    (spendingByCategory[transaction.category_id] || 0) + 
    Math.abs(amount); 
  }

  const monthlyFixed = raw.fixed.reduce((s, f) => s + Number(f.estimated_amount), 0);
  const availToday   = Number(raw.account.computed_balance ?? raw.account.initial_balance ?? 0);
  const daysInMonth  = new Date(y, m + 1, 0).getDate();
  const daysLeft     = Math.max(1, daysInMonth - today.getDate());

  // Compromisos financieros antes del próximo cobro
  const debtCommitment = raw.debts.reduce((s, d) => s + (Number(d.minimum_payment) || 0), 0);
  const goalCommitment = raw.goals
    .filter(g => g.status !== "completed")
    .reduce((s, g) => {
      const created = new Date(g.created_at);
      const elapsed = (y - created.getFullYear()) * 12 + (m - created.getMonth());
      const rem     = Math.max(1, g.target_months - elapsed);
      const toSave  = Math.max(0, Number(g.target_amount) - Number(g.current_amount));
      return s + toSave / rem;
    }, 0);
  const committed = Math.round(debtCommitment + goalCommitment);

  const normalized = {
    // Ingresos (siempre normalizados a mensual)
    monthlyIncome: monthlyInc, dailyIncome: dailyInc,
    annualIncome: annualInc, perPaycheck, payFrequency: freq,
    nextPayDate, daysUntilPay, nextPayAmount,

    // Gastos
    monthlyFixed, spentThisMonth: Math.round(spentVar), spendingByCategory,
    availableToday: Math.round(availToday),
    daysLeft, dailyRate: availToday > 0 ? Math.round(availToday / daysLeft) : 0,

    // Dinero libre (reglas de negocio formales del Documento 0)
    disponible:        monthlyInc - monthlyFixed,
    dispRestante:      Math.round((monthlyInc - monthlyFixed) - spentVar),
    committed,
    freeCashToday:     Math.round(availToday - committed),
    freeCashProjected: nextPayAmount !== null
      ? Math.round(availToday + nextPayAmount - committed)
      : null,
  };

  return { raw, normalized };
}

// ---------------------------------------------------------------
// CAPA 2 — FinancialCore (PURO — nunca modifica state)
// Única responsabilidad: describir la realidad financiera.
// No toma decisiones, no prioriza, no recomienda.
// Organizado por dominios para facilitar crecimiento futuro.
// ---------------------------------------------------------------
function FinancialCore(fd, options = {}) {
  const asOf = options.asOf ? new Date(options.asOf) : new Date();
  if (!fd.normalized) return FinancialAnalysis.empty(fd.raw);

  const n = fd.normalized, raw = fd.raw;

  // DOMINIO: cashFlow
  const cashFlow = {
    availableToday:    n.availableToday,
    availableMonthly:  n.dispRestante,
    freeCashToday:     n.freeCashToday,
    freeCashProjected: n.freeCashProjected,
    committed:         n.committed,
    dailyRate:         n.dailyRate,
    daysLeft:          n.daysLeft,
    nextPay: n.nextPayDate ? {
      amount: n.nextPayAmount, date: n.nextPayDate, daysAway: n.daysUntilPay,
      summary: `en ${n.daysUntilPay} día${n.daysUntilPay !== 1 ? "s" : ""} (${n.nextPayDate}) por ${money(n.nextPayAmount)}`,
    } : null,
  };

  // DOMINIO: spending
  const spending = {
    thisMonth: n.spentThisMonth, fixed: n.monthlyFixed, variable: n.spentThisMonth,
    byCategory: n.spendingByCategory,
  };

  // DOMINIO: goals (describe el estado, no decide qué hacer)
  const now = asOf;
  const activeGoals    = raw.goals.filter(g => g.status !== "completed");
  const completedGoals = raw.goals.filter(g => g.status === "completed");
  const totalPace = activeGoals.reduce((s, g) => {
    const created = new Date(g.created_at);
    const elapsed = (now.getFullYear() - created.getFullYear()) * 12 + (now.getMonth() - created.getMonth());
    const rem     = Math.max(1, g.target_months - elapsed);
    return s + Math.max(0, Number(g.target_amount) - Number(g.current_amount)) / rem;
  }, 0);

  const goals = {
    active: activeGoals, completed: completedGoals,
    totalMonthlyPace: Math.round(totalPace),
    canAffordAllGoals: n.dispRestante >= totalPace,
    byGoal: activeGoals.map(g => {
      const created = new Date(g.created_at);
      const elapsed = (now.getFullYear() - created.getFullYear()) * 12 + (now.getMonth() - created.getMonth());
      const rem     = Math.max(1, g.target_months - elapsed);
      const toSave  = Math.max(0, Number(g.target_amount) - Number(g.current_amount));
      const pace    = Math.round(toSave / rem);
      const st      = toSave <= 0 ? "completed" : pace > n.dispRestante ? "at_risk" : "active";
      return { ...g, pace, monthsLeft: rem, derivedStatus: st };
    }),
  };

  // DOMINIO: debts (describe el estado, no recomienda estrategia)
  const sortedDebts       = [...raw.debts].sort((a, b) => (Number(b.interest_rate)||0) - (Number(a.interest_rate)||0));
  const topDebt           = sortedDebts[0] ?? null;
  const totalDebtAmt      = raw.debts.reduce((s, d) => s + Number(d.current_balance), 0);
  const monthlyDebtCommit = raw.debts.reduce((s, d) => s + (Number(d.minimum_payment)||0), 0);
  const topRate           = Number(topDebt?.interest_rate) || 0;
  const debtRisk = topDebt
    ? (topRate >= 30 ? "critical" : topRate >= 15 ? "high" : "moderate")
    : "none";

  const debts = {
    total: totalDebtAmt, count: raw.debts.length,
    topDebt, riskLevel: debtRisk,
    sorted: sortedDebts, monthlyCommitment: Math.round(monthlyDebtCommit),
  };

  // DOMINIO: financialHealth — score con pesos dinámicos por etapa
  const inc = n.monthlyIncome;
  const savComp  = inc > 0 ? Math.max(0, Math.min(1, (Math.max(0, n.disponible) / inc) * 2)) : 0;
  const liqComp  = inc > 0 ? Math.max(0, Math.min(1, n.availableToday / inc)) : 0;
  const debtComp = inc > 0 ? 1 - Math.max(0, Math.min(1, totalDebtAmt / (inc * 3))) : 1;

  // Etapa detectada automáticamente — SOLO describe, no recomienda
  const stage = (() => {
    if (n.availableToday <= 0 && totalDebtAmt > 0)  return "survival";
    if (totalDebtAmt > 0 && debtRisk === "critical") return "debt_elimination";
    if (n.availableToday < inc * 0.5)                return "stability";
    if (totalDebtAmt === 0 && activeGoals.length > 0) return "building";
    return "growth";
  })();

  // Pesos dinámicos según etapa (el engine los calcula, el RecommendationEngine los usa)
  const weights = {
    survival:         { liquidity: 50, savings: 30, debt: 20 },
    debt_elimination: { liquidity: 30, savings: 20, debt: 50 },
    stability:        { liquidity: 35, savings: 35, debt: 30 },
    building:         { liquidity: 30, savings: 40, debt: 30 },
    growth:           { liquidity: 25, savings: 40, debt: 35 },
  }[stage] ?? { liquidity: 35, savings: 35, debt: 30 };

  const score = inc > 0 ? Math.round(Math.max(0, Math.min(100,
    savComp * weights.savings + liqComp * weights.liquidity + debtComp * weights.debt
  ))) : null;

  const financialHealth = {
    score, stage,
    stageLabel: {
      survival: "Supervivencia", debt_elimination: "Eliminar deudas",
      stability: "Estabilidad",  building: "Construcción", growth: "Crecimiento",
    }[stage] ?? "Estabilidad",
    components: {
      savings:   { value: Math.round(savComp  * weights.savings),   weight: weights.savings,   raw: savComp  },
      liquidity: { value: Math.round(liqComp  * weights.liquidity), weight: weights.liquidity, raw: liqComp  },
      debt:      { value: Math.round(debtComp * weights.debt),      weight: weights.debt,      raw: debtComp },
    },
    weights,
  };

  return {
    schemaVersion: FA_SCHEMA_VERSION,
    generatedAt:   new Date(),
    stage,
    // Dominios (solo describen realidad — sin decisiones ni recomendaciones)
    cashFlow, spending, goals, debts, financialHealth,
    // Datos normalizados — disponibles para RecommendationEngine, PurchaseEngine, etc.
    normalized: n,
  };
}

// ---------------------------------------------------------------
// CAPA 3 — RecommendationEngine
// Única responsabilidad: interpretar FinancialAnalysis y generar
// prioridades, next best action y guidance para el dashboard.
// Separado del engine para que pueda cambiar sin tocar el core.
// Recibe el análisis como parámetro — sin acceso global.
// ---------------------------------------------------------------
function RecommendationEngine(analysis) {
  if (!analysis || !analysis.cashFlow) {
    return { priorities: [], nextBestAction: null, headline: "Completa tu perfil para ver recomendaciones." };
  }

  const { goals, debts, financialHealth, normalized: n } = analysis;
  const { stage } = financialHealth;

  const priorities = [];

  // Deuda crítica (prestamista/alta tasa) — siempre primero
  if (debts.topDebt && debts.riskLevel === "critical") {
    priorities.push({
      id: "pay_debt_critical", category: "debt",
      label: `Liquidar deuda "${debts.topDebt.name}"`,
      impact: 98,
      why: `Tasa ${debts.topDebt.interest_rate}% anual — cada mes que pasa pierdes dinero`,
      amount: Number(debts.topDebt.minimum_payment) || null,
    });
  }

  // Fondo de emergencia faltante
  const hasEmergencyFund = goals.active.some(g => g.name.toLowerCase().includes("emergencia"));
  if (!hasEmergencyFund && n.availableToday < n.monthlyIncome) {
    priorities.push({
      id: "emergency_fund", category: "saving",
      label: "Crear fondo de emergencia",
      impact: 92,
      why: "Sin fondo de emergencia cualquier imprevisto puede desestabilizarte",
      amount: null,
    });
  }

  // Deuda de tasa alta (no crítica)
  if (debts.topDebt && debts.riskLevel === "high") {
    priorities.push({
      id: "pay_debt_high", category: "debt",
      label: `Reducir "${debts.topDebt.name}"`,
      impact: 78,
      why: `${debts.topDebt.interest_rate}% anual es una tasa alta`,
      amount: Number(debts.topDebt.minimum_payment) || null,
    });
  }

  // Metas activas
  goals.byGoal.forEach(g => {
    priorities.push({
      id: `goal_${g.id}`, category: "goal",
      label: `Aportar a "${g.name}"`,
      impact: g.derivedStatus === "at_risk" ? 70 : 55,
      why: `${money(g.pace)}/mes necesario — faltan ${money(Math.max(0, Number(g.target_amount) - Number(g.current_amount)))}`,
      amount: g.pace,
    });
  });

  // Colchón general
  priorities.push({
    id: "save_buffer", category: "saving",
    label: "Aumentar colchón mensual",
    impact: 35,
    why: "Más margen reduce el estrés financiero y mejora tu score",
    amount: null,
  });

  const sorted = priorities.sort((a, b) => b.impact - a.impact);
  const nextBestAction = sorted[0] ?? null;

  const headline = (() => {
    if (stage === "survival")          return "Tu prioridad ahora es estabilizar tu liquidez.";
    if (stage === "debt_elimination")  return "Atacar tu deuda de alto costo es lo más rentable que puedes hacer.";
    if (!hasEmergencyFund)             return "Completar tu fondo de emergencia es el siguiente paso clave.";
    if (goals.byGoal.some(g => g.derivedStatus === "at_risk")) return "Alguna de tus metas está en riesgo este mes.";
    if (goals.active.length > 0)       return `Estás avanzando hacia "${goals.byGoal[0]?.name}".`;
    return "Tus finanzas están estables. Es buen momento para fijar nuevas metas.";
  })();

  return { priorities: sorted, nextBestAction, headline, stage };
}

// FinancialAnalysis.empty — objeto válido para onboarding

const FinancialAnalysis = {
  empty(raw) {
    return {
      schemaVersion: FA_SCHEMA_VERSION,
      generatedAt:   new Date(),
      stage:         "onboarding",
      cashFlow:      null, spending: null,
      goals:         { active: [], completed: [], totalMonthlyPace: 0, canAffordAllGoals: false, byGoal: [] },
      debts:         { total: 0, count: 0, riskLevel: "none", sorted: [], monthlyCommitment: 0 },
      financialHealth: { score: null, stage: "onboarding", stageLabel: "Configurando", components: {}, weights: {} },
      normalized:    null,
      recommendations: { priorities: [], nextBestAction: null, headline: "Completa tu perfil para comenzar." },
    };
  },
};

// ---------------------------------------------------------------
// computeAnalysis() — punto de entrada público
// Ejecuta las 3 capas en orden y almacena en state.analysis.
// Se llama después de cada loadState(). Es puro en el sentido
// de que no tiene efectos secundarios más allá de state.analysis.
// ---------------------------------------------------------------
function computeAnalysis(asOf = new Date()) {
  const fd = buildFinancialData(asOf);                 // Capa 1
  const analysis = FinancialCore(fd, { asOf });         // Capa 2
  const recs = RecommendationEngine(analysis);          // Capa 3
  state.analysis = {
    ...analysis,
    recommendations: recs,
  };
  return state.analysis;
}

// ---------------------------------------------------------------
// SELF-TEST — batería de pruebas para desarrollo
// Detecta regresiones durante la migración de módulos.
// Llamar con runEngineTests() desde la consola del navegador.
// ---------------------------------------------------------------
function runEngineTests() {
  const results = [];
  function assert(desc, condition) {
    results.push({ desc, ok: !!condition });
    if (!condition) console.warn(`[ENGINE TEST FAIL] ${desc}`);
  }

  // Caso 1: usuario nuevo sin datos → no crashea
  try {
    const fd = buildFinancialData();
    assert("Caso 1: usuario nuevo no lanza errores", true);
    assert("Caso 1: estado onboarding correcto", fd.normalized === null);
  } catch(e) {
    assert("Caso 1: usuario nuevo no lanza errores", false);
  }

  // Simulaciones con datos ficticios
  function mockAnalysis(overrides = {}) {
    const base = {
      cashFlow: { availableToday: 5000, freeCashToday: 3000, freeCashProjected: 20000 },
      spending: { thisMonth: 500, fixed: 300 },
      goals: { active: [], completed: [], totalMonthlyPace: 0, canAffordAllGoals: true, byGoal: [] },
      debts: { total: 0, count: 0, riskLevel: "none", sorted: [], topDebt: null, monthlyCommitment: 0 },
      financialHealth: { score: 75, stage: "stability", stageLabel: "Estabilidad", components: {}, weights: {} },
      normalized: { monthlyIncome: 20000, availableToday: 5000, daysUntilPay: 10,
                    nextPayAmount: 10000, nextPayDate: "15 de agosto", dispRestante: 15000 },
      stage: "stability",
    };
    return { ...base, ...overrides };
  }

  // Caso 2: sin metas
  const a2 = mockAnalysis({ goals: { active: [], completed: [], totalMonthlyPace: 0, canAffordAllGoals: true, byGoal: [] } });
  assert("Caso 2: sin metas → goals.active vacío", a2.goals.active.length === 0);

  // Caso 3: sin deudas
  const a3 = mockAnalysis();
  assert("Caso 3: sin deudas → riskLevel none", a3.debts.riskLevel === "none");

  // Caso 4: quincenal → ingreso mensual normalizado
  const stateBackup = { ...state };
  state = { ...state, profile: { pay_frequency: "biweekly", declared_monthly_income: 17000, pay_day_1: 15, pay_day_2: 30 }, account: { computed_balance: 5000 }, transactions: [], goals: [], fixed: [], debts: [], budgets: [] };
  const fd4 = buildFinancialData();
  assert("Caso 4: quincenal 17000 → mensual 34000", fd4.normalized?.monthlyIncome === 34000);
  assert("Caso 4: income diario correcto", fd4.normalized?.dailyIncome === 1133);

  // Caso 5: mensual → ingreso sin cambio
  state.profile = { ...state.profile, pay_frequency: "monthly", declared_monthly_income: 34000 };
  const fd5 = buildFinancialData();
  assert("Caso 5: mensual 34000 → mensual 34000", fd5.normalized?.monthlyIncome === 34000);

  // Caso 6: saldo negativo + deuda → stage survival
  state = { ...stateBackup, profile: { pay_frequency: "monthly", declared_monthly_income: 20000 },
    account: { computed_balance: -500 },
    debts: [{ current_balance: 10000, interest_rate: 40, minimum_payment: 2000, debt_type: "lender" }],
    goals: [], fixed: [], transactions: [], budgets: [] };
  const fd6 = buildFinancialData();
  const a6 = FinancialCore(fd6);
  assert("Caso 6: saldo negativo + deuda → stage survival", a6.stage === "survival");

  // Caso 7: saldo positivo sin deudas → stage stability o building
  state = { ...stateBackup, profile: { pay_frequency: "monthly", declared_monthly_income: 20000 },
    account: { computed_balance: 15000 },
    debts: [], goals: [], fixed: [], transactions: [], budgets: [] };
  const fd7 = buildFinancialData();
  const a7 = FinancialEngine(fd7);
  assert("Caso 7: saldo positivo sin deudas → stability/building", ["stability","building","growth"].includes(a7.stage));

  // Restaurar state real
  state = stateBackup;

  const passed = results.filter(r => r.ok).length;
  const total = results.length;
  console.log(`[ENGINE TESTS] ${passed}/${total} passed`);
  results.forEach(r => {
    const icon = r.ok ? "✅" : "❌";
    console.log(`  ${icon} ${r.desc}`);
  });
  return { passed, total, results };
}


function determineStep() {
  if (!state.account) return "account";
  if (state.profile == null || state.profile.declared_monthly_income == null) return "income";
  if (state.goals.length === 0) return "fixed";
  return "app";
}

// ---------------------------------------------------------------
// RENDER PRINCIPAL
// ---------------------------------------------------------------
function render() {
  const step = determineStep();
  if (step === "account") return renderOnboardingAccount();
  if (step === "income") return renderOnboardingIncome();
  if (step === "fixed") return renderOnboardingFixed();
  return renderApp();
}

function renderOnboardingAccount() {
  const existing = state.account;
  root.innerHTML = `
    <div class="screen">
      <p class="step-label">Paso 1 de 4</p>
      <h1>Antes de empezar, ¿cómo te llamas?</h1>
      <div class="error-banner" id="err"></div>

      <input id="accName" placeholder="Ej. Banreservas" style="margin-bottom:2px;" value="${existing ? esc(existing.name) : ""}" />
      <p class="hint">Esto es solo para que la reconozcas vos.</p>

      <label>Tipo</label>
      <div class="type-grid" id="typeGrid">
        <div class="type-option ${(!existing || existing.type === "bank") ? "selected" : ""}" data-type="bank">Banco</div>
        <div class="type-option ${existing?.type === "cash" ? "selected" : ""}" data-type="cash">Efectivo</div>
        <div class="type-option ${existing?.type === "savings" ? "selected" : ""}" data-type="savings">Ahorro</div>
      </div>

      <label>¿Cuánto tienes ahí ahora mismo?</label>
      <input id="accBalance" type="number" step="1" min="0" placeholder="RD$0" style="margin-bottom:20px;" value="${existing ? existing.initial_balance : ""}" />

      <button class="btn-primary" id="continueBtn" style="width:100%;">Continuar</button>
    </div>
  `;

  let selectedType = existing?.type || "bank";
  document.querySelectorAll(".type-option").forEach(el => {
    el.addEventListener("click", () => {
      document.querySelectorAll(".type-option").forEach(o => o.classList.remove("selected"));
      el.classList.add("selected");
      selectedType = el.dataset.type;
    });
  });

  document.getElementById("continueBtn").addEventListener("click", async () => {
    const userName = document.getElementById("accUserName").value.trim();
    const name = document.getElementById("accName").value.trim();
    const balanceVal = document.getElementById("accBalance").value;
    const errEl = document.getElementById("err");
    if (!userName) {
      errEl.textContent = "Completá tu nombre.";
      errEl.classList.add("visible");
      return;
    }
    if (!name) {
      errEl.textContent = "Completá el nombre de la cuenta.";
      errEl.classList.add("visible");
      return;
    }
    const balanceNum = balanceVal === "" ? 0 : Number(balanceVal);
    // Guardar el nombre del usuario
    await supabase.from("profiles").update({ display_name: userName }).eq("id", user.id);
    // Si ya existe una cuenta (volviste desde un paso más adelante),
    // la actualizamos en vez de crear una segunda por accidente.
    const { error } = existing
      ? await supabase.from("accounts").update({ name, type: selectedType, initial_balance: balanceNum }).eq("id", existing.id)
      : await supabase.from("accounts").insert({ user_id: user.id, name, type: selectedType, initial_balance: balanceNum });
    if (error) {
      errEl.textContent = "No se pudo guardar. Intentá de nuevo.";
      errEl.classList.add("visible");
      return;
    }
    await loadState();
    render();
  });
}

    root.innerHTML = `

        <p class="step-label">Paso 4 de 4</p>
        <h1>Creá tu primera meta</h1>

        <label>¿Cómo la llamamos?</label>
        <input id="gName" placeholder="Ej. Fondo de emergencia" style="margin-bottom:12px;" />

        <label>Monto objetivo</label>
        <input id="gAmount" type="number" step="1" min="0" placeholder="RD$0" style="margin-bottom:12px;" />

        <label>¿En cuántos meses?</label>
        <input id="gMonths" type="number" step="1" min="0" placeholder="Ej. 6" style="margin-bottom:12px;" />

        <div class="error-banner" id="err"></div>

        <div id="goalViabilityCard"></div>

        <div class="btn-row" style="margin-top:16px;">
          <button class="btn-back" id="backBtn">‹</button>
          <button class="btn-primary" id="finishBtn">Crear meta y terminar</button>
        </div>
      </div>
    `;

    renderCard();
    document.getElementById("gAmount").addEventListener("input", renderCard);
    document.getElementById("gMonths").addEventListener("input", renderCard);

    document.getElementById("backBtn").addEventListener("click", () => renderOnboardingFixed());

    document.getElementById("finishBtn").addEventListener("click", async () => {
      const name = document.getElementById("gName").value.trim();
      const target = Number(document.getElementById("gAmount").value) || 0;
      const months = Number(document.getElementById("gMonths").value) || 0;
      const errEl = document.getElementById("err");
      if (!name || target <= 0 || months <= 0) {
        errEl.textContent = "Completá todos los campos.";
        errEl.classList.add("visible");
        return;
      }
      const { error } = await supabase.from("goals").insert({
        user_id: user.id, name, target_amount: target, target_months: months,
        linked_account_id: state.account.id, priority: "critical",
      });
      if (error) {
        errEl.textContent = "No se pudo guardar. Intentá de nuevo.";
        errEl.classList.add("visible");
        return;
      }
      await loadState();
      render();
    });
  }
  paint();
}

function buildCoachContext() {
  const spentThisMonth = spentThisMonthTotal();
  const bal = balance();
  const disp = disponible();
  const disponibleRestante = Math.round(disp - spentThisMonth);
  const goalMonthlyNeeded = state.goals.length > 0 ? Math.round(totalGoalMonthlyPace()) : null;
  const activeGoals = state.goals.filter(g => g.status !== "completed");

  // P17: datos estructurados para que el modelo razone mejor con hechos, no solo texto
  const structured = {
    perfil: {
      frecuencia_cobro: state.profile?.pay_frequency === "biweekly" ? "quincenal" : "mensual",
      // DISTINCIÓN CRÍTICA: ingreso_por_cobro es lo que entra CADA vez.
      // ingreso_mensual_total es la suma de TODOS los cobros del mes.
      // Para usuarios quincenales, el próximo cobro es ingreso_por_cobro, NO ingreso_mensual_total.
      ingreso_por_cobro: Math.round(monthlyIncome() / (state.profile?.pay_frequency === "biweekly" ? 2 : 1)),
      ingreso_mensual_total: Math.round(monthlyIncome()),
      saldo_actual: Math.round(bal),
      disponible_restante_este_mes: disponibleRestante,
    },
    // P12: gastos fijos explícitos — antes el coach decía "no tengo info"
    gastos_fijos: state.fixed.map(f => ({
      nombre: f.name,
      monto: Number(f.estimated_amount),
      categoria: f.categories?.name || "Sin categoría",
    })),
    total_gastos_fijos: Math.round(totalFixed()),
    gastos_variables_mes: Math.round(spentThisMonth),
    metas: activeGoals.map(g => ({
      nombre: g.name,
      objetivo: Number(g.target_amount),
      ahorrado: Number(g.current_amount),
      falta: Math.max(0, Number(g.target_amount) - Number(g.current_amount)),
      aporte_mensual_necesario: Math.round(goalMonthlyPace(g)),
    })),
    deudas: state.debts.map(d => ({
      nombre: d.name,
      tipo: d.debt_type,
      saldo_pendiente: Number(d.current_balance),
      tasa_interes_anual: d.interest_rate ? Number(d.interest_rate) : null,
      cuota_mensual: d.minimum_payment ? Math.round(d.minimum_payment) : null,
    })),
    presupuestos: state.budgets.map(b => {
      const cat = categories.find(c => c.id === b.category_id);
      const spent = spentThisMonthByCategory(b.category_id);
      return {
        categoria: cat?.name || "Sin categoría",
        limite: Number(b.amount),
        gastado: Math.round(spent),
        disponible: Math.round(Number(b.amount) - spent),
      };
    }),
  };

  // Resúmenes en lenguaje natural (compactos, para el prompt de texto)
  const goalSummary = activeGoals.length > 0
    ? activeGoals.map(g => {
        const falta = Math.max(0, Number(g.target_amount) - Number(g.current_amount));
        return `"${g.name}" (tiene RD$${g.current_amount}, le falta RD$${falta})`;
      }).join("; ")
    : null;

  const fixedSummary = state.fixed.length > 0
    ? state.fixed.map(f => `${f.name} RD$${f.estimated_amount}`).join(", ")
    : null;

  const budgetSummary = state.budgets.length > 0
    ? state.budgets.map(b => {
        const cat = categories.find(c => c.id === b.category_id);
        const remaining = Math.round(Number(b.amount) - spentThisMonthByCategory(b.category_id));
        return `${cat?.name || "Sin categoría"}: queda RD$${remaining} de RD$${b.amount}`;
      }).join("; ")
    : null;

  const debtsSummary = state.debts.length > 0
    ? state.debts.map(d => {
        const tasa = d.interest_rate ? ` al ${d.interest_rate}% anual` : "";
        const cuota = d.minimum_payment ? ` (cuota: RD$${Math.round(d.minimum_payment)}/mes)` : "";
        return `${d.name}: debe RD$${d.current_balance}${tasa}${cuota}`;
      }).join("; ")
    : null;

  const nextPay = nextPayInfo();
  const freq = state.profile?.pay_frequency;

  return {
    balance: Math.round(bal),
    disponibleRestante,
    income: Math.round(monthlyIncome()),       // ingreso mensual TOTAL (normalizado)
    perPaycheck: Math.round(monthlyIncome() / (freq === "biweekly" ? 2 : 1)), // lo que ENTRA cada cobro
    payFrequency: freq,
    payFrequencyLabel: freq === "biweekly" ? "quincenal" : "mensual",
    totalFixed: Math.round(totalFixed()),
    nextPay: nextPay ? `en ${nextPay.dias} día${nextPay.dias !== 1 ? "s" : ""} (${nextPay.fecha}) por ${money(nextPay.monto)}` : null,
    goalSummary,
    goalCount: activeGoals.length,
    goalMonthlyNeeded,
    fixedSummary,
    budgetSummary,
    debtsSummary,
    structured,
    // Último análisis de ¿Lo compro? — para que el coach no contradiga el veredicto
    lastPurchaseVerdict: lastPurchaseAnalysis ? {
      verdict: lastPurchaseAnalysis.verdict,
      verdictLabel: lastPurchaseAnalysis.verdictLabel,
      reason: lastPurchaseAnalysis.reason,
      item: lastPurchaseAnalysis.meta?.itemName ?? null,
      amount: lastPurchaseAnalysis.meta?.amount ?? null,
    } : null,
  };
}

let coachError = "";
let coachSending = false;
let lastPurchaseAnalysis = null;

async function sendCoachMessage() {
  if (coachSending) return; // evita envíos duplicados por doble Enter/clic
  const input = document.getElementById("coachInput");
  const msg = input.value.trim();
  if (!msg) return;

  coachError = "";
  coachSending = true;
  coachHistory.push({ role: "user", content: msg });
  // P4: limitar el historial en memoria a 20 mensajes (10 turnos).
  // El slice al mandar ya limita a 10, pero sin esto el array crece indefinidamente.
  if (coachHistory.length > 20) coachHistory = coachHistory.slice(-20);
  input.value = "";
  renderApp();
  const typingEl = document.getElementById("coachTyping");
  if (typingEl) typingEl.style.display = "block";
  const msgsEl = document.getElementById("coachMessages");
  if (msgsEl) msgsEl.scrollTop = msgsEl.scrollHeight;

  try {
    const { data, error } = await supabase.functions.invoke("coach-chat", {
      body: {
        message: msg,
        history: coachHistory.slice(0, -1).slice(-10),
        context: buildCoachContext(),
      },
    });
    if (error || data?.error) throw new Error(data?.error || error.message);
    coachHistory.push({ role: "assistant", content: data.reply });
  } catch (e) {
    coachError = "No se pudo conectar con el coach. Revisá tu conexión e intentá de nuevo.";
  } finally {
    coachSending = false;
  }
  renderApp();
}

function wireCoach() {
  const sendBtn = document.getElementById("coachSendBtn");
  const input = document.getElementById("coachInput");
  if (!sendBtn) return;
  sendBtn.addEventListener("click", sendCoachMessage);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") sendCoachMessage(); });
  const msgs = document.getElementById("coachMessages");
  if (msgs) msgs.scrollTop = msgs.scrollHeight;
}

// ================================================================
// MOTOR DE DECISIÓN v2 — buildPurchaseAnalysis(amount, itemName)
// Fuente única de verdad. La UI y el Coach consumen este objeto.
// Nunca inventar información — si no hay datos, decirlo explícito.
// ================================================================
function scoreLabel(s) {
  return s >= 80 ? "Excelente" : s >= 60 ? "Buena" : s >= 40 ? "Moderada" : s >= 20 ? "Baja" : "Muy baja";
}

function buildPurchaseAnalysis(amount, itemName) {
  const bal        = balance();
  const disp       = disponible();
  const spent      = spentThisMonthTotal();
  const dispRest   = disp - spent;
  const afterPurch = dispRest - amount;
  const balAfter   = bal - amount;
  const income     = monthlyIncome();
  const activeGoals = state.goals.filter(g => g.status !== "completed");
  const goalPace   = totalGoalMonthlyPace();
  const daysInMonth = new Date(new Date().getFullYear(), new Date().getMonth()+1, 0).getDate();
  const dayOfMonth  = new Date().getDate();
  const daysLeft    = Math.max(1, daysInMonth - dayOfMonth);

  // BUG 3 FIX: detectar si el ingreso todavía no ha entrado (bigGap)
  // Si el saldo real es mucho menor que el disponible planeado,
  // probablemente la quincena/sueldo aún no ha caído.
  const bigGap = dispRest - bal > Math.max(dispRest * 0.3, 500) && dispRest > 0;

  // BUG 1+2 FIX: calcular saldo proyectado con próximo cobro
  const nextPay = nextPayInfo();
  const cobrarPronto = nextPay !== null && nextPay.dias <= 5;
  const balProyectado = cobrarPronto ? bal + nextPay.monto : bal;
  const balAfterProyectado = balProyectado - amount;

  // Para el análisis de liquidez, usar el saldo más favorable:
  // si cobra en ≤5 días, evaluar con el saldo proyectado post-cobro.
  const balEfectivo = cobrarPronto ? balProyectado : bal;
  const balAfterEfectivo = balEfectivo - amount;

  // BUG 4 FIX: si el saldo real es negativo, el dispRest planeado
  // no refleja la situación real. Usar el menor de los dos.
  const dispRestReal = Math.min(dispRest, bal > 0 ? dispRest : dispRest + bal);

  // 1. LIQUIDEZ (peso 35%)
  let liqS, liqLabel, liqMsg;
  if (amount === 0) {
    liqS = 100; liqLabel = "—";
    liqMsg = "Ingresa un monto para ver el análisis de liquidez.";
  } else if (balEfectivo < amount) {
    // No alcanza ni con el cobro proyectado
    if (cobrarPronto && bal < amount) {
      liqS = 20; liqLabel = "Muy baja";
      liqMsg = `Hoy tienes ${money(bal)} en cuenta, pero cobras en ${nextPay.dias} día${nextPay.dias > 1 ? "s" : ""} (${money(nextPay.monto)}). Aún así, después del cobro no alcanzaría para ${money(amount)}.`;
    } else if (cobrarPronto) {
      liqS = 65; liqLabel = "Buena";
      liqMsg = `Hoy tienes ${money(bal)}, pero cobras en ${nextPay.dias} día${nextPay.dias > 1 ? "s" : ""} (${money(nextPay.monto)}). Con ese cobro tendrías ${money(balProyectado)} — suficiente.`;
    } else {
      liqS = 5; liqLabel = "Muy baja";
      if (nextPay && nextPay.dias > 0) {
        liqMsg = `Hoy no tienes ${money(amount)} en cuenta (tienes ${money(bal)}). Tu próximo cobro es en ${nextPay.dias} día${nextPay.dias > 1 ? "s" : ""} por ${money(nextPay.monto)}.`;
      } else if (bigGap) {
        liqMsg = `Hoy no tienes ${money(amount)} en cuenta (tienes ${money(bal)}). Parece que tu ingreso de este período aún no ha entrado.`;
      } else {
        liqMsg = `Hoy no tienes ${money(amount)} en cuenta (tienes ${money(bal)}).`;
      }
    }
  } else {
    // Sí alcanza con el saldo efectivo
    const pct = balAfterEfectivo / balEfectivo;
    liqS = pct >= 0.6 ? 90 : pct >= 0.4 ? 75 : pct >= 0.2 ? 55 : pct >= 0.05 ? 35 : 15;
    liqLabel = scoreLabel(liqS);
    if (cobrarPronto && bal < amount) {
      liqMsg = `Hoy tienes ${money(bal)}, pero cobras en ${nextPay.dias} día${nextPay.dias > 1 ? "s" : ""} (${money(nextPay.monto)}). Con ese cobro tendrías ${money(balProyectado)} y te quedarían ${money(balAfterEfectivo)}.`;
    } else {
      const daily = balAfterEfectivo / daysLeft;
      liqMsg = `Te quedarían ${money(Math.round(balAfterEfectivo))} en cuenta. Eso equivale a ~${money(Math.round(daily))}/día por los ${daysLeft} días restantes del mes.`;
    }
  }

  // 2. DEUDAS (peso 20% — P4: nueva dimensión)
  let debtS, debtLabel, debtMsg;
  const topDebt = state.debts.length > 0
    ? [...state.debts].sort((a,b) => (Number(b.interest_rate)||0) - (Number(a.interest_rate)||0))[0]
    : null;
  if (state.debts.length === 0) {
    debtS = 90; debtLabel = "Sin deudas";
    debtMsg = "No tienes deudas registradas. Esta compra no compite con ningún compromiso financiero.";
  } else if (topDebt && Number(topDebt.interest_rate) >= 30) {
    debtS = 25; debtLabel = "Alta prioridad";
    debtMsg = `Tienes una deuda con "${topDebt.name}" al ${topDebt.interest_rate}% anual. Financieramente conviene reducir esa deuda antes de hacer esta compra.`;
  } else if (topDebt && Number(topDebt.interest_rate) >= 15) {
    debtS = 50; debtLabel = "Moderada";
    debtMsg = `Tienes deudas activas (tasa más alta: ${topDebt.interest_rate}% anual). Considera si esta compra puede esperar hasta reducir algo esa deuda.`;
  } else {
    debtS = 75; debtLabel = "Manejable";
    debtMsg = `Tus deudas tienen tasas bajas. Esta compra no genera un conflicto crítico con tus compromisos financieros.`;
  }

  // 3. METAS (peso 25%)
  let goalsS, goalsLabel, goalsMsg;
  if (activeGoals.length === 0) {
    goalsS = 80; goalsLabel = "Sin metas";
    goalsMsg = "No tienes metas activas registradas. Esta compra no afecta ningún objetivo de ahorro.";
  } else if (amount === 0) {
    goalsS = 80; goalsLabel = "—";
    goalsMsg = "Ingresa un monto para ver el impacto en tus metas.";
  } else if (afterPurch >= goalPace) {
    goalsS = 90; goalsLabel = "Excelente";
    goalsMsg = `Después de la compra te quedan ${money(Math.round(afterPurch))} disponibles — cubre el aporte mensual de tus metas (${money(Math.round(goalPace))}).`;
  } else if (afterPurch >= 0) {
    const shortfall = goalPace - afterPurch;
    const daysDelay = Math.ceil((shortfall / income) * 30);
    goalsS = 40; goalsLabel = "Baja";
    goalsMsg = `Te faltarían ${money(Math.round(shortfall))} para cubrir tus metas este mes, equivalente a ~${daysDelay} días de retraso.`;
  } else {
    goalsS = 15; goalsLabel = "Muy baja";
    goalsMsg = `Esta compra supera tu disponible mensual (${money(Math.round(dispRest))}). Afectaría directamente el avance de tus metas.`;
  }

  // 4. HÁBITOS (peso 10% — sin historial aún)
  const habitsS = 70; const habitsLabel = "Sin datos";
  const habitsMsg = "Todavía no hay suficiente historial para detectar patrones de comportamiento.";

  // 5. BIENESTAR (peso 10% — P8: lenguaje orientado a decisiones)
  let wellS, wellLabel, wellMsg;
  const saludable = computeBaselineScore() >= 60;
  if (amount === 0) {
    wellS = 80; wellLabel = "—";
    wellMsg = "Ingresa un monto para evaluar el impacto en tu bienestar financiero.";
  } else if (balEfectivo >= amount && afterPurch >= 0 && saludable) {
    wellS = 90; wellLabel = "Excelente";
    wellMsg = cobrarPronto && bal < amount
      ? `Aunque hoy el saldo está ajustado, cobras pronto y tus finanzas se mantienen saludables con esta compra.`
      : "Tus finanzas siguen saludables incluso realizando esta compra. Tienes margen para este gasto.";
  } else if (balEfectivo >= amount && afterPurch >= 0) {
    wellS = 60; wellLabel = "Buena";
    wellMsg = "La compra es posible. Ajusta tus gastos variables el resto del mes para mantener el equilibrio.";
  } else {
    wellS = 25; wellLabel = "Baja";
    wellMsg = "Esta compra reduciría tu margen financiero para el resto del mes. No significa que sea imposible, pero aumenta el riesgo de quedarte sin efectivo antes del próximo ingreso.";
  }

  // P1+P2: SCORE COMPUESTO (escala 0-100 corregida, dividiendo por el máximo posible)
  // Pesos: liq 35, deuda 20, metas 25, hábitos 10, bienestar 10 = 100
  const rawScore = amount === 0 ? 0 :
    liqS * 0.35 + debtS * 0.20 + goalsS * 0.25 + habitsS * 0.10 + wellS * 0.10;
  const score = Math.round(rawScore);

  // VEREDICTO FINAL
  // REGLA ABSOLUTA: verde SOLO cuando el dinero está HOY en la cuenta.
  // Si el saldo actual no cubre la compra, el máximo posible es amarillo.
  // El Coach nunca contradice este veredicto — solo lo explica.
  let verdict;
  if (amount === 0) {
    verdict = "neutral";
  } else if (balEfectivo < amount) {
    // Ni con el cobro proyectado alcanza → rojo siempre
    verdict = "red";
  } else if (bal < amount && cobrarPronto) {
    // No alcanza HOY pero sí con el cobro inminente → MÁXIMO amarillo
    // Verde es imposible: el dinero no está en tu mano ahora mismo.
    verdict = "yellow";
  } else if (bal < amount) {
    // No alcanza hoy y no hay cobro próximo → rojo
    verdict = "red";
  } else if (liqS <= 10) {
    verdict = "red";
  } else if (debtS < 50) {
    // Tiene deuda de alto interés → máximo amarillo (principio financiero)
    verdict = score >= 45 ? "yellow" : "red";
  } else if (score >= 70) {
    verdict = "green";
  } else if (score >= 45) {
    verdict = "yellow";
  } else {
    verdict = "red";
  }

  const stars = verdict === "neutral" ? 0 : score >= 85 ? 5 : score >= 70 ? 4 : score >= 55 ? 3 : score >= 40 ? 2 : 1;

  // Labels contextuales — no genéricos
  let verdictLabel, reason;
  if (verdict === "neutral") {
    verdictLabel = ""; reason = "";
  } else if (verdict === "green") {
    verdictLabel = "🟢 Compra recomendable";
    reason = `Tienes ${money(bal)} en cuenta — cubre la compra y tus metas no se ven afectadas.`;
  } else if (verdict === "yellow" && bal < amount && cobrarPronto) {
    verdictLabel = "🟡 Viable cuando cobres";
    reason = `Hoy no tienes los ${money(amount)} (saldo: ${money(bal)}), pero cobras ${money(nextPay.monto)} en ${nextPay.dias} día${nextPay.dias !== 1 ? "s" : ""}. Con ese cobro puedes hacerla sin afectar tus metas.`;
  } else if (verdict === "yellow" && debtS < 50) {
    verdictLabel = "🟡 Viable, pero tienes una deuda prioritaria";
    reason = `Puedes pagar la compra, pero tienes una deuda con "${topDebt?.name}" al ${topDebt?.interest_rate}% anual. Financieramente conviene reducir esa deuda primero.`;
  } else if (verdict === "yellow") {
    verdictLabel = "🟡 Viable, pero ajusta tus gastos";
    reason = `Puedes hacer la compra, pero te quedaría menos margen para el resto del mes. Revisa si puedes recortar algún gasto variable.`;
  } else if (verdict === "red" && balEfectivo < amount) {
    verdictLabel = "🔴 No alcanza";
    if (bal < amount && nextPay && nextPay.dias > 0 && !cobrarPronto) {
      reason = `Hoy tienes ${money(bal)} en cuenta. Tu próximo cobro es en ${nextPay.dias} días por ${money(nextPay.monto)}, pero incluso con ese cobro no alcanzaría para ${money(amount)}.`;
    } else if (bal < amount && nextPay && cobrarPronto) {
      reason = `Incluso con tu próximo cobro (${money(nextPay.monto)} en ${nextPay.dias} días), el saldo proyectado de ${money(balProyectado)} no alcanza para ${money(amount)}.`;
    } else {
      reason = `Hoy tienes ${money(bal)} en cuenta.${nextPay ? ` Tu próximo cobro es en ${nextPay.dias} días.` : ""}`;
    }
  } else {
    verdictLabel = "🔴 No recomendable ahora";
    reason = `Esta compra compromete tu liquidez o tus compromisos financieros actuales.`;
  }

  const summary = amount === 0
    ? "Ingresa el monto para analizar la compra."
    : reason;

  // P6: OPORTUNIDADES ordenadas por impacto financiero
  let opportunityItems = [];
  if (amount > 0) {
    if (topDebt && Number(topDebt.interest_rate) > 0) {
      const interesAhorro = Math.round(amount * (Number(topDebt.interest_rate)/100/12));
      opportunityItems.push({ stars: 5, text: `Abonar ${money(amount)} a tu deuda "${topDebt.name}"`, reason: `Ahorrarías ~${money(interesAhorro)} en intereses este mes.` });
    }
    if (activeGoals.length > 0) {
      const topGoal = activeGoals[0];
      const falta = Math.max(0, Number(topGoal.target_amount) - Number(topGoal.current_amount));
      if (amount <= falta) opportunityItems.push({ stars: 4, text: `Aportar ${money(amount)} a tu meta "${topGoal.name}"`, reason: `Acelerarías tu progreso hacia el objetivo.` });
    }
    const fondoNecesario = totalFixed() * 3;
    if (bal < fondoNecesario) opportunityItems.push({ stars: 3, text: `Fortalecer tu fondo de emergencia`, reason: `Te faltan ~${money(Math.round(fondoNecesario - bal))} para 3 meses de gastos fijos.` });
  }

  // Coach recibe el análisis completo como DATO FIJO — no puede contradecirlo.
  // Su rol es explicar, ampliar y responder preguntas sobre el veredicto.
  const itemText = itemName ? `"${itemName}"` : "un artículo";
  const purchaseAnalysisForCoach = amount > 0 ? {
    item: itemText,
    amount,
    verdict,
    verdictLabel,
    reason,
    score,
    dimensions: {
      liquidez: { score: liqS, msg: liqMsg },
      deudas:   { score: debtS, msg: debtMsg },
      metas:    { score: goalsS, msg: goalsMsg },
      bienestar:{ score: wellS, msg: wellMsg },
    },
  } : null;

  const coachPrompt = amount > 0
    ? `Resultado del motor de decisión (VEREDICTO OFICIAL — no recalcules ni contradigas):

${JSON.stringify(purchaseAnalysisForCoach, null, 0)}

Explícame por qué el motor llegó a este veredicto y qué alternativas tengo.`
    : "";

  return {
    verdict, score, stars, verdictLabel, reason, summary, coachPrompt,
    purchaseAnalysis: purchaseAnalysisForCoach,
    dimensions: {
      liquidez:    { score: liqS,   label: liqLabel,   msg: liqMsg   },
      deudas:      { score: debtS,  label: debtLabel,  msg: debtMsg  },
      metas:       { score: goalsS, label: goalsLabel, msg: goalsMsg },
      habitos:     { score: habitsS,label: habitsLabel,msg: habitsMsg},
      bienestar:   { score: wellS,  label: wellLabel,  msg: wellMsg  },
      oportunidad: { items: opportunityItems },
    },
    actions: {
      canBuy:           bal >= amount && amount > 0,
      registerPurchase: bal >= amount && amount > 0,
      saveWishlist:     amount > 0,
    },
    meta: { amount, itemName, balAfter, dispRestante: dispRest, afterPurch },
  };
}

function renderDecisionCard(analysis) {
  const { verdict, score, stars, verdictLabel, reason, summary, dimensions, actions, meta } = analysis;

  const verdictColor = verdict === "green"
    ? "var(--success-text)" : verdict === "yellow"
    ? "var(--warning-text)" : "var(--danger-text)";
  const verdictBg = verdict === "green"
    ? "var(--success-bg)" : verdict === "yellow"
    ? "var(--warning-bg)" : "var(--danger-bg)";

  // P14: veredicto primero, luego score, luego dimensiones
  const starsHtml = stars > 0
    ? Array.from({length:5}, (_,i) =>
        `<span style="color:${i < stars ? 'var(--gold)' : 'var(--border)'}; font-size:20px;">★</span>`
      ).join("")
    : "";

  // P3: cada dimensión muestra score + label + mensaje
  const dims = [
    { label: "💧 Liquidez",  d: dimensions.liquidez  },
    { label: "💳 Deudas",    d: dimensions.deudas    },
    { label: "🎯 Metas",     d: dimensions.metas     },
    { label: "🧠 Hábitos",   d: dimensions.habitos   },
    { label: "💚 Bienestar", d: dimensions.bienestar },
  ];
  const dimHtml = dims.map(({ label, d }) => {
    const sColor = d.score >= 70 ? "var(--success-text)" : d.score >= 40 ? "var(--warning-text)" : "var(--danger-text)";
    return `
    <div style="padding:10px 0; border-bottom:0.5px solid var(--border);">
      <div class="row-between" style="margin-bottom:2px;">
        <span style="font-size:12px; font-weight:500;">${label}</span>
        <span style="font-size:11px; color:${sColor}; font-weight:500;">${d.score}/100 — ${d.label}</span>
      </div>
      <p style="font-size:11px; color:var(--text-muted); margin:0; line-height:1.5;">${d.msg}</p>
    </div>`;
  }).join("");

  // P6: oportunidades ordenadas por impacto con estrellas
  const oppHtml = dimensions.oportunidad.items.length > 0
    ? `<div style="padding:10px 0;">
         <p style="font-size:12px; font-weight:500; margin:0 0 8px;">💡 Con ${money(meta.amount)} también podrías:</p>
         ${dimensions.oportunidad.items.map(o => {
           const oStars = Array.from({length:5},(_,i) => `<span style="color:${i < o.stars ? 'var(--gold)' : 'var(--border)'}; font-size:12px;">★</span>`).join("");
           return `<div style="margin-bottom:8px;">
             <div style="display:flex; align-items:center; gap:6px; margin-bottom:2px;">
               <span>${oStars}</span>
               <span style="font-size:12px; font-weight:500;">${o.text}</span>
             </div>
             <p style="font-size:11px; color:var(--text-muted); margin:0 0 0 4px;">${o.reason}</p>
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `
    <div class="card" style="background:${verdictBg}; margin-bottom:10px; text-align:center;">
      ${starsHtml ? `<div style="margin-bottom:6px;">${starsHtml}</div>` : ""}
      <p style="font-size:16px; font-weight:600; color:${verdictColor}; margin:0 0 10px;">${verdictLabel}</p>
      <p style="font-size:13px; color:${verdictColor}; margin:0 0 12px; opacity:0.9; line-height:1.6;">${reason}</p>
      ${verdict !== "red" ? `
      <div style="display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,0.4); border-radius:20px; padding:4px 12px;">
        <span style="font-size:13px; font-weight:600; color:${verdictColor};">Score ${score}/100</span>
        <span style="font-size:11px; color:${verdictColor}; opacity:0.8;">· Confianza ${score >= 70 ? "Alta" : score >= 45 ? "Media" : "Baja"}</span>
      </div>
      ` : ""}
    </div>

    <div class="card" style="margin-bottom:10px; padding:0 12px;">
      ${dimHtml}
      ${oppHtml}
    </div>

    <div style="display:flex; gap:8px; margin-bottom:8px;">
      <button id="askCoachBtn" class="btn-secondary" style="flex:1;">💬 ¿Por qué?</button>
      ${actions.registerPurchase
        ? `<button id="simBuyBtn" class="btn-primary" style="flex:1;">✓ Lo compré</button>`
        : ""}
    </div>
    ${actions.saveWishlist
      ? `<button id="simSaveBtn" class="btn-secondary" style="width:100%; font-size:12px;">🔖 Guardar para después</button>`
      : ""}
  `;
}

// WIRE — conecta el motor con la UI

function wireSimulador() {
  const slider      = document.getElementById("simSlider");
  const amountInput = document.getElementById("simAmountInput");
  const resultEl    = document.getElementById("decisionResult");
  if (!slider || !resultEl) return;

  function update(val) {
    val = Math.max(0, Number(val) || 0);
    slider.value = Math.min(val, Number(slider.max));
    amountInput.value = val || "";

    const itemName = document.getElementById("simItemName")?.value.trim() || "";
    const analysis = buildPurchaseAnalysis(val, itemName);
    if (val > 0) lastPurchaseAnalysis = analysis;
    resultEl.innerHTML = val > 0 ? renderDecisionCard(analysis) : "";

    if (val > 0) wireDecisionActions(analysis);
  }

  slider.addEventListener("input", () => update(slider.value));
  amountInput.addEventListener("input", () => update(amountInput.value));
  document.getElementById("simItemName")?.addEventListener("input", () => {
    const val = Number(amountInput.value) || 0;
    if (val > 0) update(val);
  });
  update(0);
}

function wireDecisionActions(analysis) {
  // "¿Por qué?" → abre el coach con el análisis precargado
  const askBtn = document.getElementById("askCoachBtn");
  if (askBtn) askBtn.addEventListener("click", () => {
    if (!analysis.coachPrompt) return;
    tab = "coach";
    renderApp();
    const input = document.getElementById("coachInput");
    if (input) {
      input.value = analysis.coachPrompt;
      input.focus();
    }
  });

  // "Lo compré" → registra como gasto real reutilizando el flujo existente
  const buyBtn = document.getElementById("simBuyBtn");
  if (buyBtn) buyBtn.addEventListener("click", () => {
    openLogModal(analysis.meta.amount, analysis.meta.itemName);
  });

  // "Guardar para después" → guarda en purchase_decisions
  const saveBtn = document.getElementById("simSaveBtn");
  if (saveBtn) saveBtn.addEventListener("click", async () => {
    saveBtn.disabled = true;
    saveBtn.textContent = "Guardando…";
    const { error } = await supabase.from("purchase_decisions").insert({
      user_id: user.id,
      item_name: analysis.meta.itemName || null,
      amount: analysis.meta.amount,
      verdict: analysis.verdict,
      score: analysis.score,
      status: "saved",
      analysis_snapshot: analysis,
    });
    if (error) {
      saveBtn.disabled = false;
      saveBtn.textContent = "🔖 Guardar para después";
      showToast("No se pudo guardar. Intenta de nuevo.");
    } else {
      showToast("Guardado en tu lista de deseos");
      saveBtn.textContent = "✓ Guardado";
    }
  });
}

  return [...activas].sort((a, b) => (order[a.priority] ?? 3) - (order[b.priority] ?? 3))[0];

    el.addEventListener("click", () => {

      grid.querySelectorAll(".type-option").forEach(o => o.classList.remove("selected"));
      el.classList.add("selected");
      document.getElementById("ingAmountLabel").textContent =
        selectedFreq === "biweekly" ? "¿Cuánto ganas cada quincena?" : "¿Cuánto ganas al mes?";
      refreshDaysSection(selectedFreq);
    });
  });

  document.getElementById("saveIngresoBtn").addEventListener("click", async () => {
    const displayName = document.getElementById("ingName").value.trim();
    const amount = document.getElementById("ingAmount").value;
    const day1 = document.getElementById("ingDay1")?.value;
    const day2 = document.getElementById("ingDay2")?.value;
    const errEl = document.getElementById("ingErr");
    if (!amount || Number(amount) <= 0) {
      errEl.textContent = "Pon un monto válido.";
      errEl.classList.add("visible");
      return;
    }
    const saveBtn = document.getElementById("saveIngresoBtn");
    saveBtn.disabled = true; saveBtn.textContent = "Guardando…";
    const { error } = await supabase.from("profiles").update({
      display_name: displayName || null,
      declared_monthly_income: Number(amount),
      pay_frequency: selectedFreq,
      pay_day_1: day1 ? Number(day1) : null,
      pay_day_2: (selectedFreq === "biweekly" && day2) ? Number(day2) : null,
    }).eq("id", user.id);
    if (error) {
      errEl.textContent = "No se pudo guardar. Intenta de nuevo.";
      errEl.classList.add("visible");
      saveBtn.disabled = false; saveBtn.textContent = "Guardar";
      return;
    }
    await loadState();
    tab = "mas";
    renderApp();
    showToast("Perfil actualizado");
  });
}

function tplGastos() {
  const quickButtons = `
    <div class="btn-row" style="margin-bottom:14px;">
      <button class="btn-secondary" id="gastosAddExpenseBtn" style="flex:1;">+ Gasto</button>
      <button class="btn-secondary" id="gastosAddIncomeBtn" style="flex:1;">+ Ingreso</button>

    return `<div class="empty-state"><div class="icon-circle">🧾</div><p style="font-size:13px; color:var(--text-muted);">Todavía no registraste ningún movimiento.</p></div>${quickButtons}`;
  }
  const visibles = state.transactions.slice(0, 50);

  return `
    <h1 style="text-align:left; margin-bottom:14px;">Tus gastos</h1>
    ${quickButtons}
    ${visibles.map(t => {
      const isIncome = Number(t.amount) > 0;
      const label = isIncome
        ? (t.note || "Ingreso")
        : (t.categories?.name || t.note || "Sin categoría");

      return `

        <span>${icon} ${esc(label)}

        </span>
        <span style="display:flex; align-items:center; gap:10px;">
          <span style="color:${isIncome ? 'var(--success-text)' : 'inherit'};">${isIncome ? "+" : "-"}${money(Math.abs(t.amount))}</span>
          <span class="actions">
            ${!isIncome ? `<button data-edit-tx="${t.id}">✎</button>` : ""}
            <button data-del-tx="${t.id}">✕</button>
          </span>
        </span>

    ${hayMas ? `<p style="font-size:11px; color:var(--text-muted); text-align:center; margin-top:10px;">Mostrando los 50 más recientes de ${state.transactions.length}. El saldo suma todos.</p>` : ""}
  `;
}

function tplMetas() {
  const activas = state.goals.filter(g => g.status !== "completed");
  const completadas = state.goals.filter(g => g.status === "completed");

  function cardMeta(g, esCompletada = false) {
    const progressPct = Math.min(100, Math.round((Number(g.current_amount) / Number(g.target_amount)) * 100));
    const monthly = goalMonthlyPace(g);
    const priorityLabel = goalPriorityLabel(g.priority);
    const st = goalStatus(g);
    const stLabel = goalStatusLabel(st);
    return `
      <div class="card" style="${esCompletada ? 'opacity:0.75;' : ''}">
        <div class="row-between" style="margin-bottom:6px;">
          <span style="font-weight:500;">${esc(g.name)}</span>
          <div style="display:flex; gap:6px; align-items:center;">
            ${!esCompletada ? `<span class="badge ${g.priority}">${priorityLabel}</span>` : ""}
            <button data-edit-goal="${g.id}" style="background:none; color:var(--text-muted); font-size:12px;">✎</button>
            <button data-del-goal="${g.id}" style="background:none; color:var(--text-muted); font-size:12px;">✕</button>
          </div>
        </div>
        <div style="display:inline-block; font-size:10px; border-radius:10px; padding:2px 8px; margin-bottom:8px; background:${stLabel.bg}; color:${stLabel.color};">${stLabel.text}</div>
        <p style="font-size:11px; color:var(--text-muted); margin:0 0 6px;">${money(g.current_amount)} de ${money(g.target_amount)}${!esCompletada && goalMonthsLeft(g) > 0 ? " · Faltan " + goalMonthsLeft(g) + " meses" : ""}</p>
        <div class="progress-bar"><div class="progress-fill" style="width:${progressPct}%; background:${esCompletada ? 'var(--success-text)' : 'var(--gold)'};"></div></div>
        ${esCompletada
          ? `<div style="margin-top:8px;">
               <p style="font-size:11px; color:var(--success-text); margin:0 0 4px;">Meta cumplida 🎉</p>
               ${goalMonthsEarly(g) > 0
                 ? `<span style="font-size:10px; background:var(--success-bg); color:var(--success-text); border-radius:10px; padding:2px 8px;">🚀 ${goalMonthsEarly(g)} mes${goalMonthsEarly(g) > 1 ? "es" : ""} antes de lo previsto</span>`
                 : ""
               }
             </div>`
          : `<div class="row-between" style="margin-top:10px;">
               <span style="font-size:11px; color:var(--text-muted);">Aporte mensual: ${money(monthly)}</span>
               <button data-contribute="${g.id}" class="btn-secondary" style="padding:6px 12px; font-size:12px;">+ Aportar</button>
             </div>`
        }
      </div>
    `;
  }

  return `
    <h1 style="text-align:left; margin-bottom:14px;">Tus metas</h1>
    ${activas.length === 0 && completadas.length === 0
      ? `<div class="empty-state"><div class="icon-circle">🎯</div><p style="font-size:13px; color:var(--text-muted);">Todavía no creaste ninguna meta.</p></div>`
      : activas.length === 0
        ? `<div class="card" style="background:var(--success-bg); text-align:center; padding:16px; margin-bottom:14px;">
             <p style="font-size:22px; margin:0 0 4px;">🎉</p>
             <p style="font-size:13px; font-weight:600; color:var(--success-text); margin:0;">¡Cumpliste todas tus metas activas!</p>
           </div>`
        : activas.map(g => cardMeta(g, false)).join("")
    }
    ${completadas.length > 0 ? `
      <p style="font-size:11px; font-weight:600; color:var(--text-muted); margin:16px 0 8px; text-transform:uppercase; letter-spacing:0.5px;">Completadas</p>
      ${completadas.map(g => cardMeta(g, true)).join("")}
    ` : ""}
    <button class="btn-secondary" id="openNewGoalBtn" style="width:100%; margin-top:14px;">+ Nueva meta</button>
  `;
}

function tplDeudas() {
  if (state.debts.length === 0) {
    return `<div class="empty-state"><div class="icon-circle">📄</div><p style="font-size:13px; color:var(--text-muted);">No tienes deudas registradas.</p></div>
      ${debtAddForm()}`;
  }
  return `
    <h1 style="text-align:left; margin-bottom:14px;">Tus deudas</h1>
    ${state.debts.map(d => {
      const paid = Number(d.original_amount) - Number(d.current_balance);
      const pct = d.original_amount > 0 ? Math.round((paid / Number(d.original_amount)) * 100) : 0;
      const isPaidOff = Number(d.current_balance) <= 0;
      const typeInfo = DEBT_TYPES.find(t => t.value === d.debt_type);
      return `
      <div class="card">
        <div class="row-between" style="margin-bottom:6px;">
          <span style="font-weight:500;">${typeInfo ? typeInfo.icon : "📄"} ${esc(d.name)}</span>
          <div style="display:flex; gap:6px;">
            <button data-edit-debt="${d.id}" style="background:none; color:var(--text-muted); font-size:12px;">✎</button>
            <button data-del-debt="${d.id}" style="background:none; color:var(--text-muted); font-size:12px;">✕</button>
          </div>
        </div>
        <p style="font-size:11px; color:var(--text-muted); margin:0 0 6px;">
          ${typeInfo ? typeInfo.label : "Otro"}${d.interest_rate ? ` · ${d.interest_rate}% anual` : ""}
        </p>
        ${isPaidOff
          ? `<p style="font-size:13px; font-weight:600; color:var(--success-text); margin:0 0 4px;">✓ Deuda pagada</p>`
          : `<p style="font-size:15px; font-weight:600; color:var(--teal); margin:0 0 4px;">Debes ${money(d.current_balance)}</p>`
        }
        <p style="font-size:11px; color:var(--text-muted); margin:0 0 6px;">Pagaste ${money(paid)} de ${money(d.original_amount)}</p>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;"></div></div>
        ${!isPaidOff ? `
          <div class="row-between" style="margin-top:8px;">
            ${d.minimum_payment ? `<span style="font-size:11px; color:var(--text-muted);">Cuota sugerida: ${money(d.minimum_payment)}</span>` : `<span></span>`}
            <button data-pay-debt="${d.id}" class="btn-secondary" style="padding:6px 12px; font-size:12px;">Registrar pago</button>
          </div>
        ` : ""}
      </div>
    `;
    }).join("")}
    ${debtAddForm()}
  `;
}

      <input id="newDInterest" type="number" step="1" min="0" placeholder="Ej. 45" style="margin-bottom:8px;" />
      <label>¿En cuántas cuotas planeas pagarla? <span style="color:var(--text-muted);">(opcional)</span></label>
