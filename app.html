async function loadState() {
  const now = new Date();
  const monthStart = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2,"0")}-01`;
  const historyStart = `${now.getFullYear() - 1}-${String(now.getMonth() + 1).padStart(2,"0")}-01`;

  const essentialQueries = [
    supabase.from("accounts").select("*").order("created_at"),
    supabase.from("profiles").select("*").eq("id", user.id).maybeSingle ? supabase.from("profiles").select("*").eq("id", user.id).maybeSingle() : supabase.from("profiles").select("*").eq("id", user.id).single(),
    supabase.from("goals").select("*").order("created_at"),
    supabase.from("recurring_expense_templates").select("*, categories(name)").eq("active", true).order("created_at"),
    supabase.from("debts").select("*").order("created_at"),
    supabase.from("transactions").select("*, categories(name)").order("occurred_at", { ascending: false }).limit(300),
    supabase.from("transactions").select("*, categories(name)").gte("occurred_at", monthStart).order("occurred_at", { ascending: false }),
    supabase.from("budgets").select("*, categories(name)").order("effective_from", { ascending: false }),
  ];
  const essential = await Promise.all(essentialQueries);
  const essentialError = essential.find(r => r?.error)?.error;
  if (essentialError) throw essentialError;

  const optionalSpecs = [
    ["goalContributions", supabase.from("goal_contributions").select("id, goal_id, transaction_id, amount, amount_after, created_at").gte("created_at", historyStart)],
    ["debtPayments", supabase.from("debt_payments").select("id, debt_id, transaction_id, reversal_transaction_id, amount, balance_before, balance_after, principal_component, interest_component, fee_component, payment_number, paid_at, paid_on, status, voided_at, installments_completed, payment_action, allocation_method, breakdown_confirmed, note, corrects_payment_id, corrected_by_payment_id").gte("paid_on", historyStart)],
    ["fixedPayments", supabase.from("fixed_expense_payments").select("*").gte("period_key", historyStart)],
    ["purchaseDecisions", supabase.from("purchase_decisions").select("*").order("created_at", { ascending: false }).limit(100)],
    ["reconciliations", supabase.from("account_reconciliations").select("*").order("created_at", { ascending: false }).limit(20)],
  ];
  const optionalResults = await Promise.all(optionalSpecs.map(async ([key, query]) => {
    try { const result = await query; return { key, ...result }; }
    catch (error) { return { key, data: [], error }; }
  }));
  const optional = Object.fromEntries(optionalResults.map(r => [r.key, r.error ? [] : (r.data || [])]));
  const optionalErrors = optionalResults.filter(r => r.error).map(r => ({ key: r.key, message: r.error?.message || String(r.error) }));

  const [accountsResult, profileResult, goalsResult, fixedResult, debtsResult, transactionsResult, monthTransactionsResult, budgetsResult] = essential;
  const accounts = accountsResult.data || [];
  state = {
    account: accounts[0] || null,
    accounts,
    profile: profileResult.data || null,
    goals: goalsResult.data || [],
    fixed: fixedResult.data || [],
    debts: debtsResult.data || [],
    transactions: transactionsResult.data || [],
    analysisTransactions: monthTransactionsResult.data || [],
    budgets: budgetsResult.data || [],
    goalContributions: optional.goalContributions,
    debtPayments: optional.debtPayments,
    fixedPayments: optional.fixedPayments,
    purchaseDecisions: optional.purchaseDecisions,
    reconciliations: optional.reconciliations,
    optionalErrors,
  };
  computeAnalysis();
}

// Ritmo REAL necesario para cumplir la meta: usa lo que falta ahorrar
// y los meses que quedan de verdad (no el plan original completo),
// para no subestimar ni sobreestimar el riesgo si el usuario va
// adelantado o atrasado respecto a su plan inicial.
function goalMonthlyPace(g, asOf = state.analysis?.generatedAt || new Date()) {
  if (!g || !g.target_months) return 0;
  const started = dateOnly(g.plan_started_at || g.created_at) || new Date(asOf);
  const now = dateOnly(asOf) || new Date();
  const elapsedMonths = (now.getFullYear() - started.getFullYear()) * 12 + (now.getMonth() - started.getMonth());
  const remainingMonths = Math.max(1, Number(g.target_months) - elapsedMonths);
  const remainingAmount = Math.max(0, Number(g.target_amount) - Number(g.current_amount));
  return remainingAmount / remainingMonths;
}

// Suma el ritmo mensual necesario de TODAS las metas activas — porque
// todas compiten por el mismo disponible, no alcanza con mirar una sola.
// P2: Cálculo correcto de cuota con interés (fórmula PMT estándar).
// PMT = P × i × (1+i)^n / ((1+i)^n − 1)
// Sin tasa de interés, degrada a simple división.
function calcPMT(principal, annualRatePct, periods) {
  if (!annualRatePct || annualRatePct <= 0 || !periods) return principal / periods;
  const i = annualRatePct / 100 / 12;
  return principal * i * Math.pow(1 + i, periods) / (Math.pow(1 + i, periods) - 1);
}

const DEBT_PLAN_TYPES = [
  { value: "amortized", label: "Préstamo con cuotas sobre saldo" },
  { value: "flat_total", label: "Interés total por todo el acuerdo" },
  { value: "flat_periodic", label: "Interés fijo por cada período" },
  { value: "credit_card", label: "Tarjeta o línea de crédito" },
  { value: "no_interest", label: "Deuda sin intereses" },
  { value: "legacy", label: "Estimación con información parcial" },
];

const PAYMENT_FREQUENCIES = [
  { value: "monthly", label: "Mensual" },
  { value: "biweekly", label: "Quincenal" },
  { value: "weekly", label: "Semanal" },
];

function paymentPeriodsPerYear(frequency) {
  if (frequency === "weekly") return 52;
  if (frequency === "biweekly") return 24;
  return 12;
}

function paymentPeriodsPerMonth(frequency) {
  if (frequency === "weekly") return 52 / 12;
  if (frequency === "biweekly") return 2;
  return 1;
}

function monthlyPaymentEquivalent(amount, frequency = "monthly") {
  return Math.round((Number(amount) || 0) * paymentPeriodsPerMonth(frequency));
}

function periodicInterestRate(ratePct, rateType = "annual", paymentFrequency = "monthly") {
  const rate = Math.max(0, Number(ratePct) || 0) / 100;
  if (rateType === "per_period") return rate;
  if (rateType === "monthly") return rate / paymentPeriodsPerMonth(paymentFrequency);
  if (rateType === "annual") return rate / paymentPeriodsPerYear(paymentFrequency);
  return 0;
}

function debtRateLabel(debt) {
  if (debt?.plan_type === "no_interest") return "Sin intereses";
  if (debt?.setup_state === "incomplete" || debt?.interest_rate == null) return "Interés por confirmar";
  const rate = Number(debt?.interest_rate) || 0;
  if (!rate) return "0% confirmado";
  const type = debt?.interest_rate_type || "annual";
  if (type === "total_term") return `${rate}% total del acuerdo`;
  if (type === "monthly") return `${rate}% mensual`;
  if (type === "per_period") {
    const f = PAYMENT_FREQUENCIES.find(x => x.value === debt?.payment_frequency)?.label?.toLowerCase() || "por período";
    return `${rate}% ${f}`;
  }
  return `${rate}% anual`;
}

function debtPlanLabel(planType, debt = null) {
  if (debt?.setup_state === "incomplete") return "Información pendiente de confirmar";
  if (debt?.information_source === "scheduled_payment") return "Estimación basada en la cuota";
  if (debt?.information_source === "total_payable") return "Estimación basada en el total acordado";
  return DEBT_PLAN_TYPES.find(x => x.value === planType)?.label || "Registro básico";
}

function annualizedDebtRate(debt) {
  const rate = Math.max(0, Number(debt?.interest_rate) || 0);
  const type = debt?.interest_rate_type || "annual";
  const frequency = debt?.payment_frequency || "monthly";
  if (!rate || debt?.plan_type === "no_interest") return 0;
  if (type === "monthly") return rate * 12;
  if (type === "per_period") return rate * paymentPeriodsPerYear(frequency);
  if (type === "total_term") {
    const term = Math.max(1, Number(debt?.term_count || debt?.remaining_installments) || 1);
    return rate * paymentPeriodsPerYear(frequency) / term;
  }
  return rate;
}

function simulateAmortizedPayoff(principal, periodicRate, payment, maxPeriods = 1200) {
  let balance = Math.max(0, Number(principal) || 0);
  const rate = Math.max(0, Number(periodicRate) || 0);
  const installment = Math.max(0, Number(payment) || 0);
  if (balance <= 0 || installment <= 0) return { paysOff: balance <= 0, periods: 0, totalPaid: 0, totalInterest: 0 };
  if (rate > 0 && installment <= balance * rate) {
    return { paysOff: false, periods: null, totalPaid: null, totalInterest: null };
  }

  let periods = 0;
  let totalPaid = 0;
  let totalInterest = 0;
  while (balance > 0.005 && periods < maxPeriods) {
    const interest = balance * rate;
    const due = balance + interest;
    const paid = Math.min(installment, due);
    balance = Math.max(0, due - paid);
    totalPaid += paid;
    totalInterest += interest;
    periods += 1;
  }
  return {
    paysOff: balance <= 0.005,
    periods: balance <= 0.005 ? periods : null,
    totalPaid: balance <= 0.005 ? Math.round(totalPaid * 100) / 100 : null,
    totalInterest: balance <= 0.005 ? Math.round(totalInterest * 100) / 100 : null,
  };
}

function calculateDebtPlan({
  planType = "amortized",
  originalAmount = 0,
  interestRate = 0,
  interestRateType = "annual",
  paymentFrequency = "monthly",
  termCount = 0,
  scheduledPayment = 0,
} = {}) {
  const principal = Math.max(0, Number(originalAmount) || 0);
  const rate = Math.max(0, Number(interestRate) || 0);
  const term = Math.max(0, Math.trunc(Number(termCount) || 0));
  const manualPayment = Math.max(0, Number(scheduledPayment) || 0);

  let periodicRate = 0;
  let estimatedInterest = 0;
  let totalPayable = principal;
  let payment = manualPayment;
  let variableTotal = false;
  let payoffPeriods = term || null;

  if (planType === "credit_card") {
    periodicRate = periodicInterestRate(rate, interestRateType, "monthly");
    estimatedInterest = principal * periodicRate;
    totalPayable = null;
    variableTotal = true;
  } else if (planType === "flat_total") {
    estimatedInterest = principal * (rate / 100);
    totalPayable = principal + estimatedInterest;
    if (!payment && term > 0) payment = totalPayable / term;
  } else if (planType === "flat_periodic") {
    periodicRate = rate / 100;
    estimatedInterest = term > 0 ? principal * periodicRate * term : 0;
    totalPayable = principal + estimatedInterest;
    if (!payment && term > 0) payment = totalPayable / term;
  } else if (planType === "amortized") {
    periodicRate = periodicInterestRate(rate, interestRateType, paymentFrequency);
    if (!payment && term > 0) {
      payment = periodicRate > 0
        ? principal * periodicRate * Math.pow(1 + periodicRate, term) / (Math.pow(1 + periodicRate, term) - 1)
        : principal / term;
    }
    if (payment > 0) {
      const payoff = simulateAmortizedPayoff(principal, periodicRate, payment);
      if (payoff.paysOff) {
        totalPayable = payoff.totalPaid;
        estimatedInterest = payoff.totalInterest;
        payoffPeriods = payoff.periods;
      } else {
        totalPayable = null;
        estimatedInterest = principal * periodicRate;
        payoffPeriods = null;
        variableTotal = true;
      }
    }
  } else if (planType === "no_interest") {
    if (!payment && term > 0) payment = principal / term;
    totalPayable = principal;
    estimatedInterest = 0;
  } else {
    totalPayable = principal;
    estimatedInterest = 0;
  }

  return {
    principal: Math.round(principal * 100) / 100,
    periodicRate,
    scheduledPayment: Math.round(payment * 100) / 100,
    monthlyEquivalent: monthlyPaymentEquivalent(payment, paymentFrequency),
    totalPayable: totalPayable == null ? null : Math.round(totalPayable * 100) / 100,
    estimatedInterest: Math.round(estimatedInterest * 100) / 100,
    payoffPeriods,
    variableTotal,
  };
}

function estimateDebtPaymentBreakdown(debt, amount, manualInterest = null, feeAmount = 0) {
  const payment = Math.max(0, Number(amount) || 0);
  const fee = Math.max(0, Number(feeAmount) || 0);
  const available = Math.max(0, payment - fee);
  const planType = debt?.plan_type || "legacy";
  const principal = Math.max(0, Number(debt?.principal_outstanding ?? debt?.current_balance) || 0);
  const existingInterest = Math.max(0, Number(debt?.interest_outstanding) || 0);
  const currentBalance = Math.max(0, Number(debt?.current_balance) || (principal + existingInterest));

  let interestCharge = 0;
  let interestComponent = 0;

  if (manualInterest != null && Number.isFinite(Number(manualInterest))) {
    const requestedInterest = Math.max(0, Number(manualInterest));
    if (["flat_total", "flat_periodic"].includes(planType)) {
      interestComponent = Math.min(available, requestedInterest, existingInterest);
    } else if (planType === "no_interest") {
      interestComponent = 0;
    } else {
      interestComponent = Math.min(available, requestedInterest);
      if (planType === "amortized") {
        interestCharge = Math.max(0, interestComponent - existingInterest);
      }
    }
  } else if (planType === "amortized") {
    interestCharge = principal * periodicInterestRate(
      debt?.interest_rate,
      debt?.interest_rate_type || "annual",
      debt?.payment_frequency || "monthly"
    );
    interestComponent = Math.min(available, existingInterest + interestCharge);
  } else if (["flat_total", "flat_periodic"].includes(planType) && currentBalance > 0) {
    interestComponent = Math.min(existingInterest, available * (existingInterest / currentBalance));
  } else if (existingInterest > 0) {
    interestComponent = Math.min(existingInterest, available);
  }

  let principalComponent = Math.max(0, available - interestComponent);
  if (!["credit_card", "legacy"].includes(planType)) {
    principalComponent = Math.min(principal, principalComponent);
  }

  let newPrincipal;
  let newInterest;
  let newBalance;

  if (["credit_card", "legacy"].includes(planType)) {
    newBalance = Math.max(0, currentBalance - available);
    newPrincipal = newBalance;
    newInterest = 0;
  } else {
    newPrincipal = Math.max(0, principal - principalComponent);
    newInterest = Math.max(0, existingInterest + interestCharge - interestComponent);
    newBalance = newPrincipal + newInterest;
  }

  return {
    payment,
    fee: Math.round(fee * 100) / 100,
    interestCharge: Math.round(interestCharge * 100) / 100,
    interestComponent: Math.round(interestComponent * 100) / 100,
    principalComponent: Math.round(principalComponent * 100) / 100,
    newPrincipal: Math.round(newPrincipal * 100) / 100,
    newInterest: Math.round(newInterest * 100) / 100,
    newBalance: Math.round(newBalance * 100) / 100,
  };
}

function goalPriorityLabel(priority) {
  const normalized = normalizeGoalPriority(priority);
  if (normalized === "critical") return "🔴 Alta";
  if (normalized === "important") return "🟡 Media";
  return "🔵 Baja";
}

function goalMonthsLeft(g, asOf = state.analysis?.generatedAt || new Date()) {
  const started = dateOnly(g?.plan_started_at || g?.created_at) || dateOnly(asOf) || new Date();
  const now = dateOnly(asOf) || new Date();
  const elapsed = (now.getFullYear() - started.getFullYear()) * 12 + (now.getMonth() - started.getMonth());
  return Math.max(1, Number(g?.target_months || 1) - elapsed);
}

// Calcula cuántos meses antes del plazo se completó la meta.
// Si es positivo, se logró antes de tiempo. Si es 0 o negativo, a tiempo o tarde.
function goalMonthsEarly(g) {
  const startedAt = g?.plan_started_at || g?.created_at;
  if (!g || !g.completed_at || !startedAt || !g.target_months) return 0;
  const started = new Date(startedAt);
  const completed = new Date(g.completed_at);
  const monthsUsed = (completed.getFullYear() - started.getFullYear()) * 12 + (completed.getMonth() - started.getMonth());
  return Math.max(0, g.target_months - monthsUsed);
}

// P6: deriva el estado visible de una meta. 'completed' si ya llegó;
// 'at_risk' si el ritmo requerido supera holgadamente lo disponible.
function goalStatus(g) {
  if (!g) return "active";
  if (g.status === "completed" || Number(g.current_amount) >= Number(g.target_amount)) return "completed";
  if (g.status === "paused" || g.status === "abandoned") return g.status;

  const analyzed = state.analysis?.goals?.byGoal?.find(item => item.id === g.id);
  return analyzed?.derivedStatus || "active";
}

function goalStatusLabel(status) {
  return status === "completed" ? { text: "✓ Cumplida", color: "var(--success-text)", bg: "var(--success-bg)" }
    : status === "at_risk" ? { text: "⚠ En riesgo", color: "var(--warning-text)", bg: "var(--warning-bg)" }
    : status === "paused" ? { text: "Pausada", color: "var(--text-secondary)", bg: "var(--card)" }
    : status === "abandoned" ? { text: "Abandonada", color: "var(--text-muted)", bg: "var(--card)" }
    : { text: "En curso", color: "var(--teal)", bg: "var(--teal-light)" };
}

function isGoalActive(g) {
  if (!g) return false;
  const status = g.status || "active";
  const pending = Number(g.current_amount) < Number(g.target_amount);
  return pending && (status === "active" || status === "at_risk");
}

function isDebtActive(d) {
  if (!d) return false;
  return d.status !== "completed" && Number(d.current_balance) > 0;
}

// Crea una fecha de cobro válida incluso en meses cortos.
// Ejemplo: si el usuario cobra el día 30, febrero usa su último día real.
function dateForMonthDay(year, monthIndex, day) {
  const lastDay = new Date(year, monthIndex + 1, 0, 12).getDate();
  const requestedDay = Math.max(1, Number(day) || 1);
  return new Date(year, monthIndex, Math.min(requestedDay, lastDay), 12, 0, 0, 0);
}

// Calcula días hasta el próximo cobro y la fecha estimada
// basándose en pay_day_1, pay_day_2 y pay_frequency del perfil.
function totalFixed() {
  return state.fixed.reduce((s, f) => s + Number(f.estimated_amount), 0);
}
function monthlyIncome() {
  const profile = state.profile;
  if (!profile || profile.declared_monthly_income == null) return 0;
  const base = Math.max(0, Number(profile.declared_monthly_income) || 0);
  if (profile.pay_frequency === "biweekly") {
    const first = Math.max(0, Number(profile.paycheck_amount_1) || base);
    const second = Math.max(0, Number(profile.paycheck_amount_2) || base);
    return Math.round(first + second);
  }
  if (profile.pay_frequency === "weekly") return Math.round(base * 52 / 12);
  return Math.round(base);
}
function disponible() {
  return monthlyIncome() - totalFixed();
}
function balance() {
  const accounts = state.accounts?.length ? state.accounts : (state.account ? [state.account] : []);
  return accounts.reduce((sum, account) => sum + Number(account.computed_balance ?? account.initial_balance ?? 0), 0);
}

// Motor de Baseline Score: combina capacidad de ahorro, colchón de
// liquidez, y nivel de endeudamiento relativo al ingreso. 0-100.
// El Behavior Score se queda en "Aprendiendo" hasta que exista el
// campo de intención por transacción (fuera de Fase 1, ver ADR-005).
// ================================================================
// ================================================================
// FINANCIAL CORE — FASE 1 (v2)
// Arquitectura en 5 capas con responsabilidades separadas.
//
// REGLAS DE ORO (ningún código nuevo puede violarlas):
//   1. Ninguna pantalla lee state.* para cálculos — solo state.analysis.
//      Excepción: formularios de creación/edición (CRUD).
//   2. El engine es puro — nunca modifica state. Solo recibe y retorna.
//   3. Ningún código nuevo llama funciones @legacy directamente.
//      Las @legacy son wrappers de compatibilidad durante la migración.
//
// CAPAS:
//   FinancialData      → normalización de datos crudos
//   FinancialCore    → describe la realidad financiera (puro)
//   RecommendationEngine → prioridades, estrategia, next best action
//   PurchaseEngine     → análisis de compras (Fase 3)
//   CoachContextBuilder → contexto para la IA (Fase 5)
//   DashboardPresenter → modelo para la UI (Fase 4)
//
// SCHEMA VERSION: 2
// Incrementar cuando cambie la estructura de FinancialAnalysis
// para que módulos que consumen el análisis puedan verificar.
// ================================================================
const FA_SCHEMA_VERSION = 3;

// ---------------------------------------------------------------
// @legacy — WRAPPERS DE COMPATIBILIDAD TEMPORAL
// Estas funciones existían antes del engine y siguen funcionando
// para no romper el código de las pantallas mientras se migran.
// NINGÚN CÓDIGO NUEVO debe llamarlas directamente.
// Cuando todos los módulos lean state.analysis, se eliminarán.
// ---------------------------------------------------------------
// Las funciones balance(), disponible(), monthlyIncome(), etc.
// siguen declaradas más arriba en el archivo y son llamadas DESDE
// el engine. Su uso directo en la UI está marcado como deprecated.

// ---------------------------------------------------------------
// CAPA 1 — FinancialData
// Única responsabilidad: normalizar datos crudos de state.
// El engine NUNCA lee state directamente — solo FinancialData.
// Resuelve frecuencias, calcula próximo cobro, normaliza montos.
// ---------------------------------------------------------------
function buildFinancialData(asOf = new Date()) {
  const raw = {
    account: state.account ?? null,
    accounts: allAccounts(),
    profile: state.profile ?? null,
    transactions: state.analysisTransactions?.length ? state.analysisTransactions : (state.transactions ?? []),
    goals: state.goals ?? [], fixed: state.fixed ?? [], debts: state.debts ?? [], budgets: state.budgets ?? [],
    goalContributions: state.goalContributions ?? [], debtPayments: state.debtPayments ?? [], fixedPayments: state.fixedPayments ?? [], categories: categories ?? [],
  };
  if (!raw.profile || raw.accounts.length === 0) return { raw, normalized: null };

  const today = dateOnly(asOf) || new Date();
  const y = today.getFullYear(), m = today.getMonth();
  const profile = raw.profile;
  const freq = profile.pay_frequency ?? "monthly";
  const incomeMode = profile.income_mode || (freq === "irregular" ? "variable" : "fixed");

  const txMonth = raw.transactions.filter(tx => {
    const d = transactionEconomicDate(tx);
    return d && d <= today && d.getFullYear() === y && d.getMonth() === m;
  });
  const countableExpense = tx => isCountableExpense(tx, raw.fixedPayments);
  const variableTransactions = txMonth.filter(tx => countableExpense(tx) && !isFixedPaymentTransaction(tx));
  const fixedTransactions = txMonth.filter(tx => countableExpense(tx) && isFixedPaymentTransaction(tx));
  const ordinaryIncomeTransactions = txMonth.filter(isOrdinaryIncome);
  const variableSpent = variableTransactions.reduce((sum, tx) => sum + Math.abs(Number(tx.amount) || 0), 0);
  const fixedPaid = fixedTransactions.reduce((sum, tx) => sum + Math.abs(Number(tx.amount) || 0), 0);
  const ordinaryIncomeReceived = ordinaryIncomeTransactions.reduce((sum, tx) => sum + Math.abs(Number(tx.amount) || 0), 0);

  const storedIncome = Math.max(0, Number(profile.declared_monthly_income) || 0);
  const paycheck1 = Math.max(0, Number(profile.paycheck_amount_1) || storedIncome);
  const paycheck2 = Math.max(0, Number(profile.paycheck_amount_2) || storedIncome);
  let declaredMonthlyIncome = storedIncome;
  let perPaycheck = storedIncome;
  if (freq === "biweekly") {
    declaredMonthlyIncome = paycheck1 + paycheck2;
    perPaycheck = paycheck1;
  } else if (freq === "weekly") {
    declaredMonthlyIncome = Math.round(storedIncome * 52 / 12);
    perPaycheck = storedIncome;
  }
  // Para ingresos variables, el plan seguro usa lo realmente recibido. La cifra
  // declarada se conserva como estimación y nunca se presenta como disponible.
  const monthlyInc = incomeMode === "variable" || freq === "irregular"
    ? Math.round(ordinaryIncomeReceived)
    : Math.round(declaredMonthlyIncome);
  // La estimación siempre usa la equivalencia mensual de la frecuencia.
  // El dinero realmente utilizable en modo variable sigue siendo solo lo recibido.
  const incomeEstimate = Math.round(declaredMonthlyIncome);
  const dailyInc = Math.round(monthlyInc / 30);
  const annualInc = monthlyInc * 12;

  let nextPayDate = null, nextPayDateISO = null, daysUntilPay = null, nextPayAmount = null;
  if (freq === "weekly" && profile.pay_weekday != null) {
    const weekday = Math.max(0, Math.min(6, Number(profile.pay_weekday)));
    const next = new Date(today.getFullYear(), today.getMonth(), today.getDate(), 12);
    const delta = (weekday - next.getDay() + 7) % 7;
    next.setDate(next.getDate() + delta);
    daysUntilPay = delta;
    nextPayDateISO = localISODate(next);
    nextPayDate = delta === 0 ? "hoy" : next.toLocaleDateString("es-DO", { day:"numeric", month:"long" });
    nextPayAmount = storedIncome;
  } else if (freq !== "irregular" && incomeMode !== "variable" && profile.pay_day_1) {
    const dayEntries = freq === "biweekly" && profile.pay_day_2
      ? [
          { day:Number(profile.pay_day_1), amount:paycheck1 },
          { day:Number(profile.pay_day_2), amount:paycheck2 },
        ].filter(x => x.day).sort((a,b)=>a.day-b.day)
      : [{ day:Number(profile.pay_day_1), amount:freq === "monthly" ? declaredMonthlyIncome : perPaycheck }];
    let selected = null;
    for (const entry of dayEntries) {
      const candidate = dateForMonthDay(y, m, entry.day);
      if (candidate >= today) { selected = { ...entry, date:candidate }; break; }
    }
    if (!selected && dayEntries.length) selected = { ...dayEntries[0], date:dateForMonthDay(y, m + 1, dayEntries[0].day) };
    if (selected) {
      daysUntilPay = Math.max(0, civilDaysBetween(today, selected.date));
      nextPayDateISO = localISODate(selected.date);
      nextPayDate = daysUntilPay === 0 ? "hoy" : selected.date.toLocaleDateString("es-DO", { day:"numeric", month:"long" });
      nextPayAmount = Math.round(selected.amount);
    }
  }

  const spendingByCategory = Object.fromEntries(raw.categories.map(c => [c.id,0]));
  const fixedSpendingByCategory = Object.fromEntries(raw.categories.map(c => [c.id,0]));
  for (const tx of variableTransactions) {
    if (!tx.category_id) continue;
    spendingByCategory[tx.category_id] = (spendingByCategory[tx.category_id] || 0) + Math.abs(Number(tx.amount) || 0);
  }
  for (const tx of fixedTransactions) {
    if (!tx.category_id) continue;
    fixedSpendingByCategory[tx.category_id] = (fixedSpendingByCategory[tx.category_id] || 0) + Math.abs(Number(tx.amount) || 0);
  }
  const uncategorizedSpending = variableTransactions.filter(tx => !tx.category_id)
    .reduce((sum, tx) => sum + Math.abs(Number(tx.amount) || 0), 0);

  const monthlyFixed = raw.fixed.reduce((sum, fixed) => sum + Math.max(0, Number(fixed.estimated_amount) || 0), 0);
  const totalBalanceAllAccounts = raw.accounts.reduce((sum, account) => sum + Number(account.computed_balance ?? account.initial_balance ?? 0), 0);
  const availableToday = raw.accounts.filter(accountIsSpendable)
    .reduce((sum, account) => sum + Number(account.computed_balance ?? account.initial_balance ?? 0), 0);
  const reservedBalance = totalBalanceAllAccounts - availableToday;
  const daysInMonth = new Date(y, m + 1, 0, 12).getDate();
  const daysLeft = Math.max(1, daysInMonth - today.getDate() + 1);

  const activeDebts = raw.debts.filter(isDebtActive);
  const activeGoals = raw.goals.filter(isGoalActive);
  const debtPaidThisMonth = raw.debtPayments.filter(p => (p.status || "active") !== "voided" && sameCivilMonth(p.paid_on || p.paid_at, today))
    .reduce((map, payment) => {
      const total = Math.max(0, Number(payment.amount) || 0), fee = Math.max(0, Number(payment.fee_component) || 0);
      map[payment.debt_id] = map[payment.debt_id] || { total:0, applied:0, fees:0 };
      map[payment.debt_id].total += total;
      map[payment.debt_id].applied += Math.max(0, total - fee);
      map[payment.debt_id].fees += fee;
      return map;
    }, {});
  const goalPaidThisMonth = raw.goalContributions.filter(c => sameCivilMonth(c.contributed_on || c.created_at, today))
    .reduce((map, contribution) => { map[contribution.goal_id] = (map[contribution.goal_id] || 0) + Number(contribution.amount || 0); return map; }, {});

  const debtPlan = activeDebts.reduce((sum, debt) => sum + monthlyPaymentEquivalent(Number(debt.scheduled_payment ?? debt.minimum_payment) || 0, debt.payment_frequency || "monthly"), 0);
  const debtCashOutflow = Object.values(debtPaidThisMonth).reduce((sum, value) => sum + value.total, 0);
  const debtApplied = Object.values(debtPaidThisMonth).reduce((sum, value) => sum + value.applied, 0);
  const financialFees = Object.values(debtPaidThisMonth).reduce((sum, value) => sum + value.fees, 0);
  const debtPending = activeDebts.reduce((sum, debt) => {
    const planned = monthlyPaymentEquivalent(Number(debt.scheduled_payment ?? debt.minimum_payment) || 0, debt.payment_frequency || "monthly");
    return sum + Math.max(0, planned - (debtPaidThisMonth[debt.id]?.applied || 0));
  }, 0);

  const goalPlan = activeGoals.reduce((sum, goal) => sum + goalMonthlyPace(goal, today), 0);
  const goalCashOutflow = Object.values(goalPaidThisMonth).reduce((sum, value) => sum + value, 0);
  const goalPending = activeGoals.reduce((sum, goal) => sum + Math.max(0, goalMonthlyPace(goal, today) - (goalPaidThisMonth[goal.id] || 0)), 0);
  const fixedPending = Math.max(0, monthlyFixed - fixedPaid);

  const fixedPlanOrActual = Math.max(monthlyFixed, fixedPaid);
  const debtPlanOrActual = Math.max(debtPlan, debtCashOutflow);
  const goalPlanOrActual = Math.max(goalPlan, goalCashOutflow);
  const pendingCommitments = Math.round(fixedPending + debtPending + goalPending);
  const actualOutflows = Math.round(variableSpent + fixedPaid + debtCashOutflow + goalCashOutflow);
  const monthlyPlannedOrActualOutflow = Math.round(variableSpent + fixedPlanOrActual + debtPlanOrActual + goalPlanOrActual);
  const remainingBudget = Math.round(monthlyInc - monthlyPlannedOrActualOutflow);
  const capacityBeforeGoals = Math.round(monthlyInc - variableSpent - fixedPlanOrActual - debtPlanOrActual);
  const futureIncomeInProjection = incomeMode === "variable" || freq === "irregular"
    ? 0
    : Math.max(0, Math.round(declaredMonthlyIncome - ordinaryIncomeReceived));

  return { raw, normalized: {
    monthlyIncome:monthlyInc,
    declaredMonthlyIncome:Math.round(declaredMonthlyIncome),
    incomeEstimate,
    incomeMode,
    incomeReceived:Math.round(ordinaryIncomeReceived),
    futureIncomeInProjection,
    dailyIncome:dailyInc, annualIncome:annualInc, perPaycheck, payFrequency:freq,
    nextPayDate, nextPayDateISO, daysUntilPay, nextPayAmount,
    monthlyFixed, fixedPaid, fixedPending, fixedPlanOrActual,
    spentThisMonth:Math.round(variableSpent), spendingByCategory, fixedSpendingByCategory, uncategorizedSpending:Math.round(uncategorizedSpending),
    totalBalanceAllAccounts:Math.round(totalBalanceAllAccounts), reservedBalance:Math.round(reservedBalance),
    availableToday:Math.round(availableToday), daysLeft, dailyRate:availableToday > 0 ? Math.round(availableToday / daysLeft) : 0,
    debtPlan:Math.round(debtPlan), debtCashOutflow:Math.round(debtCashOutflow), debtApplied:Math.round(debtApplied), debtPending:Math.round(debtPending), financialFees:Math.round(financialFees),
    goalPlan:Math.round(goalPlan), goalCashOutflow:Math.round(goalCashOutflow), goalPending:Math.round(goalPending),
    debtPaidThisMonth, goalPaidThisMonth, pendingCommitments, actualOutflows, monthlyPlannedOrActualOutflow, remainingBudget, capacityBeforeGoals,
    disponible:monthlyInc - monthlyFixed,
    dispRestante:Math.round(monthlyInc - monthlyFixed - variableSpent),
    committed:pendingCommitments,
    freeCashToday:Math.round(availableToday - pendingCommitments),
    freeCashProjected:nextPayAmount !== null ? Math.round(availableToday + nextPayAmount - pendingCommitments) : null,
  }};
}

// ---------------------------------------------------------------
// CAPA 2 — FinancialCore (PURO — nunca modifica state)
// Única responsabilidad: describir la realidad financiera.
// No toma decisiones, no prioriza, no recomienda.
// Organizado por dominios para facilitar crecimiento futuro.
// ---------------------------------------------------------------
function FinancialCore(fd, options = {}) {
  const asOf = options.asOf ? dateOnly(options.asOf) : dateOnly(new Date());
  if (!fd.normalized) return FinancialAnalysis.empty(fd.raw);
  const n = fd.normalized, raw = fd.raw;
  const liquidity = {
    balanceToday:n.availableToday,
    totalBalance:n.totalBalanceAllAccounts,
    reservedBalance:n.reservedBalance,
    spendableAccountCount:raw.accounts.filter(accountIsSpendable).length,
    totalAccountCount:raw.accounts.length,
    projectedBalance:n.nextPayAmount !== null ? n.availableToday + n.nextPayAmount : null,
    plannedCommitments:n.pendingCommitments,
    freeCashToday:n.freeCashToday,
    freeCashProjected:n.freeCashProjected,
    dailyLiquidity:n.dailyRate,
    daysLeftInMonth:n.daysLeft,
    nextPay:n.nextPayDate ? {
      amount:n.nextPayAmount, date:n.nextPayDate, dateISO:n.nextPayDateISO, daysAway:n.daysUntilPay,
      summary:n.daysUntilPay === 0 ? `hoy por ${money(n.nextPayAmount)}` : `en ${n.daysUntilPay} día${n.daysUntilPay !== 1 ? "s" : ""} (${n.nextPayDate}) por ${money(n.nextPayAmount)}`,
    } : null,
  };
  const cashFlow = {
    monthlyIncome:n.monthlyIncome,
    declaredMonthlyIncome:n.declaredMonthlyIncome,
    incomeEstimate:n.incomeEstimate,
    incomeMode:n.incomeMode,
    incomeReceived:n.incomeReceived,
    futureIncomeInProjection:n.futureIncomeInProjection,
    fixedExpenses:n.monthlyFixed,
    variableExpenses:n.spentThisMonth,
    operatingExpenses:Math.round(n.fixedPlanOrActual + n.spentThisMonth),
    operatingSurplus:Math.round(n.monthlyIncome - n.fixedPlanOrActual - n.spentThisMonth),
    plannedCommitments:n.pendingCommitments,
    remainingBudget:n.remainingBudget,
    fixedPlan:n.monthlyFixed, fixedPaid:n.fixedPaid, fixedPending:n.fixedPending,
    debtPlan:n.debtPlan, debtPaid:n.debtCashOutflow, debtPending:n.debtPending,
    goalPlan:n.goalPlan, goalPaid:n.goalCashOutflow, goalPending:n.goalPending,
    financialFees:n.financialFees, actualOutflows:n.actualOutflows,
    capacityBeforeGoals:n.capacityBeforeGoals,
    burnRate:n.monthlyIncome > 0 ? Number((n.monthlyPlannedOrActualOutflow / n.monthlyIncome).toFixed(4)) : 0,
    availableToday:liquidity.balanceToday, availableMonthly:n.remainingBudget,
    freeCashToday:liquidity.freeCashToday, freeCashProjected:liquidity.freeCashProjected,
    committed:liquidity.plannedCommitments, dailyRate:liquidity.dailyLiquidity, daysLeft:liquidity.daysLeftInMonth, nextPay:liquidity.nextPay,
  };
  const spending = {
    thisMonth:n.spentThisMonth,
    fixed:n.fixedPaid,
    variable:n.spentThisMonth,
    byCategory:n.spendingByCategory,
    fixedByCategory:n.fixedSpendingByCategory,
    uncategorized:n.uncategorizedSpending || 0,
    financialFees:n.financialFees,
  };

  const now = asOf || new Date();
  const activeGoals = raw.goals.filter(isGoalActive);
  const completedGoals = raw.goals.filter(g => g.status === "completed" || Number(g.current_amount) >= Number(g.target_amount));
  const totalPace = activeGoals.reduce((sum, goal) => sum + goalMonthlyPace(goal, now), 0);
  const canAffordAllGoals = n.capacityBeforeGoals >= totalPace;
  const goals = {
    active:activeGoals,
    completed:completedGoals,
    totalMonthlyPace:Math.round(totalPace),
    canAffordAllGoals,
    byGoal:activeGoals.map(goal => {
      const monthsLeft = goalMonthsLeft(goal, now);
      const amountLeft = Math.max(0, Number(goal.target_amount) - Number(goal.current_amount));
      const pace = Math.round(amountLeft / monthsLeft);
      const paidThisMonth = Math.round(Number(n.goalPaidThisMonth?.[goal.id]) || 0);
      const pendingThisMonth = Math.max(0, pace - paidThisMonth);
      const derivedStatus = amountLeft <= 0 ? "completed" : (!canAffordAllGoals || pace > n.capacityBeforeGoals) ? "at_risk" : "active";
      return { ...goal, priority:normalizeGoalPriority(goal.priority), pace, paidThisMonth, pendingThisMonth, monthsLeft, derivedStatus };
    }),
  };

  const activeDebts = raw.debts.filter(isDebtActive);
  const sortedDebts = [...activeDebts].sort((a,b) => annualizedDebtRate(b) - annualizedDebtRate(a));
  const topDebt = sortedDebts[0] ?? null;
  const totalDebtAmount = activeDebts.reduce((sum, debt) => sum + Number(debt.current_balance || 0), 0);
  const monthlyDebtCommitment = activeDebts.reduce((sum, debt) => sum + monthlyPaymentEquivalent(Number(debt.scheduled_payment ?? debt.minimum_payment) || 0, debt.payment_frequency || "monthly"), 0);
  const topRate = annualizedDebtRate(topDebt);
  const debtRisk = topDebt ? (topRate >= 30 ? "critical" : topRate >= 15 ? "high" : "moderate") : "none";
  const debts = { total:totalDebtAmount, count:activeDebts.length, topDebt, riskLevel:debtRisk, sorted:sortedDebts, monthlyCommitment:Math.round(monthlyDebtCommitment) };

  const income = n.monthlyIncome;
  const savingsComponent = income > 0 ? Math.max(0, Math.min(1, (Math.max(0, cashFlow.remainingBudget) / income) * 2)) : 0;
  const liquidityComponent = income > 0 ? Math.max(0, Math.min(1, n.availableToday / income)) : 0;
  const debtComponent = income > 0 ? 1 - Math.max(0, Math.min(1, totalDebtAmount / (income * 3))) : 1;
  const stage = n.freeCashToday < 0 || n.availableToday < 0 ? "survival"
    : totalDebtAmount > 0 && debtRisk === "critical" ? "debt_elimination"
    : n.availableToday < income * 0.5 ? "stability"
    : totalDebtAmount === 0 && activeGoals.length > 0 ? "building" : "growth";
  const weights = {survival:{liquidity:50,savings:30,debt:20},debt_elimination:{liquidity:30,savings:20,debt:50},stability:{liquidity:35,savings:35,debt:30},building:{liquidity:30,savings:40,debt:30},growth:{liquidity:25,savings:40,debt:35}}[stage] ?? {liquidity:35,savings:35,debt:30};
  const score = income > 0 ? Math.round(Math.max(0, Math.min(100, savingsComponent * weights.savings + liquidityComponent * weights.liquidity + debtComponent * weights.debt))) : null;
  const financialHealth = {
    score, stage,
    stageLabel:{survival:"Supervivencia",debt_elimination:"Eliminar deudas",stability:"Estabilidad",building:"Construcción",growth:"Crecimiento"}[stage] ?? "Estabilidad",
    components:{savings:{value:Math.round(savingsComponent*weights.savings),weight:weights.savings,raw:savingsComponent},liquidity:{value:Math.round(liquidityComponent*weights.liquidity),weight:weights.liquidity,raw:liquidityComponent},debt:{value:Math.round(debtComponent*weights.debt),weight:weights.debt,raw:debtComponent}},
    weights,
  };
  return { schemaVersion:FA_SCHEMA_VERSION, generatedAt:new Date(now), stage, liquidity, cashFlow, spending, goals, debts, financialHealth, normalized:n };
}

function RecommendationEngine(analysis) {
  if (!analysis || !analysis.cashFlow) return { priorities:[], nextBestAction:null, headline:"Completa tu perfil para ver recomendaciones." };
  const { goals, debts, financialHealth, normalized:n, liquidity } = analysis;
  const { stage } = financialHealth;
  const priorities = [];

  if (Number(liquidity.freeCashToday) < 0) {
    priorities.push({
      id:"stabilize_liquidity", category:"liquidity",
      label:"Cubrir el déficit de hoy", impact:100,
      why:`Te faltan ${money(Math.abs(liquidity.freeCashToday))} para mantener cubiertos tus compromisos inmediatos.`,
      amount:Math.abs(liquidity.freeCashToday), action:"commitments",
    });
  } else if (Number(liquidity.balanceToday) < 0) {
    priorities.push({ id:"recover_balance", category:"liquidity", label:"Recuperar un saldo positivo", impact:100, why:`Tu saldo disponible es ${money(liquidity.balanceToday)}.`, amount:Math.abs(liquidity.balanceToday), action:"accounts" });
  }

  if (debts.topDebt && debts.riskLevel === "critical") {
    priorities.push({ id:"pay_debt_critical", category:"debt", label:`Liquidar deuda “${debts.topDebt.name}”`, impact:98, why:`${debtRateLabel(debts.topDebt)} — cada período aumenta el costo`, amount:Number(debts.topDebt.scheduled_payment ?? debts.topDebt.minimum_payment) || null, action:"deudas" });
  }

  const emergencyGoals = [...goals.active, ...goals.completed].filter(g => (g.name || "").toLowerCase().includes("emergencia"));
  const hasEmergencyFund = emergencyGoals.some(g => g.status === "completed" || Number(g.current_amount) > 0);
  if (!hasEmergencyFund && Number(liquidity.freeCashToday) >= 0 && n.availableToday < Math.max(1, n.monthlyIncome)) {
    priorities.push({ id:"emergency_fund", category:"saving", label:"Crear fondo de emergencia", impact:92, why:"Después de estabilizar tus pagos, un fondo reduce el impacto de imprevistos.", amount:null, action:"metas" });
  }

  if (debts.topDebt && debts.riskLevel === "high") {
    priorities.push({ id:"pay_debt_high", category:"debt", label:`Reducir “${debts.topDebt.name}”`, impact:78, why:`${debtRateLabel(debts.topDebt)} representa un costo alto`, amount:Number(debts.topDebt.scheduled_payment ?? debts.topDebt.minimum_payment) || null, action:"deudas" });
  }

  goals.byGoal.forEach(goal => {
    const priorityImpact = {critical:75,important:60,optional:45}[normalizeGoalPriority(goal.priority)] ?? 60;
    priorities.push({ id:`goal_${goal.id}`, category:"goal", label:`Aportar a “${goal.name}”`, impact:Math.min(90, priorityImpact + (goal.derivedStatus === "at_risk" ? 15 : 0)), why:`Quedan ${money(goal.pendingThisMonth)} por aportar este mes; faltan ${money(Math.max(0, Number(goal.target_amount) - Number(goal.current_amount)))} en total.`, amount:goal.pendingThisMonth, action:"metas" });
  });

  priorities.push({ id:"save_buffer", category:"saving", label:"Aumentar el margen mensual", impact:35, why:"Más margen reduce el riesgo de quedarte sin liquidez.", amount:null, action:"presup" });
  const sorted = priorities.sort((a,b) => b.impact - a.impact);
  const nextBestAction = sorted[0] ?? null;
  const headline = stage === "survival" ? "Tu prioridad ahora es estabilizar el dinero disponible hoy."
    : stage === "debt_elimination" ? "Atacar tu deuda de alto costo es la prioridad."
    : !hasEmergencyFund ? "El fondo de emergencia es el siguiente paso después de cubrir tus pagos."
    : goals.byGoal.some(g => g.derivedStatus === "at_risk") ? "Alguna de tus metas está en riesgo este mes."
    : goals.active.length ? `Estás avanzando hacia “${goals.byGoal[0]?.name}”.`
    : "Tus finanzas están estables. Es buen momento para fijar nuevas metas.";
  return { priorities:sorted, nextBestAction, headline, stage };
}

// ---------------------------------------------------------------
// FinancialAnalysis.empty — objeto válido para onboarding
// ---------------------------------------------------------------
const FinancialAnalysis = {
  empty(raw) {
    return {
      schemaVersion: FA_SCHEMA_VERSION,
      generatedAt: new Date(),
      stage: "onboarding",

      liquidity: null,
      cashFlow: null,
      spending: null,

      goals: {
        active: [],
        completed: [],
        totalMonthlyPace: 0,
        canAffordAllGoals: false,
        byGoal: [],
      },

      debts: {
        total: 0,
        count: 0,
        riskLevel: "none",
        sorted: [],
        monthlyCommitment: 0,
      },

      financialHealth: {
        score: null,
        stage: "onboarding",
        stageLabel: "Configurando",
        components: {},
        weights: {},
      },

      normalized: null,

      recommendations: {
        priorities: [],
        nextBestAction: null,
        headline: "Completa tu perfil para comenzar.",
      },
    };
  },
};

// ---------------------------------------------------------------
// computeAnalysis() — punto de entrada público
// Ejecuta las 3 capas en orden y almacena en state.analysis.
// Se llama después de cada loadState(). Es puro en el sentido
// de que no tiene efectos secundarios más allá de state.analysis.
// ---------------------------------------------------------------
function computeAnalysis(asOf = new Date()) {
  const fd = buildFinancialData(asOf);                 // Capa 1
  const analysis = FinancialCore(fd, { asOf });         // Capa 2
  const recs = RecommendationEngine(analysis);          // Capa 3
  state.analysis = {
    ...analysis,
    recommendations: recs,
  };
  return state.analysis;
}

// ---------------------------------------------------------------
// SELF-TEST — batería de pruebas para desarrollo
// Detecta regresiones durante la migración de módulos.
// Llamar con runEngineTests() desde la consola del navegador.
// ---------------------------------------------------------------
function runEngineTests() {
  const results = [];
  const originalState = state;
  const originalCategories = categories;
  const assert = (desc, condition) => results.push({ desc, ok: Boolean(condition) });
  const fixedDate = new Date("2026-08-01T12:00:00-04:00");

  try {
    categories = [{ id: "food", name: "Comida" }];

    state = {
      account: { computed_balance: -800, initial_balance: -800 },
      profile: { pay_frequency: "biweekly", declared_monthly_income: 17000, pay_day_1: 15, pay_day_2: 30 },
      goals: [{ id: "goal", name: "Emergencia", status: "active", priority: "critical", created_at: "2026-08-01T00:00:00Z", target_months: 10, target_amount: 40000, current_amount: 0 }],
      fixed: [], debts: [], transactions: [], analysisTransactions: [], budgets: [], goalContributions: [], debtPayments: [], analysis: null,
    };
    const core = FinancialCore(buildFinancialData(fixedDate), { asOf: fixedDate });
    state.analysis = { ...core, recommendations: RecommendationEngine(core) };
    const small = buildPurchaseAnalysis(state.analysis, 10, "tenis");
    const large = buildPurchaseAnalysis(state.analysis, 20000, "laptop");
    assert("Quincenal normaliza ingreso mensual a RD$34,000", core.cashFlow.monthlyIncome === 34000);
    assert("Próximo cobro conserva RD$17,000", core.liquidity.nextPay?.amount === 17000);
    assert("Compra cubierta solo después del cobro es amarilla", small.verdict === "yellow");
    assert("Compra no cubierta ni proyectada es roja", large.verdict === "red");
    assert("Rojo no muestra estrellas", large.stars === 0);
    assert("Saldo proyectado y dinero libre son distintos", small.affordability.balanceAfterProjected === 16190 && small.affordability.freeCashAfterProjected === 12190);

    state = {
      ...state, account: { computed_balance: 5000 },
      debts: [{ id: "debt", name: "Tarjeta", status: "active", current_balance: 10000, interest_rate: 40, minimum_payment: 1000 }],
    };
    const debtCore = FinancialCore(buildFinancialData(fixedDate), { asOf: fixedDate });
    state.analysis = { ...debtCore, recommendations: RecommendationEngine(debtCore) };
    assert("Deuda crítica bloquea verde", buildPurchaseAnalysis(state.analysis, 100, "compra").verdict !== "green");

    state = {
      account: { computed_balance: -100, initial_balance: -100 },
      profile: { pay_frequency: "monthly", declared_monthly_income: 20000, pay_day_1: 30 },
      goals: [], fixed: [], debts: [], transactions: [], analysisTransactions: [], budgets: [], goalContributions: [], debtPayments: [], analysis: null,
    };
    assert("Saldo negativo sin deuda también es supervivencia", FinancialCore(buildFinancialData(fixedDate), { asOf: fixedDate }).stage === "survival");

    assert("iPhone 15 no interpreta 15 como precio", extractMoneyAmount("Quiero comprar un iPhone 15") === null);
    assert("Precio explícito sí se extrae", extractMoneyAmount("Cuesta RD$2,500") === 2500);
    assert("Plural comprarlos es seguimiento", containsPurchaseIntent("¿Puedo comprarlos ahora?") && isPurchaseFollowUpMsg("¿Puedo comprarlos ahora?"));
    assert("Pronombre no se convierte en artículo ahora", extractPurchaseItem("¿Puedo comprármelo ahora?") === null);

    const amortizedPlan = calculateDebtPlan({
      planType: "amortized", originalAmount: 20000, interestRate: 45,
      interestRateType: "annual", paymentFrequency: "monthly", termCount: 10,
    });
    assert("Préstamo 20k al 45% anual en 10 meses calcula cuota ~RD$2,435", Math.abs(amortizedPlan.scheduledPayment - 2435.23) < 1);
    assert("Préstamo amortizado muestra intereses totales ~RD$4,352", Math.abs(amortizedPlan.estimatedInterest - 4352.27) < 2);

    const flatTotalPlan = calculateDebtPlan({
      planType: "flat_total", originalAmount: 20000, interestRate: 45,
      interestRateType: "total_term", paymentFrequency: "monthly", termCount: 5,
    });
    assert("45% total en 5 meses produce total RD$29,000", flatTotalPlan.totalPayable === 29000);
    assert("45% total en 5 meses produce cuota RD$5,800", flatTotalPlan.scheduledPayment === 5800);

    const flatPeriodicPlan = calculateDebtPlan({
      planType: "flat_periodic", originalAmount: 20000, interestRate: 10,
      interestRateType: "per_period", paymentFrequency: "monthly", termCount: 5,
    });
    assert("10% mensual plano por 5 meses produce RD$10,000 de interés", flatPeriodicPlan.estimatedInterest === 10000);
    assert("45% total en 5 meses se anualiza como riesgo alto", annualizedDebtRate({
      plan_type: "flat_total", interest_rate: 45, interest_rate_type: "total_term",
      payment_frequency: "monthly", term_count: 5,
    }) === 108);
    assert("10% mensual equivale a 120% anual para evaluar riesgo", annualizedDebtRate({
      plan_type: "amortized", interest_rate: 10, interest_rate_type: "monthly",
      payment_frequency: "monthly", term_count: 5,
    }) === 120);

    const paymentBreakdown = estimateDebtPaymentBreakdown({
      plan_type: "amortized", current_balance: 20000, principal_outstanding: 20000,
      interest_outstanding: 0, interest_rate: 45, interest_rate_type: "annual",
      payment_frequency: "monthly",
    }, 2435.23, null, 0);
    assert("Primer pago separa ~RD$750 de interés", Math.abs(paymentBreakdown.interestComponent - 750) < 0.02);
    assert("Primer pago reduce capital ~RD$1,685", Math.abs(paymentBreakdown.principalComponent - 1685.23) < 0.02);

    const insufficientInterestPayment = estimateDebtPaymentBreakdown({
      plan_type: "amortized", current_balance: 20000, principal_outstanding: 20000,
      interest_outstanding: 0, interest_rate: 45, interest_rate_type: "annual",
      payment_frequency: "monthly",
    }, 500, null, 0);
    assert("Pago menor que el interés puede aumentar el saldo", insufficientInterestPayment.newBalance > 20000);

    state = {
      account: { computed_balance: 5000, initial_balance: 5000 },
      profile: { pay_frequency: "monthly", declared_monthly_income: 20000, pay_day_1: 30 },
      goals: [], fixed: [], debts: [], transactions: [], analysisTransactions: [],
      budgets: [{ id: "b", category_id: "food", amount: 1000, effective_from: "2026-08-01", effective_to: null }],
      goalContributions: [], debtPayments: [], analysis: null,
    };
    const budgetCore = FinancialCore(buildFinancialData(fixedDate), { asOf: fixedDate });
    state.analysis = { ...budgetCore, recommendations: RecommendationEngine(budgetCore) };
    state.analysis.spending.byCategory.food = 995;
    const nearBudget = budgetStatusList()[0];
    assert("RD$995 de RD$1,000 no se marca como excedido", nearBudget.status === "near" && nearBudget.remaining === 5);
    state.analysis.spending.byCategory.food = 1000;
    assert("Llegar exactamente al límite no es exceder", budgetStatusList()[0].status === "reached");
    state.analysis.spending.byCategory.food = 1100;
    assert("El exceso se calcula por montos reales", budgetStatusList()[0].status === "exceeded" && budgetStatusList()[0].remaining === -100);
    const impact = budgetImpactForPurchase(500, "food");
    assert("Compra refleja el presupuesto de su categoría", impact.hasBudget && impact.exceededAfter);

  } catch (error) {
    results.push({ desc: `La batería lanzó una excepción: ${error.message}`, ok: false });
  } finally {
    state = originalState;
    categories = originalCategories;
    if (state.profile && state.account) computeAnalysis();
  }

  const passed = results.filter(r => r.ok).length;
  console.log(`[QA TESTS] ${passed}/${results.length} passed`);
  results.forEach(r => console.log(`  ${r.ok ? "✅" : "❌"} ${r.desc}`));
  return { passed, total: results.length, results };
}

window.runEngineTests = runEngineTests;
window.runScenarioTests = runEngineTests;

function determineStep() {
  if (!state.account) return "account";
  if (state.profile == null || state.profile.declared_monthly_income == null) return "income";
  if (!onboardingIsComplete()) return "fixed";
  return "app";
}

// ---------------------------------------------------------------
// RENDER PRINCIPAL
// ---------------------------------------------------------------
function render() {
  const step = determineStep();
  if (step === "account") return renderOnboardingAccount();
  if (step === "income") return renderOnboardingIncome();
  if (step === "fixed") return renderOnboardingFixed();
  return renderApp();
}

  root.innerHTML = `
    <div class="screen">

      <h1>Configura tu cuenta principal</h1>

      <div class="error-banner" id="err"></div>
      <label for="accUserName">Tu nombre</label>
      <input id="accUserName" placeholder="Ej. Luis" style="margin-bottom:14px;" value="${state.profile?.display_name ? esc(state.profile.display_name) : ""}" />
      <label for="accName">Nombre de la cuenta</label>
      <input id="accName" placeholder="Ej. Banreservas" style="margin-bottom:2px;" value="${existing ? esc(existing.name) : ""}" />
      <p class="hint">Esto es solo para reconocerla.</p>
      <label>Tipo</label>
      <div class="type-grid" id="typeGrid">

        <button type="button" class="type-option ${existing?.type === "cash" ? "selected" : ""}" data-type="cash">Efectivo</button>
        <button type="button" class="type-option ${existing?.type === "savings" ? "selected" : ""}" data-type="savings">Ahorro</button>
      </div>
      <label for="accBalance">¿Cuánto tienes ahí ahora mismo?</label>
      <input id="accBalance" type="number" inputmode="decimal" step="0.01" placeholder="RD$0" style="margin-bottom:4px;" value="${shownBalance}" />
      <p class="hint">Puede ser negativo. Este valor será el saldo oficial actual.</p>
      <label class="card" style="display:flex;align-items:flex-start;gap:8px;padding:10px;margin:12px 0 20px;"><input id="accSpendable" type="checkbox" style="width:auto;margin-top:2px;" ${existing ? (existing.available_for_spending !== false ? "checked" : "") : "checked"}><span><strong style="font-size:12px;">Usar esta cuenta para gastos y compras</strong><small style="display:block;color:var(--text-muted);margin-top:2px;">Desmárcalo si es un ahorro reservado que no quieres considerar disponible.</small></span></label>
      <button class="btn-primary" id="continueBtn" style="width:100%;">Continuar</button>
    </div>`;

  let selectedType = existing?.type || "bank";
  let availabilityTouched = false;
  document.getElementById("accSpendable")?.addEventListener("change",()=>{availabilityTouched=true;});
  document.querySelectorAll(".type-option").forEach(el => el.addEventListener("click", () => {
    document.querySelectorAll(".type-option").forEach(o => o.classList.remove("selected"));
    el.classList.add("selected"); selectedType = el.dataset.type;
    const checkbox=document.getElementById("accSpendable");
    if(checkbox&&!availabilityTouched) checkbox.checked=selectedType!=="savings";
  }));

  document.getElementById("continueBtn").addEventListener("click", async () => {
    const userName = document.getElementById("accUserName").value.trim();
    const name = document.getElementById("accName").value.trim();
    const raw = document.getElementById("accBalance").value;
    const balance = Number(raw);
    const errEl = document.getElementById("err");
    if (!userName) return showInlineError(errEl, "Completa tu nombre.");
    if (!name) return showInlineError(errEl, "Completa el nombre de la cuenta.");
    if (raw === "" || !Number.isFinite(balance)) return showInlineError(errEl, "Escribe el saldo actual de la cuenta.");
    const btn=document.getElementById("continueBtn"); btn.disabled=true; btn.textContent="Guardando…";
    const useForSpending=document.getElementById("accSpendable")?.checked !== false;
    const { data, error } = await supabase.rpc("save_primary_account_v51", {
      p_account_id: existing?.id || null, p_name: name, p_type: selectedType,
      p_current_balance: balance, p_display_name: userName,
      p_note: existing ? "Conciliación del saldo actual durante la configuración" : "Saldo inicial confirmado",
    });
    if (error) { showInlineError(errEl, safeErrorMessage(error, "No se pudo guardar la cuenta.")); btn.disabled=false; btn.textContent="Continuar"; return; }
    const savedId=data?.account_id||existing?.id;
    if(savedId){const {error:availabilityError}=await supabase.from("accounts").update({available_for_spending:useForSpending,updated_at:new Date().toISOString()}).eq("id",savedId);if(availabilityError){showInlineError(errEl,"La cuenta se guardó, pero no pudimos guardar su disponibilidad. Intenta de nuevo.");btn.disabled=false;btn.textContent="Continuar";return;}}
    await loadState(); render();
  });
}

function renderOnboardingIncome() {
  const profile=state.profile||{};
  let frequency=profile.pay_frequency||"monthly";
  let mode=profile.income_mode||(frequency==="irregular"?"variable":"fixed");
  const drafts={
    amount1:Number(profile.paycheck_amount_1??profile.declared_monthly_income)||0,
    amount2:Number(profile.paycheck_amount_2??profile.declared_monthly_income)||0,
    day1:Number(profile.pay_day_1)||"",day2:Number(profile.pay_day_2)||"",weekday:profile.pay_weekday??5,
  };
  function collect(){
    const a1=document.getElementById("obIncAmount1"),a2=document.getElementById("obIncAmount2"),d1=document.getElementById("obIncDay1"),d2=document.getElementById("obIncDay2"),wd=document.getElementById("obIncWeekday");
    if(a1)drafts.amount1=Number(a1.value)||0;if(a2)drafts.amount2=Number(a2.value)||0;if(d1)drafts.day1=Number(d1.value)||"";if(d2)drafts.day2=Number(d2.value)||"";if(wd)drafts.weekday=Number(wd.value);
  }
  function fields(){
    if(frequency==="biweekly") return `<p class="hint">Si ambas quincenas son iguales, repite el monto.</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;"><div><label>Primer cobro</label><input id="obIncAmount1" type="number" min="0" step="0.01" value="${drafts.amount1||""}"><label>Día</label><input id="obIncDay1" type="number" min="1" max="31" value="${drafts.day1}"></div><div><label>Segundo cobro</label><input id="obIncAmount2" type="number" min="0" step="0.01" value="${drafts.amount2||""}"><label>Día</label><input id="obIncDay2" type="number" min="1" max="31" value="${drafts.day2}"></div></div>`;
    if(frequency==="weekly") return `<label>Monto habitual por semana</label><input id="obIncAmount1" type="number" min="0" step="0.01" value="${drafts.amount1||""}"><label>Día habitual</label><select id="obIncWeekday"><option value="1">Lunes</option><option value="2">Martes</option><option value="3">Miércoles</option><option value="4">Jueves</option><option value="5">Viernes</option><option value="6">Sábado</option><option value="0">Domingo</option></select><p class="hint">La app convierte el pago semanal a una equivalencia mensual.</p>`;
    if(frequency==="irregular") return `<label>Estimación mensual <span style="color:var(--text-muted);">(opcional)</span></label><input id="obIncAmount1" type="number" min="0" step="0.01" value="${drafts.amount1||""}"><p class="hint">Las decisiones usarán solamente los ingresos que registres realmente.</p>`;
    return `<label>Ingreso mensual planificado</label><input id="obIncAmount1" type="number" min="0" step="0.01" value="${drafts.amount1||""}"><label>Día de cobro <span style="color:var(--text-muted);">(opcional)</span></label><input id="obIncDay1" type="number" min="1" max="31" value="${drafts.day1}">`;
  }
  function paint(){
    root.innerHTML=`<div class="screen"><p class="step-label">Paso 2 de 4</p><h1>Configura tu ingreso principal</h1><p class="subtitle">Separa lo que esperas recibir de lo que ya entró a tus cuentas. Otros ingresos reales se registran después como movimientos.</p><label>Tipo de ingreso</label><div class="type-grid" id="obIncomeMode" style="grid-template-columns:1fr 1fr;"><button type="button" class="type-option ${mode==="fixed"?"selected":""}" data-mode="fixed">Fijo o predecible</button><button type="button" class="type-option ${mode==="variable"?"selected":""}" data-mode="variable">Variable / estimado</button></div><label>Frecuencia</label><select id="obIncomeFrequency"><option value="monthly" ${frequency==="monthly"?"selected":""}>Mensual</option><option value="biweekly" ${frequency==="biweekly"?"selected":""}>Dos veces al mes</option><option value="weekly" ${frequency==="weekly"?"selected":""}>Semanal</option><option value="irregular" ${frequency==="irregular"?"selected":""}>Irregular</option></select><div id="obIncomeFields" style="margin-top:10px;">${fields()}</div><div class="error-banner" id="err"></div><div class="btn-row"><button class="btn-back" id="backBtn">‹</button><button class="btn-primary" id="continueBtn">Continuar</button></div></div>`;
    if(frequency==="weekly")document.getElementById("obIncWeekday").value=String(drafts.weekday);
    document.querySelectorAll("#obIncomeMode .type-option").forEach(btn=>btn.addEventListener("click",()=>{mode=btn.dataset.mode;document.querySelectorAll("#obIncomeMode .type-option").forEach(x=>x.classList.toggle("selected",x===btn));}));
    document.getElementById("obIncomeFrequency").addEventListener("change",e=>{collect();frequency=e.target.value;if(frequency==="irregular")mode="variable";paint();});
    document.getElementById("backBtn").addEventListener("click",renderOnboardingAccount);
    document.getElementById("continueBtn").addEventListener("click",async()=>{
      collect();const err=document.getElementById("err"),a1=Number(drafts.amount1)||0,a2=Number(drafts.amount2)||0,d1=Number(drafts.day1)||null,d2=Number(drafts.day2)||null;
      if(frequency!=="irregular"&&!(a1>0))return showInlineError(err,"Completa un ingreso mayor que cero.");
      if(frequency==="biweekly"&&!(a2>0))return showInlineError(err,"Completa los dos cobros del mes.");
      if(d1&&(d1<1||d1>31)||d2&&(d2<1||d2>31))return showInlineError(err,"Los días deben estar entre 1 y 31.");
      const btn=document.getElementById("continueBtn");btn.disabled=true;btn.textContent="Guardando…";
      const payload={declared_monthly_income:a1,paycheck_amount_1:frequency==="biweekly"?a1:null,paycheck_amount_2:frequency==="biweekly"?a2:null,pay_frequency:frequency,income_mode:frequency==="irregular"?"variable":mode,pay_day_1:["monthly","biweekly"].includes(frequency)?d1:null,pay_day_2:frequency==="biweekly"?d2:null,pay_weekday:frequency==="weekly"?Number(drafts.weekday):null,updated_at:new Date().toISOString()};
      const {error}=await supabase.from("profiles").update(payload).eq("id",user.id);
      if(error){showInlineError(err,safeErrorMessage(error,"No se pudo guardar. Ejecuta primero la migración v5.2."));btn.disabled=false;btn.textContent="Continuar";return;}
      await loadState();render();
    });
  }
  paint();
}

      await supabase.from("profiles").update({fixed_expenses_confirmed:true,updated_at:new Date().toISOString()}).eq("id",user.id);
      await loadState();paint();
    });
    document.getElementById("backBtn").addEventListener("click",renderOnboardingIncome);
    document.getElementById("continueBtn").addEventListener("click",async()=>{await supabase.from("profiles").update({fixed_expenses_confirmed:true,updated_at:new Date().toISOString()}).eq("id",user.id);await loadState();renderOnboardingGoal();});
    document.getElementById("skipBtn").addEventListener("click",async()=>{await supabase.from("profiles").update({fixed_expenses_confirmed:false,onboarding_skipped:true,updated_at:new Date().toISOString()}).eq("id",user.id);await loadState();renderOnboardingGoal();});
  }
  paint();
}

  function paint(){
    root.innerHTML=`<div class="screen"><p class="step-label">Paso 4 de 4</p><h1>Crea una meta</h1><p class="subtitle">Es opcional. Puedes entrar a la app y agregarla cuando tengas los datos.</p>

      <div class="btn-row" style="margin-top:16px;"><button class="btn-back" id="backBtn">‹</button><button class="btn-secondary" id="skipGoalBtn">Omitir</button><button class="btn-primary" id="finishBtn">Crear y terminar</button></div></div>`;
    const preview=()=>{const a=Number(document.getElementById("gAmount").value)||0,m=Number(document.getElementById("gMonths").value)||0,p=Number(document.getElementById("gMonthly").value)||0;document.getElementById("goalViabilityCard").innerHTML=a>0&&(m>0||p>0)?buildGoalPreviewHTML(a,m,p):`<div class="card" style="text-align:center;"><p style="font-size:12px;color:var(--text-muted);margin:0;">Completa monto y plazo para evaluar la meta.</p></div>`;};
    ["gAmount","gMonths","gMonthly"].forEach(id=>document.getElementById(id).addEventListener("input",preview));preview();
    document.getElementById("backBtn").addEventListener("click",renderOnboardingFixed);
    document.getElementById("skipGoalBtn").addEventListener("click",async()=>{await supabase.from("profiles").update({onboarding_skipped:true,updated_at:new Date().toISOString()}).eq("id",user.id);await markOnboardingComplete();await loadState();render();});
    document.getElementById("finishBtn").addEventListener("click",async()=>{
      const name=document.getElementById("gName").value.trim(),amount=Number(document.getElementById("gAmount").value),months=Number(document.getElementById("gMonths").value)||0,monthly=Number(document.getElementById("gMonthly").value)||0,errEl=document.getElementById("err");
      if(!name||!(amount>0)) return showInlineError(errEl,"Completa el nombre y un monto mayor que cero.");
      const plan=resolveGoalPlan(amount,months,monthly); if(!plan.valid) return showInlineError(errEl,plan.message);
      if(plan.status==="impossible"||plan.canAfford===false){const ok=await confirmAction(`${plan.message}\n\nPuedes guardarla marcada como en riesgo.`,"Guardar en riesgo",false);if(!ok)return;}
      const btn=document.getElementById("finishBtn");btn.disabled=true;btn.textContent="Guardando…";
      const {error}=await supabase.from("goals").insert({user_id:user.id,name,target_amount:amount,target_months:plan.targetMonths,linked_account_id:state.account.id,priority:"important",plan_started_at:localISODate()});
      if(error){showInlineError(errEl,safeErrorMessage(error,"No se pudo guardar."));btn.disabled=false;btn.textContent="Crear y terminar";return;}
      await markOnboardingComplete();await loadState();render();
    });
  }
  paint();
}

function renderApp() {
  root.innerHTML = `
    <div class="app-shell">
      <div class="app-body" id="tabContent"></div>

        <button class="nav-item ${tab === "inicio" ? "active" : ""}" data-tab="inicio"><span class="icon">🏠</span>Inicio</button>
        <button class="nav-item ${tab === "coach" ? "active" : ""}" data-tab="coach"><span class="icon">💬</span>Coach</button>
        <button class="nav-item ${tab === "simular" ? "active" : ""}" data-tab="simular"><span class="icon">🤔</span>¿Lo compro?</button>
        <button class="nav-item ${["mas","cuentas","ingreso","gastos","metas","fijos","deudas","presup","resumen","wishlist","privacidad"].includes(tab) ? "active" : ""}" data-tab="mas"><span class="icon">☰</span>Más</button>

  document.querySelectorAll(".nav-item").forEach(btn => btn.addEventListener("click",()=>{tab=btn.dataset.tab;renderApp();}));
  const logModal=document.getElementById("logModal"),confirmModal=document.getElementById("confirmModal");
  document.onkeydown=e=>{
    if(e.key!=="Escape") return;
    if(confirmModal?.classList.contains("visible")){ activeConfirmation?.resolve?.(false); return; }
    if(logModal?.classList.contains("visible")){ logModal.classList.remove("visible");logModal.innerHTML=""; }
  };
  logModal?.addEventListener("click",e=>{if(e.target===logModal){logModal.classList.remove("visible");logModal.innerHTML="";}});

  const content=document.getElementById("tabContent");
  const templates={
    inicio:tplInicio,coach:tplCoach,simular:tplSimular,mas:tplMas,
    cuentas:()=>backLink()+tplCuentas(),ingreso:()=>backLink()+tplIngreso(),gastos:()=>backLink()+tplGastos(),
    metas:()=>backLink()+tplMetas(),fijos:()=>backLink()+tplFijos(),deudas:()=>backLink()+tplDeudas(),

  };
  content.innerHTML=(templates[tab]||tplInicio)();

  if(tab==="coach") wireCoach();

function tplCuentas() {
  const accounts = allAccounts();
  const total = totalAccountBalance();
  const available = spendableAccountBalance();
  const reserved = total - available;
  const cards = accounts.map(account => {
    const balance = Number(account.computed_balance ?? account.initial_balance ?? 0);
    const spendable = accountIsSpendable(account);
    const reconciled = account.balance_reconciled_at ? formatUpdateTime(new Date(account.balance_reconciled_at)) : "Nunca";
    return `<div class="card" style="margin-bottom:8px;">
      <div class="row-between"><div><strong>${esc(account.name)}</strong><p style="font-size:10px;color:var(--text-muted);margin:3px 0 0;">${accountTypeLabel(account.type)} · ${spendable ? "Disponible para decisiones" : "Reservado, no se usa para compras"}</p></div><strong style="color:${balance<0?"var(--danger-text)":"inherit"};">${money(balance)}</strong></div>

      <div style="display:flex;gap:6px;margin-top:9px;"><button class="btn-secondary" data-reconcile-account="${account.id}" style="flex:1;padding:7px;font-size:10px;">Conciliar saldo</button><button class="btn-secondary" data-toggle-account="${account.id}" data-next-spendable="${spendable?"false":"true"}" style="flex:1;padding:7px;font-size:10px;">${spendable?"Marcar reservado":"Usar en decisiones"}</button></div>
    </div>`;
  }).join("");
  return `<h1 style="text-align:left;margin-bottom:4px;">Cuentas y saldos</h1><p class="subtitle" style="text-align:left;">Solo las cuentas marcadas como disponibles participan en “Dinero libre hoy” y ¿Lo compro?.</p>

}
