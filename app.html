<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Coach Financiero</title>
<link rel="stylesheet" href="css/styles.css" />
<style>
  .icon-action { min-width:44px; min-height:44px; display:inline-flex; align-items:center; justify-content:center; }
  .status-dot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:6px; }
  .metric-help { background:none; border:none; color:var(--text-muted); padding:0 4px; min-height:24px; cursor:pointer; }
  .alert-row { display:flex; gap:9px; align-items:flex-start; padding:9px 0; border-bottom:0.5px solid var(--border); }
  .alert-row:last-child { border-bottom:none; }

  .modal-overlay[role="dialog"]:not(.visible){display:none;}
  .type-option:focus-visible,.cat-option:focus-visible{outline:3px solid var(--teal-light);outline-offset:2px;}
  button:disabled{opacity:.58;cursor:not-allowed;}
</style>
</head>
<body>

<div id="root">
  <div class="screen" style="text-align:center; padding:60px 24px;">
    <p style="font-size:13px; color:var(--text-muted);">Cargando tus datos…</p>
  </div>
</div>

<script type="module">
import { supabase } from "./js/supabaseClient.js";

const APP_BUILD = "financial-core-v5.2-clarity-consistency-2026-08-03";
window.__APP_BUILD__ = APP_BUILD;
console.info(`[Coach Financiero] build ${APP_BUILD}`);

const CATEGORY_ICONS = {
  Comida: "🍽️", Transporte: "🚌", Vivienda: "🏠", Salud: "💊",
  Ocio: "🎮", Educación: "🎓", Ropa: "👕", Otro: "•",
};

const DEBT_TYPES = [
  { value: "tarjeta_credito", label: "Tarjeta de crédito", icon: "💳" },
  { value: "prestamo_personal", label: "Préstamo personal", icon: "🏦" },
  { value: "prestamista", label: "Prestamista", icon: "🤝" },
  { value: "financiamiento_vehiculo", label: "Financiamiento de vehículo", icon: "🚗" },
  { value: "financiamiento_electrodomestico", label: "Financiamiento de electrodoméstico", icon: "🧊" },
  { value: "hipoteca", label: "Hipoteca", icon: "🏠" },
  { value: "otro", label: "Otro", icon: "📄" },
];

let user = null;
let categories = [];
let state = {
  account: null, accounts: [], profile: null, goals: [], fixed: [], debts: [],
  transactions: [], analysisTransactions: [], budgets: [], goalContributions: [], debtPayments: [],
  fixedPayments: [], purchaseDecisions: [], reconciliations: [], optionalErrors: [], analysis: null,
};
let tab = "inicio";

const root = document.getElementById("root");
let activeConfirmation = null;
let categorySelectionMode = "auto";
let pendingCoachOfficialAnalysis = null;
let movementViewFilter = null;

// Utilidades de fecha, estado y vínculos de auditoría.
function localISODate(date = new Date()) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

function isTransferTransaction(tx) {
  return ["transfer", "loan_proceeds", "adjustment", "reversal"].includes(String(tx?.transaction_type || "")) ||
    ["goal_contribution", "debt_payment", "debt_payment_reversal", "account_reconciliation", "loan_proceeds", "legacy_transfer", "legacy_reversal"].includes(String(tx?.source_type || ""));
}

function isFixedPaymentTransaction(tx) {
  return String(tx?.source_type || "") === "fixed_expense" ||
    String(tx?.source_type || "") === "fixed_expense_legacy" || Boolean(tx?.fixed_template_id);
}

function linkedTransactionIds() {
  return new Set([
    ...(state.goalContributions || []).map(x => x.transaction_id),
    ...(state.debtPayments || []).flatMap(x => [x.transaction_id, x.reversal_transaction_id]),
  ].filter(Boolean));
}

function isLinkedTransaction(tx) {
  if (!tx) return false;
  return linkedTransactionIds().has(tx.id) || tx.source_type !== "manual";
}

function safeStorageGet(key) {
  if (!key) return null;
  try { return window.localStorage?.getItem(key) ?? null; } catch { return null; }
}

function safeStorageSet(key, value) {
  if (!key) return false;
  try { window.localStorage?.setItem(key, value); return true; } catch { return false; }
}

function onboardingStorageKey() {
  return user?.id ? `coach-financiero:onboarding:${user.id}` : null;
}

function onboardingIsComplete() {
  const key = onboardingStorageKey();
  const locallyCompleted = safeStorageGet(key) === "1";
  const hasUsage = state.goals.length > 0 || state.fixed.length > 0 || state.transactions.length > 0 ||
    state.debts.length > 0 || state.budgets.length > 0;
  return state.profile?.onboarding_completed === true || locallyCompleted || hasUsage;
}

async function markOnboardingComplete() {
  const key = onboardingStorageKey();
  safeStorageSet(key, "1");
  // Compatible con proyectos que todavía no tienen la columna.
  const { error } = await supabase.from("profiles").update({ onboarding_completed: true }).eq("id", user.id);
  if (error && !String(error.message || "").toLowerCase().includes("onboarding_completed")) {
    console.warn("No se pudo marcar onboarding_completed", error);
  }
}

async function deleteLocal(table, id, stateKey) {
  if (table === "transactions") {
    const tx = state.transactions.find(x => x.id === id);
    if (isLinkedTransaction(tx)) {
      showToast("Este movimiento está vinculado a una meta o deuda y no se puede borrar directamente.", true);
      return false;
    }
  }

  const { error } = await supabase.from(table).delete().eq("id", id);
  if (error) {
    showToast("No se pudo borrar. Tus datos no fueron modificados.", true);
    return false;
  }

  await loadState();
  renderApp();
  return true;
}

function money(n) {
  const num = Number(n) || 0;
  const hasCents = Math.abs(num - Math.round(num)) > 0.004;
  return "RD$" + num.toLocaleString("es-DO", {
    minimumFractionDigits: hasCents ? 2 : 0,
    maximumFractionDigits: hasCents ? 2 : 0,
  });
}

function dateOnly(value) {
  if (!value) return null;
  if (value instanceof Date) {
    if (Number.isNaN(value.getTime())) return null;
    return new Date(value.getFullYear(), value.getMonth(), value.getDate(), 12, 0, 0, 0);
  }
  const text = String(value);
  const civil = text.match(/^(\d{4})-(\d{2})-(\d{2})(?:$|T)/);
  if (civil) {
    const d = new Date(Number(civil[1]), Number(civil[2]) - 1, Number(civil[3]), 12, 0, 0, 0);
    return Number.isNaN(d.getTime()) ? null : d;
  }
  const d = new Date(text);
  return Number.isNaN(d.getTime()) ? null : new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12, 0, 0, 0);
}

function civilCompare(a, b) {
  const da = dateOnly(a), db = dateOnly(b);
  if (!da || !db) return null;
  return Math.sign(da.getTime() - db.getTime());
}

function sameCivilMonth(value, reference = new Date()) {
  const d = dateOnly(value), r = dateOnly(reference);
  return Boolean(d && r && d.getFullYear() === r.getFullYear() && d.getMonth() === r.getMonth());
}

function sameCivilDay(value, reference = new Date()) {
  const d = dateOnly(value), r = dateOnly(reference);
  return Boolean(d && r && d.getFullYear() === r.getFullYear() && d.getMonth() === r.getMonth() && d.getDate() === r.getDate());
}

function civilDaysBetween(from, to) {
  const a = dateOnly(from), b = dateOnly(to);
  if (!a || !b) return null;
  return Math.round((b.getTime() - a.getTime()) / 86400000);
}

function transactionEconomicDate(tx) {
  return dateOnly(tx?.occurred_at || tx?.created_at);
}

function isOrdinaryIncome(tx) {
  return Number(tx?.amount) > 0 && String(tx?.transaction_type || "") === "income" && String(tx?.source_type || "") === "manual";
}

function isOrdinaryExpense(tx) {
  return Number(tx?.amount) < 0 && String(tx?.transaction_type || "") === "expense" && ["manual", "fixed_expense", "fixed_expense_legacy"].includes(String(tx?.source_type || "manual"));
}


function fixedPaymentForTransaction(tx, payments = state.fixedPayments || []) {
  if (!tx?.id) return null;
  return payments.find(p => p.transaction_id === tx.id) || null;
}

function isVoidedFixedTransaction(tx, payments = state.fixedPayments || []) {
  if (String(tx?.source_type || "") !== "fixed_expense") return false;
  const payment = fixedPaymentForTransaction(tx, payments);
  return Boolean(payment && (payment.status || "active") === "voided");
}

function isCountableExpense(tx, payments = state.fixedPayments || []) {
  return isOrdinaryExpense(tx) && !isVoidedFixedTransaction(tx, payments);
}

function createClientRequestId() {
  return globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(16).slice(2)}`;
}

function safeErrorMessage(error, fallback = "No se pudo completar la operación.") {
  const msg = String(error?.message || error || "");
  if (msg.includes("duplicate_transaction")) return "Ya existe un movimiento igual en esa fecha.";
  if (msg.includes("fixed_payment_duplicate")) return "Ese gasto fijo ya tiene un pago registrado para el período.";
  return msg && !/mock rpc/i.test(msg) ? msg : fallback;
}

function showInlineError(element, message) {
  if (!element) { showToast(message, true); return; }
  element.textContent = String(message || "Revisa los datos.");
  element.classList.add("visible");
}

function categoryById(categoryId) {
  return categories.find(c => c.id === categoryId) || null;
}

function accountIsSpendable(account) {
  return account?.available_for_spending !== false;
}

function allAccounts() {
  return state.accounts?.length ? state.accounts : (state.account ? [state.account] : []);
}

function spendableAccounts() {
  return allAccounts().filter(accountIsSpendable);
}

function totalAccountBalance() {
  return allAccounts().reduce((sum, account) => sum + Number(account.computed_balance ?? account.initial_balance ?? 0), 0);
}

function spendableAccountBalance() {
  return spendableAccounts().reduce((sum, account) => sum + Number(account.computed_balance ?? account.initial_balance ?? 0), 0);
}

function reservedAccountBalance() {
  return totalAccountBalance() - spendableAccountBalance();
}

function accountTypeLabel(type) {
  return type === "cash" ? "Efectivo" : type === "savings" ? "Ahorro" : "Banco";
}

function normalizeGoalPriority(priority) {
  return priority === "critical" ? "critical" : priority === "optional" ? "optional" : "important";
}

function latestMovementDate() {
  const values = (state.transactions || []).map(t => t.updated_at || t.occurred_at || t.created_at)
    .filter(Boolean).map(v => new Date(v)).filter(d => !Number.isNaN(d.getTime()));
  return values.length ? new Date(Math.max(...values.map(d => d.getTime()))) : null;
}

function latestReconciliationDate() {
  const values = [
    ...allAccounts().map(a => a.balance_reconciled_at),
    ...(state.reconciliations || []).map(r => r.created_at),
  ].filter(Boolean).map(v => new Date(v)).filter(d => !Number.isNaN(d.getTime()));
  return values.length ? new Date(Math.max(...values.map(d => d.getTime()))) : null;
}

function fixedPaymentForTemplateThisMonth(templateId, asOf = new Date()) {
  return (state.fixedPayments || []).find(p => p.fixed_template_id === templateId &&
    (p.status || "active") === "active" && sameCivilMonth(p.period_key || p.paid_on, asOf)) || null;
}

function fixedDueStatus(fixed, asOf = new Date()) {
  const dueDay = Number(fixed?.due_day) || null;
  if (!dueDay) return { dueDay: null, dueDate: null, overdue: false, dueToday: false, days: null, label: "Sin fecha de vencimiento" };
  const dueDate = dateForMonthDay(asOf.getFullYear(), asOf.getMonth(), dueDay);
  const today = dateOnly(asOf);
  const cmp = civilCompare(dueDate, today);
  const distance = Math.abs(civilDaysBetween(dueDate, today));
  if (cmp < 0) return { dueDay, dueDate, overdue: true, dueToday: false, days: distance, label: `Atrasado ${distance} día${distance === 1 ? "" : "s"}` };
  if (cmp === 0) return { dueDay, dueDate, overdue: false, dueToday: true, days: 0, label: "Vence hoy" };
  return { dueDay, dueDate, overdue: false, dueToday: false, days: distance, label: `Vence en ${distance} día${distance === 1 ? "" : "s"}` };
}


function activeBudgets(reference = new Date()) {
  const today = dateOnly(reference);
  return (state.budgets || []).filter(b => {
    const from = dateOnly(b.effective_from);
    const to = dateOnly(b.effective_to);
    return (!from || from <= today) && (!to || to > today);
  });
}

function budgetPlanningSummary() {
  const analysis = state.analysis;
  const income = Number(analysis?.cashFlow?.monthlyIncome) || 0;
  const declaredIncome = Number(analysis?.cashFlow?.declaredMonthlyIncome) || income;
  const fixed = Number(analysis?.cashFlow?.fixedPlan) || Number(analysis?.cashFlow?.fixedExpenses) || 0;
  const debtCommitment = Number(analysis?.cashFlow?.debtPlan) || Number(analysis?.debts?.monthlyCommitment) || 0;
  const goalCommitment = Number(analysis?.cashFlow?.goalPlan) || Number(analysis?.goals?.totalMonthlyPace) || 0;
  const variableSpent = Number(analysis?.cashFlow?.variableExpenses) || 0;
  const monthlyVariableCapacity = Math.round(income - fixed - debtCommitment - goalCommitment);
  const remainingVariableCapacity = Math.round(monthlyVariableCapacity - variableSpent);
  const allocated = Math.round(activeBudgets().reduce((sum, b) => sum + Number(b.amount || 0), 0));
  const capacityNegative = monthlyVariableCapacity < 0;
  const overallocatedAmount = Math.max(0, allocated - Math.max(0, monthlyVariableCapacity));
  const overallocated = overallocatedAmount > 0;
  return {
    income, declaredIncome, fixed, debtCommitment, goalCommitment, variableSpent,
    capacity: monthlyVariableCapacity,
    monthlyCapacity: monthlyVariableCapacity,
    monthlyVariableCapacity,
    remainingCapacity: remainingVariableCapacity,
    remainingVariableCapacity,
    capacityNegative,
    allocated,
    unassigned: Math.round(monthlyVariableCapacity - allocated),
    overallocated,
    overallocatedAmount,
  };
}

function budgetStatusList() {
  return activeBudgets().map(budget => {
    const category = categoryById(budget.category_id);
    const limit = Number(budget.amount) || 0;
    // spending.byCategory contiene solo gastos variables en v5.2.
    const spent = Number(state.analysis?.spending?.byCategory?.[budget.category_id]) || 0;
    const remaining = limit - spent;
    const ratio = limit > 0 ? spent / limit : 0;
    let status = "within";
    let label = "Dentro del plan";
    if (spent > limit) { status = "exceeded"; label = "Excedido"; }
    else if (spent === limit && limit > 0) { status = "reached"; label = "Límite alcanzado"; }
    else if (ratio >= 0.8) { status = "near"; label = "Cerca del límite"; }
    return { budget, category, limit, spent, remaining, ratio, status, label };
  });
}

function latestFinancialUpdate() {
  const values = [latestMovementDate(), latestReconciliationDate()].filter(Boolean);
  return values.length ? new Date(Math.max(...values.map(d => d.getTime()))) : null;
}

function dataQualityAssessment() {
  let earned = 0;
  let possible = 100;
  const issues = [];
  const blockers = [];
  const profile = state.profile || {};
  const reconciliation = latestReconciliationDate();
  const movement = latestMovementDate();

  if (allAccounts().length) earned += 20;
  else { issues.push("Falta registrar una cuenta y confirmar su saldo actual."); blockers.push("No hay una cuenta confirmada."); }

  if (reconciliation) earned += 10;
  else { issues.push("Confirma o concilia el saldo actual de tus cuentas."); blockers.push("El saldo no ha sido conciliado."); }

  if (Number(state.analysis?.cashFlow?.monthlyIncome) > 0 || Number(state.analysis?.cashFlow?.incomeReceived) > 0) earned += 20;
  else { issues.push("Falta confirmar tu ingreso o registrar lo recibido este mes."); blockers.push("No hay ingreso confirmado."); }

  if (profile.pay_frequency === "irregular" || profile.pay_day_1 || profile.pay_weekday != null) earned += 5;
  else issues.push("No has indicado cuándo esperas tu próximo cobro.");

  if (profile.fixed_expenses_confirmed === true) earned += 10;
  else { issues.push("Confirma tus gastos fijos, incluso si no tienes ninguno."); blockers.push("Los gastos fijos no están confirmados."); }

  if (profile.debts_confirmed === true) earned += 10;
  else { issues.push("Confirma tus deudas, incluso si no tienes ninguna."); blockers.push("Las deudas no están confirmadas."); }

  const uncategorized = Number(state.analysis?.spending?.uncategorized) || 0;
  if ((state.transactions || []).length > 0 && uncategorized <= 0) earned += 10;
  else if (uncategorized > 0) issues.push(`Hay ${money(uncategorized)} en gastos sin categoría.`);
  else issues.push("Aún no hay suficientes movimientos para validar la clasificación.");

  const incompleteDebts = (state.debts || []).filter(d => isDebtActive(d) && d.setup_state === "incomplete");
  if (profile.debts_confirmed && !incompleteDebts.length) earned += 5;
  else if (incompleteDebts.length) { issues.push(`${incompleteDebts.length} deuda(s) tienen datos por confirmar.`); blockers.push("Hay deudas con condiciones por confirmar."); }

  const updated = latestFinancialUpdate();
  const ageDays = updated ? Math.max(0, Math.floor((Date.now() - updated.getTime()) / 86400000)) : null;
  const reconcileAgeDays = reconciliation ? Math.max(0, Math.floor((Date.now() - reconciliation.getTime()) / 86400000)) : null;
  if (reconcileAgeDays != null && reconcileAgeDays <= 14) earned += 5;
  else if (reconcileAgeDays == null) issues.push("Aún no hay una conciliación de saldo registrada.");
  else { issues.push(`La última conciliación fue hace ${reconcileAgeDays} días.`); if (reconcileAgeDays > 30) blockers.push("El saldo lleva más de 30 días sin conciliarse."); }

  const plan = budgetPlanningSummary();
  if (plan.capacityNegative) issues.push(`Tu plan mensual tiene un déficit de ${money(Math.abs(plan.capacity))} antes de presupuestar categorías.`);
  else if (plan.overallocated) issues.push(`Tus presupuestos superan tu capacidad mensual por ${money(plan.overallocatedAmount)}.`);
  else if ((state.budgets || []).length > 0) earned += 5;
  else possible -= 5;

  const score = Math.max(0, Math.min(100, Math.round((earned / Math.max(1, possible)) * 100)));
  const label = score >= 80 ? "Alta" : score >= 55 ? "Media" : "Baja";
  return {
    score, label, issues, blockers: [...new Set(blockers)],
    decisionReady: blockers.length === 0,
    updatedAt: updated, lastMovementAt: movement, lastReconciledAt: reconciliation,
    ageDays, reconcileAgeDays, earned, possible,
  };
}

function buildUserAlerts() {
  const alerts = [];
  const today = dateOnly(new Date());
  const analysis = state.analysis;
  const freeToday = Number(analysis?.liquidity?.freeCashToday) || 0;
  const commitments = Number(analysis?.liquidity?.plannedCommitments) || 0;
  const spendable = Number(analysis?.liquidity?.balanceToday) || 0;
  if (freeToday < 0) alerts.push({
    level: "urgent", icon: "🔴",
    text: commitments > 0
      ? `Te faltan ${money(Math.abs(freeToday))} para cubrir ${money(commitments)} en compromisos pendientes con ${money(spendable)} disponibles hoy.`
      : `Tu saldo disponible está en ${money(spendable)}. Necesitas ${money(Math.abs(freeToday))} para volver a cero.`,
    action: commitments > 0 ? "commitments" : "accounts", tab: "inicio",
  });

  (state.fixed || []).forEach(f => {
    if (fixedPaymentForTemplateThisMonth(f.id, today)) return;
    const due = fixedDueStatus(f, today);
    if (due.overdue) alerts.push({ level:"urgent", icon:"⏰", text:`“${f.name}” está atrasado por ${due.days} día${due.days===1?"":"s"}.`, tab:"fijos" });
    else if (due.dueToday) alerts.push({ level:"important", icon:"⏰", text:`“${f.name}” vence hoy.`, tab:"fijos" });
  });

  (state.debts || []).filter(isDebtActive).forEach(d => {
    const due = dateOnly(d.next_due_date);
    if (due && due < today) {
      const days = Math.max(1, civilDaysBetween(due, today));
      alerts.push({ level: "urgent", icon: "⏰", text: `“${d.name}” está atrasada por ${days} día${days === 1 ? "" : "s"}.`, tab: "deudas" });
    }
  });

  budgetStatusList().forEach(s => {
    if (s.status === "exceeded") alerts.push({ level: "important", icon: "📊", text: `${s.category?.name || "Una categoría"} está excedida por ${money(Math.abs(s.remaining))}.`, tab: "presup" });
    else if (s.status === "near") alerts.push({ level: "info", icon: "🟡", text: `${s.category?.name || "Una categoría"} está al ${Math.floor(s.ratio * 100)}% de su límite.`, tab: "presup" });
  });

  const uncategorized = Number(analysis?.spending?.uncategorized) || 0;
  if (uncategorized > 0) alerts.push({ level: "important", icon: "🏷️", text: `Clasifica ${money(uncategorized)} en gastos para mejorar tus presupuestos.`, action:"uncategorized", tab: "gastos" });
  const plan = budgetPlanningSummary();
  if (plan.capacityNegative) alerts.push({ level: "urgent", icon: "⚠️", text: `Tu plan mensual proyecta un déficit de ${money(Math.abs(plan.capacity))}.`, tab: "presup" });
  else if (plan.overallocated) alerts.push({ level: "important", icon: "⚠️", text: `Has distribuido ${money(plan.overallocatedAmount)} más de tu capacidad mensual.`, tab: "presup" });
  return alerts.slice(0, 8);
}

function inferCategoryId(itemName) {
  const text = String(itemName || "").toLowerCase();
  const rules = [
    ["Comida", /comida|almuerzo|cena|desayuno|pizza|restaurante|supermercado|mercado|bebida/],
    ["Transporte", /gasolina|combustible|uber|taxi|pasaje|transporte|motor|moto|veh[ií]culo/],
    ["Vivienda", /casa|alquiler|mueble|electrodom[eé]stico|nevera|estufa|hogar/],
    ["Salud", /medicina|m[eé]dico|consulta|farmacia|salud/],
    ["Ocio", /juego|cine|fiesta|concierto|ocio|viaje|vacaciones/],
    ["Educación", /curso|libro|universidad|colegio|clase|educaci[oó]n/],
    ["Ropa", /tenis|zapatos|camisa|pantal[oó]n|ropa|gorra/],
  ];
  for (const [name, pattern] of rules) {
    if (pattern.test(text)) return categories.find(c => c.name === name)?.id || null;
  }
  return null;
}

function budgetImpactForPurchase(amount, categoryId) {
  if (!categoryId) return null;
  const budget = activeBudgets().find(b => b.category_id === categoryId);
  const category = categoryById(categoryId);
  if (!budget) return { categoryId, categoryName: category?.name || "Categoría", hasBudget: false };
  const spentBefore = Number(state.analysis?.spending?.byCategory?.[categoryId]) || 0;
  const limit = Number(budget.amount) || 0;
  const spentAfter = spentBefore + Math.max(0, Number(amount) || 0);
  return {
    categoryId,
    categoryName: category?.name || "Categoría",
    hasBudget: true,
    limit,
    spentBefore,
    spentAfter,
    remainingBefore: limit - spentBefore,
    remainingAfter: limit - spentAfter,
    exceededAfter: spentAfter > limit,
    reachedAfter: spentAfter === limit,
  };
}

function formatUpdateTime(value) {
  if (!value) return "Sin actividad registrada";
  return value.toLocaleString("es-DO", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
}

// Escapa texto escrito por el usuario antes de insertarlo en HTML.
// Sin esto, un nombre como: Tarjeta "Popular"  rompe los campos de
// edición, y cualquier símbolo < o & puede romper el renderizado.
function esc(str) {
  if (str == null) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// Aviso breve arriba de la pantalla, para confirmar que algo se guardó
// (antes, editar no daba ninguna señal de que había funcionado).
function showToast(msg, isError = false) {
  let toast = document.getElementById("toastMsg");
  if (!toast) {
    toast = document.createElement("div");
    toast.id = "toastMsg";
    toast.setAttribute("role", isError ? "alert" : "status");
    toast.setAttribute("aria-live", "polite");
    toast.style.cssText = "position:fixed; top:20px; left:50%; transform:translateX(-50%); color:white; padding:10px 18px; border-radius:20px; font-size:13px; z-index:1200; box-shadow:0 4px 14px rgba(0,0,0,0.18); opacity:0; transition:opacity 0.25s, background 0.15s; pointer-events:none; max-width:calc(100vw - 32px);";
    document.body.appendChild(toast);
  }
  toast.setAttribute("role", isError ? "alert" : "status");
  toast.style.background = isError ? "var(--danger-text)" : "var(--teal)";
  toast.textContent = msg;
  toast.style.opacity = "1";
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { toast.style.opacity = "0"; }, isError ? 3200 : 1800);
}

function showUndoToast(message, onUndo) {
  let toast = document.getElementById("undoToast");
  if (toast) toast.remove();
  toast = document.createElement("div");
  toast.id = "undoToast";
  toast.style.cssText = "position:fixed;left:16px;right:16px;bottom:82px;background:var(--text);color:white;padding:11px 12px;border-radius:12px;z-index:1000;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 6px 20px rgba(0,0,0,.22);";
  toast.innerHTML = `<span style="font-size:12px;">${esc(message)}</span><button id="undoToastBtn" style="background:none;color:white;font-size:12px;font-weight:600;text-decoration:underline;min-height:32px;">Deshacer</button>`;
  document.body.appendChild(toast);
  let active = true;
  const timer = setTimeout(() => { active = false; toast.remove(); }, 6500);
  document.getElementById("undoToastBtn").addEventListener("click", async () => {
    if (!active) return;
    active = false; clearTimeout(timer);
    const btn = document.getElementById("undoToastBtn"); if (btn) { btn.disabled = true; btn.textContent = "Deshaciendo…"; }
    try { await onUndo(); } finally { toast.remove(); }
  });
}

// Reemplaza el confirm() nativo del navegador (feo, fuera de estilo)
// por un modal propio, coherente con el resto de la app.
function confirmAction(message, confirmLabel = "Sí, continuar", danger = true) {
  return new Promise(resolve => {
    const modal = document.getElementById("confirmModal");
    if (!modal) { resolve(false); return; }
    if (activeConfirmation?.resolve) activeConfirmation.resolve(false);
    let settled = false;
    const finish = value => {
      if (settled) return;
      settled = true;
      modal.onclick = null;
      modal.classList.remove("visible");
      modal.innerHTML = "";
      if (activeConfirmation?.modal === modal) activeConfirmation = null;
      resolve(Boolean(value));
    };
    activeConfirmation = { resolve: finish, modal };
    modal.classList.add("visible");
    modal.setAttribute("role", "dialog");
    modal.setAttribute("aria-modal", "true");
    modal.innerHTML = `
      <div class="modal-box" role="document" style="text-align:center;">
        <p style="font-size:14px; margin:0 0 20px; line-height:1.5;">${esc(message).replace(/\n/g, "<br>")}</p>
        <div class="btn-row">
          <button class="btn-secondary" id="confirmNo">Cancelar</button>
          <button class="btn-primary" id="confirmYes" style="background:${danger ? "var(--danger-text)" : "var(--teal)"};">${esc(confirmLabel)}</button>
        </div>
      </div>`;
    document.getElementById("confirmNo")?.addEventListener("click", () => finish(false));
    document.getElementById("confirmYes")?.addEventListener("click", () => finish(true));
    modal.onclick = event => { if (event.target === modal) finish(false); };
    setTimeout(() => document.getElementById("confirmNo")?.focus(), 0);
  });
}
