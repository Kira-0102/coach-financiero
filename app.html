function purchaseVerdictPayload(analysis) {
  if (!analysis) return null;
  return {
    verdict: analysis.verdict,
    verdictLabel: analysis.verdictLabel,
    reason: analysis.reason,
    item: analysis.meta?.itemName ?? null,
    amount: analysis.meta?.amount ?? null,
    canBuyNow: analysis.affordability?.canBuyNow ?? null,
    canBuyAfterNextIncome: analysis.affordability?.canBuyAfterNextIncome ?? null,
    canAffordAfterNextIncome: analysis.affordability?.canAffordAfterNextIncome ?? null,
    requiresNextIncome: analysis.affordability?.requiresNextIncome ?? null,
    shouldBuy: analysis.judgment?.shouldBuy ?? null,
    isBestUseOfMoney: analysis.judgment?.isBestUseOfMoney ?? null,
    budgetImpact: analysis.budgetImpact || null,
  };
}

function coachDomainForMessage(message="") {
  const text=String(message).toLowerCase();
  if(/presupuesto|categor[ií]a|l[ií]mite/.test(text)) return "budgets";
  if(/deuda|pr[eé]stamo|tarjeta|cuota|inter[eé]s/.test(text)) return "debts";
  if(/meta|ahorr|objetivo/.test(text)) return "goals";
  if(/gasto|movimiento|compr[ée]|pag[ué]/.test(text)) return "spending";
  if(/saldo|disponible|libre|cobro|ingreso/.test(text)) return "cashflow";
  return "overview";
}

function buildCoachContext({ purchaseMode = false, purchaseAnalysis = null, message = "" } = {}) {
  const fa=state.analysis||computeAnalysis();
  const domain=coachDomainForMessage(message);
  const officialPurchase=purchaseAnalysis||coachPurchaseAnalysis||simulatorPurchaseAnalysis;
  const quality=dataQualityAssessment();
  const base={schemaVersion:fa?.schemaVersion??null,asOf:localISODate(),domain,
    availableToday:Math.round(Number(fa?.liquidity?.balanceToday)||0),
    totalAcrossAccounts:Math.round(Number(fa?.liquidity?.totalBalance)||0),
    reservedSavings:Math.round(Number(fa?.liquidity?.reservedBalance)||0),
    freeCashToday:Math.round(Number(fa?.liquidity?.freeCashToday)||0),
    monthlyPlanRemaining:Math.round(Number(fa?.cashFlow?.remainingBudget)||0),
    incomePlanned:Math.round(Number(fa?.cashFlow?.monthlyIncome)||0),
    incomeReceivedThisMonth:Math.round(Number(fa?.cashFlow?.incomeReceived)||0),
    futureIncomeProjected:Math.round(Number(fa?.cashFlow?.futureIncomeProjected)||0),
    nextPay:fa?.liquidity?.nextPay||null,
    dataQuality:{score:quality.score,label:quality.label,decisionReady:quality.decisionReady,issues:quality.issues,blockers:quality.blockers},
    lastPurchaseVerdict:purchaseVerdictPayload(officialPurchase)};
  if(purchaseMode) return base;
  if(domain==="budgets") return {...base,budgets:budgetStatusList().map(s=>({category:s.category?.name||"Categoría",limit:Math.round(s.limit),variableSpent:Math.round(s.spent),remaining:Math.round(s.remaining),status:s.status})),uncategorizedSpending:Math.round(Number(fa?.spending?.uncategorized)||0)};
  if(domain==="debts") return {...base,debtRisk:fa?.debts?.riskLevel||"none",debts:(fa?.debts?.sorted||[]).map(d=>({name:d.name,balance:Number(d.current_balance),rateLabel:debtRateLabel(d),monthlyPayment:monthlyPaymentEquivalent(Number(d.scheduled_payment??d.minimum_payment)||0,d.payment_frequency||"monthly"),nextDue:d.next_due_date||null,setupState:d.setup_state||"complete"}))};
  if(domain==="goals") return {...base,goalsAffordable:fa?.goals?.canAffordAllGoals!==false,goals:(fa?.goals?.byGoal||[]).map(g=>({name:g.name,target:Number(g.target_amount),saved:Number(g.current_amount),remaining:Math.max(0,Number(g.target_amount)-Number(g.current_amount)),monthlyPace:Math.round(Number(g.pace)||0),paidThisMonth:Math.round(Number(g.paidThisMonth)||0),pendingThisMonth:Math.round(Number(g.pendingThisMonth)||0),status:g.derivedStatus,priority:g.priority}))};
  if(domain==="spending") return {...base,variableExpenses:Math.round(Number(fa?.cashFlow?.variableExpenses)||0),byCategory:Object.fromEntries(Object.entries(fa?.spending?.byCategory||{}).map(([id,v])=>[categoryById(id)?.name||id,Math.round(Number(v)||0)])),uncategorizedSpending:Math.round(Number(fa?.spending?.uncategorized)||0)};
  return {...base,fixedPlan:Math.round(Number(fa?.cashFlow?.fixedPlan)||0),debtPlan:Math.round(Number(fa?.cashFlow?.debtPlan)||0),goalPlan:Math.round(Number(fa?.cashFlow?.goalPlan)||0)};
}

function containsPurchaseIntent(message) {
  return /\b(comprar|comprarlo|comprarla|comprarlos|comprarlas|comprarme|comprármelo|comprármela|comprármelos|comprármelas|adquirir|pagar\s+por)\b/i.test(String(message));
}

function isPurchaseFollowUpMsg(message) {
  return [
    /\bpuedo\s+comprar(?:lo|la|los|las|melo|mela|melos|melas)?\s+ahora\b/i,
    /\bpuedo\s+compr[aá]rme(?:lo|la|los|las)?\s+ahora\b/i,
    /\bcuando\s+cobre\b/i, /\bpr[oó]ximo\s+cobro\b/i, /\by\s+despu[eé]s\b/i,
    /\bentonces\s+s[ií]\b/i, /\bme\s+conviene\b/i, /\bpuedo\s+hacerlo\b/i,
    /\by\s+ahora\b/i, /\bcuando\s+me\s+paguen\b/i,
  ].some(pattern => pattern.test(String(message)));
}

function parseMoneyNumber(raw) {
  if (!raw) return null;
  const cleaned = String(raw).replace(/\s/g, "").replace(/[.,](?=\d{3}(?:\D|$))/g, "").replace(",", ".");
  const value = Number(cleaned);
  return Number.isFinite(value) && value > 0 ? value : null;
}

function extractMoneyAmounts(message, { allowBare = false } = {}) {
  const value = String(message || "");
  const patterns = [
    /(?:rd\$|dop\$?|rd\s*\$)\s*(\d[\d.,]*)/gi,
    /(\d[\d.,]*)\s*(?:pesos?|dop)\b/gi,
    /(?:cuesta|cuestan|vale|valen|sale|salen|precio(?:\s+es)?|son)\s*(?:rd\$|dop\$?)?\s*(\d[\d.,]*)/gi,
    /(?:de|por)\s+(?:rd\$|dop\$?)\s*(\d[\d.,]*)/gi,
  ];
  const amounts = [];
  for (const pattern of patterns) {
    for (const match of value.matchAll(pattern)) {
      const amount = parseMoneyNumber(match[1]);
      if (amount && !amounts.includes(amount)) amounts.push(amount);
    }
  }
  if (allowBare && amounts.length === 0 && /^\s*\d[\d.,\s]*\s*$/.test(value)) {
    const amount = parseMoneyNumber(value);
    if (amount) amounts.push(amount);
  }
  return amounts;
}

function extractMoneyAmount(message, options = {}) {
  const amounts = extractMoneyAmounts(message, options);
  return amounts.length === 1 ? amounts[0] : null;
}

function isPriceReply(message) {
  if (extractMoneyAmount(message, { allowBare: true }) && /^\s*(?:rd\$?\s*)?\d[\d.,\s]*(?:\s*(?:pesos?|dop))?\s*$/i.test(String(message))) return true;
  return extractMoneyAmount(message) != null && /\b(cuesta|cuestan|vale|valen|sale|salen|precio|son)\b/i.test(String(message));
}

function extractPurchaseItem(message) {
  const value = String(message || "").trim();
  // Las formas pronominales hacen referencia al artículo anterior.
  if (/\b(comprarlo|comprarla|comprarlos|comprarlas|comprármelo|comprármela|comprármelos|comprármelas)\b/i.test(value)) return null;
  const match = value.match(/(?:comprar|comprarme|adquirir|pagar\s+por)\s+(?:unos?|unas?|un|una|el|la)?\s*(.+)$/i);
  if (!match) return null;
  let item = match[1]
    .replace(/\s+(?:de|por)\s+(?:rd\$|dop\$?)\s*\d[\d.,]*.*$/i, "")
    .replace(/[?.!,]+$/g, "")
    .trim();
  return item && !/^(ahora|despu[eé]s|cuando\s+cobre)$/i.test(item) ? item : null;
}

function expireCoachPurchaseContext() {
  if (coachPurchaseContext.updatedAtTurn !== null && coachTurnCounter - coachPurchaseContext.updatedAtTurn > 6) {
    resetCoachPurchaseContext();
  }
}

function updateCoachPurchaseContext(message) {
  expireCoachPurchaseContext();
  const explicitAmounts = extractMoneyAmounts(message);
  const followUp = isPurchaseFollowUpMsg(message);
  const hasIntent = containsPurchaseIntent(message);

  if (explicitAmounts.length > 1) {
    coachPurchaseContext.awaitingAmount = true;
    coachPurchaseContext.amount = null;
    coachPurchaseContext.updatedAtTurn = coachTurnCounter;
    coachPurchaseAnalysis = null;
    return { ambiguousOptions: true, followUp, hasIntent };
  }

  if (hasIntent) {
    const itemName = extractPurchaseItem(message);
    const amount = explicitAmounts[0] || null;
    if (itemName && coachPurchaseContext.itemName && itemName.toLowerCase() !== coachPurchaseContext.itemName.toLowerCase()) {
      resetCoachPurchaseContext();
    }
    if (itemName) {
      coachPurchaseContext.itemName = itemName;
      const inferred = inferCategoryId(itemName);
      coachPurchaseContext.categoryId = inferred || null;
      coachPurchaseContext.categoryWasInferred = Boolean(inferred);
    }
    if (amount) {
      coachPurchaseContext.amount = amount;
      coachPurchaseContext.awaitingAmount = false;
    } else if (!coachPurchaseContext.amount) {
      coachPurchaseContext.awaitingAmount = true;
    }
    coachPurchaseContext.updatedAtTurn = coachTurnCounter;
  } else if (coachPurchaseContext.awaitingAmount && isPriceReply(message)) {
    const amount = extractMoneyAmount(message, { allowBare: true });
    if (amount) {
      coachPurchaseContext.amount = amount;
      coachPurchaseContext.awaitingAmount = false;
      coachPurchaseContext.updatedAtTurn = coachTurnCounter;
    }
  } else if (followUp && coachPurchaseContext.amount) {
    coachPurchaseContext.updatedAtTurn = coachTurnCounter;
  }

  return { ambiguousOptions: false, followUp, hasIntent };
}

function buildLocalPurchaseCoachReply(message, interactionType, analysis) {
  if (interactionType === "clarify_purchase_option") {
    return "Mencionaste varios precios. Dime cuál monto exacto quieres analizar.";
  }
  if (interactionType === "clarify_purchase") {
    const item = coachPurchaseContext.itemName ? ` para ${coachPurchaseContext.itemName}` : "";
    return `¿Cuánto cuesta${item}?`;
  }
  if (interactionType !== "purchase_followup" || !analysis) return null;

  const text = String(message || "");
  const a = analysis.affordability || {};
  const j = analysis.judgment || {};
  const item = analysis.meta?.itemName || "esa compra";
  const amount = money(analysis.meta?.amount || 0);

  if (/\b(ahora|hoy)\b/i.test(text)) {
    if (a.canBuyNow) {
      return j.shouldBuy
        ? `Sí, puedes pagar ${item} por ${amount} hoy. El motor indica que tus compromisos quedan cubiertos. ${analysis.reason}`
        : `Puedes pagarlo hoy físicamente, pero el motor no lo recomienda como mejor decisión. ${analysis.reason}`;
    }
    return `No puedes pagarlo hoy con el saldo real disponible. ${analysis.reason}`;
  }

  if (/\b(cobre|cobro|paguen|despu[eé]s)\b/i.test(text)) {
    if (a.canAffordAfterNextIncome) {
      return j.shouldBuy
        ? `Después del próximo cobro el saldo proyectado sí cubriría ${item} por ${amount}. Aun así, espera a que el dinero entre realmente. ${analysis.reason}`
        : `Después del próximo cobro podrías cubrir el precio, pero eso no significa que sea recomendable. ${analysis.reason}`;
    }
    return `No. Ni con el próximo cobro proyectado alcanza para cubrir ${item} por ${amount}. ${analysis.reason}`;
  }

  if (/\b(conviene|recomiend|mejor|deber[ií]a)\b/i.test(text)) {
    if (j.shouldBuy && j.isBestUseOfMoney) return `Sí. El motor considera que puedes comprarlo y que es un uso razonable del dinero. ${analysis.reason}`;
    if (a.canBuyNow || a.canAffordAfterNextIncome) return `Podrías llegar a pagarlo, pero el motor no lo considera tu mejor uso del dinero ahora. ${analysis.reason}`;
    return `No es recomendable porque la compra no es financieramente viable con tu liquidez actual ni proyectada. ${analysis.reason}`;
  }

  return `${analysis.verdictLabel}. ${analysis.reason}`;
}

async function invokeCoach(payload, timeoutMs = 30000) {
  const request = supabase.functions.invoke("coach-chat", { body: payload });
  const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), timeoutMs));
  return Promise.race([request, timeout]);
}

async function sendCoachMessage() {
  if (coachSending) return;
  const input = document.getElementById("coachInput");
  const msg = input?.value.trim();
  if (!msg) return;

  coachError = "";
  coachSending = true;
  coachTurnCounter += 1;
  const wasAwaitingAmount = coachPurchaseContext.awaitingAmount;
  const contextUpdate = updateCoachPurchaseContext(msg);
  const priceReply = wasAwaitingAmount && isPriceReply(msg);
  const purchaseRelated = contextUpdate.hasIntent || contextUpdate.followUp || priceReply || contextUpdate.ambiguousOptions;
  const hasResolvedPurchase = Number(coachPurchaseContext.amount) > 0;

  if (purchaseRelated && hasResolvedPurchase && state.analysis) {
    coachPurchaseAnalysis = buildPurchaseAnalysis(
      state.analysis,
      coachPurchaseContext.amount,
      coachPurchaseContext.itemName || "Compra consultada",
      coachPurchaseContext.categoryId || null
    );
  }

  let interactionType = "general";
  if (contextUpdate.ambiguousOptions) interactionType = "clarify_purchase_option";
  else if (purchaseRelated && hasResolvedPurchase) interactionType = "purchase_followup";
  else if (purchaseRelated) interactionType = "clarify_purchase";

  coachHistory.push({ role: "user", content: msg });
  if (coachHistory.length > 20) coachHistory = coachHistory.slice(-20);
  input.value = "";

  let localPurchaseReply = buildLocalPurchaseCoachReply(msg, interactionType, coachPurchaseAnalysis);
  if (localPurchaseReply && interactionType === "purchase_followup" && coachPurchaseContext.categoryWasInferred && coachPurchaseAnalysis?.meta?.categoryName) {
    localPurchaseReply += ` La clasifiqué provisionalmente como ${coachPurchaseAnalysis.meta.categoryName}; puedes confirmarla en ¿Lo compro?.`;
  }
  if (localPurchaseReply) {
    coachHistory.push({ role: "assistant", content: localPurchaseReply });
    coachSending = false;
    renderApp();
    return;
  }

  renderApp();
  document.getElementById("coachTyping")?.style.setProperty("display", "block");
  try {
    const { data, error } = await invokeCoach({
      message: msg,
      history: coachHistory.slice(0, -1).slice(-10),
      context: buildCoachContext({ purchaseMode: interactionType.startsWith("purchase") || interactionType.startsWith("clarify_purchase"), purchaseAnalysis: coachPurchaseAnalysis, message: msg }),
      interaction: { type: interactionType, source: "coach", awaitingAmount: coachPurchaseContext.awaitingAmount },
    });
    if (error || data?.error) throw new Error(data?.error || error?.message || "coach_error");
    if (typeof data?.reply !== "string" || !data.reply.trim()) throw new Error("invalid_reply");
    coachHistory.push({ role: "assistant", content: data.reply.trim() });
  } catch (error) {
    coachError = error?.message === "timeout"
      ? "El coach tardó demasiado en responder. Intenta de nuevo."
      : "No se pudo conectar con el coach. Revisa tu conexión e intenta de nuevo.";
  } finally { coachSending = false; }
  renderApp();
}

function wireCoach() {
  const sendBtn = document.getElementById("coachSendBtn");
  const input = document.getElementById("coachInput");
  if (!sendBtn || !input) return;
  sendBtn.addEventListener("click", sendCoachMessage);
  input.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      sendCoachMessage();
    }
  });
  const messages = document.getElementById("coachMessages");
  if (messages) messages.scrollTop = messages.scrollHeight;
}

// ================================================================
// MOTOR DE DECISIÓN v2 — buildPurchaseAnalysis(financialAnalysis, amount, itemName)
// Fuente única de verdad. La UI y el Coach consumen este objeto.
// Nunca inventar información — si no hay datos, decirlo explícito.
// ================================================================
function scoreLabel(s) {
  return s >= 80 ? "Excelente" : s >= 60 ? "Buena" : s >= 40 ? "Moderada" : s >= 20 ? "Baja" : "Muy baja";
}

function buildPurchaseAnalysis(financialAnalysis, amount, itemName, categoryId = null) {
  const purchaseAmount = Math.max(0, Number(amount) || 0);
  const fa = financialAnalysis;
  const resolvedCategoryId = categoryId || inferCategoryId(itemName);
  const budgetImpact = budgetImpactForPurchase(purchaseAmount, resolvedCategoryId);

  if (!fa?.liquidity || !fa?.cashFlow) {
    return {
      verdict: "neutral", score: 0, stars: 0, verdictLabel: "", reason: "",
      summary: "Completa tu perfil para analizar una compra.", coachPrompt: "",
      purchaseAnalysis: null,
      dimensions: {
        liquidez: { score: 0, label: "Sin datos", msg: "Completa tu perfil financiero." },
        deudas: { score: 0, label: "Sin datos", msg: "Completa tu perfil financiero." },
        metas: { score: 0, label: "Sin datos", msg: "Completa tu perfil financiero." },
        habitos: { score: 0, label: "Sin datos", msg: "Todavía no hay suficiente historial." },
        bienestar: { score: 0, label: "Sin datos", msg: "Completa tu perfil financiero." },
        presupuesto: { score: 0, label: "Sin datos", msg: "Selecciona una categoría para evaluarlo." },
        oportunidad: { title: "", items: [] },
      },
      actions: { canBuy: false, registerPurchase: false, saveWishlist: false },
      affordability: { canBuyNow: false, canBuyAfterNextIncome: false },
      judgment: { shouldBuy: false, isBestUseOfMoney: false, verdict: "neutral" },
      budgetImpact,
      meta: { amount: purchaseAmount, itemName, categoryId: resolvedCategoryId, balAfter: null, dispRestante: null, afterPurch: null },
    };
  }

  const { liquidity, cashFlow, goals, debts, financialHealth, recommendations } = fa;
  const bal = Number(liquidity.balanceToday) || 0;
  const projectedBalance = liquidity.projectedBalance == null ? null : Number(liquidity.projectedBalance);
  const nextPay = liquidity.nextPay;
  const daysLeft = Math.max(1, Number(liquidity.daysLeftInMonth) || 1);
  const balanceAfterToday = bal - purchaseAmount;
  const balanceAfterProjected = projectedBalance == null ? null : projectedBalance - purchaseAmount;
  const freeCashAfterToday = Number(liquidity.freeCashToday || 0) - purchaseAmount;
  const freeCashAfterProjected = liquidity.freeCashProjected == null
    ? null
    : Number(liquidity.freeCashProjected) - purchaseAmount;
  const remainingBudgetAfter = Number(cashFlow.remainingBudget || 0) - purchaseAmount;
  const operatingSurplusAfter = Number(cashFlow.operatingSurplus || 0) - purchaseAmount;

  // Faltantes separados: capacidad matemática de pagar vs. capacidad de
  // preservar compromisos. Nunca mezclar saldo proyectado con dinero libre.
  const purchaseShortfallToday = Math.max(0, purchaseAmount - bal);
  const purchaseShortfallProjected = projectedBalance == null
    ? purchaseAmount
    : Math.max(0, purchaseAmount - projectedBalance);
  const freeCashShortfallToday = Math.max(0, -freeCashAfterToday);
  const freeCashShortfallProjected = freeCashAfterProjected == null
    ? null
    : Math.max(0, -freeCashAfterProjected);

  const canBuyToday = purchaseAmount > 0 && bal >= purchaseAmount;
  const canAffordAfterNextIncome = purchaseAmount > 0 && projectedBalance !== null && projectedBalance >= purchaseAmount;
  const requiresNextIncome = !canBuyToday && canAffordAfterNextIncome;
  // Compatibilidad: este campo histórico significa "requiere el próximo cobro".
  const canBuyAfterNextIncome = requiresNextIncome;
  const criticalDebt = debts?.riskLevel === "critical";
  const goalsAtRisk = (goals?.byGoal || []).some(g => g.derivedStatus === "at_risk");
  const commitmentsCoveredToday = freeCashAfterToday >= 0;
  const commitmentsCoveredProjected = freeCashAfterProjected !== null && freeCashAfterProjected >= 0;
  const goalsCovered = goals?.canAffordAllGoals !== false && !goalsAtRisk;

  // 1. LIQUIDEZ
  let liqS, liqLabel, liqMsg;
  if (purchaseAmount === 0) {
    liqS = 100; liqLabel = "—";
    liqMsg = "Ingresa un monto para ver el análisis de liquidez.";
  } else if (canBuyToday && commitmentsCoveredToday) {
    const pct = balanceAfterToday / Math.max(1, bal);
    liqS = pct >= 0.6 ? 90 : pct >= 0.4 ? 75 : pct >= 0.2 ? 60 : pct >= 0.05 ? 45 : 30;
    liqLabel = scoreLabel(liqS);
    liqMsg = `Puedes pagarla hoy. Te quedarían ${money(Math.round(balanceAfterToday))} en la cuenta y ${money(Math.round(freeCashAfterToday))} libres después de tus compromisos planificados.`;
  } else if (canBuyToday) {
    liqS = 30; liqLabel = "Comprometida";
    liqMsg = `Tienes el dinero en la cuenta, pero la compra usaría ${money(Math.abs(Math.round(freeCashAfterToday)))} reservado para deudas o metas. Puedes pagarla físicamente, pero no sin afectar compromisos.`;
  } else if (canBuyAfterNextIncome) {
    liqS = commitmentsCoveredProjected ? (nextPay?.daysAway <= 5 ? 55 : nextPay?.daysAway <= 15 ? 45 : 35) : 25;
    liqLabel = scoreLabel(liqS);
    const projectedFreeText = freeCashAfterProjected == null
      ? "sin cálculo de dinero libre"
      : `${money(Math.round(freeCashAfterProjected))} libres después de compromisos`;
    liqMsg = `Hoy no tienes ${money(purchaseAmount)} en cuenta (saldo: ${money(bal)}). Después de tu próximo cobro de ${money(nextPay?.amount || 0)} el saldo sería ${money(projectedBalance)}; tras la compra quedarían ${money(balanceAfterProjected)} en cuenta y ${projectedFreeText}. ${commitmentsCoveredProjected ? "La compra sería posible entonces, no hoy." : "El saldo alcanzaría, pero tus compromisos planificados quedarían sin cubrir."}`;
  } else {
    liqS = 5; liqLabel = "Muy baja";
    if (nextPay) {
      const faltante = Math.max(0, purchaseAmount - Number(projectedBalance || 0));
      liqMsg = `Hoy tienes ${money(bal)}. Después de tu próximo cobro de ${money(nextPay.amount)} tendrías ${money(projectedBalance || 0)} y todavía faltarían ${money(faltante)}.`;
    } else {
      liqMsg = `Hoy no tienes ${money(purchaseAmount)} en cuenta (saldo: ${money(bal)}) y no hay un próximo cobro configurado para proyectar la compra.`;
    }
  }

  // 2. DEUDAS
  let debtS, debtLabel, debtMsg;
  const topDebt = debts?.topDebt || null;
  if (!topDebt) {
    debtS = 90; debtLabel = "Sin deudas";
    debtMsg = "No tienes deudas activas registradas.";
  } else if (criticalDebt) {
    debtS = 25; debtLabel = "Alta prioridad";
    debtMsg = `Tienes una deuda con "${topDebt.name}" al ${topDebt.interest_rate}% anual. Esta compra nunca puede recibir verde mientras esa deuda siga activa.`;
  } else if (debts.riskLevel === "high") {
    debtS = 50; debtLabel = "Moderada";
    debtMsg = `Tu deuda activa de mayor tasa está al ${topDebt.interest_rate}% anual. Conviene evaluar si la compra puede esperar.`;
  } else {
    debtS = 75; debtLabel = "Manejable";
    debtMsg = "Tus deudas activas no presentan una tasa crítica.";
  }

  // 3. METAS Y PRESUPUESTO MENSUAL
  let goalsS, goalsLabel, goalsMsg;
  const activeGoals = goals?.active || [];
  if (activeGoals.length === 0) {
    goalsS = 80; goalsLabel = "Sin metas";
    goalsMsg = "No tienes metas activas registradas.";
  } else if (purchaseAmount === 0) {
    goalsS = 80; goalsLabel = "—";
    goalsMsg = "Ingresa un monto para ver el impacto en tus metas.";
  } else if (remainingBudgetAfter >= 0) {
    goalsS = goalsAtRisk ? 65 : 90;
    goalsLabel = goalsAtRisk ? "Con atención" : "Excelente";
    goalsMsg = `En tu plan mensual, después de la compra quedarían ${money(Math.round(remainingBudgetAfter))} luego de cubrir gastos, deudas y aportes a metas. Esto describe presupuesto mensual, no dinero disponible hoy.`;
  } else if (operatingSurplusAfter >= 0) {
    goalsS = 40; goalsLabel = "Baja";
    goalsMsg = `La compra cabe dentro del ingreso mensual, pero dejaría un faltante de ${money(Math.abs(Math.round(remainingBudgetAfter)))} para tus deudas o metas planificadas.`;
  } else {
    goalsS = 15; goalsLabel = "Muy baja";
    goalsMsg = `La compra supera en ${money(Math.abs(Math.round(operatingSurplusAfter)))} el margen operativo del mes antes de completar tus compromisos.`;
  }

  // 4. PRESUPUESTO DE CATEGORÍA
  let budgetS = null, budgetLabel = "Sin categoría", budgetMsg = "Selecciona una categoría para comparar la compra con su presupuesto.";
  if (budgetImpact?.hasBudget) {
    if (budgetImpact.exceededAfter) {
      budgetS = 25; budgetLabel = "Excedido";
      budgetMsg = `En ${budgetImpact.categoryName} llevas ${money(budgetImpact.spentBefore)}. Con esta compra subirías a ${money(budgetImpact.spentAfter)} y excederías el límite por ${money(Math.abs(budgetImpact.remainingAfter))}.`;
    } else if (budgetImpact.reachedAfter) {
      budgetS = 60; budgetLabel = "Límite alcanzado";
      budgetMsg = `La compra consumiría exactamente todo el presupuesto de ${budgetImpact.categoryName}.`;
    } else {
      budgetS = 90; budgetLabel = "Dentro del plan";
      budgetMsg = `Después de la compra quedarían ${money(budgetImpact.remainingAfter)} en el presupuesto de ${budgetImpact.categoryName}.`;
    }
  } else if (budgetImpact && !budgetImpact.hasBudget) {
    budgetS = null; budgetLabel = "Sin límite";
    budgetMsg = `${budgetImpact.categoryName} no tiene un presupuesto configurado. La compra se evalúa con tu liquidez y plan mensual general.`;
  }

  // 5. HÁBITOS
  const habitsS = null;
  const habitsLabel = "Sin datos";
  const habitsMsg = "Todavía no hay suficiente historial para detectar patrones de comportamiento.";

  // 6. BIENESTAR
  let wellS, wellLabel, wellMsg;
  const healthScore = Number(financialHealth?.score);
  const healthy = Number.isFinite(healthScore) && healthScore >= 60;
  if (purchaseAmount === 0) {
    wellS = 80; wellLabel = "—";
    wellMsg = "Ingresa un monto para evaluar el impacto en tu bienestar financiero.";
  } else if (canBuyToday && commitmentsCoveredToday && remainingBudgetAfter >= 0 && healthy) {
    wellS = 90; wellLabel = "Excelente";
    wellMsg = "Puedes pagarla hoy sin dejar descubiertos tus compromisos y tu salud financiera se mantiene estable.";
  } else if (canBuyToday && commitmentsCoveredToday) {
    wellS = 60; wellLabel = "Buena";
    wellMsg = "La compra es posible hoy, aunque reduce tu margen. Mantén controlados los gastos variables restantes.";
  } else if (canBuyAfterNextIncome && commitmentsCoveredProjected && remainingBudgetAfter >= 0) {
    wellS = healthy ? 65 : 50;
    wellLabel = healthy ? "Buena" : "Moderada";
    wellMsg = "No es posible hoy, pero podría ser viable después del próximo cobro. Espera a que el dinero esté realmente en la cuenta.";
  } else {
    wellS = 25; wellLabel = "Baja";
    wellMsg = "La compra reduciría demasiado tu margen o dejaría compromisos sin cubrir.";
  }

  const scoreParts = purchaseAmount === 0 ? [] : [
    [liqS, 0.32], [debtS, 0.18], [goalsS, 0.20], [wellS, 0.12],
    ...(Number.isFinite(Number(budgetS)) ? [[budgetS, 0.18]] : []),
  ];
  const scoreWeight = scoreParts.reduce((sum, part) => sum + part[1], 0);
  const rawScore = scoreWeight > 0 ? scoreParts.reduce((sum, [value, weight]) => sum + Number(value) * weight, 0) / scoreWeight : 0;
  const quality = dataQualityAssessment();
  const qualityFactor = 0.70 + (Math.max(0, Math.min(100, quality.score)) / 100) * 0.30;
  const score = Math.round(rawScore * qualityFactor);

  const categoryBudgetCovered = !budgetImpact?.hasBudget || !budgetImpact.exceededAfter;
  const shouldBuy = quality.decisionReady && canBuyToday && commitmentsCoveredToday && remainingBudgetAfter >= 0 && goalsCovered && !criticalDebt && categoryBudgetCovered;
  const strategicPriority = recommendations?.nextBestAction || null;
  const isBestUseOfMoney = shouldBuy && (!strategicPriority || Number(strategicPriority.impact || 0) < 90);

  let verdict;
  if (purchaseAmount === 0) verdict = "neutral";
  else if (!canBuyToday && canBuyAfterNextIncome) verdict = "yellow";
  else if (!canBuyToday) verdict = "red";
  else if (!quality.decisionReady) verdict = "yellow";
  else if (!shouldBuy || !isBestUseOfMoney) verdict = "yellow";
  else verdict = "green";

  const stars = verdict === "neutral" || verdict === "red" ? 0 : score >= 85 ? 5 : score >= 70 ? 4 : score >= 55 ? 3 : score >= 40 ? 2 : 1;

  let verdictLabel, reason;
  if (verdict === "neutral") {
    verdictLabel = ""; reason = "";
  } else if (verdict === "green") {
    verdictLabel = "🟢 Compra recomendable";
    reason = `Puedes pagarla hoy, tus compromisos quedan cubiertos y no existe una prioridad financiera más urgente.`;
  } else if (!canBuyToday && canBuyAfterNextIncome) {
    if (criticalDebt) {
      verdictLabel = "🟡 Viable cuando cobres, pero la deuda es prioritaria";
      reason = `El saldo proyectado cubriría ${money(purchaseAmount)} después del próximo cobro, pero tienes una deuda al ${topDebt?.interest_rate}% anual. Espera a recibir el dinero y prioriza reducir esa deuda.`;
    } else if (!commitmentsCoveredProjected || remainingBudgetAfter < 0 || !goalsCovered) {
      verdictLabel = "🟡 El saldo alcanzaría cuando cobres, pero compromete tu plan";
      const uncovered = Math.max(
        0,
        Number(freeCashShortfallProjected || 0),
        Math.max(0, -remainingBudgetAfter)
      );
      reason = `Hoy no puedes pagarla. Después del próximo cobro el saldo proyectado sería ${money(projectedBalance || 0)} y quedaría ${money(balanceAfterProjected || 0)} tras la compra, pero faltarían ${money(Math.round(uncovered))} para mantener cubiertos tus compromisos o presupuesto mensual.`;
    } else {
      verdictLabel = "🟡 Viable cuando cobres";
      reason = `Hoy tienes ${money(bal)}. Después de tu próximo cobro de ${money(nextPay?.amount || 0)} tendrías ${money(projectedBalance || 0)}; tras pagar ${money(purchaseAmount)} quedarían ${money(balanceAfterProjected || 0)} en la cuenta y ${money(freeCashAfterProjected || 0)} libres después de compromisos. Espera a recibir el dinero; hoy no está disponible.`;
    }
  } else if (!canBuyToday) {
    verdictLabel = "🔴 No alcanza";
    if (nextPay) {
      const extraCommitmentText = freeCashShortfallProjected && freeCashShortfallProjected > purchaseShortfallProjected
        ? ` Para preservar compromisos, el faltante financiero sería ${money(freeCashShortfallProjected)}.`
        : "";
      reason = `Hoy tienes ${money(bal)}. Después de tu próximo cobro tendrías ${money(projectedBalance || 0)} y aún faltarían ${money(purchaseShortfallProjected)} para efectuar la compra.${extraCommitmentText}`;
    } else {
      reason = `Hoy tienes ${money(bal)} y no hay un próximo cobro configurado que permita cubrir la compra.`;
    }
  } else if (!quality.decisionReady) {
    verdictLabel = "🟡 Posible, pero faltan datos por confirmar";
    reason = `La cuenta parece cubrir la compra, pero no damos un resultado verde porque ${quality.blockers[0] || "faltan datos financieros importantes"}. Revisa la calidad de tus datos antes de decidir.`;
  } else if (budgetImpact?.hasBudget && budgetImpact.exceededAfter) {
    verdictLabel = "🟡 Puedes pagarla, pero excede tu presupuesto";
    reason = `La cuenta cubre la compra, pero el presupuesto de ${budgetImpact.categoryName} quedaría excedido por ${money(Math.abs(budgetImpact.remainingAfter))}.`;
  } else if (criticalDebt) {
    verdictLabel = "🟡 Puedes pagarla, pero la deuda es prioritaria";
    reason = `El dinero está hoy en la cuenta, pero tienes una deuda al ${topDebt?.interest_rate}% anual. Financiera y estratégicamente, reducir esa deuda es un mejor uso del dinero.`;
  } else if (!commitmentsCoveredToday || remainingBudgetAfter < 0) {
    verdictLabel = "🟡 Puedes pagarla, pero compromete tu plan";
    reason = `La cuenta cubre la compra, pero dejarías sin cubrir ${money(Math.max(0, Math.abs(Math.round(Math.min(freeCashAfterToday, remainingBudgetAfter)))))} de compromisos o presupuesto mensual.`;
  } else {
    verdictLabel = "🟡 Viable, pero no es tu mejor uso del dinero";
    reason = strategicPriority
      ? `${strategicPriority.label} tiene mayor impacto financiero en este momento.`
      : "La compra es posible, pero conviene preservar más margen.";
  }

  const opportunityItems = [];
  let opportunityTitle = "";
  if (purchaseAmount > 0 && canBuyToday) {
    opportunityTitle = `Con ${money(purchaseAmount)} también podrías:`;
    if (topDebt && Number(topDebt.interest_rate) > 0) {
      const interesAhorro = Math.round(purchaseAmount * (Number(topDebt.interest_rate) / 100 / 12));
      opportunityItems.push({ stars: 5, text: `Abonar ${money(purchaseAmount)} a tu deuda "${topDebt.name}"`, reason: `Reducirías intereses y saldo pendiente; el ahorro estimado del primer mes sería ~${money(interesAhorro)}.` });
    }
    const topGoal = goals?.byGoal?.[0];
    if (topGoal) {
      const falta = Math.max(0, Number(topGoal.target_amount) - Number(topGoal.current_amount));
      if (purchaseAmount <= falta) opportunityItems.push({ stars: 4, text: `Aportar ${money(purchaseAmount)} a tu meta "${topGoal.name}"`, reason: "Acelerarías el progreso del objetivo." });
    }
    const fixedExpenses = Number(cashFlow.fixedExpenses) || 0;
    if (fixedExpenses > 0) {
      const emergencyTarget = fixedExpenses * 3;
      const emergencyGoal = [...(goals?.active || []), ...(goals?.completed || [])]
        .find(g => g.name?.toLowerCase().includes("emergencia"));
      const emergencySaved = emergencyGoal ? Number(emergencyGoal.current_amount) || 0 : 0;
      if (emergencySaved < emergencyTarget) {
        opportunityItems.push({ stars: 3, text: "Fortalecer tu fondo de emergencia", reason: `Meta de referencia: ${money(emergencyTarget)}. Has registrado ${money(emergencySaved)} en una meta de emergencia.` });
      }
    }
  } else if (purchaseAmount > 0) {
    opportunityTitle = "Antes de comprar, considera:";
    if (canBuyAfterNextIncome) {
      opportunityItems.push({ stars: 5, text: "Esperar al próximo cobro", reason: "La compra sería posible después de que el dinero entre realmente a la cuenta." });
    } else {
      const shortfall = Math.max(0, purchaseAmount - Math.max(0, bal));
      opportunityItems.push({
        stars: 5,
        text: bal < 0 ? "Recuperar un saldo positivo" : `Aumentar tu saldo en ${money(shortfall)}`,
        reason: bal < 0
          ? `Tu saldo actual es ${money(bal)}; primero necesitas estabilizar la liquidez.`
          : `Tu saldo es positivo, pero todavía faltan ${money(shortfall)} para pagar esta compra hoy.`,
      });
    }
  }

  const itemText = itemName ? `"${itemName}"` : "un artículo";
  const purchaseAnalysisForCoach = purchaseAmount > 0 ? {
    item: itemText,
    amount: purchaseAmount,
    verdict,
    verdictLabel,
    reason,
    score,
    affordability: {
      canBuyNow: canBuyToday,
      canBuyAfterNextIncome,
      canAffordAfterNextIncome,
      requiresNextIncome,
      balanceAfterToday,
      balanceAfterProjected,
      freeCashAfterToday,
      freeCashAfterProjected,
      purchaseShortfallToday,
      purchaseShortfallProjected,
      freeCashShortfallToday,
      freeCashShortfallProjected,
    },
    judgment: { shouldBuy, isBestUseOfMoney },
    dataQuality: { score: quality.score, label: quality.label, decisionReady: quality.decisionReady, blockers: quality.blockers },
    budgetImpact,
    dimensions: {
      liquidez: { score: liqS, msg: liqMsg },
      deudas: { score: debtS, msg: debtMsg },
      metas: { score: goalsS, msg: goalsMsg },
      bienestar: { score: wellS, msg: wellMsg },
      presupuesto: { score: budgetS, msg: budgetMsg },
    },
  } : null;

  const coachPrompt = purchaseAmount > 0
    ? `Resultado del motor de decisión (VEREDICTO OFICIAL — no recalcules ni contradigas):\n\n${JSON.stringify(purchaseAnalysisForCoach)}\n\nExplica el resultado y las alternativas usando únicamente estos datos.`
    : "";

  return {
    verdict, score, stars, verdictLabel, reason,
    summary: purchaseAmount === 0 ? "Ingresa el monto para analizar la compra." : reason,
    coachPrompt,
    purchaseAnalysis: purchaseAnalysisForCoach,
    affordability: {
      canBuyNow: canBuyToday,
      canBuyAfterNextIncome,
      canAffordAfterNextIncome,
      requiresNextIncome,
      balanceAfterToday,
      balanceAfterProjected,
      freeCashAfterToday,
      freeCashAfterProjected,
      purchaseShortfallToday,
      purchaseShortfallProjected,
      freeCashShortfallToday,
      freeCashShortfallProjected,
    },
    judgment: {
      shouldBuy,
      isBestUseOfMoney,
      verdict,
      nextBestAction: strategicPriority,
    },
    dimensions: {
      liquidez: { score: liqS, label: liqLabel, msg: liqMsg },
      deudas: { score: debtS, label: debtLabel, msg: debtMsg },
      metas: { score: goalsS, label: goalsLabel, msg: goalsMsg },
      habitos: { score: habitsS, label: habitsLabel, msg: habitsMsg },
      bienestar: { score: wellS, label: wellLabel, msg: wellMsg },
      presupuesto: { score: budgetS, label: budgetLabel, msg: budgetMsg },
      oportunidad: { title: opportunityTitle, items: opportunityItems },
    },
    dataQuality: { score: quality.score, label: quality.label, decisionReady: quality.decisionReady, issues: quality.issues, blockers: quality.blockers },
    budgetImpact,
    actions: {
      canBuy: canBuyToday,
      registerPurchase: canBuyToday,
      saveWishlist: purchaseAmount > 0,
    },
    meta: {
      amount: purchaseAmount,
      itemName,
      categoryId: resolvedCategoryId,
      categoryName: categoryById(resolvedCategoryId)?.name || null,
      balAfter: balanceAfterToday,
      dispRestante: cashFlow.remainingBudget,
      afterPurch: remainingBudgetAfter,
    },
  };
}

function renderDecisionCard(analysis) {
  const {verdict,score,stars,verdictLabel,reason,dimensions,actions,meta}=analysis;
  const verdictColor=verdict==="green"?"var(--success-text)":verdict==="yellow"?"var(--warning-text)":"var(--danger-text)";
  const verdictBg=verdict==="green"?"var(--success-bg)":verdict==="yellow"?"var(--warning-bg)":"var(--danger-bg)";
  const starsHtml=stars>0?Array.from({length:5},(_,i)=>`<span style="color:${i<stars?"var(--gold)":"var(--border)"};font-size:20px;">★</span>`).join(""):"";
  const dims=[['💧 Liquidez',dimensions.liquidez],['💳 Deudas',dimensions.deudas],['🎯 Metas',dimensions.metas],['📊 Presupuesto',dimensions.presupuesto],['🧠 Hábitos',dimensions.habitos],['💚 Bienestar',dimensions.bienestar]];
  const dimHtml=dims.map(([label,d])=>{const n=Number(d?.score),has=Number.isFinite(n),color=!has?"var(--text-muted)":n>=70?"var(--success-text)":n>=40?"var(--warning-text)":"var(--danger-text)";return `<div style="padding:10px 0;border-bottom:.5px solid var(--border);"><div class="row-between"><span style="font-size:12px;font-weight:500;">${esc(label)}</span><span style="font-size:11px;color:${color};font-weight:500;">${has?`${n}/100 — `:""}${esc(d?.label||"Sin datos")}</span></div><p style="font-size:11px;color:var(--text-muted);margin:2px 0 0;line-height:1.5;">${esc(d?.msg||"")}</p></div>`;}).join("");
  const opportunity=dimensions.oportunidad||{items:[]};
  const oppHtml=(opportunity.items||[]).length?`<div style="padding:10px 0;"><p style="font-size:12px;font-weight:500;margin:0 0 8px;">💡 ${esc(opportunity.title||`Con ${money(meta.amount)} también podrías:`)}</p>${opportunity.items.map(o=>`<div style="margin-bottom:8px;"><strong style="font-size:12px;">${esc(o.text||"")}</strong><p style="font-size:11px;color:var(--text-muted);margin:2px 0 0;">${esc(o.reason||"")}</p></div>`).join("")}</div>`:"";
  const quality=analysis.dataQuality||dataQualityAssessment();
  const qualityText=`Datos ${quality.label||"sin evaluar"}${quality.decisionReady===false?" · por confirmar":""}`;
  return `<div class="card" style="background:${verdictBg};margin-bottom:10px;text-align:center;">${starsHtml?`<div>${starsHtml}</div>`:""}<p style="font-size:16px;font-weight:600;color:${verdictColor};margin:6px 0 10px;">${esc(verdictLabel)}</p><p style="font-size:13px;color:${verdictColor};margin:0 0 12px;line-height:1.6;">${esc(reason)}</p>${verdict!=="red"?`<div style="display:inline-flex;flex-direction:column;gap:2px;background:rgba(255,255,255,.45);border-radius:12px;padding:6px 12px;"><span style="font-size:13px;font-weight:600;color:${verdictColor};">Índice de conveniencia ${Number(score)||0}/100</span><span style="font-size:10px;color:${verdictColor};">No es un score crediticio · ${esc(qualityText)}</span></div>`:""}</div>
    <div class="card" style="margin-bottom:10px;padding:0 12px;">${dimHtml}${oppHtml}</div><div style="display:flex;gap:8px;margin-bottom:8px;"><button id="askCoachBtn" class="btn-secondary" style="flex:1;">💬 Explícame</button>${actions.registerPurchase?`<button id="simBuyBtn" class="btn-primary" style="flex:1;">✓ Registrar compra</button>`:""}</div>${actions.saveWishlist?`<button id="simSaveBtn" class="btn-secondary" style="width:100%;font-size:12px;">🔖 Guardar para después</button>`:""}`;
}

function looksLikeAmountOnly(value) {
  return /^(?:rd\$?\s*)?\d[\d.,\s]*(?:\s*pesos?)?$/i.test(String(value || "").trim());
}

function wireSimulador() {
  const slider=document.getElementById("simSlider"),amountInput=document.getElementById("simAmountInput"),itemInput=document.getElementById("simItemName"),categoryInput=document.getElementById("simCategory"),resultEl=document.getElementById("decisionResult"),hint=document.getElementById("simFieldHint"),categoryHint=document.getElementById("simCategoryHint");
  if(!slider||!amountInput||!itemInput||!categoryInput||!resultEl)return;
  categorySelectionMode="auto";
  function applyAutoCategory(){
    if(categorySelectionMode!=="auto") return;
    const inferred=inferCategoryId(itemInput.value.trim())||"";
    categoryInput.value=inferred;
    if(categoryHint){
      const category=categoryById(inferred);
      categoryHint.style.display=category?"block":"none";
      categoryHint.textContent=category?`Categoría sugerida: ${category.name}. Revísala antes de decidir.`:"";
    }
  }
  function update(value){
    const amount=Math.max(0,Number(value)||0);slider.value=Math.min(amount,Number(slider.max));amountInput.value=amount||"";
    if(amount<=0){simulatorPurchaseAnalysis=null;resultEl.innerHTML="";return;}
    applyAutoCategory();
    const analysis=buildPurchaseAnalysis(state.analysis,amount,itemInput.value.trim(),categoryInput.value||null);simulatorPurchaseAnalysis=analysis;resultEl.innerHTML=renderDecisionCard(analysis);wireDecisionActions(analysis);
  }
  slider.addEventListener("input",()=>update(slider.value));amountInput.addEventListener("input",()=>update(amountInput.value));
  itemInput.addEventListener("input",()=>{applyAutoCategory();const amount=Number(amountInput.value)||0;if(amount>0)update(amount);});
  categoryInput.addEventListener("change",()=>{categorySelectionMode=categoryInput.value?"manual":"auto";if(categoryHint){categoryHint.style.display=categorySelectionMode==="manual"?"block":"none";categoryHint.textContent=categorySelectionMode==="manual"?"Categoría confirmada por ti.":"";}const amount=Number(amountInput.value)||0;if(amount>0)update(amount);});
  itemInput.addEventListener("blur",()=>{const value=itemInput.value.trim();if(!value||!looksLikeAmountOnly(value)||Number(amountInput.value)>0)return;const amount=extractMoneyAmount(value,{allowBare:true});if(!amount)return;itemInput.value="";amountInput.value=amount;if(hint){hint.textContent=`Movimos ${money(amount)} al campo de precio.`;hint.style.display="block";}update(amount);});
  update(0);
}

function wireDecisionActions(analysis) {
  document.getElementById("askCoachBtn")?.addEventListener("click",()=>{
    coachPurchaseAnalysis=analysis;pendingCoachOfficialAnalysis=analysis;
    coachPurchaseContext={itemName:analysis.meta?.itemName||"Compra consultada",amount:analysis.meta?.amount||null,categoryId:analysis.meta?.categoryId||null,categoryWasInferred:false,awaitingAmount:false,updatedAtTurn:coachTurnCounter};
    coachHistory.push({role:"user",content:`Explícame el resultado de la compra de ${analysis.meta?.itemName||"este artículo"} por ${money(analysis.meta?.amount||0)}.`});
    coachHistory.push({role:"assistant",content:`${analysis.verdictLabel}. ${analysis.reason}`});
    tab="coach";renderApp();
  });
  document.getElementById("simBuyBtn")?.addEventListener("click",()=>{resetCoachPurchaseContext();simulatorPurchaseAnalysis=null;openLogModal(analysis.meta.amount,analysis.meta.itemName||null,analysis.meta.categoryId||null);});
  const saveBtn=document.getElementById("simSaveBtn");
  if(saveBtn)saveBtn.addEventListener("click",async()=>{saveBtn.disabled=true;saveBtn.textContent="Guardando…";const {error}=await supabase.from("purchase_decisions").insert({user_id:user.id,item_name:analysis.meta.itemName||null,amount:analysis.meta.amount,category_id:analysis.meta.categoryId||null,verdict:analysis.verdict,score:analysis.score,status:"saved",analysis_snapshot:analysis});if(error){showToast(safeErrorMessage(error,"No se pudo guardar."),true);saveBtn.disabled=false;saveBtn.textContent="🔖 Guardar para después";return;}await loadState();showToast("Compra guardada para revisarla después");});
}

function primaryGoal() {
  const order = { critical: 0, important: 1, optional: 2 };
  // Solo metas activas o en riesgo — las completadas no van al Dashboard
  const activas = state.goals.filter(isGoalActive);
  return [...activas].sort((a, b) => (order[a.priority] ?? 3) - (order[b.priority] ?? 3))[0];
}

function tplResumenMensual() {
  const now=new Date(),monthLabel=now.toLocaleDateString("es-DO",{month:"long",year:"numeric"});
  const tx=(state.transactions||[]).filter(t=>sameCivilMonth(transactionEconomicDate(t),now));
  const income=tx.filter(isOrdinaryIncome).reduce((sum,t)=>sum+Number(t.amount||0),0);
  const variable=tx.filter(t=>isCountableExpense(t)&&!isFixedPaymentTransaction(t)).reduce((sum,t)=>sum+Math.abs(Number(t.amount||0)),0);
  const fixedPaid=tx.filter(t=>isCountableExpense(t)&&isFixedPaymentTransaction(t)).reduce((sum,t)=>sum+Math.abs(Number(t.amount||0)),0);
  const debtPaid=(state.debtPayments||[]).filter(p=>(p.status||"active")!=="voided"&&sameCivilMonth(p.paid_on||p.paid_at,now)).reduce((sum,p)=>sum+Number(p.amount||0),0);
  const saved=(state.goalContributions||[]).filter(c=>sameCivilMonth(c.contributed_on||c.created_at,now)).reduce((sum,c)=>sum+Number(c.amount||0),0);
  const fees=(state.debtPayments||[]).filter(p=>(p.status||"active")!=="voided"&&sameCivilMonth(p.paid_on||p.paid_at,now)).reduce((sum,p)=>sum+Number(p.fee_component||0),0);
  const ordinaryNet=income-variable-fixedPaid-debtPaid-saved;
  const nonOrdinary=tx.filter(t=>!isOrdinaryIncome(t)&&!isCountableExpense(t)).reduce((sum,t)=>sum+Number(t.amount||0),0);
  const declared=Number(state.analysis?.cashFlow?.declaredMonthlyIncome)||0;
  const monthBudgets=(state.budgets||[]).filter(b=>{const start=dateOnly(b.effective_from),end=dateOnly(b.effective_to),first=new Date(now.getFullYear(),now.getMonth(),1,12),next=new Date(now.getFullYear(),now.getMonth()+1,1,12);return(!start||start<next)&&(!end||end>first);});
  const exceeded=monthBudgets.filter(b=>{const spent=tx.filter(t=>isCountableExpense(t)&&!isFixedPaymentTransaction(t)&&t.category_id===b.category_id).reduce((sum,t)=>sum+Math.abs(Number(t.amount)),0);return spent>Number(b.amount||0);}).length;
  const rows=[["Ingreso realmente registrado",income],["Gastos variables",-variable],["Gastos fijos pagados",-fixedPaid],["Pagos de deudas",-debtPaid],["Aportes a metas",-saved],["Flujo ordinario neto registrado",ordinaryNet]];
  return `<h1 style="text-align:left;margin-bottom:4px;">Resumen mensual</h1><p style="font-size:11px;color:var(--text-muted);margin:0 0 14px;text-transform:capitalize;">${monthLabel}</p><div class="card accent" style="margin-bottom:10px;"><div class="row-between"><span>Plan/estimación mensual</span><strong>${money(declared)}</strong></div><div class="row-between" style="margin-top:5px;"><span>Ingreso registrado hasta hoy</span><strong>${money(income)}</strong></div><p class="hint">El plan usa lo que declaraste; este resumen usa solo movimientos de ingreso registrados.</p></div><div class="card">${rows.map(([label,value],i)=>`<div class="row-between" style="padding:${i?"9px 0":"0 0 9px"};${i?"border-top:.5px solid var(--border);":""}"><span style="font-size:11px;color:var(--text-secondary);">${label}</span><strong style="font-size:12px;color:${value<0?"var(--danger-text)":"var(--success-text)"};">${money(value)}</strong></div>`).join("")}</div>${nonOrdinary!==0?`<div class="card" style="margin-top:10px;"><div class="row-between"><span style="font-size:11px;">Ajustes, préstamos y transferencias</span><strong>${money(nonOrdinary)}</strong></div><p class="hint">Se muestran aparte porque no son ingreso laboral ni gasto ordinario.</p></div>`:""}${fees>0?`<p class="hint">Los pagos de deuda incluyen ${money(fees)} en comisiones o mora.</p>`:""}<div class="card" style="margin-top:10px;"><p style="font-size:12px;font-weight:600;margin:0 0 5px;">Presupuestos de gastos variables</p><p style="font-size:11px;color:var(--text-muted);margin:0;">${exceeded?`${exceeded} categoría${exceeded===1?"":"s"} excedida${exceeded===1?"":"s"}.`:"Ninguna categoría excedida."}</p></div>`;
}

function wireIngreso() {
  const frequency=document.getElementById("ingFrequency"),fields=document.getElementById("incomeFields"),modeGrid=document.getElementById("ingModeGrid");if(!frequency||!fields)return;
  let mode=state.profile?.income_mode||(frequency.value==="irregular"?"variable":"fixed");
  modeGrid.querySelectorAll(".type-option").forEach(option=>option.addEventListener("click",()=>{mode=option.dataset.mode;modeGrid.querySelectorAll(".type-option").forEach(x=>x.classList.toggle("selected",x===option));draw();}));
  function draw(){const p=state.profile||{},freq=frequency.value,stored=Number(p.declared_monthly_income)||0,p1=Number(p.paycheck_amount_1)||stored,p2=Number(p.paycheck_amount_2)||stored;fields.innerHTML=freq==="biweekly"?`<p class="hint">Puedes registrar quincenas diferentes.</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;"><div><label>Primer cobro</label><input id="ingAmount1" type="number" min="0" step="0.01" value="${p1||""}"><label>Día</label><input id="ingDay1" type="number" min="1" max="31" value="${p.pay_day_1||""}"></div><div><label>Segundo cobro</label><input id="ingAmount2" type="number" min="0" step="0.01" value="${p2||""}"><label>Día</label><input id="ingDay2" type="number" min="1" max="31" value="${p.pay_day_2||""}"></div></div>`:freq==="weekly"?`<label>Monto por semana</label><input id="ingAmount1" type="number" min="0" step="0.01" value="${stored||""}"><label>Día habitual</label><select id="ingWeekday"><option value="1">Lunes</option><option value="2">Martes</option><option value="3">Miércoles</option><option value="4">Jueves</option><option value="5">Viernes</option><option value="6">Sábado</option><option value="0">Domingo</option></select><p class="hint">La equivalencia mensual usa 52 semanas ÷ 12.</p>`:freq==="irregular"?`<label>Estimación mensual <span style="color:var(--text-muted);">(solo referencia)</span></label><input id="ingAmount1" type="number" min="0" step="0.01" value="${stored||""}"><p class="hint">Para decisiones, la app usará únicamente ingresos realmente registrados este mes.</p>`:`<label>Ingreso mensual planificado</label><input id="ingAmount1" type="number" min="0" step="0.01" value="${stored||""}"><label>Día de cobro <span style="color:var(--text-muted);">(opcional)</span></label><input id="ingDay1" type="number" min="1" max="31" value="${p.pay_day_1||""}">`;if(freq==="weekly"){const el=document.getElementById("ingWeekday");if(el)el.value=String(p.pay_weekday??5);}if(freq==="irregular")mode="variable";}
  frequency.addEventListener("change",draw);draw();
  document.getElementById("saveIngresoBtn").addEventListener("click",async()=>{const freq=frequency.value,name=document.getElementById("ingName").value.trim(),amount1=Number(document.getElementById("ingAmount1")?.value)||0,amount2=Number(document.getElementById("ingAmount2")?.value)||0,day1=Number(document.getElementById("ingDay1")?.value)||null,day2=Number(document.getElementById("ingDay2")?.value)||null,weekday=document.getElementById("ingWeekday")?Number(document.getElementById("ingWeekday").value):null,err=document.getElementById("ingErr");if(!(amount1>0)&&freq!=="irregular")return showInlineError(err,"Pon un monto mayor que cero.");if(freq==="biweekly"&&!(amount2>0))return showInlineError(err,"Completa ambos cobros.");if(day1&&(day1<1||day1>31)||day2&&(day2<1||day2>31))return showInlineError(err,"Los días deben estar entre 1 y 31.");const btn=document.getElementById("saveIngresoBtn");btn.disabled=true;btn.textContent="Guardando…";const payload={display_name:name||null,declared_monthly_income:amount1,paycheck_amount_1:freq==="biweekly"?amount1:null,paycheck_amount_2:freq==="biweekly"?amount2:null,pay_frequency:freq,income_mode:freq==="irregular"?"variable":mode,pay_day_1:["monthly","biweekly"].includes(freq)?day1:null,pay_day_2:freq==="biweekly"?day2:null,pay_weekday:freq==="weekly"?weekday:null,updated_at:new Date().toISOString()};const {error}=await supabase.from("profiles").update(payload).eq("id",user.id);if(error){showInlineError(err,safeErrorMessage(error,"No se pudo guardar. Ejecuta la migración v5.2 si aún no lo has hecho."));btn.disabled=false;btn.textContent="Guardar";return;}await loadState();tab="mas";renderApp();showToast("Perfil actualizado");});
}

function tplGastos() {
  const quick=`<div class="btn-row" style="margin-bottom:14px;"><button class="btn-secondary" id="gastosAddExpenseBtn" style="flex:1;">+ Gasto</button><button class="btn-secondary" id="gastosAddIncomeBtn" style="flex:1;">+ Ingreso</button></div>`;
  const all=state.transactions||[];
  const visible=movementViewFilter==="uncategorized"?all.filter(t=>isOrdinaryExpense(t)&&!t.category_id&&!isFixedPaymentTransaction(t)):all;
  const filterBanner=movementViewFilter?`<div class="card accent" style="margin-bottom:10px;"><div class="row-between"><span style="font-size:11px;">Mostrando gastos sin categoría</span><button class="link-btn" id="clearMovementFilter">Ver todos</button></div></div>`:"";
  if(!visible.length)return `<h1 style="text-align:left;">Movimientos</h1>${quick}${filterBanner}<div class="empty-state"><div class="icon-circle">🧾</div><p style="font-size:13px;color:var(--text-muted);">${movementViewFilter?"No quedan gastos sin categoría.":"Todavía no registraste movimientos."}</p></div>`;
  const sourceLabel=t=>t.source_type==="debt_payment"?"Pago de deuda · corrígelo desde Deudas":t.source_type==="goal_contribution"?"Aporte a meta · corrígelo desde Metas":isFixedPaymentTransaction(t)?"Pago de gasto fijo · corrígelo desde Gastos fijos":t.source_type!=="manual"?"Movimiento vinculado":"Movimiento manual";
  const rows=visible.slice(0,100).map(t=>{const income=isOrdinaryIncome(t),category=t.categories?.name||(income?"Ingreso":"Sin categoría"),title=t.note||(income?"Ingreso registrado":category),icon=income?"💰":CATEGORY_ICONS[t.categories?.name]||"📄",linked=isLinkedTransaction(t);return `<div class="card row-between" style="margin-bottom:6px;padding:10px 12px;"><span style="min-width:0;">${icon} ${esc(title)}<span style="display:block;color:var(--text-muted);font-size:10px;">${esc(category)} · ${formatDateDO(t.occurred_at)||"Sin fecha"} · ${esc(allAccounts().find(a=>a.id===t.account_id)?.name||"Cuenta")}</span>${linked?`<span style="display:block;color:var(--text-muted);font-size:9px;margin-top:2px;">🔒 ${esc(sourceLabel(t))}</span>`:""}</span><span style="display:flex;align-items:center;gap:10px;"><strong style="color:${income?"var(--success-text)":"inherit"};">${income?"+":"-"}${money(Math.abs(t.amount))}</strong><span class="actions">${linked?"":`<button data-edit-tx="${t.id}" aria-label="Editar movimiento">✎</button><button data-del-tx="${t.id}" aria-label="Borrar movimiento">✕</button>`}</span></span></div>`;}).join("");
  return `<h1 style="text-align:left;margin-bottom:14px;">Movimientos</h1>${quick}${filterBanner}${rows}${visible.length>100?`<p class="hint">Mostrando los 100 más recientes. La exportación incluye todo.</p>`:""}`;
}

function tplMetas() {
  const active=state.goals.filter(isGoalActive),completed=state.goals.filter(g=>g.status==="completed"||Number(g.current_amount)>=Number(g.target_amount)),inactive=state.goals.filter(g=>g.status==="paused"||g.status==="abandoned");
  const analysisMap=new Map((state.analysis?.goals?.byGoal||[]).map(g=>[g.id,g]));

function debtDueInfo(debt, today = new Date()) {
  if (!debt?.next_due_date || debt.status === "completed") return { overdue: false, days: 0, text: null };
  const due = new Date(`${String(debt.next_due_date).slice(0, 10)}T12:00:00`);
  const now = new Date(today.getFullYear(), today.getMonth(), today.getDate(), 12);
  const days = Math.floor((now - due) / 86400000);
  if (days > 0) return { overdue: true, days, text: `Pago atrasado por ${days} día${days === 1 ? "" : "s"}` };
  const remaining = Math.ceil((due - now) / 86400000);
  return { overdue: false, days: -remaining, text: remaining === 0 ? "Vence hoy" : `Vence en ${remaining} día${remaining === 1 ? "" : "s"}` };
}

function advanceDebtDateClient(value, frequency = "monthly", dueDay = null) {
  if (!value) return null;
  const date = new Date(`${String(value).slice(0, 10)}T12:00:00`);
  if (frequency === "weekly") date.setDate(date.getDate() + 7);
  else if (frequency === "biweekly") date.setDate(date.getDate() + 14);
  else {
    const target = Number(dueDay) || date.getDate();
    date.setDate(1);
    date.setMonth(date.getMonth() + 1);
    const last = new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
    date.setDate(Math.min(target, last));
  }
  return localISODate(date);
}

function debtAccrualPeriods(debt, paidOn) {
  if ((debt?.plan_type || "legacy") !== "amortized" || !(Number(debt?.interest_rate) > 0)) return 0;
  const paidDate = new Date(`${paidOn || localISODate()}T12:00:00`);
  let cursor = debt.interest_accrued_through
    ? advanceDebtDateClient(debt.interest_accrued_through, debt.payment_frequency, debt.due_day)
    : (debt.next_due_date || paidOn || localISODate());
  if (!cursor) return 1;
  let cursorDate = new Date(`${cursor}T12:00:00`);
  if (!debt.interest_accrued_through && cursorDate > paidDate) return 1;
  let periods = 0;
  while (cursorDate <= paidDate && periods < 120) {
    periods += 1;
    cursor = advanceDebtDateClient(cursor, debt.payment_frequency, debt.due_day);
    cursorDate = new Date(`${cursor}T12:00:00`);
  }
  return periods;
}

function estimateDebtPaymentBreakdownV4(debt, amount, paidOn, manualInterest = null, feeAmount = 0) {
  const clone = { ...debt };
  const periods = debtAccrualPeriods(debt, paidOn);
  if ((debt?.plan_type || "legacy") === "amortized" && manualInterest == null) {
    const periodic = periodicInterestRate(debt.interest_rate, debt.interest_rate_type || "annual", debt.payment_frequency || "monthly");
    const interest = Math.max(0, Number(debt.interest_outstanding || 0)) + Math.max(0, Number(debt.principal_outstanding ?? debt.current_balance) || 0) * periodic * periods;
    return { ...estimateDebtPaymentBreakdown(clone, amount, interest, feeAmount), periodsAccrued: periods };
  }
  return { ...estimateDebtPaymentBreakdown(clone, amount, manualInterest, feeAmount), periodsAccrued: periods };
}

function wizardDebtPayload(draft) {
  const original = Math.max(0, Number(draft.originalAmount) || Number(draft.currentBalance) || 0);
  const currentInput = Math.max(0, Number(draft.currentBalance) || original);
  const totalTerm = Math.max(0, Math.trunc(Number(draft.totalTermCount ?? draft.termCount) || 0));
  const remainingTerm = Math.max(0, Math.trunc(Number(draft.remainingTermCount ?? draft.termCount) || (draft.existingMode === "existing" ? 0 : totalTerm)));
  const planTerm = draft.existingMode === "existing" ? (remainingTerm || totalTerm) : totalTerm;
  const scheduledInput = Math.max(0, Number(draft.scheduledPayment) || 0);
  const source = draft.knowledge || "unknown";
  let planType = "legacy", rate = null, rateType = "annual", setupState = "complete", informationSource = source;

  if (draft.debtType === "tarjeta_credito") {
    planType = "credit_card";
    rate = source === "annual_rate" ? Math.max(0, Number(draft.rate) || 0) : null;
    setupState = source === "unknown" ? "incomplete" : "complete";
    informationSource = source === "unknown" ? "card_statement" : source;
  } else if (source === "annual_rate") { planType = "amortized"; rate = Math.max(0, Number(draft.rate) || 0); rateType = "annual"; }
  else if (source === "monthly_rate") { planType = "amortized"; rate = Math.max(0, Number(draft.rate) || 0); rateType = "monthly"; }
  else if (source === "periodic_rate") { planType = "flat_periodic"; rate = Math.max(0, Number(draft.rate) || 0); rateType = "per_period"; }
  else if (source === "total_interest_pct") { planType = "flat_total"; rate = Math.max(0, Number(draft.rate) || 0); rateType = "total_term"; }
  else if (source === "total_payable") {
    planType = "flat_total";
    const total = Math.max(0, Number(draft.totalPayable) || 0);
    rate = original > 0 ? Math.max(0, ((total - original) / original) * 100) : 0;
    rateType = "total_term"; setupState = "estimated";
  } else if (source === "scheduled_payment") { planType = "legacy"; setupState = "estimated"; }
  else if (source === "no_interest") { planType = "no_interest"; rate = 0; }
  else { planType = "legacy"; rate = null; setupState = "incomplete"; }

  const baseForPlan = draft.existingMode === "existing" ? currentInput : original;
  const plan = calculateDebtPlan({ planType, originalAmount: baseForPlan, interestRate: rate || 0, interestRateType: rateType, paymentFrequency: draft.paymentFrequency || "monthly", termCount: planTerm, scheduledPayment: scheduledInput });
  if (source === "total_payable") {
    plan.totalPayable = Math.max(0, Number(draft.totalPayable) || 0);
    plan.estimatedInterest = Math.max(0, plan.totalPayable - original);
    if (!plan.scheduledPayment && planTerm > 0) plan.scheduledPayment = plan.totalPayable / planTerm;
  }
  if (source === "scheduled_payment" && scheduledInput > 0 && planTerm > 0) {
    plan.totalPayable = scheduledInput * planTerm;
    plan.estimatedInterest = Math.max(0, plan.totalPayable - baseForPlan);
    plan.scheduledPayment = scheduledInput;
  }

  let currentPrincipal = draft.existingMode === "existing" ? currentInput : original;
  let interestOutstanding = 0;
  let currentBalance = currentInput;
  if (draft.existingMode !== "existing" && ["flat_total", "flat_periodic"].includes(planType)) {
    interestOutstanding = Math.max(0, Number(plan.estimatedInterest) || 0);
    currentBalance = original + interestOutstanding;
  } else if (draft.existingMode !== "existing") currentBalance = original;

  // Nunca inferir pagos históricos a partir de la diferencia entre capital y saldo.
  const paidBefore = Math.max(0, Number(draft.paidBeforeApp) || 0);
  const scheduled = Math.max(0, Number(plan.scheduledPayment) || scheduledInput || 0);
  const totalPayable = plan.totalPayable == null ? null : Math.round(Number(plan.totalPayable) * 100) / 100;
  const estimatedInterest = planType === "credit_card" || setupState === "incomplete" ? null : Math.max(0, Number(plan.estimatedInterest) || 0);

  return { plan: { ...plan, scheduledPayment: scheduled, totalPayable, estimatedInterest }, payload: {
    name: String(draft.name || "").trim(), debt_type: draft.debtType === "unsure" ? "otro" : (draft.debtType || "otro"), plan_type: planType,
    original_amount: original, current_balance: currentBalance, principal_outstanding: currentPrincipal, interest_outstanding: interestOutstanding,
    interest_rate: rate, interest_rate_type: rateType, payment_frequency: draft.debtType === "tarjeta_credito" ? "monthly" : (draft.paymentFrequency || "monthly"),
    term_count: planType === "credit_card" ? null : (totalTerm || null), remaining_installments: planType === "credit_card" ? null : (remainingTerm || totalTerm || null),
    scheduled_payment: scheduled || null, minimum_payment: scheduled || null, total_payable: totalPayable, estimated_total_interest: estimatedInterest,
    total_paid: Number(draft.existingTotalPaid) || 0, total_interest_paid: Number(draft.existingInterestPaid) || 0, total_fees_paid: Number(draft.existingFeesPaid) || 0,
    start_date: draft.startDate || null, next_due_date: draft.nextDue || null, due_day: draft.nextDue ? Number(String(draft.nextDue).slice(-2)) : null,
    status: currentBalance <= 0 ? "completed" : "active", setup_state: setupState, information_source: informationSource,
    is_existing_debt: draft.existingMode === "existing", balance_at_registration: currentBalance, paid_before_app: paidBefore,
    payment_allocation_method: draft.allocationMethod || (["flat_total", "flat_periodic"].includes(planType) ? "proportional" : "interest_first"),
    credit_limit: draft.creditLimit ? Number(draft.creditLimit) : null, statement_day: draft.statementDay ? Number(draft.statementDay) : null,
    breakdown_required: planType === "credit_card" || setupState === "incomplete",
  }};
}
