<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Coach Financiero</title>
<link rel="stylesheet" href="css/styles.css" />
<style>
  .icon-action { min-width:44px; min-height:44px; display:inline-flex; align-items:center; justify-content:center; }
  .status-dot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:6px; }
  .metric-help { background:none; border:none; color:var(--text-muted); padding:0 4px; min-height:24px; cursor:pointer; }
  .alert-row { display:flex; gap:9px; align-items:flex-start; padding:9px 0; border-bottom:0.5px solid var(--border); }
  .alert-row:last-child { border-bottom:none; }

  .modal-overlay[role="dialog"]:not(.visible){display:none;}
  .type-option:focus-visible,.cat-option:focus-visible{outline:3px solid var(--teal-light);outline-offset:2px;}
  button:disabled{opacity:.58;cursor:not-allowed;}
</style>
</head>
<body>

<div id="root">
  <div class="screen" style="text-align:center; padding:60px 24px;">
    <p style="font-size:13px; color:var(--text-muted);">Cargando tus datos…</p>
  </div>
</div>

<script type="module">
import { supabase } from "./js/supabaseClient.js";

const APP_BUILD = "financial-core-v5.1-stabilized-2026-08-03";
window.__APP_BUILD__ = APP_BUILD;
console.info(`[Coach Financiero] build ${APP_BUILD}`);

const CATEGORY_ICONS = {
  Comida: "🍽️", Transporte: "🚌", Vivienda: "🏠", Salud: "💊",
  Ocio: "🎮", Educación: "🎓", Ropa: "👕", Otro: "•",
};

const DEBT_TYPES = [
  { value: "tarjeta_credito", label: "Tarjeta de crédito", icon: "💳" },
  { value: "prestamo_personal", label: "Préstamo personal", icon: "🏦" },
  { value: "prestamista", label: "Prestamista", icon: "🤝" },
  { value: "financiamiento_vehiculo", label: "Financiamiento de vehículo", icon: "🚗" },
  { value: "financiamiento_electrodomestico", label: "Financiamiento de electrodoméstico", icon: "🧊" },
  { value: "hipoteca", label: "Hipoteca", icon: "🏠" },
  { value: "otro", label: "Otro", icon: "📄" },
];

let user = null;
let categories = [];
let state = {
  account: null, accounts: [], profile: null, goals: [], fixed: [], debts: [],
  transactions: [], analysisTransactions: [], budgets: [], goalContributions: [], debtPayments: [],
  fixedPayments: [], purchaseDecisions: [], reconciliations: [], optionalErrors: [], analysis: null,
};
let tab = "inicio";

const root = document.getElementById("root");
let activeConfirmation = null;
let categorySelectionMode = "auto";
let pendingCoachOfficialAnalysis = null;

// Utilidades de fecha, estado y vínculos de auditoría.
function localISODate(date = new Date()) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

function isTransferTransaction(tx) {
  return ["transfer", "loan_proceeds", "adjustment", "reversal"].includes(String(tx?.transaction_type || "")) ||
    ["goal_contribution", "debt_payment", "debt_payment_reversal", "account_reconciliation", "loan_proceeds", "legacy_transfer", "legacy_reversal"].includes(String(tx?.source_type || ""));
}

function isFixedPaymentTransaction(tx) {
  return String(tx?.source_type || "") === "fixed_expense" ||
    String(tx?.source_type || "") === "fixed_expense_legacy" || Boolean(tx?.fixed_template_id);
}

function linkedTransactionIds() {
  return new Set([
    ...(state.goalContributions || []).map(x => x.transaction_id),
    ...(state.debtPayments || []).flatMap(x => [x.transaction_id, x.reversal_transaction_id]),
  ].filter(Boolean));
}

function isLinkedTransaction(tx) {
  if (!tx) return false;
  return linkedTransactionIds().has(tx.id) || tx.source_type !== "manual";
}

function safeStorageGet(key) {
  if (!key) return null;
  try { return window.localStorage?.getItem(key) ?? null; } catch { return null; }
}

function safeStorageSet(key, value) {
  if (!key) return false;
  try { window.localStorage?.setItem(key, value); return true; } catch { return false; }
}

function onboardingStorageKey() {
  return user?.id ? `coach-financiero:onboarding:${user.id}` : null;
}

function onboardingIsComplete() {
  const key = onboardingStorageKey();
  const locallyCompleted = safeStorageGet(key) === "1";
  const hasUsage = state.goals.length > 0 || state.fixed.length > 0 || state.transactions.length > 0 ||
    state.debts.length > 0 || state.budgets.length > 0;
  return state.profile?.onboarding_completed === true || locallyCompleted || hasUsage;
}

async function markOnboardingComplete() {
  const key = onboardingStorageKey();
  safeStorageSet(key, "1");
  // Compatible con proyectos que todavía no tienen la columna.
  const { error } = await supabase.from("profiles").update({ onboarding_completed: true }).eq("id", user.id);
  if (error && !String(error.message || "").toLowerCase().includes("onboarding_completed")) {
    console.warn("No se pudo marcar onboarding_completed", error);
  }
}

async function deleteLocal(table, id, stateKey) {
  if (table === "transactions") {
    const tx = state.transactions.find(x => x.id === id);
    if (isLinkedTransaction(tx)) {
      showToast("Este movimiento está vinculado a una meta o deuda y no se puede borrar directamente.", true);
      return false;
    }
  }

  const { error } = await supabase.from(table).delete().eq("id", id);
  if (error) {
    showToast("No se pudo borrar. Tus datos no fueron modificados.", true);
    return false;
  }

  await loadState();
  renderApp();
  return true;
}

function money(n) {
  const num = Number(n) || 0;
  const hasCents = Math.abs(num - Math.round(num)) > 0.004;
  return "RD$" + num.toLocaleString("es-DO", {
    minimumFractionDigits: hasCents ? 2 : 0,
    maximumFractionDigits: hasCents ? 2 : 0,
  });
}

function dateOnly(value) {
  if (!value) return null;
  if (value instanceof Date) {
    if (Number.isNaN(value.getTime())) return null;
    return new Date(value.getFullYear(), value.getMonth(), value.getDate(), 12, 0, 0, 0);
  }
  const text = String(value);
  const civil = text.match(/^(\d{4})-(\d{2})-(\d{2})(?:$|T)/);
  if (civil) {
    const d = new Date(Number(civil[1]), Number(civil[2]) - 1, Number(civil[3]), 12, 0, 0, 0);
    return Number.isNaN(d.getTime()) ? null : d;
  }
  const d = new Date(text);
  return Number.isNaN(d.getTime()) ? null : new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12, 0, 0, 0);
}

function civilCompare(a, b) {
  const da = dateOnly(a), db = dateOnly(b);
  if (!da || !db) return null;
  return Math.sign(da.getTime() - db.getTime());
}

function sameCivilMonth(value, reference = new Date()) {
  const d = dateOnly(value), r = dateOnly(reference);
  return Boolean(d && r && d.getFullYear() === r.getFullYear() && d.getMonth() === r.getMonth());
}

function sameCivilDay(value, reference = new Date()) {
  const d = dateOnly(value), r = dateOnly(reference);
  return Boolean(d && r && d.getFullYear() === r.getFullYear() && d.getMonth() === r.getMonth() && d.getDate() === r.getDate());
}

function civilDaysBetween(from, to) {
  const a = dateOnly(from), b = dateOnly(to);
  if (!a || !b) return null;
  return Math.round((b.getTime() - a.getTime()) / 86400000);
}

function transactionEconomicDate(tx) {
  return dateOnly(tx?.occurred_at || tx?.created_at);
}

function isOrdinaryIncome(tx) {
  return Number(tx?.amount) > 0 && String(tx?.transaction_type || "") === "income" && String(tx?.source_type || "") === "manual";
}

function isOrdinaryExpense(tx) {
  return Number(tx?.amount) < 0 && String(tx?.transaction_type || "") === "expense" && ["manual", "fixed_expense", "fixed_expense_legacy"].includes(String(tx?.source_type || "manual"));
}


function fixedPaymentForTransaction(tx, payments = state.fixedPayments || []) {
  if (!tx?.id) return null;
  return payments.find(p => p.transaction_id === tx.id) || null;
}

function isVoidedFixedTransaction(tx, payments = state.fixedPayments || []) {
  if (String(tx?.source_type || "") !== "fixed_expense") return false;
  const payment = fixedPaymentForTransaction(tx, payments);
  return Boolean(payment && (payment.status || "active") === "voided");
}

function isCountableExpense(tx, payments = state.fixedPayments || []) {
  return isOrdinaryExpense(tx) && !isVoidedFixedTransaction(tx, payments);
}

function createClientRequestId() {
  return globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(16).slice(2)}`;
}

function safeErrorMessage(error, fallback = "No se pudo completar la operación.") {
  const msg = String(error?.message || error || "");
  if (msg.includes("duplicate_transaction")) return "Ya existe un movimiento igual en esa fecha.";
  if (msg.includes("fixed_payment_duplicate")) return "Ese gasto fijo ya tiene un pago registrado para el período.";
  return msg && !/mock rpc/i.test(msg) ? msg : fallback;
}

function showInlineError(element, message) {
  if (!element) { showToast(message, true); return; }
  element.textContent = String(message || "Revisa los datos.");
  element.classList.add("visible");
}

function categoryById(categoryId) {
  return categories.find(c => c.id === categoryId) || null;
}

function activeBudgets(reference = new Date()) {
  const today = dateOnly(reference);
  return (state.budgets || []).filter(b => {
    const from = dateOnly(b.effective_from);
    const to = dateOnly(b.effective_to);
    return (!from || from <= today) && (!to || to > today);
  });
}

function budgetPlanningSummary() {
  const analysis = state.analysis;
  const income = Number(analysis?.cashFlow?.monthlyIncome) || 0;
  const fixed = Number(analysis?.cashFlow?.fixedPlan) || Number(analysis?.cashFlow?.fixedExpenses) || 0;
  const debtCommitment = Number(analysis?.cashFlow?.debtPlan) || Number(analysis?.debts?.monthlyCommitment) || 0;
  const goalCommitment = Number(analysis?.cashFlow?.goalPlan) || Number(analysis?.goals?.totalMonthlyPace) || 0;
  const variableSpent = Number(analysis?.cashFlow?.variableExpenses) || 0;
  const capacity = Math.round(income - fixed - debtCommitment - goalCommitment - variableSpent);
  const allocated = Math.round(activeBudgets().reduce((sum, b) => sum + Number(b.amount || 0), 0));
  const capacityNegative = capacity < 0;
  const overallocated = allocated > Math.max(0, capacity) && allocated > 0;
  return {
    income, fixed, debtCommitment, goalCommitment, variableSpent,
    capacity, capacityNegative, allocated,
    unassigned: Math.round(Math.max(0, capacity) - allocated),
    overallocated,
    overallocatedAmount: overallocated ? allocated - Math.max(0, capacity) : 0,
  };
}

function budgetStatusList() {
  return activeBudgets().map(budget => {
    const category = categoryById(budget.category_id);
    const limit = Number(budget.amount) || 0;
    const spent = Number(state.analysis?.spending?.byCategory?.[budget.category_id]) || 0;
    const remaining = limit - spent;
    const ratio = limit > 0 ? spent / limit : 0;
    let status = "within";
    let label = "Dentro del plan";
    if (spent > limit) { status = "exceeded"; label = "Excedido"; }
    else if (spent === limit && limit > 0) { status = "reached"; label = "Límite alcanzado"; }
    else if (ratio >= 0.8) { status = "near"; label = "Cerca del límite"; }
    return { budget, category, limit, spent, remaining, ratio, status, label };
  });
}

function latestFinancialUpdate() {
  const candidates = [
    state.account?.balance_reconciled_at,
    state.account?.updated_at,
    ...(state.transactions || []).slice(0, 20).map(t => t.updated_at || t.created_at),
    ...(state.reconciliations || []).slice(0, 5).map(r => r.created_at),
  ].filter(Boolean).map(v => new Date(v)).filter(d => !Number.isNaN(d.getTime()));
  if (!candidates.length) return null;
  return new Date(Math.max(...candidates.map(d => d.getTime())));
}

function dataQualityAssessment() {
  let earned = 0;
  let possible = 100;
  const issues = [];
  const profile = state.profile || {};

  if (state.account) earned += 20; else issues.push("Falta registrar una cuenta y confirmar su saldo actual.");
  if (state.account?.balance_reconciled_at || (state.reconciliations || []).length) earned += 10;
  else issues.push("Confirma o concilia el saldo actual de tu cuenta.");

  if (Number(state.analysis?.cashFlow?.monthlyIncome) > 0) earned += 20;
  else issues.push("Falta confirmar tu ingreso.");
  if (profile.pay_day_1) earned += 5; else issues.push("No has indicado tu día de cobro.");

  if (profile.fixed_expenses_confirmed === true) earned += 10;
  else issues.push("Confirma tus gastos fijos, incluso si no tienes ninguno.");
  if (profile.debts_confirmed === true) earned += 10;
  else issues.push("Confirma tus deudas, incluso si no tienes ninguna.");

  const uncategorized = Number(state.analysis?.spending?.uncategorized) || 0;
  if ((state.transactions || []).length > 0 && uncategorized <= 0) earned += 10;
  else if (uncategorized > 0) issues.push(`Hay ${money(uncategorized)} en gastos sin categoría.`);
  else issues.push("Aún no hay suficientes movimientos para validar la clasificación.");

  const incompleteDebts = (state.debts || []).filter(d => isDebtActive(d) && d.setup_state === "incomplete");
  if (profile.debts_confirmed && !incompleteDebts.length) earned += 5;
  else if (incompleteDebts.length) issues.push(`${incompleteDebts.length} deuda(s) tienen datos por confirmar.`);

  const updated = latestFinancialUpdate();
  const ageDays = updated ? Math.max(0, Math.floor((Date.now() - updated.getTime()) / 86400000)) : null;
  if (ageDays != null && ageDays <= 14) earned += 5;
  else if (ageDays == null) issues.push("Aún no hay una conciliación o actividad financiera registrada.");
  else issues.push(`Tus datos llevan ${ageDays} días sin conciliarse o actualizarse.`);

  const plan = budgetPlanningSummary();
  if (plan.capacityNegative) issues.push(`Tu plan mensual ya tiene un déficit de ${money(Math.abs(plan.capacity))} antes de presupuestar categorías.`);
  else if (plan.overallocated) issues.push(`Tus presupuestos superan tu capacidad mensual por ${money(plan.overallocatedAmount)}.`);
  else if ((state.budgets || []).length > 0) earned += 5;
  else possible -= 5;

  const score = Math.max(0, Math.min(100, Math.round((earned / Math.max(1, possible)) * 100)));
  const label = score >= 80 ? "Alta" : score >= 55 ? "Media" : "Baja";
  return { score, label, issues, updatedAt: updated, ageDays, earned, possible };
}

function buildUserAlerts() {
  const alerts = [];
  const today = dateOnly(new Date());
  const freeToday = Number(state.analysis?.liquidity?.freeCashToday) || 0;
  if (freeToday < 0) alerts.push({ level: "urgent", icon: "🔴", text: `Tienes ${money(Math.abs(freeToday))} de compromisos pendientes sin respaldo hoy.`, tab: "inicio" });

  (state.debts || []).filter(isDebtActive).forEach(d => {
    const due = dateOnly(d.next_due_date);
    if (due && due < today) {
      const days = Math.max(1, civilDaysBetween(due, today));
      alerts.push({ level: "urgent", icon: "⏰", text: `“${d.name}” está atrasada por ${days} día${days === 1 ? "" : "s"}.`, tab: "deudas" });
    }
  });

  budgetStatusList().forEach(s => {
    if (s.status === "exceeded") alerts.push({ level: "important", icon: "📊", text: `${s.category?.name || "Una categoría"} está excedida por ${money(Math.abs(s.remaining))}.`, tab: "presup" });
    else if (s.status === "near") alerts.push({ level: "info", icon: "🟡", text: `${s.category?.name || "Una categoría"} está al ${Math.floor(s.ratio * 100)}% de su límite.`, tab: "presup" });
  });

  const uncategorized = Number(state.analysis?.spending?.uncategorized) || 0;
  if (uncategorized > 0) alerts.push({ level: "important", icon: "🏷️", text: `Clasifica ${money(uncategorized)} en gastos para mejorar tus presupuestos.`, tab: "gastos" });
  const plan = budgetPlanningSummary();
  if (plan.capacityNegative) alerts.push({ level: "urgent", icon: "⚠️", text: `Tu plan mensual tiene un déficit de ${money(Math.abs(plan.capacity))}.`, tab: "presup" });
  else if (plan.overallocated) alerts.push({ level: "important", icon: "⚠️", text: `Has distribuido ${money(plan.overallocatedAmount)} más de tu capacidad mensual.`, tab: "presup" });
  return alerts.slice(0, 8);
}

function inferCategoryId(itemName) {
  const text = String(itemName || "").toLowerCase();
  const rules = [
    ["Comida", /comida|almuerzo|cena|desayuno|pizza|restaurante|supermercado|mercado|bebida/],
    ["Transporte", /gasolina|combustible|uber|taxi|pasaje|transporte|motor|moto|veh[ií]culo/],
    ["Vivienda", /casa|alquiler|mueble|electrodom[eé]stico|nevera|estufa|hogar/],
    ["Salud", /medicina|m[eé]dico|consulta|farmacia|salud/],
    ["Ocio", /juego|cine|fiesta|concierto|ocio|viaje|vacaciones/],
    ["Educación", /curso|libro|universidad|colegio|clase|educaci[oó]n/],
    ["Ropa", /tenis|zapatos|camisa|pantal[oó]n|ropa|gorra/],
  ];
  for (const [name, pattern] of rules) {
    if (pattern.test(text)) return categories.find(c => c.name === name)?.id || null;
  }
  return null;
}

function budgetImpactForPurchase(amount, categoryId) {
  if (!categoryId) return null;
  const budget = activeBudgets().find(b => b.category_id === categoryId);
  const category = categoryById(categoryId);
  if (!budget) return { categoryId, categoryName: category?.name || "Categoría", hasBudget: false };
  const spentBefore = Number(state.analysis?.spending?.byCategory?.[categoryId]) || 0;
  const limit = Number(budget.amount) || 0;
  const spentAfter = spentBefore + Math.max(0, Number(amount) || 0);
  return {
    categoryId,
    categoryName: category?.name || "Categoría",
    hasBudget: true,
    limit,
    spentBefore,
    spentAfter,
    remainingBefore: limit - spentBefore,
    remainingAfter: limit - spentAfter,
    exceededAfter: spentAfter > limit,
    reachedAfter: spentAfter === limit,
  };
}

function formatUpdateTime(value) {
  if (!value) return "Sin actividad registrada";
  return value.toLocaleString("es-DO", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
}

// Escapa texto escrito por el usuario antes de insertarlo en HTML.
// Sin esto, un nombre como: Tarjeta "Popular"  rompe los campos de
// edición, y cualquier símbolo < o & puede romper el renderizado.
function esc(str) {
  if (str == null) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// Aviso breve arriba de la pantalla, para confirmar que algo se guardó
// (antes, editar no daba ninguna señal de que había funcionado).
function showToast(msg, isError = false) {
  let toast = document.getElementById("toastMsg");
  if (!toast) {
    toast = document.createElement("div");
    toast.id = "toastMsg";
    toast.setAttribute("role", isError ? "alert" : "status");
    toast.setAttribute("aria-live", "polite");
    toast.style.cssText = "position:fixed; top:20px; left:50%; transform:translateX(-50%); color:white; padding:10px 18px; border-radius:20px; font-size:13px; z-index:1200; box-shadow:0 4px 14px rgba(0,0,0,0.18); opacity:0; transition:opacity 0.25s, background 0.15s; pointer-events:none; max-width:calc(100vw - 32px);";
    document.body.appendChild(toast);
  }
  toast.setAttribute("role", isError ? "alert" : "status");
  toast.style.background = isError ? "var(--danger-text)" : "var(--teal)";
  toast.textContent = msg;
  toast.style.opacity = "1";
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { toast.style.opacity = "0"; }, isError ? 3200 : 1800);
}

function showUndoToast(message, onUndo) {
  let toast = document.getElementById("undoToast");
  if (toast) toast.remove();
  toast = document.createElement("div");
  toast.id = "undoToast";
  toast.style.cssText = "position:fixed;left:16px;right:16px;bottom:82px;background:var(--text);color:white;padding:11px 12px;border-radius:12px;z-index:1000;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 6px 20px rgba(0,0,0,.22);";
  toast.innerHTML = `<span style="font-size:12px;">${esc(message)}</span><button id="undoToastBtn" style="background:none;color:white;font-size:12px;font-weight:600;text-decoration:underline;min-height:32px;">Deshacer</button>`;
  document.body.appendChild(toast);
  let active = true;
  const timer = setTimeout(() => { active = false; toast.remove(); }, 6500);
  document.getElementById("undoToastBtn").addEventListener("click", async () => {
    if (!active) return;
    active = false; clearTimeout(timer);
    const btn = document.getElementById("undoToastBtn"); if (btn) { btn.disabled = true; btn.textContent = "Deshaciendo…"; }
    try { await onUndo(); } finally { toast.remove(); }
  });
}

// Reemplaza el confirm() nativo del navegador (feo, fuera de estilo)
// por un modal propio, coherente con el resto de la app.
function confirmAction(message, confirmLabel = "Sí, continuar", danger = true) {
  return new Promise(resolve => {
    const modal = document.getElementById("confirmModal");
    if (!modal) { resolve(false); return; }
    if (activeConfirmation?.resolve) activeConfirmation.resolve(false);
    let settled = false;
    const finish = value => {
      if (settled) return;
      settled = true;
      modal.onclick = null;
      modal.classList.remove("visible");
      modal.innerHTML = "";
      if (activeConfirmation?.modal === modal) activeConfirmation = null;
      resolve(Boolean(value));
    };
    activeConfirmation = { resolve: finish, modal };
    modal.classList.add("visible");
    modal.setAttribute("role", "dialog");
    modal.setAttribute("aria-modal", "true");
    modal.innerHTML = `
      <div class="modal-box" role="document" style="text-align:center;">
        <p style="font-size:14px; margin:0 0 20px; line-height:1.5;">${esc(message).replace(/\n/g, "<br>")}</p>
        <div class="btn-row">
          <button class="btn-secondary" id="confirmNo">Cancelar</button>
          <button class="btn-primary" id="confirmYes" style="background:${danger ? "var(--danger-text)" : "var(--teal)"};">${esc(confirmLabel)}</button>
        </div>
      </div>`;
    document.getElementById("confirmNo")?.addEventListener("click", () => finish(false));
    document.getElementById("confirmYes")?.addEventListener("click", () => finish(true));
    modal.onclick = event => { if (event.target === modal) finish(false); };
    setTimeout(() => document.getElementById("confirmNo")?.focus(), 0);
  });
}

// ---------------------------------------------------------------
// CARGA INICIAL
// ---------------------------------------------------------------
async function init() {
  try {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) { window.location.href = "index.html"; return; }
    user = session.user;

    const { data: cats, error: categoriesError } = await supabase.from("categories").select("*").order("name");
    if (categoriesError) throw categoriesError;
    categories = cats || [];

    await loadState();
    render();
  } catch (e) {
    console.error("[Coach Financiero] error de carga", e);
    root.innerHTML = `
      <div class="screen" style="text-align:center; padding:50px 24px;">
        <div class="icon-circle" style="background:var(--danger-bg); margin:0 auto 14px;">⚠️</div>
        <p style="font-size:14px; margin:0 0 8px;">No pudimos cargar tus datos</p>
        <p style="font-size:12px; color:var(--text-muted); margin:0 0 20px; line-height:1.5;">Revisa tu conexión a internet e intenta de nuevo.</p>
        <button class="btn-primary" style="width:100%;" onclick="window.location.reload()">Reintentar</button>
      </div>
    `;
  }
}

async function loadState() {
  const now = new Date();
  const monthStart = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2,"0")}-01`;
  const historyStart = `${now.getFullYear() - 1}-${String(now.getMonth() + 1).padStart(2,"0")}-01`;

  const essentialQueries = [
    supabase.from("accounts").select("*").order("created_at"),
    supabase.from("profiles").select("*").eq("id", user.id).maybeSingle ? supabase.from("profiles").select("*").eq("id", user.id).maybeSingle() : supabase.from("profiles").select("*").eq("id", user.id).single(),
    supabase.from("goals").select("*").order("created_at"),
    supabase.from("recurring_expense_templates").select("*, categories(name)").eq("active", true).order("created_at"),
    supabase.from("debts").select("*").order("created_at"),
    supabase.from("transactions").select("*, categories(name)").order("occurred_at", { ascending: false }).limit(300),
    supabase.from("transactions").select("*, categories(name)").gte("occurred_at", monthStart).order("occurred_at", { ascending: false }),
    supabase.from("budgets").select("*, categories(name)").order("effective_from", { ascending: false }),
  ];
  const essential = await Promise.all(essentialQueries);
  const essentialError = essential.find(r => r?.error)?.error;
  if (essentialError) throw essentialError;

  const optionalSpecs = [
    ["goalContributions", supabase.from("goal_contributions").select("id, goal_id, transaction_id, amount, amount_after, created_at").gte("created_at", historyStart)],
    ["debtPayments", supabase.from("debt_payments").select("id, debt_id, transaction_id, reversal_transaction_id, amount, balance_before, balance_after, principal_component, interest_component, fee_component, payment_number, paid_at, paid_on, status, voided_at, installments_completed, payment_action, allocation_method, breakdown_confirmed, note, corrects_payment_id, corrected_by_payment_id").gte("paid_on", historyStart)],
    ["fixedPayments", supabase.from("fixed_expense_payments").select("*").gte("period_key", historyStart)],
    ["purchaseDecisions", supabase.from("purchase_decisions").select("*").order("created_at", { ascending: false }).limit(100)],
    ["reconciliations", supabase.from("account_reconciliations").select("*").order("created_at", { ascending: false }).limit(20)],
  ];
  const optionalResults = await Promise.all(optionalSpecs.map(async ([key, query]) => {
    try { const result = await query; return { key, ...result }; }
    catch (error) { return { key, data: [], error }; }
  }));
  const optional = Object.fromEntries(optionalResults.map(r => [r.key, r.error ? [] : (r.data || [])]));
  const optionalErrors = optionalResults.filter(r => r.error).map(r => ({ key: r.key, message: r.error?.message || String(r.error) }));

  const [accountsResult, profileResult, goalsResult, fixedResult, debtsResult, transactionsResult, monthTransactionsResult, budgetsResult] = essential;
  const accounts = accountsResult.data || [];
  state = {
    account: accounts[0] || null,
    accounts,
    profile: profileResult.data || null,
    goals: goalsResult.data || [],
    fixed: fixedResult.data || [],
    debts: debtsResult.data || [],
    transactions: transactionsResult.data || [],
    analysisTransactions: monthTransactionsResult.data || [],
    budgets: budgetsResult.data || [],
    goalContributions: optional.goalContributions,
    debtPayments: optional.debtPayments,
    fixedPayments: optional.fixedPayments,
    purchaseDecisions: optional.purchaseDecisions,
    reconciliations: optional.reconciliations,
    optionalErrors,
  };
  computeAnalysis();
}

// Ritmo REAL necesario para cumplir la meta: usa lo que falta ahorrar
// y los meses que quedan de verdad (no el plan original completo),
// para no subestimar ni sobreestimar el riesgo si el usuario va
// adelantado o atrasado respecto a su plan inicial.
function goalMonthlyPace(g, asOf = state.analysis?.generatedAt || new Date()) {
  if (!g || !g.target_months) return 0;
  const created = dateOnly(g.created_at) || new Date(asOf);
  const now = dateOnly(asOf) || new Date();
  const elapsedMonths = (now.getFullYear() - created.getFullYear()) * 12 + (now.getMonth() - created.getMonth());
  const remainingMonths = Math.max(1, Number(g.target_months) - elapsedMonths);
  const remainingAmount = Math.max(0, Number(g.target_amount) - Number(g.current_amount));
  return remainingAmount / remainingMonths;
}

// Suma el ritmo mensual necesario de TODAS las metas activas — porque
// todas compiten por el mismo disponible, no alcanza con mirar una sola.
// P2: Cálculo correcto de cuota con interés (fórmula PMT estándar).
// PMT = P × i × (1+i)^n / ((1+i)^n − 1)
// Sin tasa de interés, degrada a simple división.
function calcPMT(principal, annualRatePct, periods) {
  if (!annualRatePct || annualRatePct <= 0 || !periods) return principal / periods;
  const i = annualRatePct / 100 / 12;
  return principal * i * Math.pow(1 + i, periods) / (Math.pow(1 + i, periods) - 1);
}

const DEBT_PLAN_TYPES = [
  { value: "amortized", label: "Préstamo con cuotas sobre saldo" },
  { value: "flat_total", label: "Interés total por todo el acuerdo" },
  { value: "flat_periodic", label: "Interés fijo por cada período" },
  { value: "credit_card", label: "Tarjeta o línea de crédito" },
  { value: "no_interest", label: "Deuda sin intereses" },
  { value: "legacy", label: "Estimación con información parcial" },
];

const PAYMENT_FREQUENCIES = [
  { value: "monthly", label: "Mensual" },
  { value: "biweekly", label: "Quincenal" },
  { value: "weekly", label: "Semanal" },
];

function paymentPeriodsPerYear(frequency) {
  if (frequency === "weekly") return 52;
  if (frequency === "biweekly") return 24;
  return 12;
}

function paymentPeriodsPerMonth(frequency) {
  if (frequency === "weekly") return 52 / 12;
  if (frequency === "biweekly") return 2;
  return 1;
}

function monthlyPaymentEquivalent(amount, frequency = "monthly") {
  return Math.round((Number(amount) || 0) * paymentPeriodsPerMonth(frequency));
}

function periodicInterestRate(ratePct, rateType = "annual", paymentFrequency = "monthly") {
  const rate = Math.max(0, Number(ratePct) || 0) / 100;
  if (rateType === "per_period") return rate;
  if (rateType === "monthly") return rate / paymentPeriodsPerMonth(paymentFrequency);
  if (rateType === "annual") return rate / paymentPeriodsPerYear(paymentFrequency);
  return 0;
}

function debtRateLabel(debt) {
  if (debt?.plan_type === "no_interest") return "Sin intereses";
  if (debt?.setup_state === "incomplete" || debt?.interest_rate == null) return "Interés por confirmar";
  const rate = Number(debt?.interest_rate) || 0;
  if (!rate) return "0% confirmado";
  const type = debt?.interest_rate_type || "annual";
  if (type === "total_term") return `${rate}% total del acuerdo`;
  if (type === "monthly") return `${rate}% mensual`;
  if (type === "per_period") {
    const f = PAYMENT_FREQUENCIES.find(x => x.value === debt?.payment_frequency)?.label?.toLowerCase() || "por período";
    return `${rate}% ${f}`;
  }
  return `${rate}% anual`;
}

function debtPlanLabel(planType, debt = null) {
  if (debt?.setup_state === "incomplete") return "Información pendiente de confirmar";
  if (debt?.information_source === "scheduled_payment") return "Estimación basada en la cuota";
  if (debt?.information_source === "total_payable") return "Estimación basada en el total acordado";
  return DEBT_PLAN_TYPES.find(x => x.value === planType)?.label || "Registro básico";
}

function annualizedDebtRate(debt) {
  const rate = Math.max(0, Number(debt?.interest_rate) || 0);
  const type = debt?.interest_rate_type || "annual";
  const frequency = debt?.payment_frequency || "monthly";
  if (!rate || debt?.plan_type === "no_interest") return 0;
  if (type === "monthly") return rate * 12;
  if (type === "per_period") return rate * paymentPeriodsPerYear(frequency);
  if (type === "total_term") {
    const term = Math.max(1, Number(debt?.term_count || debt?.remaining_installments) || 1);
    return rate * paymentPeriodsPerYear(frequency) / term;
  }
  return rate;
}

function simulateAmortizedPayoff(principal, periodicRate, payment, maxPeriods = 1200) {
  let balance = Math.max(0, Number(principal) || 0);
  const rate = Math.max(0, Number(periodicRate) || 0);
  const installment = Math.max(0, Number(payment) || 0);
  if (balance <= 0 || installment <= 0) return { paysOff: balance <= 0, periods: 0, totalPaid: 0, totalInterest: 0 };
  if (rate > 0 && installment <= balance * rate) {
    return { paysOff: false, periods: null, totalPaid: null, totalInterest: null };
  }

  let periods = 0;
  let totalPaid = 0;
  let totalInterest = 0;
  while (balance > 0.005 && periods < maxPeriods) {
    const interest = balance * rate;
    const due = balance + interest;
    const paid = Math.min(installment, due);
    balance = Math.max(0, due - paid);
    totalPaid += paid;
    totalInterest += interest;
    periods += 1;
  }
  return {
    paysOff: balance <= 0.005,
    periods: balance <= 0.005 ? periods : null,
    totalPaid: balance <= 0.005 ? Math.round(totalPaid * 100) / 100 : null,
    totalInterest: balance <= 0.005 ? Math.round(totalInterest * 100) / 100 : null,
  };
}

function calculateDebtPlan({
  planType = "amortized",
  originalAmount = 0,
  interestRate = 0,
  interestRateType = "annual",
  paymentFrequency = "monthly",
  termCount = 0,
  scheduledPayment = 0,
} = {}) {
  const principal = Math.max(0, Number(originalAmount) || 0);
  const rate = Math.max(0, Number(interestRate) || 0);
  const term = Math.max(0, Math.trunc(Number(termCount) || 0));
  const manualPayment = Math.max(0, Number(scheduledPayment) || 0);

  let periodicRate = 0;
  let estimatedInterest = 0;
  let totalPayable = principal;
  let payment = manualPayment;
  let variableTotal = false;
  let payoffPeriods = term || null;

  if (planType === "credit_card") {
    periodicRate = periodicInterestRate(rate, interestRateType, "monthly");
    estimatedInterest = principal * periodicRate;
    totalPayable = null;
    variableTotal = true;
  } else if (planType === "flat_total") {
    estimatedInterest = principal * (rate / 100);
    totalPayable = principal + estimatedInterest;
    if (!payment && term > 0) payment = totalPayable / term;
  } else if (planType === "flat_periodic") {
    periodicRate = rate / 100;
    estimatedInterest = term > 0 ? principal * periodicRate * term : 0;
    totalPayable = principal + estimatedInterest;
    if (!payment && term > 0) payment = totalPayable / term;
  } else if (planType === "amortized") {
    periodicRate = periodicInterestRate(rate, interestRateType, paymentFrequency);
    if (!payment && term > 0) {
      payment = periodicRate > 0
        ? principal * periodicRate * Math.pow(1 + periodicRate, term) / (Math.pow(1 + periodicRate, term) - 1)
        : principal / term;
    }
    if (payment > 0) {
      const payoff = simulateAmortizedPayoff(principal, periodicRate, payment);
      if (payoff.paysOff) {
        totalPayable = payoff.totalPaid;
        estimatedInterest = payoff.totalInterest;
        payoffPeriods = payoff.periods;
      } else {
        totalPayable = null;
        estimatedInterest = principal * periodicRate;
        payoffPeriods = null;
        variableTotal = true;
      }
    }
  } else if (planType === "no_interest") {
    if (!payment && term > 0) payment = principal / term;
    totalPayable = principal;
    estimatedInterest = 0;
  } else {
    totalPayable = principal;
    estimatedInterest = 0;
  }

  return {
    principal: Math.round(principal * 100) / 100,
    periodicRate,
    scheduledPayment: Math.round(payment * 100) / 100,
    monthlyEquivalent: monthlyPaymentEquivalent(payment, paymentFrequency),
    totalPayable: totalPayable == null ? null : Math.round(totalPayable * 100) / 100,
    estimatedInterest: Math.round(estimatedInterest * 100) / 100,
    payoffPeriods,
    variableTotal,
  };
}

function estimateDebtPaymentBreakdown(debt, amount, manualInterest = null, feeAmount = 0) {
  const payment = Math.max(0, Number(amount) || 0);
  const fee = Math.max(0, Number(feeAmount) || 0);
  const available = Math.max(0, payment - fee);
  const planType = debt?.plan_type || "legacy";
  const principal = Math.max(0, Number(debt?.principal_outstanding ?? debt?.current_balance) || 0);
  const existingInterest = Math.max(0, Number(debt?.interest_outstanding) || 0);
  const currentBalance = Math.max(0, Number(debt?.current_balance) || (principal + existingInterest));

  let interestCharge = 0;
  let interestComponent = 0;

  if (manualInterest != null && Number.isFinite(Number(manualInterest))) {
    const requestedInterest = Math.max(0, Number(manualInterest));
    if (["flat_total", "flat_periodic"].includes(planType)) {
      interestComponent = Math.min(available, requestedInterest, existingInterest);
    } else if (planType === "no_interest") {
      interestComponent = 0;
    } else {
      interestComponent = Math.min(available, requestedInterest);
      if (planType === "amortized") {
        interestCharge = Math.max(0, interestComponent - existingInterest);
      }
    }
  } else if (planType === "amortized") {
    interestCharge = principal * periodicInterestRate(
      debt?.interest_rate,
      debt?.interest_rate_type || "annual",
      debt?.payment_frequency || "monthly"
    );
    interestComponent = Math.min(available, existingInterest + interestCharge);
  } else if (["flat_total", "flat_periodic"].includes(planType) && currentBalance > 0) {
    interestComponent = Math.min(existingInterest, available * (existingInterest / currentBalance));
  } else if (existingInterest > 0) {
    interestComponent = Math.min(existingInterest, available);
  }

  let principalComponent = Math.max(0, available - interestComponent);
  if (!["credit_card", "legacy"].includes(planType)) {
    principalComponent = Math.min(principal, principalComponent);
  }

  let newPrincipal;
  let newInterest;
  let newBalance;

  if (["credit_card", "legacy"].includes(planType)) {
    newBalance = Math.max(0, currentBalance - available);
    newPrincipal = newBalance;
    newInterest = 0;
  } else {
    newPrincipal = Math.max(0, principal - principalComponent);
    newInterest = Math.max(0, existingInterest + interestCharge - interestComponent);
    newBalance = newPrincipal + newInterest;
  }

  return {
    payment,
    fee: Math.round(fee * 100) / 100,
    interestCharge: Math.round(interestCharge * 100) / 100,
    interestComponent: Math.round(interestComponent * 100) / 100,
    principalComponent: Math.round(principalComponent * 100) / 100,
    newPrincipal: Math.round(newPrincipal * 100) / 100,
    newInterest: Math.round(newInterest * 100) / 100,
    newBalance: Math.round(newBalance * 100) / 100,
  };
}

function goalPriorityLabel(priority) {
  if (priority === "critical") return "🔴 Alta";
  if (priority === "important") return "🟡 Media";
  return "🔵 Baja";
}

function goalMonthsLeft(g, asOf = state.analysis?.generatedAt || new Date()) {
  const created = dateOnly(g?.created_at) || dateOnly(asOf) || new Date();
  const now = dateOnly(asOf) || new Date();
  const elapsed = (now.getFullYear() - created.getFullYear()) * 12 + (now.getMonth() - created.getMonth());
  return Math.max(1, Number(g?.target_months || 1) - elapsed);
}

// Calcula cuántos meses antes del plazo se completó la meta.
// Si es positivo, se logró antes de tiempo. Si es 0 o negativo, a tiempo o tarde.
function goalMonthsEarly(g) {
  if (!g || !g.completed_at || !g.created_at || !g.target_months) return 0;
  const created = new Date(g.created_at);
  const completed = new Date(g.completed_at);
  const monthsUsed = (completed.getFullYear() - created.getFullYear()) * 12 + (completed.getMonth() - created.getMonth());
  return Math.max(0, g.target_months - monthsUsed);
}

// P6: deriva el estado visible de una meta. 'completed' si ya llegó;
// 'at_risk' si el ritmo requerido supera holgadamente lo disponible.
function goalStatus(g) {
  if (!g) return "active";
  if (g.status === "completed" || Number(g.current_amount) >= Number(g.target_amount)) return "completed";
  if (g.status === "paused" || g.status === "abandoned") return g.status;

  const analyzed = state.analysis?.goals?.byGoal?.find(item => item.id === g.id);
  return analyzed?.derivedStatus || "active";
}

function goalStatusLabel(status) {
  return status === "completed" ? { text: "✓ Cumplida", color: "var(--success-text)", bg: "var(--success-bg)" }
    : status === "at_risk" ? { text: "⚠ En riesgo", color: "var(--warning-text)", bg: "var(--warning-bg)" }
    : status === "paused" ? { text: "Pausada", color: "var(--text-secondary)", bg: "var(--card)" }
    : status === "abandoned" ? { text: "Abandonada", color: "var(--text-muted)", bg: "var(--card)" }
    : { text: "En curso", color: "var(--teal)", bg: "var(--teal-light)" };
}

function isGoalActive(g) {
  if (!g) return false;
  const status = g.status || "active";
  const pending = Number(g.current_amount) < Number(g.target_amount);
  return pending && (status === "active" || status === "at_risk");
}

function isDebtActive(d) {
  if (!d) return false;
  return d.status !== "completed" && Number(d.current_balance) > 0;
}

// Crea una fecha de cobro válida incluso en meses cortos.
// Ejemplo: si el usuario cobra el día 30, febrero usa su último día real.
function dateForMonthDay(year, monthIndex, day) {
  const lastDay = new Date(year, monthIndex + 1, 0, 12).getDate();
  const requestedDay = Math.max(1, Number(day) || 1);
  return new Date(year, monthIndex, Math.min(requestedDay, lastDay), 12, 0, 0, 0);
}

// Calcula días hasta el próximo cobro y la fecha estimada
// basándose en pay_day_1, pay_day_2 y pay_frequency del perfil.
function totalFixed() {
  return state.fixed.reduce((s, f) => s + Number(f.estimated_amount), 0);
}
function monthlyIncome() {
  if (!state.profile || state.profile.declared_monthly_income == null) return 0;
  const base = Number(state.profile.declared_monthly_income);
  return state.profile.pay_frequency === "biweekly" ? base * 2 : base;
}
function disponible() {
  return monthlyIncome() - totalFixed();
}
function balance() {
  const accounts = state.accounts?.length ? state.accounts : (state.account ? [state.account] : []);
  return accounts.reduce((sum, account) => sum + Number(account.computed_balance ?? account.initial_balance ?? 0), 0);
}

// Motor de Baseline Score: combina capacidad de ahorro, colchón de
// liquidez, y nivel de endeudamiento relativo al ingreso. 0-100.
// El Behavior Score se queda en "Aprendiendo" hasta que exista el
// campo de intención por transacción (fuera de Fase 1, ver ADR-005).
// ================================================================
// ================================================================
// FINANCIAL CORE — FASE 1 (v2)
// Arquitectura en 5 capas con responsabilidades separadas.
//
// REGLAS DE ORO (ningún código nuevo puede violarlas):
//   1. Ninguna pantalla lee state.* para cálculos — solo state.analysis.
//      Excepción: formularios de creación/edición (CRUD).
//   2. El engine es puro — nunca modifica state. Solo recibe y retorna.
//   3. Ningún código nuevo llama funciones @legacy directamente.
//      Las @legacy son wrappers de compatibilidad durante la migración.
//
// CAPAS:
//   FinancialData      → normalización de datos crudos
//   FinancialCore    → describe la realidad financiera (puro)
//   RecommendationEngine → prioridades, estrategia, next best action
//   PurchaseEngine     → análisis de compras (Fase 3)
//   CoachContextBuilder → contexto para la IA (Fase 5)
//   DashboardPresenter → modelo para la UI (Fase 4)
//
// SCHEMA VERSION: 2
// Incrementar cuando cambie la estructura de FinancialAnalysis
// para que módulos que consumen el análisis puedan verificar.
// ================================================================
const FA_SCHEMA_VERSION = 3;

// ---------------------------------------------------------------
// @legacy — WRAPPERS DE COMPATIBILIDAD TEMPORAL
// Estas funciones existían antes del engine y siguen funcionando
// para no romper el código de las pantallas mientras se migran.
// NINGÚN CÓDIGO NUEVO debe llamarlas directamente.
// Cuando todos los módulos lean state.analysis, se eliminarán.
// ---------------------------------------------------------------
// Las funciones balance(), disponible(), monthlyIncome(), etc.
// siguen declaradas más arriba en el archivo y son llamadas DESDE
// el engine. Su uso directo en la UI está marcado como deprecated.

// ---------------------------------------------------------------
// CAPA 1 — FinancialData
// Única responsabilidad: normalizar datos crudos de state.
// El engine NUNCA lee state directamente — solo FinancialData.
// Resuelve frecuencias, calcula próximo cobro, normaliza montos.
// ---------------------------------------------------------------
function buildFinancialData(asOf = new Date()) {
  const raw = {
    account: state.account ?? null,
    accounts: state.accounts?.length ? state.accounts : (state.account ? [state.account] : []),
    profile: state.profile ?? null,
    transactions: state.analysisTransactions?.length ? state.analysisTransactions : (state.transactions ?? []),
    goals: state.goals ?? [], fixed: state.fixed ?? [], debts: state.debts ?? [], budgets: state.budgets ?? [],
    goalContributions: state.goalContributions ?? [], debtPayments: state.debtPayments ?? [], fixedPayments: state.fixedPayments ?? [], categories: categories ?? [],
  };
  if (!raw.profile || raw.accounts.length === 0) return { raw, normalized: null };

  const today = dateOnly(asOf) || new Date();
  const y = today.getFullYear(), m = today.getMonth();
  const freq = raw.profile.pay_frequency ?? "monthly";
  const perPaycheck = Number(raw.profile.declared_monthly_income) || 0;
  const monthlyInc = freq === "biweekly" ? perPaycheck * 2 : perPaycheck;
  const dailyInc = Math.round(monthlyInc / 30);
  const annualInc = monthlyInc * 12;

  let nextPayDate = null, nextPayDateISO = null, daysUntilPay = null, nextPayAmount = null;
  if (raw.profile.pay_day_1) {
    const days = (freq === "biweekly" && raw.profile.pay_day_2)
      ? [raw.profile.pay_day_1, raw.profile.pay_day_2].filter(Boolean).sort((a,b)=>a-b)
      : [raw.profile.pay_day_1];
    let next = null;
    for (const day of days) {
      const candidate = dateForMonthDay(y, m, day);
      if (candidate >= today) { next = candidate; break; }
    }
    if (!next) next = dateForMonthDay(y, m + 1, days[0]);
    daysUntilPay = Math.max(0, civilDaysBetween(today, next));
    nextPayDateISO = localISODate(next);
    nextPayDate = daysUntilPay === 0 ? "hoy" : next.toLocaleDateString("es-DO", { day:"numeric", month:"long" });
    nextPayAmount = perPaycheck;
  }

  const txMonth = raw.transactions.filter(tx => {
    const d = transactionEconomicDate(tx);
    return d && d <= today && d.getFullYear() === y && d.getMonth() === m;
  });

  const countableExpense = tx => isCountableExpense(tx, raw.fixedPayments);
  const variableTransactions = txMonth.filter(tx => countableExpense(tx) && !isFixedPaymentTransaction(tx));
  const fixedTransactions = txMonth.filter(tx => countableExpense(tx) && isFixedPaymentTransaction(tx));
  const ordinaryIncomeTransactions = txMonth.filter(isOrdinaryIncome);
  const variableSpent = variableTransactions.reduce((s,t)=>s+Math.abs(Number(t.amount)||0),0);
  const fixedPaid = fixedTransactions.reduce((s,t)=>s+Math.abs(Number(t.amount)||0),0);
  const ordinaryIncomeReceived = ordinaryIncomeTransactions.reduce((s,t)=>s+Math.abs(Number(t.amount)||0),0);

  const spendingByCategory = Object.fromEntries(raw.categories.map(c => [c.id,0]));
  for (const tx of txMonth) {
    if (!countableExpense(tx) || !tx.category_id) continue;
    spendingByCategory[tx.category_id] = (spendingByCategory[tx.category_id] || 0) + Math.abs(Number(tx.amount)||0);
  }
  const uncategorizedSpending = txMonth
    .filter(tx => countableExpense(tx) && !tx.category_id && !isFixedPaymentTransaction(tx))
    .reduce((s,t)=>s+Math.abs(Number(t.amount)||0),0);

  const monthlyFixed = raw.fixed.reduce((s,f)=>s+Math.max(0,Number(f.estimated_amount)||0),0);
  const availableToday = raw.accounts.reduce((s,a)=>s+Number(a.computed_balance ?? a.initial_balance ?? 0),0);
  const daysInMonth = new Date(y,m+1,0,12).getDate();
  const daysLeft = Math.max(1,daysInMonth-today.getDate()+1);

  const activeDebts = raw.debts.filter(isDebtActive);
  const activeGoals = raw.goals.filter(isGoalActive);
  const debtPaidThisMonth = raw.debtPayments.filter(p => (p.status||"active")!=="voided" && sameCivilMonth(p.paid_on||p.paid_at,today))
    .reduce((map,p)=>{
      const total=Math.max(0,Number(p.amount)||0), fee=Math.max(0,Number(p.fee_component)||0);
      map[p.debt_id] = map[p.debt_id] || { total:0, applied:0, fees:0 };
      map[p.debt_id].total += total; map[p.debt_id].applied += Math.max(0,total-fee); map[p.debt_id].fees += fee;
      return map;
    },{});
  const goalPaidThisMonth = raw.goalContributions.filter(c=>sameCivilMonth(c.created_at,today))
    .reduce((map,c)=>{ map[c.goal_id]=(map[c.goal_id]||0)+Number(c.amount||0); return map; },{});

  const debtPlan = activeDebts.reduce((s,d)=>s+monthlyPaymentEquivalent(Number(d.scheduled_payment ?? d.minimum_payment)||0,d.payment_frequency||"monthly"),0);
  const debtCashOutflow = Object.values(debtPaidThisMonth).reduce((s,v)=>s+v.total,0);
  const debtApplied = Object.values(debtPaidThisMonth).reduce((s,v)=>s+v.applied,0);
  const financialFees = Object.values(debtPaidThisMonth).reduce((s,v)=>s+v.fees,0);
  const debtPending = activeDebts.reduce((s,d)=>{
    const planned=monthlyPaymentEquivalent(Number(d.scheduled_payment ?? d.minimum_payment)||0,d.payment_frequency||"monthly");
    return s+Math.max(0,planned-(debtPaidThisMonth[d.id]?.applied||0));
  },0);

  const goalPlan = activeGoals.reduce((s,g)=>s+goalMonthlyPace(g,today),0);
  const goalCashOutflow = Object.values(goalPaidThisMonth).reduce((s,v)=>s+v,0);
  const goalPending = activeGoals.reduce((s,g)=>s+Math.max(0,goalMonthlyPace(g,today)-(goalPaidThisMonth[g.id]||0)),0);
  const fixedPending = Math.max(0,monthlyFixed-fixedPaid);

  const fixedPlanOrActual = Math.max(monthlyFixed,fixedPaid);
  const debtPlanOrActual = Math.max(debtPlan,debtCashOutflow);
  const goalPlanOrActual = Math.max(goalPlan,goalCashOutflow);
  const pendingCommitments = Math.round(fixedPending+debtPending+goalPending);
  const actualOutflows = Math.round(variableSpent+fixedPaid+debtCashOutflow+goalCashOutflow);
  const monthlyPlannedOrActualOutflow = Math.round(variableSpent+fixedPlanOrActual+debtPlanOrActual+goalPlanOrActual);
  const remainingBudget = Math.round(monthlyInc-monthlyPlannedOrActualOutflow);
  const capacityBeforeGoals = Math.round(monthlyInc-variableSpent-fixedPlanOrActual-debtPlanOrActual);

  return { raw, normalized: {
    monthlyIncome:monthlyInc,dailyIncome:dailyInc,annualIncome:annualInc,perPaycheck,payFrequency:freq,
    nextPayDate,nextPayDateISO,daysUntilPay,nextPayAmount,
    monthlyFixed,fixedPaid,fixedPending,fixedPlanOrActual,
    spentThisMonth:Math.round(variableSpent),spendingByCategory,uncategorizedSpending:Math.round(uncategorizedSpending),
    ordinaryIncomeReceived:Math.round(ordinaryIncomeReceived),
    availableToday:Math.round(availableToday),daysLeft,dailyRate:availableToday>0?Math.round(availableToday/daysLeft):0,
    debtPlan:Math.round(debtPlan),debtCashOutflow:Math.round(debtCashOutflow),debtApplied:Math.round(debtApplied),debtPending:Math.round(debtPending),financialFees:Math.round(financialFees),
    goalPlan:Math.round(goalPlan),goalCashOutflow:Math.round(goalCashOutflow),goalPending:Math.round(goalPending),
    debtPaidThisMonth,goalPaidThisMonth,pendingCommitments,actualOutflows,monthlyPlannedOrActualOutflow,remainingBudget,capacityBeforeGoals,
    disponible:monthlyInc-monthlyFixed,
    dispRestante:Math.round(monthlyInc-monthlyFixed-variableSpent),
    committed:pendingCommitments,
    freeCashToday:Math.round(availableToday-pendingCommitments),
    freeCashProjected:nextPayAmount!==null?Math.round(availableToday+nextPayAmount-pendingCommitments):null,
  }};
}

// ---------------------------------------------------------------
// CAPA 2 — FinancialCore (PURO — nunca modifica state)
// Única responsabilidad: describir la realidad financiera.
// No toma decisiones, no prioriza, no recomienda.
// Organizado por dominios para facilitar crecimiento futuro.
// ---------------------------------------------------------------
function FinancialCore(fd, options = {}) {
  const asOf = options.asOf ? dateOnly(options.asOf) : dateOnly(new Date());
  if (!fd.normalized) return FinancialAnalysis.empty(fd.raw);
  const n=fd.normalized, raw=fd.raw;
  const liquidity={
    balanceToday:n.availableToday,
    projectedBalance:n.nextPayAmount!==null?n.availableToday+n.nextPayAmount:null,
    plannedCommitments:n.pendingCommitments,
    freeCashToday:n.freeCashToday,freeCashProjected:n.freeCashProjected,
    dailyLiquidity:n.dailyRate,daysLeftInMonth:n.daysLeft,
    nextPay:n.nextPayDate?{amount:n.nextPayAmount,date:n.nextPayDate,dateISO:n.nextPayDateISO,daysAway:n.daysUntilPay,summary:n.daysUntilPay===0?`hoy por ${money(n.nextPayAmount)}`:`en ${n.daysUntilPay} día${n.daysUntilPay!==1?"s":""} (${n.nextPayDate}) por ${money(n.nextPayAmount)}`} : null,
  };
  const cashFlow={
    monthlyIncome:n.monthlyIncome,
    fixedExpenses:n.monthlyFixed,
    variableExpenses:n.spentThisMonth,
    operatingExpenses:Math.round(n.fixedPlanOrActual+n.spentThisMonth),
    operatingSurplus:Math.round(n.monthlyIncome-n.fixedPlanOrActual-n.spentThisMonth),
    plannedCommitments:n.pendingCommitments,
    remainingBudget:n.remainingBudget,
    fixedPlan:n.monthlyFixed,fixedPaid:n.fixedPaid,fixedPending:n.fixedPending,
    debtPlan:n.debtPlan,debtPaid:n.debtCashOutflow,debtPending:n.debtPending,
    goalPlan:n.goalPlan,goalPaid:n.goalCashOutflow,goalPending:n.goalPending,
    financialFees:n.financialFees,actualOutflows:n.actualOutflows,
    capacityBeforeGoals:n.capacityBeforeGoals,
    burnRate:n.monthlyIncome>0?Number((n.monthlyPlannedOrActualOutflow/n.monthlyIncome).toFixed(4)):0,
    availableToday:liquidity.balanceToday,availableMonthly:n.remainingBudget,
    freeCashToday:liquidity.freeCashToday,freeCashProjected:liquidity.freeCashProjected,
    committed:liquidity.plannedCommitments,dailyRate:liquidity.dailyLiquidity,daysLeft:liquidity.daysLeftInMonth,nextPay:liquidity.nextPay,
  };
  const spending={thisMonth:n.spentThisMonth,fixed:n.fixedPaid,variable:n.spentThisMonth,byCategory:n.spendingByCategory,uncategorized:n.uncategorizedSpending||0,financialFees:n.financialFees};

  const now=asOf||new Date();
  const activeGoals=raw.goals.filter(isGoalActive), completedGoals=raw.goals.filter(g=>g.status==="completed"||Number(g.current_amount)>=Number(g.target_amount));
  const totalPace=activeGoals.reduce((s,g)=>s+goalMonthlyPace(g,now),0);
  const canAffordAllGoals=n.capacityBeforeGoals>=totalPace;
  const goals={active:activeGoals,completed:completedGoals,totalMonthlyPace:Math.round(totalPace),canAffordAllGoals,byGoal:activeGoals.map(g=>{
    const rem=goalMonthsLeft(g,now),toSave=Math.max(0,Number(g.target_amount)-Number(g.current_amount)),pace=Math.round(toSave/rem);
    const st=toSave<=0?"completed":(!canAffordAllGoals||pace>n.capacityBeforeGoals)?"at_risk":"active";
    return {...g,pace,monthsLeft:rem,derivedStatus:st};
  })};

  const activeDebts=raw.debts.filter(isDebtActive),sortedDebts=[...activeDebts].sort((a,b)=>annualizedDebtRate(b)-annualizedDebtRate(a)),topDebt=sortedDebts[0]??null;
  const totalDebtAmt=activeDebts.reduce((s,d)=>s+Number(d.current_balance||0),0);
  const monthlyDebtCommit=activeDebts.reduce((s,d)=>s+monthlyPaymentEquivalent(Number(d.scheduled_payment??d.minimum_payment)||0,d.payment_frequency||"monthly"),0);
  const topRate=annualizedDebtRate(topDebt),debtRisk=topDebt?(topRate>=30?"critical":topRate>=15?"high":"moderate"):"none";
  const debts={total:totalDebtAmt,count:activeDebts.length,topDebt,riskLevel:debtRisk,sorted:sortedDebts,monthlyCommitment:Math.round(monthlyDebtCommit)};

  const inc=n.monthlyIncome;
  const savComp=inc>0?Math.max(0,Math.min(1,(Math.max(0,cashFlow.remainingBudget)/inc)*2)):0;
  const liqComp=inc>0?Math.max(0,Math.min(1,n.availableToday/inc)):0;
  const debtComp=inc>0?1-Math.max(0,Math.min(1,totalDebtAmt/(inc*3))):1;
  const stage=n.availableToday<=0?"survival":totalDebtAmt>0&&debtRisk==="critical"?"debt_elimination":n.availableToday<inc*0.5?"stability":totalDebtAmt===0&&activeGoals.length>0?"building":"growth";
  const weights={survival:{liquidity:50,savings:30,debt:20},debt_elimination:{liquidity:30,savings:20,debt:50},stability:{liquidity:35,savings:35,debt:30},building:{liquidity:30,savings:40,debt:30},growth:{liquidity:25,savings:40,debt:35}}[stage]??{liquidity:35,savings:35,debt:30};
  const score=inc>0?Math.round(Math.max(0,Math.min(100,savComp*weights.savings+liqComp*weights.liquidity+debtComp*weights.debt))):null;
  const financialHealth={score,stage,stageLabel:{survival:"Supervivencia",debt_elimination:"Eliminar deudas",stability:"Estabilidad",building:"Construcción",growth:"Crecimiento"}[stage]??"Estabilidad",components:{savings:{value:Math.round(savComp*weights.savings),weight:weights.savings,raw:savComp},liquidity:{value:Math.round(liqComp*weights.liquidity),weight:weights.liquidity,raw:liqComp},debt:{value:Math.round(debtComp*weights.debt),weight:weights.debt,raw:debtComp}},weights};
  return {schemaVersion:FA_SCHEMA_VERSION,generatedAt:new Date(now),stage,liquidity,cashFlow,spending,goals,debts,financialHealth,normalized:n};
}

function RecommendationEngine(analysis) {
  if (!analysis || !analysis.cashFlow) {
    return { priorities: [], nextBestAction: null, headline: "Completa tu perfil para ver recomendaciones." };
  }

  const { goals, debts, financialHealth, normalized: n } = analysis;
  const { stage } = financialHealth;

  const priorities = [];

  // Deuda crítica (prestamista/alta tasa) — siempre primero
  if (debts.topDebt && debts.riskLevel === "critical") {
    priorities.push({
      id: "pay_debt_critical", category: "debt",
      label: `Liquidar deuda "${debts.topDebt.name}"`,
      impact: 98,
      why: `${debtRateLabel(debts.topDebt)} — cada período que pasa aumenta el costo`,
      amount: Number(debts.topDebt.scheduled_payment ?? debts.topDebt.minimum_payment) || null,
    });
  }

  // Fondo de emergencia faltante. Una meta completada también cuenta
  // mientras conserve un monto registrado, para no recomendar crearla de nuevo.
  const emergencyGoals = [...goals.active, ...goals.completed]
    .filter(g => (g.name || "").toLowerCase().includes("emergencia"));
  const hasEmergencyFund = emergencyGoals.some(g =>
    g.status === "completed" || Number(g.current_amount) > 0
  );
  if (!hasEmergencyFund && n.availableToday < n.monthlyIncome) {
    priorities.push({
      id: "emergency_fund", category: "saving",
      label: "Crear fondo de emergencia",
      impact: 92,
      why: "Sin fondo de emergencia cualquier imprevisto puede desestabilizarte",
      amount: null,
    });
  }

  // Deuda de tasa alta (no crítica)
  if (debts.topDebt && debts.riskLevel === "high") {
    priorities.push({
      id: "pay_debt_high", category: "debt",
      label: `Reducir "${debts.topDebt.name}"`,
      impact: 78,
      why: `${debtRateLabel(debts.topDebt)} representa un costo alto`,
      amount: Number(debts.topDebt.scheduled_payment ?? debts.topDebt.minimum_payment) || null,
    });
  }

  // Metas activas
  goals.byGoal.forEach(g => {
    const priorityImpact = { critical: 75, important: 60, optional: 45 }[g.priority] ?? 55;
    priorities.push({
      id: `goal_${g.id}`, category: "goal",
      label: `Aportar a "${g.name}"`,
      impact: Math.min(90, priorityImpact + (g.derivedStatus === "at_risk" ? 15 : 0)),
      why: `${money(g.pace)}/mes necesario — faltan ${money(Math.max(0, Number(g.target_amount) - Number(g.current_amount)))}`,
      amount: g.pace,
    });
  });

  // Colchón general
  priorities.push({
    id: "save_buffer", category: "saving",
    label: "Aumentar colchón mensual",
    impact: 35,
    why: "Más margen reduce el estrés financiero y mejora tu score",
    amount: null,
  });

  const sorted = priorities.sort((a, b) => b.impact - a.impact);
  const nextBestAction = sorted[0] ?? null;

  const headline = (() => {
    if (stage === "survival")          return "Tu prioridad ahora es estabilizar tu liquidez.";
    if (stage === "debt_elimination")  return "Atacar tu deuda de alto costo es lo más rentable que puedes hacer.";
    if (!hasEmergencyFund)             return "Completar tu fondo de emergencia es el siguiente paso clave.";
    if (goals.byGoal.some(g => g.derivedStatus === "at_risk")) return "Alguna de tus metas está en riesgo este mes.";
    if (goals.active.length > 0)       return `Estás avanzando hacia "${goals.byGoal[0]?.name}".`;
    return "Tus finanzas están estables. Es buen momento para fijar nuevas metas.";
  })();

  return { priorities: sorted, nextBestAction, headline, stage };
}

// ---------------------------------------------------------------
// computeAnalysis() — punto de entrada público
// Ejecuta las 3 capas en orden y almacena en state.analysis.
// Se llama después de cada loadState(). Es puro en el sentido
// de que no tiene efectos secundarios más allá de state.analysis.
// ---------------------------------------------------------------
function computeAnalysis(asOf = new Date()) {
  const fd = buildFinancialData(asOf);                 // Capa 1
  const analysis = FinancialCore(fd, { asOf });         // Capa 2
  const recs = RecommendationEngine(analysis);          // Capa 3
  state.analysis = {
    ...analysis,
    recommendations: recs,
  };
  return state.analysis;
}

  const passed = results.filter(r => r.ok).length;

  results.forEach(r => console.log(`  ${r.ok ? "✅" : "❌"} ${r.desc}`));

}

function determineStep() {
  if (!state.account) return "account";
  if (state.profile == null || state.profile.declared_monthly_income == null) return "income";
  if (!onboardingIsComplete()) return "fixed";
  return "app";
}

function render() {
  const step = determineStep();
  if (step === "account") return renderOnboardingAccount();
  if (step === "income") return renderOnboardingIncome();
  if (step === "fixed") return renderOnboardingFixed();
  return renderApp();
}

function renderOnboardingIncome() {
  let frequency = state.profile?.pay_frequency || "monthly";
  const stored = Number(state.profile?.declared_monthly_income);
  let monthlyDraft = Number.isFinite(stored) && stored > 0 ? (frequency === "monthly" ? stored : stored * 2) : 0;
  let biweeklyDraft = Number.isFinite(stored) && stored > 0 ? (frequency === "biweekly" ? stored : stored / 2) : 0;

  function currentDraft(){ return frequency === "biweekly" ? biweeklyDraft : monthlyDraft; }
  function rememberDraft(){ const el=document.getElementById("incAmount"); if(!el) return; const v=Number(el.value); if(Number.isFinite(v)&&v>=0){ if(frequency==="biweekly") biweeklyDraft=v; else monthlyDraft=v; } }
  function paint() {
    root.innerHTML = `<div class="screen"><p class="step-label">Paso 2 de 4</p><h1>¿Con qué frecuencia cobras?</h1>
      <p class="subtitle">La app conserva la equivalencia mensual cuando cambias la frecuencia.</p>
      <div class="type-grid" style="grid-template-columns:1fr 1fr;" id="freqGrid">
        <button type="button" class="type-option ${frequency === "monthly" ? "selected" : ""}" data-f="monthly">Fin de mes</button>
        <button type="button" class="type-option ${frequency === "biweekly" ? "selected" : ""}" data-f="biweekly">Quincenal</button>
      </div>
      <label for="incAmount" style="text-align:center;">${frequency === "biweekly" ? "¿Cuánto recibes cada quincena?" : "¿Cuánto recibes al mes?"}</label>
      <input id="incAmount" type="number" inputmode="decimal" step="0.01" min="0.01" placeholder="RD$0" style="text-align:center;font-size:18px;margin-bottom:4px;" value="${currentDraft() || ""}" />
      <p class="hint" id="incHint" style="text-align:center;">${frequency === "biweekly" && currentDraft() ? `${money(currentDraft()*2)} al mes.` : "Antes de descontar tus gastos fijos."}</p>
      <div class="error-banner" id="err"></div><div class="btn-row"><button class="btn-back" id="backBtn">‹</button><button class="btn-primary" id="continueBtn">Continuar</button></div></div>`;
    document.querySelectorAll("#freqGrid .type-option").forEach(el=>el.addEventListener("click",()=>{
      rememberDraft(); const next=el.dataset.f; if(next===frequency) return;
      if(next==="biweekly" && !biweeklyDraft && monthlyDraft) biweeklyDraft=monthlyDraft/2;
      if(next==="monthly" && !monthlyDraft && biweeklyDraft) monthlyDraft=biweeklyDraft*2;
      frequency=next; paint();
    }));
    document.getElementById("incAmount").addEventListener("input",e=>{
      const v=Number(e.target.value)||0; if(frequency==="biweekly") biweeklyDraft=v; else monthlyDraft=v;
      document.getElementById("incHint").textContent=frequency==="biweekly"&&v?`${money(v*2)} al mes.`:"Antes de descontar tus gastos fijos.";
    });
    document.getElementById("backBtn").addEventListener("click",renderOnboardingAccount);
    document.getElementById("continueBtn").addEventListener("click",async()=>{
      rememberDraft(); const amount=currentDraft(); const errEl=document.getElementById("err");
      if(!(amount>0)) return showInlineError(errEl,"Completa un ingreso mayor que cero.");
      const btn=document.getElementById("continueBtn");btn.disabled=true;btn.textContent="Guardando…";
      const {error}=await supabase.from("profiles").update({declared_monthly_income:amount,pay_frequency:frequency,updated_at:new Date().toISOString()}).eq("id",user.id);
      if(error){showInlineError(errEl,"No se pudo guardar. Intenta de nuevo.");btn.disabled=false;btn.textContent="Continuar";return;}
      await loadState();render();
    });
  }
  paint();
}

function renderOnboardingGoal() {
  function paint(){
    root.innerHTML=`<div class="screen"><p class="step-label">Paso 4 de 4</p><h1>Crea una meta</h1><p class="subtitle">Es opcional. Puedes entrar a la app y agregarla cuando tengas los datos.</p>

    const preview=()=>{const a=Number(document.getElementById("gAmount").value)||0,m=Number(document.getElementById("gMonths").value)||0,p=Number(document.getElementById("gMonthly").value)||0;document.getElementById("goalViabilityCard").innerHTML=a>0&&(m>0||p>0)?buildGoalPreviewHTML(a,m,p):`<div class="card" style="text-align:center;"><p style="font-size:12px;color:var(--text-muted);margin:0;">Completa monto y plazo para evaluar la meta.</p></div>`;};
    ["gAmount","gMonths","gMonthly"].forEach(id=>document.getElementById(id).addEventListener("input",preview));preview();
    document.getElementById("backBtn").addEventListener("click",renderOnboardingFixed);
    document.getElementById("skipGoalBtn").addEventListener("click",async()=>{await supabase.from("profiles").update({onboarding_skipped:true,updated_at:new Date().toISOString()}).eq("id",user.id);await markOnboardingComplete();await loadState();render();});
    document.getElementById("finishBtn").addEventListener("click",async()=>{
      const name=document.getElementById("gName").value.trim(),amount=Number(document.getElementById("gAmount").value),months=Number(document.getElementById("gMonths").value)||0,monthly=Number(document.getElementById("gMonthly").value)||0,errEl=document.getElementById("err");
      if(!name||!(amount>0)) return showInlineError(errEl,"Completa el nombre y un monto mayor que cero.");
      const plan=resolveGoalPlan(amount,months,monthly); if(!plan.valid) return showInlineError(errEl,plan.message);
      if(plan.status==="impossible"||plan.canAfford===false){const ok=await confirmAction(`${plan.message}\n\nPuedes guardarla marcada como en riesgo.`,"Guardar en riesgo",false);if(!ok)return;}
      const btn=document.getElementById("finishBtn");btn.disabled=true;btn.textContent="Guardando…";
      const {error}=await supabase.from("goals").insert({user_id:user.id,name,target_amount:amount,target_months:plan.targetMonths,linked_account_id:state.account.id,priority:"critical"});
      if(error){showInlineError(errEl,safeErrorMessage(error,"No se pudo guardar."));btn.disabled=false;btn.textContent="Crear y terminar";return;}
      await markOnboardingComplete();await loadState();render();
    });
  }
  paint();
}
