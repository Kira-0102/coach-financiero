    nextDue: existingDebt?.next_due_date || "", startDate: existingDebt?.start_date || "", creditLimit: existingDebt?.credit_limit ?? "", statementDay: existingDebt?.statement_day ?? "",
    allocationMethod: existingDebt?.payment_allocation_method || "interest_first", proceedsMode: "not_applicable", proceedsAccountId: state.account?.id || "",
    existingTotalPaid: existingDebt?.total_paid || 0, existingInterestPaid: existingDebt?.total_interest_paid || 0, existingFeesPaid: existingDebt?.total_fees_paid || 0,
  };

  function collect() {
    const get = id => document.getElementById(id)?.value;
    const checked = name => document.querySelector(`[name="${name}"]:checked`)?.value;
    if (get("dwName") != null) draft.name = get("dwName");
    if (get("dwType") != null) draft.debtType = get("dwType");
    if (checked("dwExisting")) draft.existingMode = checked("dwExisting");
    const fieldMap = {
      OriginalAmount: "originalAmount", CurrentBalance: "currentBalance", PaidBeforeApp: "paidBeforeApp",
      Rate: "rate", TotalPayable: "totalPayable", ScheduledPayment: "scheduledPayment",
      TotalTermCount: "totalTermCount", RemainingTermCount: "remainingTermCount", Frequency: "paymentFrequency", NextDue: "nextDue",
      StartDate: "startDate", CreditLimit: "creditLimit", StatementDay: "statementDay",
      Allocation: "allocationMethod", ProceedsMode: "proceedsMode", ProceedsAccount: "proceedsAccountId",
    };
    Object.entries(fieldMap).forEach(([key, target]) => {
      const value = get(`dw${key}`);
      if (value != null) draft[target] = value;
    });
    if (get("dwKnowledge") != null) draft.knowledge = get("dwKnowledge");
  }

  function validateStep() {
    collect();
    if (draft.step === 1 && (!draft.name.trim() || !draft.debtType)) return "Escribe un nombre y selecciona el tipo de deuda.";
    if (draft.step === 2) {
      const original = Number(draft.originalAmount) || 0;
      const current = Number(draft.currentBalance) || 0;
      if (draft.debtType === "tarjeta_credito" && current <= 0) return "Indica el balance actual de la tarjeta.";
      if (draft.existingMode === "new" && original <= 0) return "Indica cuánto dinero recibiste o financiaste.";
      if (draft.existingMode === "existing" && current <= 0) return "Indica cuánto debes actualmente.";
      if (draft.existingMode === "existing" && original <= 0) draft.originalAmount = String(current);
      if (draft.existingMode === "new" && draft.debtType !== "tarjeta_credito" && draft.proceedsMode === "cash_to_account" && !draft.proceedsAccountId) return "Selecciona la cuenta que recibió el dinero.";
    }
    if (draft.step === 3) {
      if (["annual_rate","monthly_rate","periodic_rate","total_interest_pct"].includes(draft.knowledge) && (String(draft.rate).trim() === "" || !(Number(draft.rate) >= 0))) return "Indica la tasa o selecciona que no la conoces.";
      if (draft.knowledge === "total_payable" && !(Number(draft.totalPayable) > 0)) return "Indica el total que debes devolver.";
      if (draft.knowledge === "total_payable" && Number(draft.totalPayable) + 0.004 < (Number(draft.originalAmount)||Number(draft.currentBalance)||0)) return "El total a devolver no puede ser menor que el capital recibido.";
    }
    if (draft.step === 4) {
      const planType = wizardDebtPayload(draft).payload.plan_type;
      if (!["credit_card","legacy"].includes(planType) && !(Number(draft.existingMode === "existing" ? draft.remainingTermCount : draft.totalTermCount) > 0)) return "Indica la cantidad de cuotas.";
      if (draft.knowledge === "scheduled_payment" && (!(Number(draft.scheduledPayment) > 0) || !(Number(draft.existingMode === "existing" ? draft.remainingTermCount : draft.totalTermCount) > 0))) return "Indica la cuota y la cantidad de pagos.";
      if (draft.debtType === "tarjeta_credito" && !(Number(draft.scheduledPayment) > 0)) return "Indica el pago mínimo mensual de la tarjeta.";
      if (draft.debtType === "tarjeta_credito" && Number(draft.scheduledPayment) > Number(draft.currentBalance)) return "El pago mínimo no puede superar el balance actual.";
    }
    return null;
  }

  function stepOne() {
    return `
      <p class="step-label">Paso 1 de 5</p><h2 style="font-size:20px;margin:0 0 6px;">${existingDebt ? "Revisa la deuda" : "¿Qué deuda quieres registrar?"}</h2>
      <p class="subtitle" style="text-align:left;">${existingDebt ? "Edita únicamente los datos del acuerdo. Los pagos registrados se conservan." : "Primero identifica la deuda. La app mostrará solo las preguntas necesarias."}</p>
      <label>Nombre</label><input id="dwName" value="${esc(draft.name)}" placeholder="Ej. Préstamo de Randy o Tarjeta Popular" style="margin-bottom:10px;" />
      <label>Tipo de deuda</label><select id="dwType" style="margin-bottom:8px;">
        <option value="">Selecciona una opción</option>
        ${DEBT_TYPES.map(t => `<option value="${t.value}" ${draft.debtType === t.value ? "selected" : ""}>${t.icon} ${t.label}</option>`).join("")}
        <option value="unsure" ${draft.debtType === "unsure" ? "selected" : ""}>❓ No estoy seguro</option>
      </select>`;
  }

  function stepTwo() {
    const card = draft.debtType === "tarjeta_credito";
    return `
      <p class="step-label">Paso 2 de 5</p><h2 style="font-size:20px;margin:0 0 6px;">Situación actual</h2>
      ${!card && !existingDebt ? `<label style="margin-bottom:7px;">¿Es nueva o ya la estabas pagando?</label>
      <label class="card" style="display:block;padding:10px;margin-bottom:6px;"><input type="radio" name="dwExisting" value="new" ${draft.existingMode === "new" ? "checked" : ""} style="width:auto;margin-right:7px;">Es nueva, todavía no he pagado</label>
      <label class="card" style="display:block;padding:10px;margin-bottom:10px;"><input type="radio" name="dwExisting" value="existing" ${draft.existingMode === "existing" ? "checked" : ""} style="width:auto;margin-right:7px;">Ya he realizado algunos pagos</label>` : ""}
      ${card ? `
        <label>Balance actual</label><input id="dwCurrentBalance" type="number" step="0.01" min="0" value="${draft.currentBalance}" placeholder="RD$0" style="margin-bottom:8px;">
        <label>Límite de crédito <span style="color:var(--text-muted);">(opcional)</span></label><input id="dwCreditLimit" type="number" step="0.01" min="0" value="${draft.creditLimit}" placeholder="RD$0" style="margin-bottom:8px;">
      ` : `
        <label>Monto originalmente recibido o financiado</label><input id="dwOriginalAmount" type="number" step="0.01" min="0" value="${draft.originalAmount}" placeholder="RD$0" style="margin-bottom:8px;">
        ${draft.existingMode === "existing" ? `<label>Saldo pendiente actual</label><input id="dwCurrentBalance" type="number" step="0.01" min="0" value="${draft.currentBalance}" placeholder="RD$0" style="margin-bottom:8px;">
        <label>Total pagado antes de usar esta app <span style="color:var(--text-muted);">(opcional)</span></label><input id="dwPaidBeforeApp" type="number" step="0.01" min="0" value="${draft.paidBeforeApp}" placeholder="RD$0" style="margin-bottom:8px;">` : `<label>¿Dónde quedó el dinero o el bien financiado?</label><select id="dwProceedsMode" style="margin-bottom:8px;"><option value="already_reflected" ${draft.proceedsMode === "already_reflected" ? "selected" : ""}>El dinero ya está incluido en mi saldo actual</option><option value="cash_to_account" ${draft.proceedsMode === "cash_to_account" ? "selected" : ""}>El dinero entró a una cuenta y todavía no lo registré</option><option value="used_immediately" ${draft.proceedsMode === "used_immediately" ? "selected" : ""}>Lo usé de inmediato; no debe sumarse a mi saldo</option><option value="financed_asset" ${draft.proceedsMode === "financed_asset" ? "selected" : ""}>Financié un bien; no recibí efectivo</option></select>${draft.proceedsMode === "cash_to_account" ? `<label>Cuenta que recibió el dinero</label><select id="dwProceedsAccount" style="margin-bottom:8px;">${(state.accounts.length ? state.accounts : [state.account]).filter(Boolean).map(a=>`<option value="${a.id}" ${draft.proceedsAccountId === a.id ? "selected" : ""}>${esc(a.name)}</option>`).join("")}</select>` : ""}<p class="hint">Esto evita contar un préstamo como salario o sumarlo dos veces.</p>`}
      `}`;
  }

  function stepThree() {
    const options = debtKnowledgeOptions(draft.debtType);
    const source = draft.knowledge;
    return `
      <p class="step-label">Paso 3 de 5</p><h2 style="font-size:20px;margin:0 0 6px;">¿Qué sabes sobre los intereses?</h2>
      <p class="subtitle" style="text-align:left;">No inventaremos una tasa. Puedes registrar la deuda aunque falte información.</p>
      <select id="dwKnowledge" style="margin-bottom:10px;">${options.map(([v,l]) => `<option value="${v}" ${source === v ? "selected" : ""}>${l}</option>`).join("")}</select>
      ${["annual_rate","monthly_rate","periodic_rate","total_interest_pct"].includes(source) ? `<label>${source === "annual_rate" ? "Tasa anual" : source === "monthly_rate" ? "Tasa mensual" : source === "periodic_rate" ? "Porcentaje por cada cuota" : "Porcentaje total del acuerdo"}</label><input id="dwRate" type="number" step="0.01" min="0" value="${draft.rate}" placeholder="Ej. 45" style="margin-bottom:8px;">` : ""}
      ${source === "total_payable" ? `<label>Total que debes devolver</label><input id="dwTotalPayable" type="number" step="0.01" min="0" value="${draft.totalPayable}" placeholder="RD$0" style="margin-bottom:8px;">` : ""}
      ${source === "unknown" ? `<div class="card warning"><p style="font-size:11px;margin:0;color:var(--warning-text);">La deuda se guardará con “datos por confirmar”. No asumiremos que tiene 0% de interés.</p></div>` : ""}`;
  }

  function stepFour() {
    const card = draft.debtType === "tarjeta_credito";
    return `
      <p class="step-label">Paso 4 de 5</p><h2 style="font-size:20px;margin:0 0 6px;">Pagos y fechas</h2>
      ${!card ? `<label>Frecuencia de pago</label><select id="dwFrequency" style="margin-bottom:8px;">${PAYMENT_FREQUENCIES.map(x => `<option value="${x.value}" ${draft.paymentFrequency === x.value ? "selected" : ""}>${x.label}</option>`).join("")}</select>
      ${draft.existingMode === "existing" ? `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;"><div><label style="font-size:10px;">Cuotas acordadas originalmente</label><input id="dwTotalTermCount" type="number" step="1" min="1" value="${draft.totalTermCount}" placeholder="Ej. 12" style="margin-bottom:8px;"></div><div><label style="font-size:10px;">Cuotas que faltan</label><input id="dwRemainingTermCount" type="number" step="1" min="1" value="${draft.remainingTermCount}" placeholder="Ej. 5" style="margin-bottom:8px;"></div></div>` : `<label>Cantidad total de cuotas <span style="color:var(--text-muted);">(si la sabes)</span></label><input id="dwTotalTermCount" type="number" step="1" min="1" value="${draft.totalTermCount}" placeholder="Ej. 10" style="margin-bottom:8px;">`}` : `<input id="dwFrequency" type="hidden" value="monthly">`}
      <label>${card ? "Pago mínimo mensual" : "Cuota acordada"} ${card ? "" : `<span style="color:var(--text-muted);">(si la conoces)</span>`}</label><input id="dwScheduledPayment" type="number" step="0.01" min="0" value="${draft.scheduledPayment}" placeholder="RD$0" style="margin-bottom:8px;">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <div><label style="font-size:10px;">Fecha de inicio</label><input id="dwStartDate" type="date" value="${draft.startDate}" style="margin-bottom:8px;"></div>
        <div><label style="font-size:10px;">Próximo pago</label><input id="dwNextDue" type="date" value="${draft.nextDue}" style="margin-bottom:8px;"></div>
      </div>
      ${card ? `<label>Día de corte <span style="color:var(--text-muted);">(opcional)</span></label><input id="dwStatementDay" type="number" min="1" max="31" value="${draft.statementDay}" placeholder="Ej. 10" style="margin-bottom:8px;">` : `<label>¿Cómo aplica el prestamista cada pago?</label><select id="dwAllocation" style="margin-bottom:8px;"><option value="interest_first" ${draft.allocationMethod === "interest_first" ? "selected" : ""}>Primero intereses</option><option value="proportional" ${draft.allocationMethod === "proportional" ? "selected" : ""}>Proporcional entre capital e interés</option><option value="principal_first" ${draft.allocationMethod === "principal_first" ? "selected" : ""}>Primero capital</option><option value="manual" ${draft.allocationMethod === "manual" ? "selected" : ""}>Lo indicaré en cada pago</option></select>`}`;
  }

  function stepFive() {
    const { payload, plan } = wizardDebtPayload(draft);
    const infoWarning = payload.setup_state === "incomplete" ? `<div class="card warning" style="margin-top:9px;"><p style="font-size:11px;color:var(--warning-text);margin:0;">⚠ Falta confirmar cómo se calculan los intereses. La app no presentará el costo total como definitivo.</p></div>` : "";
    return `
      <p class="step-label">Paso 5 de 5</p><h2 style="font-size:20px;margin:0 0 6px;">Confirma los datos</h2>
      ${debtPlanPreviewHTML(plan, { planType: payload.plan_type, paymentFrequency: payload.payment_frequency, termCount: payload.remaining_installments, currentBalance: payload.current_balance, setupState: payload.setup_state, informationSource: payload.information_source })}
      ${debtImpactHTML(payload, plan)}${infoWarning}
      ${draft.existingMode === "new" && draft.debtType !== "tarjeta_credito" ? `<div class="card" style="margin-top:9px;"><p style="font-size:11px;font-weight:600;margin:0 0 4px;">Registro del dinero o bien</p><p style="font-size:10px;color:var(--text-muted);margin:0;">${draft.proceedsMode === "cash_to_account" ? `Se sumará ${money(payload.original_amount)} a ${esc((state.accounts.find(a=>a.id===draft.proceedsAccountId)||state.account)?.name||"la cuenta")}, sin contarlo como ingreso laboral.` : draft.proceedsMode === "already_reflected" ? "No se modificará el saldo porque confirmaste que el dinero ya está incluido." : draft.proceedsMode === "financed_asset" ? "No se sumará efectivo porque se financió un bien." : "No se sumará efectivo porque el dinero se utilizó de inmediato."}</p></div>` : ""}
      <p style="font-size:10px;color:var(--text-muted);line-height:1.45;margin:10px 0 0;">Los cálculos son estimados y pueden no incluir seguros, mora, comisiones o reglas particulares del contrato.</p>`;
  }

  function paint() {
    modal.classList.add("visible");
    const body = [stepOne, stepTwo, stepThree, stepFour, stepFive][draft.step - 1]();
    modal.innerHTML = `<div class="modal-box" style="max-height:90vh;overflow-y:auto;">${body}<div class="error-banner" id="dwErr"></div><div class="btn-row" style="margin-top:14px;"><button class="btn-secondary" id="dwBack">${draft.step === 1 ? "Cancelar" : "Atrás"}</button><button class="btn-primary" id="dwNext">${draft.step === 5 ? "Guardar deuda" : "Continuar"}</button></div></div>`;

    document.getElementById("dwKnowledge")?.addEventListener("change", e => { collect(); draft.knowledge = e.target.value; paint(); });
    document.getElementById("dwProceedsMode")?.addEventListener("change", e => { collect(); draft.proceedsMode = e.target.value; paint(); });
    document.querySelectorAll('[name="dwExisting"]').forEach(r => r.addEventListener("change", e => { collect(); draft.existingMode = e.target.value; paint(); }));
    document.getElementById("dwBack").addEventListener("click", () => {
      collect();
      if (draft.step === 1) { modal.classList.remove("visible"); modal.innerHTML = ""; }
      else { draft.step -= 1; paint(); }
    });
    document.getElementById("dwNext").addEventListener("click", async () => {
      const error = validateStep();
      if (error) { const el = document.getElementById("dwErr"); el.textContent = error; el.classList.add("visible"); return; }
      if (draft.step < 5) { draft.step += 1; paint(); return; }
      const button = document.getElementById("dwNext"); button.disabled = true; button.textContent = "Guardando…";
      const { payload } = wizardDebtPayload(draft);
      const proceedsMode = !existingDebt && draft.existingMode === "new" && Number(payload.original_amount) > 0 ? draft.proceedsMode : "not_applicable";
      const proceedsAccount = proceedsMode === "cash_to_account" ? draft.proceedsAccountId : null;
      const { error: saveError } = await supabase.rpc("save_debt_v51", { p_payload: payload, p_debt_id: existingDebt?.id || null, p_proceeds_mode: proceedsMode, p_account_id: proceedsAccount });
      if (saveError) { const el = document.getElementById("dwErr"); el.textContent = saveError.message || "No se pudo guardar la deuda."; el.classList.add("visible"); button.disabled = false; button.textContent = "Guardar deuda"; return; }
      modal.classList.remove("visible"); modal.innerHTML = "";
      await loadState(); renderApp(); showToast(existingDebt ? "Deuda actualizada" : "Deuda guardada");
    });
  }

  paint();
}

function tplDeudas() {
  const debtCards = state.debts.map(d => {
    const stats = debtPaymentStats(d.id);
    const scheduled = Number(d.scheduled_payment ?? d.minimum_payment) || 0;
    const isVariableDebt = (d.plan_type || "legacy") === "credit_card";
    const totalPaidInApp = stats.total;
    const paidBefore = Math.max(0, Number(d.paid_before_app) || 0);
    const totalPaid = totalPaidInApp + paidBefore;
    const totalPlan = isVariableDebt ? 0 : (Number(d.total_payable) || Number(d.original_amount) || 0);
    const pct = totalPlan > 0 ? Math.max(0, Math.min(100, Math.round((totalPaid / totalPlan) * 100))) : 0;
    const isPaidOff = d.status === "completed" || Number(d.current_balance) <= 0;
    const typeInfo = DEBT_TYPES.find(t => t.value === d.debt_type);
    const frequencyLabel = PAYMENT_FREQUENCIES.find(x => x.value === (d.payment_frequency || "monthly"))?.label || "Mensual";
    const nextDue = formatDateDO(d.next_due_date);
    const remaining = Number(d.remaining_installments) || 0;
    const interestPaid = Number(d.total_interest_paid) || stats.interest;
    const principalPaid = stats.principal;
    const feesPaid = Number(d.total_fees_paid) || stats.fees;
    const dueInfo = debtDueInfo(d);
    const installmentPaid = Math.max(0, Number(d.current_installment_paid) || 0);
    const installmentPct = scheduled > 0 ? Math.min(100, Math.round((installmentPaid / scheduled) * 100)) : 0;

    return `
      <div class="card">
        <div class="row-between" style="margin-bottom:6px;align-items:flex-start;">
          <div>
            <span style="font-weight:600;">${typeInfo ? typeInfo.icon : "📄"} ${esc(d.name)}</span>
            <p style="font-size:10px;color:var(--text-muted);margin:3px 0 4px;">${esc(debtPlanLabel(d.plan_type || "legacy", d))}</p>
            ${debtSetupBadge(d)}
          </div>
          <div style="display:flex;gap:6px;">
            <button aria-label="Editar deuda" data-edit-debt="${d.id}" style="background:none;color:var(--text-muted);font-size:12px;">✎</button>
            <button aria-label="Borrar deuda" data-del-debt="${d.id}" style="background:none;color:var(--text-muted);font-size:12px;">✕</button>
          </div>
        </div>

        <p style="font-size:11px;color:var(--text-muted);margin:7px 0;">${typeInfo ? typeInfo.label : "Otro"} · ${debtRateLabel(d)}</p>
        ${dueInfo.text ? `<p style="font-size:10px;color:${dueInfo.overdue ? "var(--danger-text)" : "var(--text-muted)"};margin:0 0 7px;">${dueInfo.overdue ? "🔴" : "📅"} ${dueInfo.text}${nextDue ? ` · ${nextDue}` : ""}</p>` : ""}

        ${isPaidOff ? `<p style="font-size:13px;font-weight:600;color:var(--success-text);margin:0 0 5px;">✓ Deuda pagada</p>` : `<p style="font-size:16px;font-weight:600;color:var(--teal);margin:0 0 5px;">Saldo pendiente: ${money(d.current_balance)}</p>`}
        ${totalPlan > 0 ? `<div class="progress-bar"><div class="progress-fill" style="width:${pct}%;"></div></div>` : ""}
        <p style="font-size:10px;color:var(--text-muted);margin:5px 0 8px;">Pagos registrados en esta app: ${money(totalPaidInApp)}${paidBefore > 0 ? ` · Pagado antes de registrarla: ${money(paidBefore)}` : ""}.</p>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;padding:8px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);">
          <div><span style="font-size:9px;color:var(--text-muted);display:block;">${isVariableDebt ? "Balance reportado" : "Capital pendiente"}</span><strong style="font-size:11px;">${money(d.principal_outstanding ?? d.current_balance)}</strong></div>
          <div><span style="font-size:9px;color:var(--text-muted);display:block;">Interés pendiente</span><strong style="font-size:11px;">${money(d.interest_outstanding || 0)}</strong></div>
          <div><span style="font-size:9px;color:var(--text-muted);display:block;">Interés pagado</span><strong style="font-size:11px;">${money(interestPaid)}</strong></div>
          ${!isVariableDebt ? `<div><span style="font-size:9px;color:var(--text-muted);display:block;">Capital pagado en la app</span><strong style="font-size:11px;">${money(principalPaid)}</strong></div>` : ""}
          ${feesPaid > 0 ? `<div><span style="font-size:9px;color:var(--text-muted);display:block;">Cargos pagados</span><strong style="font-size:11px;">${money(feesPaid)}</strong></div>` : ""}
          ${remaining > 0 ? `<div><span style="font-size:9px;color:var(--text-muted);display:block;">Cuotas restantes</span><strong style="font-size:11px;">${remaining}</strong></div>` : ""}
        </div>

        ${!isPaidOff && scheduled > 0 ? `<div style="margin-top:8px;"><div class="row-between" style="font-size:9px;color:var(--text-muted);"><span>Cuota actual</span><span>${money(installmentPaid)} de ${money(scheduled)}</span></div><div class="progress-bar"><div class="progress-fill" style="width:${installmentPct}%;background:var(--gold);"></div></div></div>` : ""}

        ${!isPaidOff ? `<div class="row-between" style="margin-top:9px;align-items:flex-end;"><div><span style="font-size:10px;color:var(--text-muted);display:block;">${scheduled ? "Cuota acordada" : "Cuota"}</span><strong style="font-size:12px;">${scheduled ? `${money(scheduled)} · ${frequencyLabel.toLowerCase()}` : "No definida"}</strong>${nextDue ? `<span style="font-size:9px;color:var(--text-muted);display:block;margin-top:2px;">Próximo pago: ${nextDue}</span>` : ""}</div><button data-pay-debt="${d.id}" class="btn-secondary" style="padding:7px 12px;font-size:11px;">Registrar pago</button></div>` : ""}

        ${stats.payments.length > 0 ? `<button data-view-debt-history="${d.id}" style="width:100%;margin-top:8px;background:none;color:var(--teal);font-size:10px;text-decoration:underline;">Ver historial de ${stats.payments.length} movimiento${stats.payments.length === 1 ? "" : "s"}</button>` : ""}
      </div>`;
  }).join("");

  return `<h1 style="text-align:left;margin-bottom:4px;">Tus deudas</h1><p style="font-size:11px;color:var(--text-muted);margin:0 0 14px;">Registra lo que sabes. La app no asumirá intereses que no hayas confirmado.</p>${debtCards || `<div class="empty-state"><div class="icon-circle">📄</div><p style="font-size:13px;color:var(--text-muted);">No tienes deudas registradas.</p></div>`}${debtAddForm()}`;
}

function debtAddForm() {
  return `<button class="btn-secondary" id="openDebtWizardBtn" style="width:100%;margin-top:14px;">+ Agregar deuda paso a paso</button>`;
}

function tplPresupuestos() {
  const statuses=budgetStatusList(),used=new Set(statuses.map(s=>s.budget.category_id)),availableCategories=categories.filter(c=>!used.has(c.id)),plan=budgetPlanningSummary(),uncat=Number(state.analysis?.spending?.uncategorized)||0;

function debtFormElements(prefix) {
  const byId = suffix => document.getElementById(`${prefix}${suffix}`);
  return {
    name: byId("Name"), type: byId("Type"), planType: byId("PlanType"),
    amount: byId("Amount"), interest: byId("Interest"), rateType: byId("RateType"),
    frequency: byId("Frequency"), installments: byId("Installments"),
    scheduledPayment: byId("ScheduledPayment"), currentBalance: byId("CurrentBalance"),
    currentPrincipal: byId("CurrentPrincipal"), remainingInstallments: byId("RemainingInstallments"),
    startDate: byId("StartDate"), nextDue: byId("NextDue"), preview: byId("DebtPreview"),
    interestGroup: byId("InterestGroup"), termGroup: byId("TermGroup"),
    interestLabel: byId("InterestLabel"),
  };
}

function suggestedPlanForDebtType(debtType) {
  if (debtType === "tarjeta_credito") return "credit_card";
  if (debtType === "prestamista") return "flat_total";
  return "amortized";
}

function applyDebtFormMode(prefix, { keepCurrentRateType = false } = {}) {
  const e = debtFormElements(prefix);
  if (!e.planType) return;
  const planType = e.planType.value;

  if (e.interestGroup) e.interestGroup.style.display = planType === "no_interest" ? "none" : "block";
  if (e.termGroup) e.termGroup.style.display = planType === "credit_card" ? "none" : "block";

  if (e.rateType) {
    e.rateType.disabled = ["flat_total", "flat_periodic", "no_interest"].includes(planType);
    if (!keepCurrentRateType) {
      if (planType === "flat_total") e.rateType.value = "total_term";
      else if (planType === "flat_periodic") e.rateType.value = "per_period";
      else if (planType === "credit_card") e.rateType.value = "annual";
      else if (planType === "no_interest") e.rateType.value = "annual";
      else if (!["annual", "monthly", "per_period"].includes(e.rateType.value)) e.rateType.value = "annual";
    }
  }

  if (e.interestLabel) {
    e.interestLabel.textContent = planType === "flat_total"
      ? "Interés total del acuerdo (%)"
      : planType === "flat_periodic"
        ? "Interés por cada cuota (%)"
        : planType === "credit_card"
          ? "Tasa de la tarjeta (%)"
          : "Tasa de interés (%)";
  }

  if (planType === "credit_card" && e.frequency) e.frequency.value = "monthly";
  renderDebtFormPreview(prefix);
}

function debtFormData(prefix, existingDebt = null) {
  const e = debtFormElements(prefix);
  const planType = e.planType?.value || existingDebt?.plan_type || "amortized";
  const originalAmount = Number(e.amount?.value) || Number(existingDebt?.original_amount) || 0;
  const interestRate = planType === "no_interest" ? 0 : (Number(e.interest?.value) || 0);
  const interestRateType = planType === "flat_total" ? "total_term"
    : planType === "flat_periodic" ? "per_period"
    : (e.rateType?.value || existingDebt?.interest_rate_type || "annual");
  const paymentFrequency = planType === "credit_card" ? "monthly" : (e.frequency?.value || existingDebt?.payment_frequency || "monthly");
  const termCount = planType === "credit_card" ? 0 : Math.max(0, Math.trunc(Number(e.installments?.value) || Number(existingDebt?.term_count) || 0));
  const scheduledPaymentInput = Math.max(0, Number(e.scheduledPayment?.value) || 0);

  const planBaseAmount = existingDebt
    ? Math.max(0, Number(existingDebt.principal_outstanding ?? existingDebt.current_balance) || 0)
    : originalAmount;
  const planTerm = existingDebt
    ? Math.max(0, Math.trunc(Number(e.remainingInstallments?.value) || Number(existingDebt.remaining_installments) || termCount))
    : termCount;

  const plan = calculateDebtPlan({
    planType,
    originalAmount: planBaseAmount,
    interestRate,
    interestRateType,
    paymentFrequency,
    termCount: planTerm,
    scheduledPayment: scheduledPaymentInput,
  });
  const effectiveTermCount = planType === "amortized" && plan.payoffPeriods
    ? plan.payoffPeriods
    : termCount;

  const currentPrincipalInput = Number(e.currentPrincipal?.value);
  const currentBalanceInput = Number(e.currentBalance?.value);
  const currentPrincipal = existingDebt
    ? Math.max(0, Number(existingDebt.principal_outstanding ?? existingDebt.current_balance) || 0)
    : (Number.isFinite(currentPrincipalInput) && currentPrincipalInput >= 0 ? currentPrincipalInput : originalAmount);

  const existingPaymentCount = existingDebt ? debtPaymentStats(existingDebt.id).payments.length : 0;
  const convertingLegacyPlan = Boolean(
    existingDebt &&
    existingPaymentCount === 0 &&
    (existingDebt.plan_type || "legacy") === "legacy" &&
    planType !== "legacy"
  );

  let currentBalance;
  let interestOutstanding;
  if (existingDebt && !convertingLegacyPlan) {
    currentBalance = Math.max(0, Number(existingDebt.current_balance) || 0);
    interestOutstanding = Math.max(0, Number(existingDebt.interest_outstanding) || 0);
  } else if (existingDebt && convertingLegacyPlan) {
    if (["flat_total", "flat_periodic"].includes(planType)) {
      interestOutstanding = Math.max(0, plan.estimatedInterest);
      currentBalance = currentPrincipal + interestOutstanding;
    } else {
      interestOutstanding = 0;
      currentBalance = currentPrincipal;
    }
  } else if (Number.isFinite(currentBalanceInput) && currentBalanceInput > 0) {
    currentBalance = currentBalanceInput;
    interestOutstanding = Math.max(0, currentBalance - currentPrincipal);
  } else if (["flat_total", "flat_periodic"].includes(planType)) {
    interestOutstanding = Math.max(0, plan.estimatedInterest);
    currentBalance = currentPrincipal + interestOutstanding;
  } else {
    interestOutstanding = 0;
    currentBalance = currentPrincipal;
  }

  const remainingInstallmentsInput = Math.trunc(Number(e.remainingInstallments?.value) || 0);
  const calculatedRemaining = planType === "amortized" && plan.payoffPeriods ? plan.payoffPeriods : planTerm;
  const remainingInstallments = existingDebt
    ? Math.max(0, remainingInstallmentsInput || calculatedRemaining || Number(existingDebt.remaining_installments) || planTerm)
    : Math.max(0, remainingInstallmentsInput || effectiveTermCount);

  const historicalPaid = existingDebt ? Math.max(0, Number(existingDebt.total_paid) || debtPaymentStats(existingDebt.id).total) : 0;
  const historicalInterest = existingDebt ? Math.max(0, Number(existingDebt.total_interest_paid) || debtPaymentStats(existingDebt.id).interest) : 0;
  const remainingProjectedTotal = plan.totalPayable == null ? null : plan.totalPayable;

  return {
    plan,
    payload: {
      name: e.name?.value?.trim() || existingDebt?.name || "",
      debt_type: e.type?.value || existingDebt?.debt_type || "otro",
      plan_type: planType,
      original_amount: originalAmount,
      current_balance: currentBalance,
      principal_outstanding: currentPrincipal,
      interest_outstanding: interestOutstanding,
      interest_rate: interestRate,
      interest_rate_type: interestRateType,
      payment_frequency: paymentFrequency,
      term_count: (existingDebt ? (termCount || Number(existingDebt.term_count) || null) : (effectiveTermCount || null)),
      remaining_installments: remainingInstallments || null,
      scheduled_payment: plan.scheduledPayment || null,
      minimum_payment: plan.scheduledPayment || null,
      total_payable: remainingProjectedTotal == null ? null : historicalPaid + remainingProjectedTotal,
      estimated_total_interest: planType === "credit_card" ? null : historicalInterest + plan.estimatedInterest,
      total_paid: historicalPaid,
      total_interest_paid: historicalInterest,
      total_fees_paid: existingDebt ? Math.max(0, Number(existingDebt.total_fees_paid) || debtPaymentStats(existingDebt.id).fees) : 0,
      start_date: e.startDate?.value || existingDebt?.start_date || null,
      next_due_date: e.nextDue?.value || existingDebt?.next_due_date || null,
      due_day: Number((e.nextDue?.value || existingDebt?.next_due_date || "").slice(-2)) || existingDebt?.due_day || null,
      status: existingDebt?.status === "completed" && currentBalance > 0 ? "active" : (existingDebt?.status || "active"),
    },
  };
}

function validateDebtForm(prefix, existingDebt = null) {
  const { payload, plan } = debtFormData(prefix, existingDebt);
  if (!payload.name || !payload.debt_type || payload.original_amount <= 0) {
    return { error: "Completa el nombre, el tipo y el capital original." };
  }
  if (payload.interest_rate < 0) return { error: "La tasa de interés no puede ser negativa." };
  if (!["credit_card", "legacy"].includes(payload.plan_type) && !payload.term_count) {
    return { error: "Indica la cantidad de cuotas del acuerdo." };
  }
  if (payload.plan_type === "credit_card" && !(payload.scheduled_payment > 0)) {
    return { error: "Indica el pago mínimo mensual de la tarjeta." };
  }
  if (payload.current_balance < payload.principal_outstanding) {
    return { error: "El saldo total pendiente no puede ser menor que el capital pendiente." };
  }
  if (payload.principal_outstanding > payload.original_amount && !existingDebt) {
    return { error: "El capital pendiente no puede superar el capital original." };
  }
  if (plan.scheduledPayment <= 0 && payload.plan_type !== "legacy") {
    return { error: "No se pudo calcular una cuota. Revisa el plazo o escribe la cuota acordada." };
  }
  if (payload.plan_type === "amortized" && !plan.payoffPeriods) {
    return { error: "La cuota no cubre los intereses y la deuda no terminaría de pagarse. Aumenta la cuota o el plazo." };
  }
  const planPeriods = existingDebt ? payload.remaining_installments : payload.term_count;
  if (["flat_total", "flat_periodic", "no_interest"].includes(payload.plan_type) && planPeriods > 0 && plan.totalPayable != null) {
    const expectedPayment = plan.totalPayable / planPeriods;
    if (Math.abs(plan.scheduledPayment - expectedPayment) > 1) {
      return { error: `La cuota no coincide con el total del acuerdo. Usa ${money(expectedPayment)} o ajusta la cantidad de cuotas.` };
    }
  }
  return { payload, plan, error: null };
}

function renderDebtFormPreview(prefix, existingDebt = null) {
  const e = debtFormElements(prefix);
  if (!e.preview) return;
  const { payload, plan } = debtFormData(prefix, existingDebt);
  e.preview.innerHTML = debtPlanPreviewHTML(plan, {
    planType: payload.plan_type,
    paymentFrequency: payload.payment_frequency,
    termCount: existingDebt ? payload.remaining_installments : payload.term_count,
    currentBalance: payload.current_balance > 0 ? payload.current_balance : null,
  });
}

function wireDebtForm(prefix, existingDebt = null) {
  const e = debtFormElements(prefix);
  if (!e.planType) return;

  const update = () => renderDebtFormPreview(prefix, existingDebt);
  [e.amount, e.interest, e.rateType, e.frequency, e.installments, e.scheduledPayment,
   e.currentBalance, e.currentPrincipal, e.remainingInstallments, e.startDate, e.nextDue]
    .filter(Boolean).forEach(input => input.addEventListener("input", update));

  e.planType.addEventListener("change", () => {
    if (existingDebt && e.planType.value !== (existingDebt.plan_type || "legacy") && e.scheduledPayment) {
      e.scheduledPayment.value = "";
    }
    applyDebtFormMode(prefix);
  });
  e.type?.addEventListener("change", () => {
    if (!existingDebt) e.planType.value = suggestedPlanForDebtType(e.type.value);
    applyDebtFormMode(prefix);
  });

  applyDebtFormMode(prefix, { keepCurrentRateType: Boolean(existingDebt) });
}

async function saveDebtFromForm(prefix, existingDebt = null) {
  const result=validateDebtForm(prefix,existingDebt);if(result.error)return {error:{message:result.error}};
  const proceedsMode=existingDebt?existingDebt.proceeds_mode||"not_applicable":"already_reflected";
  return supabase.rpc("save_debt_v51",{p_payload:result.payload,p_debt_id:existingDebt?.id||null,p_proceeds_mode:proceedsMode,p_account_id:state.account?.id||null});
}

async function fetchAllRows(table, select="*") {
  const pageSize=1000,rows=[];let from=0;
  while(true){const {data,error}=await supabase.from(table).select(select).range(from,from+pageSize-1);if(error)throw error;rows.push(...(data||[]));if(!data||data.length<pageSize)break;from+=pageSize;}
  return rows;
}

async function exportAllDataV51(button=null) {
  if(button){button.disabled=true;button.textContent="Preparando…";}

    const tables=["accounts","account_reconciliations","profiles","categories","transactions","recurring_expense_templates","fixed_expense_payments","goals","goal_contributions","debts","debt_payments","budgets","purchase_decisions"];
    const values=await Promise.all(tables.map(t=>fetchAllRows(t)));
    const payload={exportedAt:new Date().toISOString(),build:APP_BUILD,data:Object.fromEntries(tables.map((t,i)=>[t,values[i]]))};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`coach-financiero-${localISODate()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);showToast("Exportación completa preparada");
  }catch(error){showToast(safeErrorMessage(error,"No se pudo exportar todos los datos."),true);}finally{if(button){button.disabled=false;button.textContent="Exportar mis datos en JSON";}}
}

  document.querySelectorAll("[data-del-wishlist]").forEach(btn=>btn.addEventListener("click",async()=>{const {error}=await supabase.from("purchase_decisions").delete().eq("id",btn.dataset.delWishlist);if(error)return showToast("No se pudo eliminar.",true);await loadState();renderApp();}));

  // Agregar categoría — abre modal con selector

  document.querySelectorAll("[data-edit-budget]").forEach(btn => {
    btn.addEventListener("click", () => openEditBudgetModal(
      btn.dataset.editBudget,
      btn.dataset.editCat,
      Number(btn.dataset.editAmount)
    ));
  });

  // Eliminar presupuesto

  const openDebtWizardBtn = document.getElementById("openDebtWizardBtn");
  if (openDebtWizardBtn) openDebtWizardBtn.addEventListener("click", openDebtWizard);

    addDebtBtn.addEventListener("click", async () => {

// ---------------------------------------------------------------
// Preview de viabilidad de meta — compartida entre el onboarding (paso 4)
// y "+ Nueva meta", para que ambas pantallas calculen exactamente lo mismo
// y no se desincronicen si una se actualiza y la otra no.
function goalAvailableBudget() {
  return Number(state.analysis?.cashFlow?.remainingBudget) || 0;
}

function resolveGoalPlan(amount, months, monthly) {
  const target=Number(amount)||0,deadline=Number(months)||0,contribution=Number(monthly)||0,available=goalAvailableBudget();
  if(target<=0)return{valid:false,message:"El monto objetivo debe ser mayor que cero.",canAfford:false};
  if(deadline<=0&&contribution<=0)return{valid:false,message:"Indica el plazo o el aporte mensual.",canAfford:false};
  const required=deadline>0?target/deadline:contribution;
  if(deadline>0&&contribution>0&&contribution+0.01<required)return{valid:false,message:`Con ${money(contribution)}/mes no llegarías en ${deadline} meses. Necesitas al menos ${money(Math.ceil(required))}/mes o ampliar el plazo.`,canAfford:false};
  const targetMonths=deadline>0?Math.ceil(deadline):Math.ceil(target/contribution);
  const monthlyNeeded=deadline>0?Math.ceil(required):contribution;
  const canAfford=available>0&&monthlyNeeded<=available;
  const status=available<=0?"impossible":canAfford?"sustainable":"at_risk";
  const message=available<=0?`Tu proyección mensual restante es ${money(available)} y la meta necesita ${money(monthlyNeeded)}/mes.`:canAfford?`La meta necesita ${money(monthlyNeeded)}/mes y cabe en tu proyección actual.`:`La meta necesita ${money(monthlyNeeded)}/mes, más que los ${money(available)} disponibles en tu proyección.`;
  return{valid:true,targetMonths,monthlyNeeded,canAfford,status,message};
}

function buildGoalPreviewHTML(amount, months, monthly) {
  const target=Number(amount)||0;if(target<=0)return"";
  const plan=resolveGoalPlan(target,months,monthly);if(!plan.valid)return`<div class="card" style="background:var(--warning-bg);margin-top:4px;"><p style="font-size:12px;color:var(--warning-text);margin:0;line-height:1.5;">⚠ ${esc(plan.message)}</p></div>`;
  const tone=plan.canAfford?"var(--success-bg)":"var(--warning-bg)",text=plan.canAfford?"var(--success-text)":"var(--warning-text)";
  return `<div class="card" style="background:${tone};margin-top:4px;"><p style="font-size:12px;color:${text};margin:0;line-height:1.5;">${plan.canAfford?"✓ Alcanzable con los datos actuales.":"⚠ Plan en riesgo."} ${esc(plan.message)} Plazo: ${plan.targetMonths} meses.</p></div>`;
}

  modal.classList.add("visible");modal.innerHTML=`<div class="modal-box"><p class="step-label">Editar meta</p><label>Nombre</label><input id="egName" value="${esc(goal.name)}"><label>Monto objetivo</label><input id="egAmount" type="number" min="0.01" step="0.01" value="${goal.target_amount}"><label>Plazo en meses</label><input id="egMonths" type="number" min="1" step="1" value="${goal.target_months}"><label style="display:flex;gap:7px;font-size:11px;"><input id="egRestartPlan" type="checkbox" checked style="width:auto;">Contar el nuevo plazo desde hoy</label><p class="hint">Si desmarcas esta opción, el plazo seguirá contando desde ${formatDateDO(goal.plan_started_at||goal.created_at)||"la fecha original"}.</p><label>Estado</label><select id="egStatus"><option value="active" ${isGoalActive(goal)?"selected":""}>Activa</option><option value="paused" ${goal.status==="paused"?"selected":""}>Pausada</option><option value="abandoned" ${goal.status==="abandoned"?"selected":""}>Archivada</option></select><label>Prioridad</label><select id="egPriority"><option value="critical" ${priority==="critical"?"selected":""}>🔴 Alta</option><option value="important" ${priority==="important"?"selected":""}>🟡 Media</option><option value="optional" ${priority==="optional"?"selected":""}>🔵 Baja</option></select><div class="error-banner" id="egErr"></div><div class="btn-row"><button class="btn-secondary" id="cancelEdit">Cancelar</button><button class="btn-primary" id="saveEdit">Guardar</button></div></div>`;
  document.getElementById("cancelEdit").onclick=()=>{modal.classList.remove("visible");modal.innerHTML="";};
  document.getElementById("saveEdit").onclick=async()=>{const name=document.getElementById("egName").value.trim(),amount=Number(document.getElementById("egAmount").value),months=Number(document.getElementById("egMonths").value),priority=document.getElementById("egPriority").value,requestedStatus=document.getElementById("egStatus").value,restart=document.getElementById("egRestartPlan").checked,err=document.getElementById("egErr");if(!name||!(amount>0)||!(months>0))return showInlineError(err,"El monto y el plazo deben ser mayores que cero.");const stillCompleted=Number(goal.current_amount)>=amount,status=stillCompleted?"completed":requestedStatus,btn=document.getElementById("saveEdit");btn.disabled=true;btn.textContent="Guardando…";const payload={name,target_amount:amount,target_months:months,priority,status,completed_at:stillCompleted?(goal.completed_at||new Date().toISOString()):null};if(restart)payload.plan_started_at=localISODate();const {error}=await supabase.from("goals").update(payload).eq("id",goalId);if(error){showInlineError(err,safeErrorMessage(error,"No se pudo guardar. Ejecuta la migración v5.2."));btn.disabled=false;btn.textContent="Guardar";return;}modal.classList.remove("visible");modal.innerHTML="";await loadState();renderApp();showToast(restart?"Meta actualizada con plazo desde hoy":"Meta actualizada");};
}

function runDebtUXTests() {
  const tests = [];
  const check = (name, ok) => tests.push({ name, ok: Boolean(ok) });
  const flat = calculateDebtPlan({ planType: "flat_total", originalAmount: 20000, interestRate: 45, interestRateType: "total_term", paymentFrequency: "monthly", termCount: 5 });
  check("45% total sobre RD$20,000 produce RD$29,000", Math.abs(flat.totalPayable - 29000) < 0.01);
  check("La cuota plana de 5 pagos es RD$5,800", Math.abs(flat.scheduledPayment - 5800) < 0.01);
  const estimated = wizardDebtPayload({ name:"Tenis", debtType:"prestamista", existingMode:"new", originalAmount:20000, currentBalance:"", paidBeforeApp:"", knowledge:"scheduled_payment", rate:"", totalPayable:"", scheduledPayment:2435, termCount:10, paymentFrequency:"monthly", nextDue:"", startDate:"", allocationMethod:"proportional" });
  check("Solo cuota crea una estimación, no una tasa inventada", estimated.payload.setup_state === "estimated" && estimated.payload.interest_rate == null);
  const unknown = wizardDebtPayload({ name:"Deuda", debtType:"otro", existingMode:"existing", originalAmount:20000, currentBalance:15000, paidBeforeApp:5000, knowledge:"unknown", scheduledPayment:3000, termCount:6, paymentFrequency:"monthly", nextDue:"", startDate:"", allocationMethod:"manual" });
  check("Interés desconocido queda incompleto", unknown.payload.setup_state === "incomplete" && unknown.payload.interest_rate == null);
  check("Una deuda en curso conserva saldo actual", unknown.payload.current_balance === 15000);
  const partial1 = 1200, partial2 = 1235, installment = 2435;
  check("Dos pagos parciales completan una cuota", Math.floor((partial1 + partial2) / installment) === 1);
  const passed = tests.filter(t => t.ok).length;
  console.log(`[DEBT UX TESTS] ${passed}/${tests.length} passed`);
  tests.forEach(t => console.log(`  ${t.ok ? "✅" : "❌"} ${t.name}`));
  return { passed, total: tests.length, tests };
}
window.runDebtUXTests = runDebtUXTests;


function runStabilizationTests() {
  const originalState = state;
  const originalCategories = categories;
  const results = [];
  const assert = (desc, ok) => results.push({ desc, ok: Boolean(ok) });
  const asOf = new Date(2026, 7, 15, 16, 0, 0);
  const profile = {
    id: "test-user", declared_monthly_income: 30000, pay_frequency: "monthly",
    pay_day_1: 15, pay_day_2: null, fixed_expenses_confirmed: true,
    debts_confirmed: true, movements_reviewed_at: asOf.toISOString(),
  };
  const account = { id: "a", name: "Principal", initial_balance: 50000, computed_balance: 50000, balance_reconciled_at: asOf.toISOString(), updated_at: asOf.toISOString() };
  const install = overrides => {
    state = {
      account, accounts: [account], profile: { ...profile }, goals: [], fixed: [], debts: [],
      transactions: [], analysisTransactions: [], budgets: [], goalContributions: [], debtPayments: [],
      fixedPayments: [], purchaseDecisions: [], reconciliations: [{ created_at: asOf.toISOString() }],
      optionalErrors: [], analysis: null, ...overrides,
    };
    computeAnalysis(asOf);
    return state.analysis;
  };
  try {
    assert("Fecha civil no cambia de día", formatDateDO("2026-08-03").includes("3"));
    assert("Mes civil exige también el año", sameCivilMonth("2025-08-03", new Date(2026,7,3)) === false);
    assert("Una nota que empieza con Pago: sigue siendo gasto manual", isOrdinaryExpense({ amount:-100, transaction_type:"expense", source_type:"manual", note:"Pago: comida" }));
    assert("Ingresos de préstamo no se tratan como ingreso ordinario", !isOrdinaryIncome({ amount:20000, transaction_type:"loan_proceeds", source_type:"loan_proceeds" }));
    const unsafe='<img src=x onerror="globalThis.__xss=1">';
    assert("Escape neutraliza HTML del usuario", !esc(unsafe).includes("<img"));

    let analysis = install({});
    assert("El día de cobro se reconoce como hoy", analysis.liquidity.nextPay?.daysAway === 0 && analysis.liquidity.nextPay?.dateISO === "2026-08-15");
    assert("Calidad de datos no depende del score de compra", ["Alta","Media","Baja"].includes(dataQualityAssessment().label));
    assert("Un pago fijo anulado no cuenta como gasto", !isCountableExpense({ id:"tx-fixed", amount:-100, transaction_type:"expense", source_type:"fixed_expense" }, [{ transaction_id:"tx-fixed", status:"voided" }]));
    assert("Un pago fijo activo sí cuenta como gasto", isCountableExpense({ id:"tx-fixed", amount:-100, transaction_type:"expense", source_type:"fixed_expense" }, [{ transaction_id:"tx-fixed", status:"active" }]));

    const debt = { id:"d", name:"Préstamo", status:"active", current_balance:20000, scheduled_payment:5000, minimum_payment:5000, payment_frequency:"monthly", interest_rate:20, interest_rate_type:"annual", plan_type:"amortized" };
    const before = install({ debts:[debt] }).cashFlow.remainingBudget;
    const debtPayment = { id:"dp", debt_id:"d", amount:5000, fee_component:0, status:"active", paid_on:"2026-08-10" };
    const after = install({ debts:[debt], debtPayments:[debtPayment] }).cashFlow.remainingBudget;
    assert("Pagar la cuota no aumenta falsamente el plan mensual", before === after);

    const debtWithFee = { ...debt, scheduled_payment:5000 };
    const feePayment = { id:"dpf", debt_id:"d", amount:5200, fee_component:200, status:"active", paid_on:"2026-08-10" };
    analysis = install({ debts:[debtWithFee], debtPayments:[feePayment] });
    assert("Las comisiones de deuda permanecen dentro del flujo mensual", analysis.cashFlow.financialFees === 200 && analysis.cashFlow.debtPaid === 5200);

    const fixedTx={id:"ft",amount:-12000,transaction_type:"expense",source_type:"fixed_expense",category_id:"home",occurred_at:"2026-08-03T12:00:00"};
    analysis=install({fixed:[{id:"f",name:"Casa",estimated_amount:12000,active:true}],analysisTransactions:[fixedTx],transactions:[fixedTx],fixedPayments:[{id:"fp",transaction_id:"ft",fixed_template_id:"f",status:"voided",period_key:"2026-08-01",paid_on:"2026-08-03"}]});
    assert("Revertir un gasto fijo restaura su estado pendiente", analysis.cashFlow.fixedPaid === 0 && analysis.cashFlow.fixedPending === 12000);

    const expensiveDebt={id:"d2",name:"Deuda",status:"active",current_balance:18000,scheduled_payment:18000,minimum_payment:18000,payment_frequency:"monthly",interest_rate:0,interest_rate_type:"annual",plan_type:"no_interest"};
    const goal={id:"g",name:"Meta",status:"active",current_amount:0,target_amount:5000,target_months:1,priority:"normal",created_at:"2026-08-01"};
    analysis=install({fixed:[{id:"f",name:"Casa",estimated_amount:10000,active:true}],debts:[expensiveDebt],goals:[goal]});
    assert("La capacidad de metas descuenta primero las cuotas de deuda", analysis.goals.canAffordAllGoals === false);

    state.analysis.cashFlow.fixedPlan=40000;
    state.budgets=[];
    const plan=budgetPlanningSummary();
    assert("Capacidad negativa no se llama sobreasignación sin presupuestos", plan.capacityNegative && plan.allocated===0 && !plan.overallocated);

    state.profile={...state.profile,fixed_expenses_confirmed:false,debts_confirmed:false};
    const lowQuality=dataQualityAssessment();
    assert("Ausencia sin confirmar no produce precisión alta", lowQuality.label !== "Alta");
    assert("Tasa total no se etiqueta como anual", debtRateLabel({interest_rate:45,interest_rate_type:"total_term",term_count:5,payment_frequency:"monthly"}).includes("total"));
  } catch (error) {
    results.push({ desc:`Excepción: ${error.message}`, ok:false });
  } finally {
    state = originalState;
    categories = originalCategories;
    if (state.profile && state.account) computeAnalysis();
  }
  const passed=results.filter(r=>r.ok).length;
  console.log(`[STABILIZATION TESTS] ${passed}/${results.length} passed`);
  results.forEach(r=>console.log(`${r.ok?"✅":"❌"} ${r.desc}`));
  return { passed, total:results.length, results };
}
window.runStabilizationTests=runStabilizationTests;


function runClarityTests() {
  const originalState=state,originalCategories=categories;
  const results=[];const assert=(desc,ok)=>results.push({desc,ok:Boolean(ok)});
  const asOf=new Date(2026,7,3,12,0,0);
  try {
    categories=[{id:"food",name:"Comida"},{id:"home",name:"Vivienda"}];
    const profile={id:"u",display_name:"Luis",declared_monthly_income:30000,pay_frequency:"monthly",pay_day_1:30,income_mode:"fixed",fixed_expenses_confirmed:true,debts_confirmed:true};
    const checking={id:"c",name:"Cuenta",type:"bank",computed_balance:5000,initial_balance:5000,available_for_spending:true,balance_reconciled_at:"2026-08-03T12:00:00"};
    const savings={id:"s",name:"Ahorro",type:"savings",computed_balance:20000,initial_balance:20000,available_for_spending:false,balance_reconciled_at:"2026-08-03T12:00:00"};
    state={account:checking,accounts:[checking,savings],profile,goals:[],fixed:[],debts:[],transactions:[],analysisTransactions:[],budgets:[],goalContributions:[],debtPayments:[],fixedPayments:[],purchaseDecisions:[],reconciliations:[{created_at:"2026-08-03T12:00:00"}],optionalErrors:[],analysis:null};
    computeAnalysis(asOf);
    assert("El ahorro reservado no se presenta como disponible para comprar",state.analysis.liquidity.balanceToday===5000&&state.analysis.liquidity.totalBalance===25000&&state.analysis.liquidity.reservedBalance===20000);

    state.profile={...profile,pay_frequency:"biweekly",declared_monthly_income:20000,paycheck_amount_1:20000,paycheck_amount_2:15000,pay_day_1:15,pay_day_2:30};computeAnalysis(asOf);
    assert("Dos quincenas desiguales conservan su ingreso mensual real",state.analysis.cashFlow.declaredMonthlyIncome===35000);
    state.profile={...profile,pay_frequency:"weekly",declared_monthly_income:5000,income_mode:"variable",pay_weekday:5};computeAnalysis(asOf);
    assert("El ingreso semanal variable se muestra como estimación mensual, no como dinero disponible",state.analysis.cashFlow.incomeEstimate===Math.round(5000*52/12)&&state.analysis.cashFlow.monthlyIncome===0);
    state.profile={...profile};computeAnalysis(asOf);

    const fixedTx={id:"fx",account_id:"c",category_id:"home",amount:-10000,occurred_at:"2026-08-02",transaction_type:"expense",source_type:"fixed_expense"};
    const variableTx={id:"vx",account_id:"c",category_id:"food",amount:-2000,occurred_at:"2026-08-02",transaction_type:"expense",source_type:"manual"};
    state.fixed=[{id:"f",name:"Alquiler",estimated_amount:10000,category_id:"home",active:true}];
    state.transactions=[fixedTx,variableTx];state.analysisTransactions=[fixedTx,variableTx];state.fixedPayments=[{id:"fp",fixed_template_id:"f",transaction_id:"fx",status:"active",paid_on:"2026-08-02",period_key:"2026-08-01",amount:10000}];
    state.budgets=[{id:"b",category_id:"home",amount:12000,effective_from:"2026-08-01",effective_to:null}];
    computeAnalysis(asOf);
    assert("El presupuesto por categoría usa gastos variables y no vuelve a contar el alquiler",Number(state.analysis.spending.byCategory.home||0)===0&&Number(state.analysis.spending.fixedByCategory.home||0)===10000);
    const plan=budgetPlanningSummary();
    assert("La capacidad de presupuesto no descuenta dos veces los gastos variables",plan.monthlyCapacity===20000&&plan.remainingCapacity===18000);

    const goal={id:"g",name:"Meta",status:"active",priority:"important",target_amount:6000,current_amount:1000,target_months:5,plan_started_at:"2026-08-01"};
    state.goals=[goal];state.goalContributions=[{id:"gc",goal_id:"g",amount:500,contributed_on:"2026-08-02"}];computeAnalysis(asOf);
    const goalAnalysis=state.analysis.goals.byGoal.find(g=>g.id==="g");
    assert("La meta descuenta lo aportado este mes del aporte pendiente",goalAnalysis.paidThisMonth===500&&goalAnalysis.pendingThisMonth===500);

    state.profile={...profile,fixed_expenses_confirmed:false,debts_confirmed:false};computeAnalysis(asOf);
    const gated=buildPurchaseAnalysis(state.analysis,100,"pizza","food");
    assert("Una compra no recibe verde cuando faltan datos financieros críticos",gated.verdict!=="green"&&gated.dataQuality.decisionReady===false);

    state.profile={...profile};state.accounts=[{...checking,computed_balance:-800,initial_balance:-800}];state.account=state.accounts[0];state.fixed=[{id:"f",name:"Internet",estimated_amount:4000,active:true}];state.transactions=[];state.analysisTransactions=[];state.fixedPayments=[];state.goals=[];state.goalContributions=[];state.budgets=[];computeAnalysis(asOf);
    assert("Con déficit, la primera recomendación es estabilizar liquidez",state.analysis.recommendations.nextBestAction?.action==="commitments"||state.analysis.recommendations.nextBestAction?.action==="cuentas");

    const debtDraft={name:"Préstamo",debtType:"prestamo_personal",existingMode:"existing",originalAmount:20000,currentBalance:15000,paidBeforeApp:"",knowledge:"no_interest",scheduledPayment:3000,totalTermCount:10,remainingTermCount:5,paymentFrequency:"monthly",nextDue:"",startDate:"",allocationMethod:"principal_first"};
    const payload=wizardDebtPayload(debtDraft).payload;
    assert("Los pagos anteriores no se inventan por diferencia de saldo",payload.paid_before_app===0);
    assert("Cuotas originales y restantes se guardan por separado",payload.term_count===10&&payload.remaining_installments===5);

    const inferred=inferCategoryId("pizza familiar");
    const coachPurchase=buildPurchaseAnalysis(state.analysis,100,"pizza familiar",inferred);
    assert("El motor conserva la misma categoría entre Coach y simulador",coachPurchase.meta.categoryId===inferred);
  } catch(error){results.push({desc:`Excepción: ${error.message}`,ok:false});}
  finally{state=originalState;categories=originalCategories;if(state.profile&&state.account)computeAnalysis();}
  const passed=results.filter(r=>r.ok).length;
  console.log(`[CLARITY TESTS] ${passed}/${results.length} passed`);results.forEach(r=>console.log(`${r.ok?"✅":"❌"} ${r.desc}`));
  return {passed,total:results.length,results};
}
window.runClarityTests=runClarityTests;
