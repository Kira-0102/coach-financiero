<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Coach Financiero</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="screen">
  <h1 id="formTitle">Inicia sesión</h1>
  <p class="subtitle">Tu coach financiero, con tus datos reales.</p>

  <div class="error-banner" id="errorBanner"></div>

  <label for="email">Email</label>
  <input type="email" id="email" placeholder="tu@email.com" autocomplete="email" autofocus style="margin-bottom:14px;" />

  <label for="password">Contraseña</label>
  <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" style="margin-bottom:20px;" />

  <button class="btn-primary" id="submitBtn" style="width:100%; margin-bottom:14px;">
    Entrar
  </button>

  <p style="text-align:center; font-size:13px; color:var(--text-secondary);">
    <span id="toggleText">¿No tienes cuenta?</span>
    <button class="link-btn" id="toggleModeBtn">Regístrate</button>
  </p>
  <p style="text-align:center; margin-top:8px;" id="forgotWrap">
    <button class="link-btn" id="forgotBtn" style="font-size:12px;">¿Olvidaste tu contraseña?</button>
  </p>
</div>

<script type="module">
  import { supabase } from "./js/supabaseClient.js";

  let mode = "login"; // login | signup

  const formTitle = document.getElementById("formTitle");
  const toggleText = document.getElementById("toggleText");
  const toggleModeBtn = document.getElementById("toggleModeBtn");
  const submitBtn = document.getElementById("submitBtn");
  const errorBanner = document.getElementById("errorBanner");

  function showError(msg, isSuccess = false) {
    errorBanner.textContent = msg;
    errorBanner.style.background = isSuccess ? "var(--success-bg)" : "";
    errorBanner.style.color = isSuccess ? "var(--success-text)" : "";
    errorBanner.classList.add("visible");
  }
  function clearError() {
    errorBanner.classList.remove("visible");
    errorBanner.style.background = "";
    errorBanner.style.color = "";
  }

  toggleModeBtn.addEventListener("click", () => {
    mode = mode === "login" ? "signup" : "login";
    formTitle.textContent = mode === "login" ? "Inicia sesión" : "Crea tu cuenta";
    submitBtn.textContent = mode === "login" ? "Entrar" : "Registrarme";
    toggleText.textContent = mode === "login" ? "¿No tienes cuenta?" : "¿Ya tienes cuenta?";
    toggleModeBtn.textContent = mode === "login" ? "Regístrate" : "Inicia sesión";
    document.getElementById("password").setAttribute("autocomplete", mode === "signup" ? "new-password" : "current-password");
    document.getElementById("forgotWrap").style.display = mode === "login" ? "block" : "none";
    clearError();
  });

  document.getElementById("forgotBtn").addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    if (!email) {
      showError("Escribí tu email arriba primero, y volvé a tocar este link.");
      return;
    }
    const forgotBtn = document.getElementById("forgotBtn");
    forgotBtn.disabled = true;
    const { error } = await supabase.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + "/reset-password.html",
    });
    forgotBtn.disabled = false;
    if (error) {
      showError("No se pudo enviar el correo. Intentá de nuevo.");
      return;
    }
    showError("Si ese email tiene una cuenta, te mandamos un link para restablecer tu contraseña. Revisá tu correo.", true);
  });

  submitBtn.addEventListener("click", handleSubmit);
  document.getElementById("email").addEventListener("keydown", (e) => { if (e.key === "Enter") handleSubmit(); });
  document.getElementById("password").addEventListener("keydown", (e) => { if (e.key === "Enter") handleSubmit(); });

  async function handleSubmit() {
    clearError();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
      showError("Completá email y contraseña.");
      return;
    }
    if (password.length < 6) {
      showError("La contraseña necesita al menos 6 caracteres.");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Un momento…";

    try {
      if (mode === "signup") {
        const { data, error } = await supabase.auth.signUp({ email, password });
        if (error) throw error;
        if (data.session) {
          // La confirmación por correo está desactivada: Supabase ya
          // nos dio una sesión activa, no hace falta pedirle que
          // vuelva a escribir sus datos para iniciar sesión de nuevo.
          window.location.href = "app.html";
          return;
        }
        showError("Cuenta creada. Revisá tu correo para confirmarla antes de entrar.");
      } else {
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
        window.location.href = "app.html";
        return;
      }
    } catch (err) {
      showError(traducirError(err.message));
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = mode === "login" ? "Entrar" : "Registrarme";
    }
  }

  function traducirError(msg) {
    if (msg.includes("Invalid login credentials")) {
      return mode === "login"
        ? "Email o contraseña incorrectos. Si es tu primera vez acá, toca \"Regístrate\" abajo."
        : "Email o contraseña incorrectos.";
    }
    if (msg.includes("User already registered")) return "Ese email ya tiene una cuenta. Inicia sesión.";
    if (msg.includes("Email not confirmed")) return "Confirmá tu correo antes de entrar — revisá tu bandeja de entrada.";
    return "No se pudo completar la acción. Intentá de nuevo.";
  }

  // Si ya hay sesión activa, saltar directo a la app
  supabase.auth.getSession().then(({ data }) => {
    if (data.session) window.location.href = "app.html";
  });
</script>

</body>
</html>
