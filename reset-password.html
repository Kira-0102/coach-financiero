<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Coach Financiero</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="screen" id="root">
  <h1>Un momento…</h1>
  <p class="subtitle">Verificando tu link de recuperación.</p>
</div>

<script type="module">
  import { supabase } from "./js/supabaseClient.js";

  const root = document.getElementById("root");

  function renderForm() {
    root.innerHTML = `
      <h1>Elegí tu contraseña nueva</h1>
      <p class="subtitle">Mínimo 6 caracteres.</p>

      <div class="error-banner" id="errorBanner"></div>

      <label for="newPassword">Contraseña nueva</label>
      <input type="password" id="newPassword" placeholder="••••••••" autocomplete="new-password" style="margin-bottom:20px;" />

      <button class="btn-primary" id="saveBtn" style="width:100%;">Guardar y entrar</button>
    `;

    const errorBanner = document.getElementById("errorBanner");
    function showError(msg) {
      errorBanner.textContent = msg;
      errorBanner.classList.add("visible");
    }

    const saveBtn = document.getElementById("saveBtn");
    const newPasswordInput = document.getElementById("newPassword");

    async function submit() {
      const password = newPasswordInput.value;
      if (!password || password.length < 6) {
        showError("La contraseña necesita al menos 6 caracteres.");
        return;
      }
      saveBtn.disabled = true;
      saveBtn.textContent = "Guardando…";
      const { error } = await supabase.auth.updateUser({ password });
      if (error) {
        showError("No se pudo actualizar. Probá pedir el link de nuevo desde el login.");
        saveBtn.disabled = false;
        saveBtn.textContent = "Guardar y entrar";
        return;
      }
      window.location.href = "app.html";
    }

    saveBtn.addEventListener("click", submit);
    newPasswordInput.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
    newPasswordInput.focus();
  }

  function renderInvalidLink() {
    root.innerHTML = `
      <h1>Este link ya no es válido</h1>
      <p class="subtitle">Puede haber expirado, o ya se usó antes. Pedí uno nuevo desde el login.</p>
      <button class="btn-primary" style="width:100%;" onclick="window.location.href='index.html'">Volver al login</button>
    `;
  }

  // El link del correo deja a Supabase establecer una sesión de
  // recuperación automáticamente al cargar esta página. Si no hay
  // sesión, el link es inválido o ya se usó.
  supabase.auth.getSession().then(({ data }) => {
    if (data.session) renderForm();
    else renderInvalidLink();
  });
</script>

</body>
</html>
